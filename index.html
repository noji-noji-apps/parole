<style>
:root{
  /* 白基調。差し色は三色旗の緑（verde）と赤（rosso）だけ。文字・罫線は無彩色 */
  --flag-g:#009246; --flag-w:#ffffff; --flag-r:#ce2b37;
  --paper:#ffffff; --sheet:#ffffff; --grid:rgba(0,0,0,.045); --line:#e4e4e4;
  --ink:#007a3d; --text:#1c1c1c; --muted:#6e6e6e; --soft:#f4f4f4;
  --red:#ce2b37; --green:#007a3d; --amber:#ce2b37;
  --on-ink:#ffffff; --male:#007a3d; --female:#ce2b37;
  --serif:"Bodoni Moda","Bodoni 72","Didot","Times New Roman",serif;
  --head:"Bodoni Moda","Bodoni 72","Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* ダークモードには対応しない：端末やブラウザの設定に関わらず常に白基調で表示する */
:root, :root[data-theme="dark"]{ color-scheme:light only; }
button,input,select,textarea{background-color:var(--sheet);color:var(--text)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--text);font:15px/1.65 var(--sans);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header::before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--flag-g) 0 33.34%,var(--flag-w) 33.34% 66.67%,var(--flag-r) 66.67%)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--serif);font-size:1.6rem;font-style:italic;color:var(--ink);letter-spacing:.01em;background:none;border:0;padding:0;line-height:1}
.bar nav{margin-left:auto;display:flex;gap:4px}
.navbtn{background:none;border:1px solid transparent;border-radius:999px;padding:5px 14px;color:var(--muted)}
.navbtn[aria-current="page"]{border-color:var(--line);color:var(--text);background:var(--sheet)}

main{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h2{font-family:var(--head);font-size:1.2rem;margin:30px 0 10px;font-weight:700;color:var(--text);letter-spacing:.02em}
h2:first-child{margin-top:4px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}

/* level list */
.levels{display:grid;gap:8px}
.lv{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lv[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.lv .num{font-family:var(--serif);font-size:2rem;line-height:1;color:var(--ink);grid-row:span 2;width:1.4em;text-align:center}
.lv .name{font-weight:600}
.lv .tag{font-size:.78rem;color:var(--muted);margin-left:8px;font-weight:400}
.lv .count{font-size:.85rem;color:var(--muted);text-align:right}
.lv .desc{font-size:.82rem;color:var(--muted);grid-column:2/4}
.meter{grid-column:2/4;height:5px;border-radius:3px;background:var(--soft);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .m{background:var(--ink)} .meter .l{background:color-mix(in srgb,var(--ink) 35%,transparent)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:5px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--ink)}
.legend span.l::before{background:color-mix(in srgb,var(--ink) 35%,transparent)}
.legend span.u::before{background:var(--soft);outline:1px solid var(--line)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 12px;font-size:.85rem}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
select,input[type=text],textarea{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:6px}
.mode{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left}
.mode b{display:block;font-size:1rem}
.mode span{font-size:.82rem;color:var(--muted)}
.mode.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.mode.primary span{color:inherit;opacity:.8}
.mode:disabled{opacity:.45;cursor:not-allowed}

.btn{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:9px 16px}
.btn.ink{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.ghost{background:none}
.btn.danger{color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{border-left:3px solid var(--amber);padding:6px 12px;background:var(--soft);border-radius:0 8px 8px 0;font-size:.88rem;margin-bottom:14px}

/* session */
.sesshead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress{flex:1;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .25s}
.counter{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}

.sheet{
  background-color:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-position:-1px -1px;
  border:1px solid var(--line);border-radius:14px;padding:22px 22px 20px;position:relative
}
.flash{min-height:300px;display:flex;flex-direction:column;cursor:pointer;user-select:none;-webkit-user-select:none}
.flash .front{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:10px 0}
.it{font-family:var(--serif);font-weight:600;font-size:clamp(2.1rem,8vw,3.4rem);line-height:1.1;color:var(--ink);overflow-wrap:anywhere}
.flash .front .it{font-size:clamp(2.8rem,12vw,4.4rem);font-weight:700}
.ja-big{font-size:clamp(1.4rem,5vw,1.9rem);font-weight:600;line-height:1.35}
/* 日本語の見出し：訳語の区切りでだけ改行し、括弧書きは小さく別の行に。はみ出す訳語だけ縮める */
.jfit{display:block;width:100%;text-align:center}
.jc{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 0 .2em;max-width:none}
.jm{white-space:nowrap}
.jn{font-size:.58em;font-weight:500;color:var(--muted);white-space:nowrap;line-height:1.35}
.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.badge{font-size:.75rem;border:1px solid var(--line);background:var(--sheet);border-radius:6px;padding:1px 8px;color:var(--muted)}
.badge.m{color:var(--male);border-color:color-mix(in srgb,var(--male) 40%,transparent)}
.badge.f{color:var(--female);border-color:color-mix(in srgb,var(--female) 40%,transparent)}
.hint{font-size:.8rem;color:var(--muted);text-align:center}
.back{border-top:1px dashed var(--line);margin-top:14px;padding-top:14px;display:grid;gap:10px;cursor:auto;user-select:text;-webkit-user-select:text}
.back .meaning{font-size:1.25rem;font-weight:600}
.field{display:grid;grid-template-columns:4.5em 1fr;gap:10px;font-size:.92rem}
.field dt{color:var(--muted);font-size:.8rem;padding-top:2px}
.field dd{margin:0}
.ex-it{font-family:var(--serif);font-weight:600;font-size:1.2rem;line-height:1.4}
.ex-it em{font-style:italic}
.speak{background:none;border:1px solid var(--line);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;vertical-align:middle;color:var(--ink);flex:none}
.speak svg{width:16px;height:16px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.judge .btn{padding:14px;font-weight:600}
.judge .no{color:var(--red)}
.judge .yes{color:var(--green)}
kbd{font:inherit;font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted);margin-left:6px}

.question{text-align:center;padding:18px 0 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.choices{display:grid;gap:8px;margin-top:14px}
.choice{display:flex;gap:12px;align-items:center;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:1rem}
.choice .k{font-size:.75rem;color:var(--muted);width:1.2em;text-align:center;flex:none}
.choice.it-opt{font-family:var(--serif);font-size:1.25rem}
.choice.ok{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.choice.ok .k{color:var(--green)}
.choice.ng{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.choice:disabled{cursor:default}
.choice:disabled:not(.ok):not(.ng){opacity:.6}

.answer-box{display:flex;gap:8px;margin-top:16px}
.answer-box input{font-family:var(--serif);font-size:1.4rem;padding:10px 14px;flex:1;min-width:0}
.answer-box input.ok{border-color:var(--green)}
.answer-box input.ng{border-color:var(--red)}
.feedback{margin-top:14px;display:grid;gap:10px}
.verdict{font-weight:600;font-size:1.05rem}
.verdict.ok{color:var(--green)} .verdict.ng{color:var(--red)} .verdict.close{color:var(--amber)}
.correct-it{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.correct-it .it{font-size:2rem}

.result-num{font-family:var(--serif);font-size:3.6rem;color:var(--ink);line-height:1}
.misslist{list-style:none;padding:0;margin:8px 0 0;border-top:1px solid var(--line)}
.misslist li{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line)}
.misslist .w{font-family:var(--serif);font-size:1.1rem;color:var(--ink)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{white-space:nowrap;font-weight:600}
tr:last-child td{border-bottom:0}
code{font-size:.85em;background:var(--soft);padding:1px 5px;border-radius:4px}
.errors{font-size:.82rem;color:var(--red);margin:6px 0 0;padding-left:18px}
.hidden{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:520px){.field{grid-template-columns:1fr;gap:2px}.sheet{padding:18px 16px}}

/* stats / review */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1;color:var(--ink);font-variant-numeric:lining-nums}
.stat span{font-size:.76rem;color:var(--muted);line-height:1.35}
.review{display:grid;gap:8px}
.rv{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.rv-head{display:flex;align-items:baseline;gap:8px}
.rv-head b{font-family:var(--serif);font-weight:400;font-size:2rem;line-height:1;color:var(--ink)}
.rv-head b.red,.red{color:var(--red)}
.rv-head span{font-size:.9rem}
/* flash */
.flipbtn{margin-top:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.8rem;color:var(--muted)}
/* type */
.accents{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:14px}
.accents button{flex:1 1 0;min-width:0;height:38px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;font-family:var(--serif);font-size:1.15rem;color:var(--ink);touch-action:manipulation}
.answer-box input.close{border-color:var(--amber)}
/* settings */
.toggle{display:flex;gap:12px;align-items:flex-start;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;margin-bottom:8px}
.toggle input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--ink);flex:none}
.toggle > span{display:flex;flex-direction:column;gap:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* list */
input[type=search]{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%;font-size:1rem}
.wlist{border:1px solid var(--line);border-radius:10px;background:var(--sheet);overflow:hidden}
.wi{border-bottom:1px solid var(--line)}
.wi:last-child{border-bottom:0}
.wi summary{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1.2fr) auto;gap:10px;align-items:baseline;padding:9px 12px;cursor:pointer;list-style:none}
.wi summary::-webkit-details-marker{display:none}
.wi[open] summary{background:var(--soft)}
.wi .w{font-family:var(--serif);font-size:1.1rem;color:var(--ink);overflow-wrap:anywhere}
.wi .j{font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wi .lvn{font-size:.76rem;color:var(--muted);white-space:nowrap}
.wd{padding:10px 14px 14px;display:grid;gap:10px}
.wd .meaning{font-weight:600}
.st{width:9px;height:9px;border-radius:50%;display:inline-block;align-self:center}
.st-m{background:var(--ink)} .st-l{background:color-mix(in srgb,var(--ink) 35%,transparent)} .st-u{outline:1px solid var(--line);background:var(--soft)}
.hist{display:inline-flex;gap:3px;vertical-align:middle;margin:0 4px}
.hist i{width:9px;height:9px;border-radius:50%;display:block}
.hist i.o{background:var(--green)} .hist i.x{background:none;outline:1.5px solid var(--red);outline-offset:-1.5px}
/* bars */
.bars{display:flex;align-items:stretch;gap:4px;height:150px;padding:6px 0 0}
.bars.short{height:110px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-width:0}
.bar-col > i{display:flex;flex-direction:column;justify-content:flex-end;width:100%;max-width:26px;background:color-mix(in srgb,var(--ink) 35%,transparent);border-radius:3px 3px 0 0;min-height:1px}
.bar-col > i > i{display:block;width:100%;background:var(--ink);border-radius:3px 3px 0 0}
.bar-col > i.flat{background:var(--ink)}
.bar-n{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;min-height:1em}
.bar-l{font-size:.64rem;color:var(--muted);white-space:nowrap}
@media (max-width:520px){
  .bar-l{font-size:.56rem}
  .wi summary{grid-template-columns:auto minmax(0,1fr) auto;}
  .wi .j{grid-column:2/4;grid-row:2;white-space:normal}
}
@media (max-width:440px){.bar .navbtn{padding:5px 9px}.bar{gap:8px}.logo{font-size:1.4rem}.stat b{font-size:1.7rem}}

/* units */
.ugroup{margin-bottom:6px}
.ugroup summary{cursor:pointer;font-weight:600;padding:6px 0;display:flex;gap:10px;align-items:baseline}
.ugroup summary::-webkit-details-marker{display:none}
.ugroup summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);align-self:center;margin:0 2px;transition:transform .15s}
.ugroup[open] summary::before{transform:rotate(45deg)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;margin:4px 0 8px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;text-align:left;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:8px 12px 9px}
.unit[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.unit .un{font-family:var(--serif);color:var(--ink);font-size:1.05rem;line-height:1;font-variant-numeric:lining-nums}
.unit .uname{font-size:.88rem;font-weight:600;line-height:1.35}
.unit .ucount{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.unit .meter{grid-column:1/4;height:3px}
.uhead{padding:12px 12px 6px;font-size:.82rem;font-weight:700;color:var(--muted);background:var(--soft);border-bottom:1px solid var(--line)}

/* unit lines */
.ulines{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.ulines > *{min-width:0}
.urow{background:var(--sheet);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.urow.open{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.uline{box-sizing:border-box;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:0;padding:12px 14px 17px}
.urow .uline{background:none}
label.uline{border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;grid-template-columns:auto auto minmax(0,1fr) auto}
.uline input{width:18px;height:18px;margin:0;accent-color:var(--ink)}
.uline .un{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1.15rem;line-height:1;font-variant-numeric:lining-nums}
.uline .uname{font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uline .ulv{font-weight:400;font-size:.75rem;color:var(--muted);margin-right:8px}
.uline .ucount{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.uline .meter{position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:0;grid-column:auto}
.ustart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px 12px}
.ustart .btn{padding:10px 4px;font-size:.88rem;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;word-break:keep-all;overflow-wrap:normal}
.startbar{position:sticky;bottom:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--paper);border-top:1px solid var(--line);margin-top:16px;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.startbar b{font-family:var(--serif);font-weight:400;font-size:1.3rem;color:var(--ink)}

/* level page */
.lvhead{display:flex;gap:14px;align-items:center;margin:14px 0 14px}
.lvhead .num{font-family:var(--serif);font-size:3rem;line-height:1;color:var(--ink);width:1.2em;text-align:center}
.lvinfo{flex:1;display:flex;flex-direction:column;gap:3px}
.lvinfo b{font-size:1.15rem}
.lvinfo .tag{font-size:.78rem;color:var(--muted)}
.lvinfo .meter{height:5px;margin-top:4px}
.udone{color:var(--ink);font-weight:600}
/* 大きな文字や数字は黒。緑はボタン・進捗・正解だけに使う */
.it,.lv .num,.lvhead .num,.stat b,.rv-head b,.uline .un,.result-num,.misslist .w,.wi .w,.correct-it .it,.startbar b,.logo{color:var(--text)}
.rv-head b.red{color:var(--red)}

/* 起動画面：三色旗。canvas で波打つ旗を描き、タップで上へ流す */
#splash{position:fixed;inset:0;z-index:100;overflow:hidden;cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none;background:transparent}
#splash .flagcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.splash-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;pointer-events:none;transition:opacity .3s ease,transform .5s ease}
#splash.go .splash-text{opacity:0;transform:translateY(-40px)}
.splash-text h1{margin:0;font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(4.2rem,19vw,8rem);line-height:1;color:#1c1c1c;letter-spacing:.01em;
  text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff,0 0 10px rgba(255,255,255,.9)}
.tagline{margin:0;display:grid;font-size:1.2rem;color:#1c1c1c;text-shadow:0 0 2px #fff,0 0 3px #fff,0 0 5px #fff,0 0 8px #fff,0 0 12px rgba(255,255,255,.9)}
.tagline span{grid-area:1/1;text-align:center;white-space:nowrap;animation:tagSwap 6s ease-in-out infinite}
.tagline .tl-ja{font-weight:700}
.tagline .tl-it{font-family:var(--serif);font-style:italic;font-weight:700;font-size:1.35rem;animation-delay:-3s}
@keyframes tagSwap{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
@media (prefers-reduced-motion: reduce){ .splash-text{transition:opacity .3s} #splash.go .splash-text{transform:none} }
/* ユニットの学習方法シート */
.ubackdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;padding:16px;transition:background .2s ease}
.ubackdrop.show{background:rgba(0,0,0,.35)}
.usheet{width:100%;max-width:440px;background:var(--sheet);border-radius:16px;padding:18px 16px;display:grid;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.18);opacity:0;transform:translateY(10px) scale(.98);transition:transform .2s ease,opacity .2s ease}
.ubackdrop.show .usheet{transform:none;opacity:1}
.dlg-title{font-size:1.05rem}
.dlg-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.dlg-actions .btn{padding:12px 6px}
.accents .hintbtn{font-family:var(--sans);font-size:.78rem;padding:0;white-space:nowrap;background:var(--sheet);opacity:1}
/* チェックボックスとラジオボタンは自前で描く（端末によって中が黒くなるのを防ぐ） */
input[type=checkbox],input[type=radio]{-webkit-appearance:none;appearance:none;width:20px;height:20px;margin:0;flex:none;display:inline-grid;place-content:center;background:#fff;border:1.5px solid #b8b8b8;border-radius:5px;cursor:pointer;vertical-align:middle}
input[type=radio]{border-radius:50%}
input[type=checkbox]:checked{background:var(--ink);border-color:var(--ink)}
input[type=checkbox]:checked::after{content:"";width:10px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
input[type=radio]:checked{border:6px solid var(--ink);background:#fff}
.usheet-head{display:flex;align-items:center;gap:10px}
.usheet-head .un{font-family:var(--serif);font-weight:700;font-size:1.4rem;color:var(--ink);line-height:1}
.usheet-head b{flex:1;font-size:1.05rem}
.usheet-prog{display:grid;gap:6px}
.usheet-prog .meter{grid-column:auto;height:8px;border-radius:4px}
.usheet .ustart{padding:0}
.usheet .ustart .btn{padding:14px 4px;font-size:.95rem}
@media (prefers-reduced-motion: reduce){ .ubackdrop,.usheet{transition:none} }
/* 声の選択 */
.vlist{display:grid;gap:6px;margin:4px 0 10px}
.vopt{display:flex;align-items:center;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.vopt:has(input:checked){border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.vopt input{width:18px;height:18px;margin:0;accent-color:var(--ink);flex:none}
.vname{flex:1;font-weight:600}
.vname .muted{font-weight:400}
/* ベースは緑：番号とテストのボタンは緑。赤は小さな差し色（進捗の「学習中」・不正解・ロゴの点）だけ */
.lv .num,.lvhead .num,.uline .un{color:var(--ink)}
.ustart .btn[data-ustart="type"],.btn.ink[data-review="type"]{background:var(--ink);border-color:var(--ink);color:#fff}
.meter .l,.legend span.l::before,.st-l,.bar-col > i{background:color-mix(in srgb,var(--red) 38%,transparent)}
</style>
</head>
<body>
<div id="splash" role="button" tabindex="0" aria-label="タップして始める">
  <canvas class="flagcv" aria-hidden="true"></canvas>
  <div class="splash-text">
    <h1 lang="it">Parole</h1>
    <p class="tagline"><span class="tl-ja">イタリアへ行こう！</span><span class="tl-it" lang="it">Andiamo in Italia!</span></p>
  </div>
</div>
<header>
  <div class="bar">
    <button class="logo" id="goHome" aria-label="ホームへ">Parole</button>
    <nav>
      <button class="navbtn" data-nav="home">学習</button>
      <button class="navbtn" data-nav="list">単語</button>
      <button class="navbtn" data-nav="stats">記録</button>
      <button class="navbtn" data-nav="settings">設定</button>
    </nav>
  </div>
</header>
<main id="main"></main>

<script>
/* ------------------------------------------------------------------ */
/* 内蔵の単語データ（parole_all.csv・重複統合済み・ユニット順）        */
/* ------------------------------------------------------------------ */
const SAMPLE_CSV = `id,level,italian,japanese,pos,gender,forms,category,example_it,example_ja,note,alt_answers,unit
L1-0001,1,ciao,やあ|じゃあね,interj,,,挨拶・定型表現,"Ciao, come stai?",やあ、元気？,出会いにも別れにも使う親しい間柄の挨拶。初対面や目上の人には buongiorno や arrivederci が無難。,,出会いと別れのあいさつ
L1-0067,1,salve,こんにちは|やあ,interj,,,挨拶・定型表現,"Salve, vorrei un caffè.",こんにちは、コーヒーをください。,時間帯を問わず使える、丁寧すぎずくだけすぎない挨拶。店に入るときなどに便利。,,出会いと別れのあいさつ
L1-0005,1,buongiorno,おはよう|こんにちは,interj,,,挨拶・定型表現,"Buongiorno, un caffè per favore.",おはようございます、コーヒーを1杯ください。,午前〜昼過ぎまで使う丁寧な挨拶。夕方以降は buonasera。,buon giorno,出会いと別れのあいさつ
L1-0042,1,buon pomeriggio,こんにちは（午後の）|よい午後を,phrase,,,挨拶・定型表現,"Buon pomeriggio, signora. Come sta?",こんにちは、奥さん。お元気ですか？,午後の挨拶。会う時にも別れ際にも使える。イタリアでは buongiorno や buonasera の方がよく使われる。,buonpomeriggio,出会いと別れのあいさつ
L1-0082,1,buonasera,こんばんは,interj,,,挨拶・定型表現,"Buonasera, un tavolo per due, per favore.",こんばんは、2人用のテーブルをお願いします。,午後から夕方以降に使う挨拶。地域によっては昼過ぎから使う。別れ際には使えるが、就寝前は buonanotte。,buona sera,出会いと別れのあいさつ
L1-0044,1,buonanotte,おやすみ|おやすみなさい,interj,,,挨拶・定型表現,"Buonanotte, a domani!",おやすみなさい、また明日！,寝る前や夜の別れ際に言う挨拶。「こんばんは」は buonasera で、buonanotte は出会いの挨拶には使わない。,buona notte,出会いと別れのあいさつ
L1-0019,1,arrivederci,さようなら|またね,interj,,,挨拶・定型表現,Grazie e arrivederci!,ありがとう、さようなら！,別れの定番の挨拶。親しい相手には ciao、改まった場面では arrivederLa も使う。,a rivederci,出会いと別れのあいさつ
L1-0255,1,arrivederla,さようなら（丁寧）|失礼します,phrase,,,挨拶・定型表現,"Grazie e arrivederla, signora.",ありがとうございました、さようなら、奥様。,Lei で話す相手への丁寧な別れの挨拶。友人には arrivederci か ciao。,,出会いと別れのあいさつ
L1-0037,1,a domani,また明日|明日会いましょう,phrase,,,挨拶・定型表現,"Grazie di tutto, a domani!",いろいろありがとう、また明日！,別れの挨拶。a dopo（また後で）、a presto（近いうちに）なども同じ型。,ci vediamo domani,出会いと別れのあいさつ
L1-0489,1,fino a domani,また明日|明日まで,phrase,,,挨拶・定型表現,Il negozio è chiuso fino a domani.,その店は明日まで閉まっています。,fino a は「〜まで」の意味。別れの挨拶の「また明日」は a domani と言う。,a domani,出会いと別れのあいさつ

L1-0141,1,a presto,また近いうちに|またね,phrase,,,挨拶・定型表現,"Grazie di tutto, a presto!",いろいろありがとう、またね！,「近いうちにまた会いましょう」という別れの挨拶。「また後で」は a dopo や a più tardi を使う。,,出会いと別れのあいさつ

L1-0501,1,sogni d'oro,いい夢を|おやすみなさい,phrase,,,挨拶・定型表現,"Buonanotte, sogni d'oro!",おやすみ、いい夢を！,就寝前の挨拶。buonanotte と一緒に言うことが多い。直訳は「金の夢」。,,出会いと別れのあいさつ
L1-0021,1,come stai,元気？|調子はどう？,phrase,,,挨拶・定型表現,"Ciao Marco, come stai?",やあマルコ、元気？,"親しい相手（tu）に使うくだけた表現。目上や初対面には come sta?（Lei）を使う。返事は Bene, grazie. E tu?",,元気？と自己紹介

L1-0110,1,come va,調子はどう？|元気？,phrase,,,挨拶・定型表現,"Ciao Marco, come va?",やあマルコ、調子はどう？,"親しい相手へのくだけた挨拶。丁寧な相手には come sta?（Lei）を使う。答えは Bene, grazie. E tu?",,元気？と自己紹介
L1-0361,1,come vanno le cose,調子はどう？|最近どう？,phrase,,,挨拶・定型表現,"Ciao Marco, come vanno le cose?",やあマルコ、調子はどう？,"くだけた挨拶。Come va? も同じように使える。丁寧に尋ねるときは Come sta?。答えは Bene, grazie. など。",come va,元気？と自己紹介
L1-0132,1,tutto bene,元気だよ|すべて順調|元気？,phrase,,,挨拶・定型表現,"Ciao Marco, tutto bene?",やあマルコ、元気？,挨拶の「Come stai?」への返事にも、疑問文として「調子はどう？」と聞くのにも使う。口語的でくだけた表現。,va tutto bene,元気？と自己紹介
L1-0041,1,bene,良く|元気で|よし,adv,,,挨拶・定型表現,"Sto bene, grazie. E tu?",元気です、ありがとう。あなたは？,比較級は meglio（più bene とは言わない）。名詞「善」としても使う。Va bene. は「いいですよ」。,,元気？と自己紹介
L1-0145,1,benissimo,とても良い|大変よく|最高,adv,,,挨拶・定型表現,"Come stai? Benissimo, grazie!",調子はどう？とてもいいよ、ありがとう！,bene の絶対最上級。返事や相づちで「了解、いいですよ」の意味にもなる。,,元気？と自己紹介
L1-0435,1,così così,まあまあ|ぼちぼち,phrase,,,挨拶・定型表現,"Come stai? Così così, grazie.",調子はどう？まあまあだよ、ありがとう。,体調や出来を聞かれたときの定番の返事。良くも悪くもない、という控えめなニュアンス。フランス語の comme ci comme ça にあたる表現。,,元気？と自己紹介
L1-0447,1,non c'è male,まあまあ|悪くない,phrase,,,挨拶・定型表現,"Come stai? Non c'è male, grazie.",元気？まあまあだよ、ありがとう。,調子を聞かれたときの返事。直訳は「悪くない」。親しい相手にも丁寧な場面（Come sta?）にも使える。,non male,元気？と自己紹介
L1-0078,1,stare bene,元気である|調子がいい,phrase,,"sto bene, stai bene, sta bene, stiamo bene, state bene, stanno bene",挨拶・定型表現,"Come stai? Sto bene, grazie.",元気？ 元気だよ、ありがとう。,挨拶で体調を聞く・答える定番表現。服などが「似合う」の意味でも使う（Ti sta bene）。,,元気？と自己紹介
L1-0261,1,stare,（調子が）〜である|いる|とどまる|〜している（stare＋ジェルンディオ）,verb,,"sto, stai, sta, stiamo, state, stanno（過去分詞 stato）",挨拶・定型表現,"Come stai? Sto bene, grazie.",調子はどう？元気だよ、ありがとう。,不規則動詞。過去分詞は essere と同形の stato で、助動詞は essere。stare＋ジェルンディオで進行形（sto mangiando）。,,元気？と自己紹介
L1-0052,1,e tu,君は？|あなたは？,phrase,,,挨拶・定型表現,"Sto bene, grazie. E tu?",元気です、ありがとう。君は？,親しい相手に使うくだけた形。丁寧に言うなら e Lei? を使う。,e te,元気？と自己紹介

L1-0027,1,mi chiamo,私の名前は〜です|〜といいます,phrase,,,挨拶・定型表現,Mi chiamo Yuki. E tu?,私はユキといいます。あなたは？,chiamarsi の1人称単数。「あなたの名前は？」は Come ti chiami?（丁寧には Come si chiama?）。,,元気？と自己紹介

L1-0149,1,chiamarsi,〜という名前である|名前は〜です,verb,,"mi chiamo, ti chiami, si chiama, ci chiamiamo, vi chiamate, si chiamano",挨拶・定型表現,Mi chiamo Yuki e sono giapponese.,私はユキといい、日本人です。,再帰動詞。自己紹介の定番で、Come ti chiami?（名前は？）、丁寧には Come si chiama? と聞く。,,元気？と自己紹介
L1-0029,1,il nome,名前|名詞,noun,m,nomi,挨拶・定型表現,Come ti chiami? Il mio nome è Marco.,名前は何ていうの？僕の名前はマルコだよ。,-e で終わるが男性名詞。姓は il cognome。丁寧に名前を尋ねるときは Come si chiama? を使う。,,元気？と自己紹介

L1-0334,1,piacere di conoscerla,はじめまして（丁寧）|お会いできて嬉しいです（丁寧）,phrase,,,挨拶・定型表現,"Buongiorno, signora Rossi. Piacere di conoscerla.",おはようございます、ロッシさん。はじめまして。,Lei（敬称）を使う相手に言う初対面の挨拶。親しい相手には piacere di conoscerti。単に piacere / molto piacere とも言い、これは相手を選ばず使える。,molto piacere|piacere,元気？と自己紹介
L1-0397,1,piacere mio,こちらこそ|どういたしまして,phrase,,,挨拶・定型表現,Grazie dell'aiuto! - Piacere mio!,助けてくれてありがとう！ー こちらこそ！,自己紹介で Piacere と言われた返事や、お礼への返事として使う。単独の Piacere が「はじめまして」。,il piacere è mio,元気？と自己紹介
L1-0233,1,di dove sei,出身はどこですか|どこの出身ですか,phrase,,,挨拶・定型表現,"Ciao, di dove sei?",こんにちは、出身はどこですか？,tu に対するくだけた形。丁寧には Di dov'è? と言う。答えは Sono di Tokyo.（〜出身です）。,di dove sei tu,元気？と自己紹介

L1-0057,1,non lo so,わからない|知らない,phrase,,,挨拶・定型表現,"Non lo so, mi dispiace.",わかりません、ごめんなさい。,"sapere（知っている）の否定形。lo は「それ」を指す。丁寧に言うなら mi dispiace, non lo so。",non so,ことばが通じないとき
L1-0167,1,parla inglese,英語を話しますか|（彼・彼女は）英語を話す,phrase,,,挨拶・定型表現,"Scusi, parla inglese?",すみません、英語を話せますか？,丁寧な相手には Parla inglese?、親しい相手には Parli inglese?。動詞 parlare の3人称単数で、Lei に対する敬称形。,,ことばが通じないとき
L1-0089,1,non parlo italiano,イタリア語は話せません|イタリア語を話しません,phrase,,,挨拶・定型表現,"Mi scusi, non parlo italiano.",すみません、イタリア語は話せません。,parlare の否定形。「少し話せる」は parlo un po' di italiano。英語が通じるか聞くなら Parla inglese?,non parlo l'italiano,ことばが通じないとき
L1-0205,1,parlo un po' di italiano,イタリア語を少し話せます|イタリア語を少し話します,phrase,,,挨拶・定型表現,"Scusi, parlo un po' di italiano.",すみません、イタリア語は少しだけ話せます。,un po' は un poco の短縮形。語尾のアポストロフィを忘れずに。相手には Parla inglese? と尋ねる。,parlo un poco di italiano,ことばが通じないとき
L1-0522,1,parli più piano,もっとゆっくり話してください|もっとゆっくり話して,phrase,,,挨拶・定型表現,"Scusi, parli più piano, per favore.",すみません、もっとゆっくり話してください。,parli は Lei への丁寧な命令形。親しい相手（tu）には Parla più piano、複数の相手（voi）には Parlate più piano。piano は「ゆっくり、小さな声で」の意味。,,ことばが通じないとき
L1-0073,1,l'inglese,英語|イギリス人（男性）,noun,m,gli inglesi（イギリス人の複数形。言語名としては通常単数のみ）,挨拶・定型表現,Parlo un po' d'inglese.,英語を少し話します。,言語名の意味では男性名詞で、語頭は小文字。「イギリス人」の意味では男女同形で、男性は un inglese、女性は un'inglese。複数形は gli inglesi（男性・混合）/ le inglesi（女性）。単数で l' になると性は区別できない。,la lingua inglese,ことばが通じないとき
L1-0118,1,italiano,イタリアの|イタリア人の,adj,,"italiana, italiani, italiane",挨拶・定型表現,Mi piace la cucina italiana.,私はイタリア料理が好きです。,国籍・言語を表す形容詞は小文字で書く。名詞では「イタリア人」、l'italiano は「イタリア語」の意味にもなる。,,ことばが通じないとき
L1-0377,1,giapponese,日本の|日本人の|日本語の,adj,,giapponesi,挨拶・定型表現,Mi piace il cibo giapponese.,私は日本料理が好きです。,-e 形容詞で男女同形、複数は giapponesi。名詞では日本人（il/la giapponese）、日本語（il giapponese）も表す。国籍の形容詞は小文字で書く。,,ことばが通じないとき
L1-0442,1,francese,フランスの|フランス人の,adj,,francesi,挨拶・定型表現,Mi piace il vino francese.,私はフランスのワインが好きです。,男女同形の -e 形容詞で、複数は francesi。名詞では il francese（フランス語、フランス人男性）。国籍・言語名は小文字。,,ことばが通じないとき
L1-0463,1,spagnolo,スペインの|スペイン人の,adj,,"spagnola, spagnoli, spagnole",挨拶・定型表現,Mi piace la cucina spagnola.,私はスペイン料理が好きです。,国籍・言語の形容詞は小文字で書く。名詞では「スペイン人」「スペイン語」（lo spagnolo）の意味にもなる。,,ことばが通じないとき
L1-0473,1,americano,アメリカの|アメリカ人の,adj,,"americana, americani, americane",挨拶・定型表現,Il mio amico è americano.,私の友達はアメリカ人です。,国籍・形容詞は小文字で書く。名詞として「アメリカ人」、またアメリカーノ（コーヒー）の意味でも使う。,,ことばが通じないとき
L1-0222,1,buon appetito,いただきます|召し上がれ,phrase,,,挨拶・定型表現,Buon appetito a tutti!,みなさん、どうぞ召し上がれ！,"食事の前に言う決まり文句。返事は Grazie, altrettanto!（ありがとう、あなたも）。日本語の「いただきます」と違い、相手に向けて言う。",,お祝いとひとこと
L1-0150,1,cin cin,乾杯,interj,,,挨拶・定型表現,Cin cin! Alla nostra salute!,乾杯！私たちの健康に！,グラスを合わせるときの掛け声。綴りは cincin とも書く。salute! も乾杯の掛け声としてよく使われる。,cincin|salute,お祝いとひとこと
L1-0349,1,alla salute,乾杯！,phrase,,,挨拶・定型表現,Alla salute! Buon appetito a tutti.,乾杯！みなさん、召し上がれ。,単に Salute! とも言う。くしゃみをした人にかける「お大事に」は Salute! で、alla salute とは言わない。乾杯は cin cin もよく使う。,salute|cin cin,お祝いとひとこと
L1-0460,1,salute,乾杯|お大事に（くしゃみをした人に）,interj,,,挨拶・定型表現,Salute! Alla nostra amicizia!,乾杯！私たちの友情に！,くしゃみをした人にも言う。名詞 la salute は「健康」の意味で、複数形は通常使わない。乾杯の別表現に cin cin がある。,cin cin,お祝いとひとこと
L1-0103,1,buon viaggio,よい旅を|いってらっしゃい,phrase,,,挨拶・定型表現,"Ciao, buon viaggio!",じゃあね、よい旅を！,旅立つ人にかける定型表現。バカンスなら buone vacanze（複数形が普通）も使う。,,お祝いとひとこと
L1-0043,1,buona giornata,よい一日を|良い一日を,phrase,,,挨拶・定型表現,Grazie e buona giornata!,ありがとう、よい一日を！,別れ際に使う挨拶。夕方以降は buona serata、夜は buonanotte。返事は Altrettanto!（あなたも）。,buona giornata a lei,お祝いとひとこと
L1-0104,1,buona serata,良い夜を|良い晩を,phrase,,,挨拶・定型表現,"Grazie, buona serata!",ありがとう、良い夜を！,夕方〜夜、別れ際に使う挨拶。夜寝る前は buonanotte。,,お祝いとひとこと
L1-0480,1,buona settimana,良い一週間を,phrase,,,挨拶・定型表現,"Grazie, buona settimana a tutti!",ありがとう、皆さん良い一週間を！,日曜の夜や月曜など週の初めに、別れ際に言う。週末前なら buon fine settimana を使う。返事は altrettanto（あなたも）など。,buona settimana a te,お祝いとひとこと
L1-0189,1,buona domenica,良い日曜日を|楽しい日曜日を,phrase,,,挨拶・定型表現,"Grazie, buona domenica anche a te!",ありがとう、あなたも良い日曜日を！,日曜日当日や、前日の土曜の別れ際に言う挨拶。週末全体には buon fine settimana（良い週末を）を使う。,,お祝いとひとこと
L1-0223,1,buon fine settimana,よい週末を,phrase,,,挨拶・定型表現,"Grazie, buon fine settimana!",ありがとう、よい週末を！,金曜や土曜に別れ際に言う挨拶。返事は Altrettanto!（あなたも）。fine settimana は男性名詞で不変。,buon weekend|buon week-end,お祝いとひとこと
L1-0147,1,buone vacanze,良い休暇を|楽しい休暇を,phrase,,,挨拶・定型表現,"Buone vacanze, ci vediamo a settembre!",良い休暇を、9月に会いましょう！,"休暇に出かける人への挨拶。夏休みや祝日前に使う。返事は Grazie, altrettanto!（あなたも）。",buona vacanza,お祝いとひとこと
L1-0224,1,buona fortuna,幸運を|頑張って,phrase,,,挨拶・定型表現,Domani hai l'esame? Buona fortuna!,明日試験なの？幸運を祈ってるよ！,試験や挑戦の前にかける言葉。「in bocca al lupo」も同じ場面で使い、返事は「crepi」。,in bocca al lupo,お祝いとひとこと
L1-0102,1,buon compleanno,誕生日おめでとう,phrase,,,挨拶・定型表現,"Buon compleanno, Marco!",誕生日おめでとう、マルコ！,compleanno は男性名詞。誕生日には Tanti auguri! も定番（誕生日以外のお祝いにも使える）。,tanti auguri di buon compleanno,お祝いとひとこと
L1-0466,1,tanti auguri,おめでとう|お祝いの言葉,phrase,,,挨拶・定型表現,Tanti auguri di buon compleanno!,お誕生日おめでとう！,誕生日・祝日・結婚などで広く使う。auguri だけでも言える。クリスマスや新年にも使える。,auguri,お祝いとひとこと
L1-0434,1,congratulazioni,おめでとう|おめでとうございます,interj,,,挨拶・定型表現,Congratulazioni per il tuo nuovo lavoro!,新しい仕事、おめでとう！,常に複数形で使う。祝う内容は per で続ける（Congratulazioni per la laurea!）。auguri は誕生日や祝祭などで「幸運・幸せを祈る」ときの言葉で、使い分ける。,complimenti,お祝いとひとこと
L1-0146,1,buon Natale,メリークリスマス|クリスマスおめでとう,phrase,,,挨拶・定型表現,Buon Natale a tutti!,みなさん、メリークリスマス！,Natale は通常大文字で書く。新年の挨拶は buon anno。「Buone feste」は年末年始全般に使える。,,お祝いとひとこと
L1-0188,1,buon anno,あけましておめでとう|良いお年を,phrase,,,挨拶・定型表現,Buon anno a tutti!,みなさん、あけましておめでとう！,年末年始のあいさつ。年が明ける前後どちらにも使える。buon anno nuovo とも言う。,buon anno nuovo|buon capodanno,お祝いとひとこと
L1-0440,1,felice anno nuovo,あけましておめでとう|新年おめでとう,phrase,,,挨拶・定型表現,Felice anno nuovo a tutti!,皆さん、あけましておめでとうございます！,年末年始の挨拶。日常では Buon anno! のほうがずっと一般的。年が明ける前に「よいお年を」の意味でも使える。,buon anno|buon anno nuovo|felice anno,お祝いとひとこと
L1-0357,1,buona idea,いい考えだね|名案だ,phrase,,,挨拶・定型表現,Andiamo al mare? Buona idea!,海に行く？ いい考えだね！,相手の提案への返事として使う。冠詞なしの感嘆表現。che buona idea! と強めることもできる。,ottima idea,お祝いとひとこと
L1-0228,1,che bello,素敵だね|いいね|きれい,phrase,,,挨拶・定型表現,Che bello questo posto!,この場所、素敵だね！,"che＋形容詞で感嘆を表す。感嘆の対象が女性名詞や複数のものなら che bella, che belli, che belle と性・数を一致させる。",,お祝いとひとこと
L1-0191,1,che buono,なんて美味しい！|美味しい！,interj,,,挨拶・定型表現,Che buono questo gelato!,このジェラート、なんて美味しいの！,食べ物に対して使う感嘆表現。複数のものには che buoni、女性名詞には che buona / che buone と性数を合わせる。,,お祝いとひとこと
L1-0449,1,peccato,残念|惜しい,interj,,,挨拶・定型表現,"Peccato, il museo è chiuso oggi.",残念、今日は美術館が休みです。,Che peccato! で「残念だね」。名詞の peccato（罪）が元で、È un peccato che＋接続法も頻出。,che peccato,お祝いとひとこと
L1-0144,1,ah,ああ|あっ,interj,,,挨拶・定型表現,"Ah, ho capito!",ああ、わかった！,驚き・納得・喜びなど幅広い感情を表す間投詞。イントネーションで意味が変わる。,,お祝いとひとこと
L1-0113,1,ecco,ほら|はい、どうぞ|これが〜です,interj,,,挨拶・定型表現,Ecco il tuo caffè.,はい、君のコーヒーだよ。,物や人を示すときに使う。代名詞は動詞の後ろにつく（eccolo「ほら、それだ」、eccomi「ここにいます」）。,,お祝いとひとこと
L1-0472,1,allora,それでは|その時|じゃあ,adv,,,挨拶・定型表現,"Allora, andiamo al ristorante?",それじゃあ、レストランに行こうか？,会話では「じゃあ、それで」とつなぎの言葉として頻出。「その時、当時」の意味でも使う（例: Allora ero giovane.「当時は若かった」）。,,お祝いとひとこと
L1-0414,1,ti amo,愛してる|君を愛している,phrase,,,挨拶・定型表現,Ti amo tanto.,君をとても愛してる。,恋人や配偶者への強い愛情表現。家族や友人には ti voglio bene（大好き）がよく使われる。,,お祝いとひとこと
L1-0137,1,zero,ゼロ|0,num,,,数・時間・曜日,Fa zero gradi oggi.,今日は気温が0度です。,"数詞としては不変。zero のあとの名詞は複数形になる（zero gradi, zero euro）。数字の「0」を指す男性名詞としては複数形 zeri もある。",,数 0〜20
L1-0003,1,uno,1,num,,"un, una, un'",数・時間・曜日,"Un biglietto, per favore.",切符を1枚ください。,名詞の前では不定冠詞と同じく un / uno / una / un' と変化。,,数 0〜20
L1-0006,1,due,2,num,,,数・時間・曜日,"Un tavolo per due, per favore.",2人用のテーブルをお願いします。,男女同形で変化しない。名詞の前でも形は due のまま。,,数 0〜20
L1-0012,1,tre,3,num,,,数・時間・曜日,Siamo in tre.,私たちは3人です。,不変。複合数詞では末尾の tre にアクセントが付く（ventitré）。,,数 0〜20
L1-0011,1,quattro,4,num,,,数・時間・曜日,Siamo in quattro.,私たちは4人です。,"不変。レストランで人数を伝えるときは Un tavolo per quattro, per favore. のように使う。",,数 0〜20
L1-0020,1,cinque,5,num,,,数・時間・曜日,Siamo in cinque.,私たちは5人です。,不変。人数は in cinque（5人で）と言える。,,数 0〜20
L1-0033,1,sei,6,num,,,数・時間・曜日,Siamo in sei.,私たちは6人です。,essere の tu の活用形 sei（君は〜だ）と同形。文脈で区別する。数詞は不変。,,数 0〜20
L1-0034,1,sette,7,num,,,数・時間・曜日,Sono le sette di sera.,夜の7時です。,時刻は le sette のように女性複数の定冠詞を付ける（1時のみ l'una）。,,数 0〜20
L1-0061,1,otto,8,num,,,数・時間・曜日,Sono le otto.,8時です。,時刻は女性複数の定冠詞を使い le otto。数詞 otto は性数変化しない。,,数 0〜20
L1-0058,1,nove,9,num,,,数・時間・曜日,Il treno parte alle nove.,列車は9時に出発します。,不変の数詞。時刻は alle nove のように女性複数定冠詞を使う。,,数 0〜20
L1-0023,1,dieci,10,num,,,数・時間・曜日,Il biglietto costa dieci euro.,切符は10ユーロです。,不変の数詞で、男性・女性どちらの名詞にも同じ形を使う。dieci euro のように名詞の前に置く。,,数 0〜20
L1-0183,1,undici,11,num,,,数・時間・曜日,Il treno parte alle undici.,列車は11時に出発します。,時刻は le ore の省略なので le undici（11時）。日付では母音で始まるため l'undici（11日）となる。,,数 0〜20
L1-0155,1,dodici,12,num,,,数・時間・曜日,Sono le dodici.,12時です。,不変。dodici は「十二」。正午は mezzogiorno とも言う。,,数 0〜20
L1-0415,1,tredici,13,num,,,数・時間・曜日,Il bus numero tredici passa qui.,13番のバスはここを通ります。,"tredici は不変。11〜16は -dici で終わる（undici, dodici, tredici...）。",,数 0〜20
L1-0296,1,quattordici,14,num,,,数・時間・曜日,Ho quattordici anni.,私は14歳です。,数詞は不変。年齢は avere ＋ 数 ＋ anni で言う（essere は使わない）。,,数 0〜20
L1-0174,1,quindici,15,num,,,数・時間・曜日,Il museo apre tra quindici minuti.,美術館は15分後に開きます。,"不変の数詞。11〜16は -dici で終わる（undici, dodici, tredici, quattordici, quindici, sedici）。",,数 0〜20
L1-0408,1,sedici,16,num,,,数・時間・曜日,Ho sedici anni.,私は16歳です。,"11〜16は -dici で終わる（undici, dodici, tredici, quattordici, quindici, sedici）。不変で性による変化はない。",,数 0〜20
L1-0514,1,diciassette,17,num,,,数・時間・曜日,Ho diciassette anni.,私は17歳です。,不変。dieci＋e＋sette（10と7）が縮まった形。16 は sedici、18 は diciotto。,,数 0〜20
L1-0271,1,diciotto,18,num,,,数・時間・曜日,Ho diciotto anni.,私は18歳です。,年齢は avere を使って言う。diciassette（17）、diciannove（19）と混同しやすい。,,数 0〜20
L1-0365,1,diciannove,19,num,,,数・時間・曜日,Ho diciannove anni.,私は19歳です。,"10の位と1の位をつなげて1語で書く。diciassette, diciotto, diciannove の順に並ぶ。",,数 0〜20
L1-0134,1,venti,20,num,,,数・時間・曜日,Ho venti anni.,私は20歳です。,年齢は avere ... anni で言う。21 は ventuno だが、名詞の前では ventun anni のように語尾を落とす形もよく使われる（ventuno anni も可）。,,数 0〜20
L1-0252,1,ventidue,22,num,,,数・時間・曜日,Ho ventidue anni.,私は22歳です。,venti は uno や otto のように母音で始まる語が続くと、ventuno・ventotto のように語末の i が落ちるが、ventidue は変化しない。年齢は avere を使う。,,数 0〜20
L1-0347,1,primo,1番目の|最初の,adj,,"prima, primi, prime",数・時間・曜日,Il primo giorno visitiamo il centro.,初日は中心街を観光します。,序数詞。名詞に性数一致する。日付は il primo maggio（5月1日）のみ序数、他は基数を使う。,,数 0〜20
L1-0215,1,trenta,30,num,,,数・時間・曜日,Il biglietto costa trenta euro.,切符は30ユーロです。,10の位の数詞。uno と otto が続くときは語尾の a を落とす（trentuno 31、trentotto 38）。それ以外は trentadue 32、trentatré 33 のようにそのまま続ける。,,大きな数と値段
L1-0295,1,quaranta,40,num,,,数・時間・曜日,Ho quaranta anni.,私は40歳です。,"30〜90の十の位は -anta で終わる（20は venti）。quarantaは不変で、一の位が1と8のときは語尾の母音が落ちる（quarantuno, quarantotto）。",,大きな数と値段
L1-0193,1,cinquanta,50,num,,,数・時間・曜日,Ho cinquanta euro.,私は50ユーロ持っています。,"十の位の数詞は不変。-anta の仲間（quaranta, sessanta）。uno・otto が続くときは語尾の母音を落とす（cinquantuno 51, cinquantotto 58）。",,大きな数と値段
L1-0300,1,sessanta,60,num,,,数・時間・曜日,Ho sessanta euro.,60ユーロ持っています。,"30〜90の十の位は -anta で終わる（quaranta, cinquanta, sessanta など）。uno と otto が続くときだけ語尾の母音が落ちる（sessantuno, sessantotto）。sessantadue などはそのまま続ける。",,大きな数と値段
L1-0461,1,settanta,70,num,,,数・時間・曜日,Mia nonna ha settant'anni.,私の祖母は70歳です。,"settanta は不変。母音で始まる anni の前では settant'anni と縮約されることが多い（vent'anni, trent'anni なども同様）。",,大きな数と値段

L1-0448,1,novanta,90,num,,,数・時間・曜日,Il biglietto costa novanta euro.,切符は90ユーロです。,数詞は不変。novantuno のように1が付くと語尾の a が落ちる。,,大きな数と値段

L1-0098,1,l'anno,年|歳,noun,m,anni,数・時間・曜日,Quest'anno vado in Italia.,今年はイタリアに行きます。,年齢は avere ... anni（Ho venti anni.）。母音で始まるので l'anno。Buon anno! は新年の挨拶。,,月・季節・行事
L1-0503,1,la stagione,季節|シーズン,noun,f,stagioni,数・時間・曜日,Qual è la tua stagione preferita?,あなたの好きな季節はどれですか？,四季は le quattro stagioni。ピザの名前にもなっている。-ione の名詞は女性名詞が多い。,,月・季節・行事
L1-0335,1,la primavera,春,noun,f,primavere,数・時間・曜日,In primavera i fiori sono bellissimi.,春には花がとてもきれいです。,「春に」は in primavera と言い、冠詞は付けない（d'estate のように di を使う形もある）。主語などでは la primavera è bella のように冠詞を付ける。,,月・季節・行事
L1-0236,1,l'estate,夏,noun,f,estati,数・時間・曜日,In estate vado al mare.,夏は海に行きます。,「夏に」は in estate または d'estate。複数形 estati はまれ。,,月・季節・行事
L1-0428,1,l'autunno,秋,noun,m,autunni,数・時間・曜日,In autunno fa fresco a Roma.,ローマでは秋は涼しいです。,「秋に」は in autunno。季節名は男性名詞で、母音で始まるので冠詞は l'。,,月・季節・行事
L1-0256,1,l'inverno,冬,noun,m,inverni,数・時間・曜日,In inverno fa molto freddo qui.,冬はここはとても寒いです。,「冬に」は in inverno。母音で始まるので冠詞は l' になる。,,月・季節・行事

L1-0231,1,il compleanno,誕生日,noun,m,compleanni,数・時間・曜日,Oggi è il mio compleanno.,今日は私の誕生日です。,お祝いは Buon compleanno! または Auguri! と言う。,,月・季節・行事
L1-0341,1,la vacanza,休暇|バカンス,noun,f,vacanze,数・時間・曜日,Siamo in vacanza a Roma.,私たちはローマで休暇中です。,「休暇中」は in vacanza。複数形 le vacanze で「休み・バカンス」の意味でよく使う。,le vacanze,月・季節・行事
L1-0488,1,la festa,パーティー|祝日|祭り,noun,f,feste,数・時間・曜日,Domani c'è una festa a casa mia.,明日、私の家でパーティーがあります。,Buona festa! は祝日などに言う挨拶。「誕生日」は compleanno で、誕生日パーティーは festa di compleanno。,,月・季節・行事
L1-0115,1,la famiglia,家族,noun,f,famiglie,家族・人,La mia famiglia abita a Roma.,私の家族はローマに住んでいます。,単数形でも「家族」という集合を表す。複数形は famiglie で、-glia が -glie になる。,,家族
L1-0125,1,il padre,父|父親,noun,m,padri,家族・人,Mio padre lavora in banca.,父は銀行で働いています。,呼びかけや口語では papà が多い。所有形容詞と使うとき、修飾語のない単数の親族名詞は通常冠詞なし（mio padre）。ただし loro は例外（il loro padre）。,il papà,家族
L1-0074,1,la madre,母親|母,noun,f,madri,家族・人,Mia madre abita a Roma.,私の母はローマに住んでいます。,"呼びかけや親しい間柄では mamma も使う。修飾語のない単数の家族名詞は所有詞に冠詞を付けない（mia madre）。ただし loro や mamma には付く（la loro madre, la mia mamma）。",la mamma,家族
L1-0090,1,il papà,パパ|お父さん,noun,m,papà（不変）,家族・人,Mio papà lavora in banca.,うちのパパは銀行で働いています。,アクセント付きの -à で終わるので複数形も papà（i papà）。口語的で、改まった場では padre。家族名詞は単数なら冠詞を省くのが原則だが、papà は mio papà とも il mio papà とも言う。,il babbo,家族
L1-0084,1,la mamma,お母さん|ママ,noun,f,mamme,家族・人,La mia mamma è di Napoli.,私の母はナポリの出身です。,くだけた呼び方。改まった場面では la madre。mamma は愛称形なので、所有形容詞と使うときは la mia mamma のように冠詞を付けるのが普通（mia madre は冠詞なし）。,,家族
L1-0116,1,il figlio,息子|子ども,noun,m,figli,家族・人,Ho un figlio di cinque anni.,私には5歳の息子がいます。,複数 i figli は「息子たち」だけでなく「子どもたち（男女）」も指す。女の子は la figlia。,,家族
L1-0237,1,la figlia,娘,noun,f,figlie,家族・人,Mia figlia ha dieci anni.,私の娘は10歳です。,男性形は il figlio（息子）。複数 i figli は「子どもたち」の意味にもなる。,,家族
L1-0158,1,il fratello,兄|弟|兄弟,noun,m,fratelli,家族・人,Mio fratello lavora a Milano.,兄（弟）はミラノで働いています。,イタリア語では兄と弟を区別せず fratello と言う。区別するなら fratello maggiore（兄）、fratello minore（弟）。複数 fratelli は兄弟や兄弟姉妹の意味にもなる。,,家族
L1-0140,1,la sorella,姉|妹,noun,f,sorelle,家族・人,Mia sorella abita a Roma.,私の姉（妹）はローマに住んでいます。,イタリア語では姉と妹を区別せず、必要なら maggiore（年上）や minore（年下）を添える。,,家族

L1-0123,1,la nonna,祖母|おばあちゃん,noun,f,nonne,家族・人,Mia nonna abita a Roma.,私の祖母はローマに住んでいます。,男性形は il nonno。複数形 i nonni は「祖父母」の意味にもなる。,,家族

L1-0388,1,il marito,夫,noun,m,mariti,家族・人,Mio marito lavora in banca.,私の夫は銀行で働いています。,妻は la moglie。家族名詞の単数形では所有形容詞に冠詞を付けない（mio marito）。ただし loro は例外で il loro marito となる。,,家族
L1-0445,1,la moglie,妻|奥さん,noun,f,mogli,家族・人,Mia moglie è italiana.,私の妻はイタリア人です。,複数形は mogli。夫は il marito。親族名詞は単数なら所有形容詞に冠詞を付けない（mia moglie）。,,家族
L1-0354,1,il bambino,子ども|男の子|幼児,noun,m,i bambini,家族・人,Il bambino gioca in giardino.,男の子は庭で遊んでいます。,女の子は la bambina。複数 bambini は男女混合の「子どもたち」も指す。,,家族
L1-0170,1,la persona,人|人物,noun,f,persone,家族・人,Siamo in tre persone.,私たちは3人です。,男性でも女性でも常に女性名詞。「人々」は le persone または la gente（単数扱い）。,,人をあらわすことば

L1-0156,1,la donna,女性|女の人,noun,f,donne,家族・人,Quella donna è la mia insegnante.,あの女性は私の先生です。,「妻」の意味でも使うが、普通は moglie。男性は uomo（複数 uomini）。,,人をあらわすことば

L1-0337,1,la ragazza,女の子|少女|彼女（恋人）,noun,f,ragazze,家族・人,La ragazza beve un caffè.,その女の子はコーヒーを飲んでいます。,「恋人（女性）」の意味でも使う。男の子は ragazzo、複数で男女混合なら ragazzi。,,人をあらわすことば
L1-0138,1,l'amico,友人（男性）|友達,noun,m,"amici（女性は amica, amiche）",家族・人,Questo è il mio amico Marco.,こちらは友人のマルコです。,複数形 amici は h を入れず -ci と綴り、c は硬い /k/ から軟らかい「チ」の音に変わる（アミーチ）。女性の友人は l'amica、複数形は le amiche（h が入る）。,,人をあらわすことば
L1-0096,1,l'amica,女友達|友人（女性）,noun,f,amiche,家族・人,La mia amica abita a Roma.,私の女友達はローマに住んでいます。,男性は l'amico（複数 gli amici）。女性複数 amiche は硬い /k/ の音を保つため h を入れて -che と綴る。,,人をあらわすことば
L1-0517,1,la fidanzata,彼女|恋人（女性）|婚約者（女性）,noun,f,fidanzate,家族・人,"Questa è la mia fidanzata, Anna.",こちらは私の恋人のアンナです。,男性は il fidanzato。本来は「婚約者」だが、日常では交際中の恋人にも広く使う。,,人をあらわすことば

L1-0212,1,la signora,〜さん（成人女性への敬称）|女性|夫人,noun,f,signore,家族・人,"Buongiorno, signora Rossi.",おはようございます、ロッシさん。,女性への丁寧な呼びかけ。呼びかけでは冠詞なしで signora Rossi、話題にするときは la signora Rossi。男性は signore（名前の前では signor）。,,人をあらわすことば
L1-0465,1,lo studente,学生|大学生,noun,m,"studenti（女性は la studentessa, le studentesse）",家族・人,Lo studente studia in biblioteca.,学生は図書館で勉強しています。,s＋子音で始まるので冠詞は lo、複数は gli studenti。女性は studentessa。,,人をあらわすことば
L1-0497,1,il professore,先生|教授,noun,m,professori,家族・人,Il professore parla molto piano.,先生はとてもゆっくり話します。,女性形は la professoressa（複数 le professoresse）。中学以上の教師や大学教授を指し、小学校の先生は maestro/maestra。,l'insegnante,人をあらわすことば
L1-0281,1,giovane,若い,adj,,giovani,家族・人,Mia sorella è molto giovane.,私の妹はとても若いです。,男女同形の -e 形容詞。名詞としても使い、un giovane は「若者」。,,人をあらわすことば
L1-0016,1,io,私|僕,pron,,,疑問詞・代名詞,Io sono di Tokyo.,私は東京出身です。,主語は動詞の活用で分かるため、普通は省略する。強調や対比のときだけ io を入れる。,,私・君・彼（代名詞と所有）
L1-0079,1,tu,君|あなた（親しい相手に）,pron,,,疑問詞・代名詞,Tu come stai?,君は元気？,親しい相手や同年代に使う。目上や初対面には敬称の Lei を使う。主語は省略されることが多い。,,私・君・彼（代名詞と所有）
L1-0055,1,lui,彼,pron,,,疑問詞・代名詞,Lui è di Roma.,彼はローマ出身です。,主語人称代名詞。通常は省略するが、強調や対比では使う。前置詞の後では「彼を・彼に」の意味でも使う（con lui）。,,私・君・彼（代名詞と所有）
L1-0385,1,lei,彼女|あなた（敬称）,pron,,,疑問詞・代名詞,Lei è di Roma?,あなたはローマ出身ですか？,敬称では大文字 Lei と書くことがある。動詞は3人称単数。親しい相手には tu を使う。,,私・君・彼（代名詞と所有）
L1-0036,1,noi,私たち|我々,pron,,,疑問詞・代名詞,Noi andiamo al mare domani.,私たちは明日海に行きます。,主語人称代名詞は省略されることが多く、強調や対比のときに使う。女性だけの場合は noi のまま。,,私・君・彼（代名詞と所有）
L1-0217,1,voi,君たち|あなたがた,pron,,,疑問詞・代名詞,Voi siete di Roma?,あなたたちはローマの出身ですか？,tu の複数形。目的語の「君たちを・に」は vi。南部では目上の一人にも voi を使うことがある。,,私・君・彼（代名詞と所有）
L1-0120,1,loro,彼ら|彼女ら|それら,pron,,,疑問詞・代名詞,Loro sono di Napoli.,彼らはナポリ出身です。,男女同形の主語代名詞。Loro と大文字にすると「あなた方」の敬称にもなるが、現在はまれ。所有形容詞（loro）は不変。,,私・君・彼（代名詞と所有）
L1-0087,1,mi,私を|私に,pron,,,疑問詞・代名詞,Mi chiamo Marco.,私の名前はマルコです。,直接・間接目的語の弱形代名詞で動詞の前に置く。再帰代名詞（mi chiamo）としても頻出。強勢形は me。,,私・君・彼（代名詞と所有）
L1-0250,1,ti,君を|君に,pron,,,疑問詞・代名詞,Ti chiamo domani.,明日君に電話するよ。,tu の目的語・再帰代名詞（弱形）。通常は動詞の前に置く。肯定命令形・不定詞では後ろに付く（例: Alzati!「起きなさい」、voglio vederti「君に会いたい」）。,,私・君・彼（代名詞と所有）
L1-0389,1,me,私|私を|私に,pron,,,疑問詞・代名詞,Vieni con me?,私と一緒に来る？,前置詞の後や強調で使う強勢形。主語は io。me lo のように mi が me に変わる形もある。,,私・君・彼（代名詞と所有）
L1-0499,1,si,自分自身を|自分に|（一般的な）人は,pron,,"再帰代名詞: mi, ti, si, ci, vi, si",疑問詞・代名詞,Si chiama Marco.,彼はマルコという名前です。,"3人称（単数・複数）の再帰代名詞。非人称（si dice「と言われる」）や受身にも使う。si（代名詞）と sì（はい）はアクセント記号で区別。活用した動詞の前に置くが、不定詞・ジェルンディオでは語尾に付く（lavarsi, lavandosi）。",,私・君・彼（代名詞と所有）
L1-0390,1,mio,私の|私のもの,pron,,"mia, miei, mie",疑問詞・代名詞,Questa valigia è mia.,このスーツケースは私のです。,所有形容詞としては通常 il mio libro のように冠詞が付く。代名詞では il mio（私のもの）だが、essere の後の述語では冠詞なしが普通（è mia）。修飾語のない家族の単数名詞では冠詞なし（mia madre）。,,私・君・彼（代名詞と所有）
L1-0340,1,tuo,君の|君のもの,adj,,"tua, tuoi, tue",疑問詞・代名詞,Questa è la tua borsa?,これは君のかばん？,"所有形容詞（名詞の性数に一致）。通常は冠詞を伴う（il tuo libro, la tua borsa）。ただし単数の親族名詞（修飾語なし）では冠詞を付けない（tua madre, tuo fratello）。複数形（i tuoi fratelli）や愛称（la tua mamma）、修飾語つき（il tuo fratello maggiore）では冠詞が必要。代名詞としても使う（il tuo = 君のもの）。丁寧な相手（Lei）には suo/Suo。",,私・君・彼（代名詞と所有）
L1-0506,1,suo,彼の|彼女の|あなたの（Lei）,adj,,"sua, suoi, sue",疑問詞・代名詞,Questa è la sua borsa.,これは彼女のかばんです。,"所有者ではなく所有される物の性数に一致する（彼のかばんも彼女のかばんも la sua borsa）。通常は冠詞つき（il suo libro）だが、修飾語のつかない単数の親族名詞では冠詞を付けない（sua madre）。ただし複数（i suoi fratelli）や形容詞・指小辞がつく場合（la sua sorella maggiore）は冠詞が必要。敬称 Lei に対しては Suo, Sua と大文字で書くこともある。",,私・君・彼（代名詞と所有）
L1-0049,1,che cosa,何|何を,pron,,,疑問詞・代名詞,Che cosa desidera?,何になさいますか？,疑問代名詞で不変。cosa 単独や che 単独でも同じ意味で使える。,cosa|che,何・どこ・これ・あれ
L1-0111,1,cosa,何|もの|こと,pron,,,疑問詞・代名詞,Cosa vuoi mangiare?,何が食べたい？,疑問詞では「何」(Cosa fai?。Che cosa fai? も同義)。名詞の cosa は女性名詞で複数形 cose。,che cosa|che,何・どこ・これ・あれ
L1-0192,1,chi,誰|〜する人,pron,,,疑問詞・代名詞,Chi è quella ragazza?,あの女の子は誰ですか？,疑問詞として「誰」。性数は変化せず、動詞は原則単数で受ける（ただし Chi sono quelle ragazze? のように essere の補語が複数なら複数）。前置詞と使う: con chi（誰と）、di chi（誰の）。「〜する人」の意味でも使う（Chi studia impara.）。,,何・どこ・これ・あれ
L1-0051,1,dove,どこ|どこに,adv,,,疑問詞・代名詞,Dov'è la stazione?,駅はどこですか？,dove è は dov'è と縮約する。「どこから」は da dove。di dove は出身を尋ねる（Di dove sei? 出身はどこ？）。,,何・どこ・これ・あれ
L1-0129,1,quando,いつ|〜のとき|〜するとき,adv,,,疑問詞・代名詞,Quando parte il treno?,列車はいつ出発しますか？,疑問詞「いつ」のほか、接続詞「〜のとき」としても使う。変化しない。前置詞と組み合わせて da quando（いつから）の形もよく使う。,,何・どこ・これ・あれ
L1-0064,1,perché,なぜ|なぜならば|〜なので|なぜなら,conj,,,疑問詞・代名詞,Perché sei in ritardo?,なぜ遅れたの？,疑問文では「なぜ」、平叙文では理由を表す「なぜなら、〜ので」。Perché...? の質問に Perché... で答えられる。,,何・どこ・これ・あれ
L1-0108,1,come,〜のように|どのように|〜のような|どう,adv,,,疑問詞・代名詞,Come stai oggi?,今日の調子はどう？,疑問では「どう、どのように」（副詞）、比較では「〜のように」（接続詞的）。Come si chiama? は名前を尋ねる定番表現。,,何・どこ・これ・あれ
L1-0066,1,questo,これ|この,pron,,"questa, questi, queste",疑問詞・代名詞,Quanto costa questo?,これはいくらですか？,形容詞（この〜）でも代名詞（これ）でも使い、性数一致する。単数では questo + 母音で quest' の形もある。,,何・どこ・これ・あれ
L1-0406,1,quello,あれ|それ|あの,pron,,"quella, quelli, quelle",疑問詞・代名詞,Quello è il mio treno.,あれが私の電車です。,"指示代名詞。形容詞では名詞の前で quel, quello, quella, quei, quegli, quelle, quell' と冠詞に似た変化をする。",,何・どこ・これ・あれ
L1-0032,1,qui,ここ|ここで,adv,,,疑問詞・代名詞,Il museo è qui vicino.,美術館はこのすぐ近くです。,qui は話し手に近い場所を指す。qua もほぼ同義だが、やや口語的。,qua,何・どこ・これ・あれ
L1-0336,1,qua,ここ|こちら,adv,,,疑問詞・代名詞,"Vieni qua, per favore.",こっちに来てください。,qui とほぼ同義だが、qua はやや口語的で、qui より漠然とした範囲を指すことがある。Vieni qua のように命令文でもよく使う。,qui,何・どこ・これ・あれ
L1-0162,1,lì,あそこ|そこ,adv,,,疑問詞・代名詞,Il bagno è lì.,トイレはあそこです。,アクセント記号が必要（li は代名詞）。近い所は qui/qua、離れた所は lì/là。lì は là よりやや限定的。,,何・どこ・これ・あれ
L1-0159,1,là,あそこ|あちら,adv,,,疑問詞・代名詞,"Il bagno è là, a destra.",トイレはあそこ、右側です。,アクセント記号が必要。la（冠詞・代名詞）と区別する。近い場所は qui/qua、遠い場所は là/lì。,lì,何・どこ・これ・あれ
L1-0405,1,qualcosa,何か|あるもの,pron,,,疑問詞・代名詞,Vorrei qualcosa da bere.,何か飲み物がほしいのですが。,不変で常に男性単数扱い。形容詞は qualcosa di buono のように di＋男性形でつなぐ。,qualche cosa,何・どこ・これ・あれ
L1-0331,1,niente,何も（〜ない）|何でもない,pron,,,疑問詞・代名詞,"Non ho bisogno di niente, grazie.",何もいりません、ありがとう。,動詞の後では non と併用（non ... niente）。文頭なら Niente è impossibile のように non 不要。Di niente! は「どういたしまして」。,nulla,何・どこ・これ・あれ
L1-0495,1,nulla,何も（～ない）|無,pron,,,疑問詞・代名詞,Non capisco nulla.,私は何も分かりません。,動詞の後ろに置くときは non が必要（non ... nulla）。文頭では non 不要。niente とほぼ同義。,niente,何・どこ・これ・あれ
L1-0416,1,tutto,すべて|全部,pron,,,疑問詞・代名詞,"Va tutto bene, grazie.",すべて順調です、ありがとう。,"代名詞「すべて」の tutto は不変。形容詞では名詞に性数一致（tutta la città, tutti i giorni 毎日）。tutti / tutte は「全員」の意味の代名詞としても使う。",ogni cosa,何・どこ・これ・あれ
L1-0321,1,altro,他の|別の,adj,,"altra, altri, altre",疑問詞・代名詞,"Vorrei un altro caffè, per favore.",コーヒーをもう1杯お願いします。,名詞の前に置き、名詞に性数一致する。un altro / un'altra は「もう一つの」「別の」。代名詞としても使う。,,何・どこ・これ・あれ
L1-0013,1,a,〜へ|〜に|〜で,prep,,,副詞・接続詞・前置詞,Vado a Roma domani.,明日ローマに行きます。,"都市名の前では a（in Italia は国）。定冠詞と結合する（al, alla, ai など）。母音の前で ad になることもある。",,つなぐことば（前置詞）
L1-0022,1,di,〜の|〜から（出身）|〜について,prep,,,副詞・接続詞・前置詞,Sono di Tokyo.,私は東京の出身です。,"定冠詞と結合する（del, della, dei など）。essere di で出身を表す。母音の前では d' になることがある（d'accordo, d'amore など）。",,つなぐことば（前置詞）
L1-0269,1,da,〜から|〜の所へ|〜によって,prep,,,副詞・接続詞・前置詞,Vengo da Tokyo.,私は東京から来ました。,"出発点・人の家や店（da Marco）・期間の起点（da lunedì）・行為者（受身）など用法が広い。冠詞と結合し dal, dalla, dai などになる。",,つなぐことば（前置詞）
L1-0025,1,in,〜の中に|〜で|〜へ,prep,,,副詞・接続詞・前置詞,Vivo in Italia da due anni.,私は2年前からイタリアに住んでいます。,"多くの国・大陸・地域の前では冠詞なしで in を使う（in Italia）が、nel Regno Unito, negli Stati Uniti のように冠詞が付く例外もある。都市の前は a（a Roma）。定冠詞と結合して nel, nella などになる。",,つなぐことば（前置詞）
L1-0014,1,con,〜と一緒に|〜で（手段・道具）|〜を持った,prep,,,副詞・接続詞・前置詞,Vado al mercato con mia sorella.,私は姉と一緒に市場へ行きます。,手段・道具・付帯の意味も表す（con la carta で、カードで）。定冠詞との結合形 col は現在ほぼ使わず、con il のように書く。,,つなぐことば（前置詞）
L1-0018,1,per,〜のために|〜行きの|〜を通って,prep,,,副詞・接続詞・前置詞,Questo treno è per Roma.,この電車はローマ行きです。,目的・方向・期間・手段など用途が広い。「〜行き」は per Roma、期間は per due giorni（2日間）。,,つなぐことば（前置詞）
L1-0412,1,su,〜の上に|〜について,prep,,,副詞・接続詞・前置詞,Il gatto è su una sedia.,猫は椅子の上にいます。,"定冠詞と結合する（sul, sullo, sull', sulla, sui, sugli, sulle）。「〜について」の意味でも使う（例: un libro su Roma＝ローマについての本）。",,つなぐことば（前置詞）
L1-0249,1,su,上へ|上に,adv,,,副詞・接続詞・前置詞,"Vieni su, la cena è pronta.",上に来て、夕食ができたよ。,前置詞（〜の上に）としても使う。反対は giù。su e giù は「上がったり下がったり」。,sopra,つなぐことば（前置詞）
L1-0502,1,sotto,下に|下で,adv,,,副詞・接続詞・前置詞,"Il gatto non è sopra, è sotto.",猫は上ではなく、下にいます。,前置詞としても使う（sotto il tavolo）。反対語は sopra。副詞では「下の階で」の意味でも使う。,,つなぐことば（前置詞）
L1-0486,1,davanti,前に|前で,adv,,,副詞・接続詞・前置詞,Il bar è proprio davanti.,バーはすぐ前にあります。,名詞の前に置くときは davanti a（davanti alla stazione）。副詞としては単独で使う。反対は dietro。,di fronte,つなぐことば（前置詞）
L1-0280,1,fuori,外に|外で,adv,,,副詞・接続詞・前置詞,Fuori fa freddo.,外は寒いです。,反対語は dentro（中に）。fuori di や fuori da で「〜の外に」。,,つなぐことば（前置詞）
L1-0210,1,senza,〜なしで|〜なしに,prep,,,副詞・接続詞・前置詞,Vorrei un caffè senza zucchero.,砂糖なしのコーヒーをください。,冠詞なしの名詞が続くことが多い（senza zucchero）。動詞が続くときは senza＋不定詞（senza parlare）。,,つなぐことば（前置詞）
L1-0382,1,insieme,一緒に|共に,adv,,,副詞・接続詞・前置詞,Mangiamo insieme stasera?,今夜、一緒に食べませんか？,insieme a ... で「〜と一緒に」。人を続けるときは a が必要。名詞の insieme は「全体」の意味。,,つなぐことば（前置詞）
L1-0009,1,e,と|そして,conj,,,副詞・接続詞・前置詞,Vorrei un caffè e un cornetto.,コーヒーとコルネットをください。,母音の前では ed になることもあるが、e + e など同じ母音の前に限られることが多い。発音は「エ」。essere の è（アクセント付き）と混同しない。,,つなぐことば（接続詞と程度）
L1-0059,1,o,または|〜か,conj,,,副詞・接続詞・前置詞,Vuoi un caffè o un tè?,コーヒーとお茶、どちらがいいですか？,選択肢をつなぐ接続詞。主に o で始まる語の前で od になることもあるが、普通は o のまま使う。,oppure,つなぐことば（接続詞と程度）
L1-0026,1,ma,しかし|でも,conj,,,副詞・接続詞・前置詞,"Mi piace, ma è troppo caro.",気に入りましたが、高すぎます。,最も一般的な逆接。ma の前にはふつうカンマを置く。Ma dai!（まさか／いやいや／さあ）のように、驚きや不信、促しを表す慣用表現も多い。,,つなぐことば（接続詞と程度）
L1-0048,1,che,〜ということ|〜と（従属節を導く）,conj,,,副詞・接続詞・前置詞,So che hai ragione.,あなたが正しいことは分かっています。,従属節を導く接続詞。英語の that と違って省略できない（例: So che hai ragione.）。che には疑問詞（「何」。che cosa の形が多い）や関係代名詞（「〜する（人・物）」）の用法もある。,,つなぐことば（接続詞と程度）
L1-0481,1,che,〜するところの（関係代名詞）|何（疑問）|〜こと（接続詞）,pron,,,副詞・接続詞・前置詞,Il libro che leggo è interessante.,私が読んでいる本は面白い。,不変で、人にも物にも使える関係代名詞。疑問では Che cosa? や Che? と言い、接続詞（dire che〜）としても頻出。,,つなぐことば（接続詞と程度）
L1-0298,1,se,もし〜なら|〜かどうか,conj,,,副詞・接続詞・前置詞,"Se piove, restiamo a casa.",雨が降ったら、家にいましょう。,間接疑問の「〜かどうか」にも使う。アクセント付きの sé（自分）や sì（はい）とは別語。,,つなぐことば（接続詞と程度）
L1-0219,1,anche,〜も|また|〜さえ,adv,,,副詞・接続詞・前置詞,"Prendo anche un'acqua, per favore.",水も1本お願いします。,修飾する語の直前に置く。「〜もまた〜ない」は neanche / nemmeno を使う。,,つなぐことば（接続詞と程度）
L1-0017,1,non,〜ない|〜でない,adv,,,副詞・接続詞・前置詞,Non parlo italiano.,私はイタリア語を話しません。,動詞の直前に置いて否定する。non ... niente や non ... mai のように他の否定語と併用する（二重否定）。,,つなぐことば（接続詞と程度）
L1-0028,1,molto,とても|たくさん,adv,,,副詞・接続詞・前置詞,Questo vestito è molto bello.,このワンピースはとてもすてきです。,"副詞のときは不変（molto bello / molto bene）。形容詞・代名詞では名詞に性数一致する（molti turisti, molta gente）。",,つなぐことば（接続詞と程度）
L1-0091,1,poco,少し|わずか,adj,,"poca, pochi, poche",副詞・接続詞・前置詞,"Parlo poco italiano, mi dispiace.",イタリア語はほとんど話せません、すみません。,"形容詞・代名詞では性数変化する（poca acqua, pochi euro）。副詞では不変（Parlo poco = あまり話さない）。poco は「ほとんどない」という否定的な含みがあり、un po' (di) は「少しある」という肯定的な含みになる。",,つなぐことば（接続詞と程度）
L1-0294,1,poco,少し|あまり〜ない,adv,,,副詞・接続詞・前置詞,Questo vestito costa poco.,この服は安い（ほとんどお金がかからない）。,"副詞の poco は不変。形容詞・代名詞では poca, pochi, poche と性数変化する。un po'（un poco）は「少しある」という肯定的な意味、poco は「ほとんどない」という否定的なニュアンス。",,つなぐことば（接続詞と程度）
L1-0077,1,più,もっと|より多く|より〜（比較級）|最も〜（定冠詞と・最上級）,adv,,,副詞・接続詞・前置詞,"Vorrei più tempo, per favore.",もう少し時間がほしいのですが。,比較級は più＋形容詞＋di/che。否定の non ... più は「もう〜ない」。数量の più は不変。,,つなぐことば（接続詞と程度）
L1-0251,1,troppo,〜すぎる|あまりに|多すぎる,adv,,,副詞・接続詞・前置詞,Questo vestito costa troppo.,この服は高すぎます。,副詞は不変。形容詞・代名詞では名詞に性数一致する（troppa gente）。molto は「とても」で、troppo は「過剰」。,,つなぐことば（接続詞と程度）
L1-0409,1,solo,〜だけ|ただ|のみ,adv,,,副詞・接続詞・前置詞,Ho solo dieci euro.,10ユーロしか持っていません。,形容詞 solo（ひとりの）は性数変化するが、副詞は不変。solamente や soltanto も同義。,solamente|soltanto,つなぐことば（接続詞と程度）
L1-0310,1,vero,本当の|真実の,adj,,"vera, veri, vere",副詞・接続詞・前置詞,È una storia vera.,それは実話です。,文末の Vero? は「そうでしょう？」と確認する表現。名詞 il vero は「真実」。,,つなぐことば（接続詞と程度）
L1-0372,1,forse,たぶん|もしかすると,adv,,,副詞・接続詞・前置詞,Forse domani vado al mare.,たぶん明日は海に行きます。,確信の度合いは低め。文頭にも文中にも置け、単独で返事にも使える。,magari,つなぐことば（接続詞と程度）
L1-0450,1,per esempio,例えば,phrase,,,副詞・接続詞・前置詞,"Mi piace la frutta, per esempio le mele.",果物が好きです、例えばリンゴ。,同じ意味で ad esempio も使う。文頭でも文中でも置ける。,ad esempio,つなぐことば（接続詞と程度）
L1-0100,1,il bar,バール|喫茶店,noun,m,bar（不変）,食事・飲み物,C'è un bar qui vicino?,この近くにバールはありますか？,イタリアのバールはコーヒーや軽食を立ち飲みでとる店。子音で終わる外来語なので複数形も同形。,,カフェとバール
L1-0046,1,il caffè,コーヒー|エスプレッソ,noun,m,caffè（不変）,食事・飲み物,"Vorrei un caffè, per favore.",コーヒーを1杯お願いします。,イタリアで caffè と頼むと普通はエスプレッソが出る。アクセント付きの語尾で複数形も同形。,,カフェとバール
L1-0114,1,l'espresso,エスプレッソ,noun,m,espressi,食事・飲み物,"Un espresso, per favore.",エスプレッソを1杯ください。,イタリアで単に caffè と頼むとエスプレッソが出る。複数形は espressi。,il caffè,カフェとバール
L1-0148,1,il cappuccino,カプチーノ,noun,m,cappuccini,食事・飲み物,"Un cappuccino e un cornetto, per favore.",カプチーノとクロワッサンをください。,イタリアでは朝の飲み物とされ、昼食後や夕方以降に頼むのは珍しいと見られがち。,,カフェとバール
L1-0160,1,il latte,牛乳|ミルク,noun,m,latti,食事・飲み物,Vorrei un caffè con un po' di latte.,少しミルクを入れたコーヒーをください。,複数形 latti はまれで、ふつうは単数で使う。朝食の caffè latte や latte macchiato が定番。,,カフェとバール
L1-0180,1,il tè,紅茶|お茶,noun,m,tè（不変）,食事・飲み物,"Vorrei un tè caldo, per favore.",温かい紅茶をお願いします。,アクセント付きの tè は不変で、複数形も同形。綴りは thè でなく tè。レモン入りは tè al limone。,il the,カフェとバール
L1-0424,1,lo zucchero,砂糖,noun,m,zuccheri,食事・飲み物,"Un caffè senza zucchero, per favore.",砂糖なしのコーヒーを1杯ください。,z で始まるので冠詞は lo。複数形 zuccheri はあまり使わず、通常は単数で用いる。,,カフェとバール
L1-0268,1,il cioccolato,チョコレート,noun,m,cioccolati,食事・飲み物,Vorrei un gelato al cioccolato.,チョコレート味のジェラートをください。,「チョコレート味」は al cioccolato。一粒のチョコ（ボンボン）は cioccolatino、板チョコは tavoletta di cioccolato と言う。,,カフェとバール
L1-0197,1,il gelato,ジェラート|アイスクリーム,noun,m,gelati,食事・飲み物,Vorrei un gelato al cioccolato.,チョコレート味のジェラートをください。,店では cono（コーン）か coppetta（カップ）かを聞かれ、味は gusto と言う。,,カフェとバール
L1-0367,1,il dolce,デザート|甘いもの|菓子,noun,m,dolci,食事・飲み物,Come dolce vorrei il tiramisù.,デザートにはティラミスをお願いします。,形容詞 dolce（甘い）と同形。レストランでは dessert より dolce がよく使われる。複数 i dolci は菓子類も指す。,il dessert,カフェとバール
L1-0004,1,l'acqua,水,noun,f,acque,食事・飲み物,Vorrei una bottiglia d'acqua naturale.,炭酸なしの水を1本ください。,店では naturale（炭酸なし）か frizzante（炭酸入り）かを聞かれる。,,カフェとバール
L1-0518,1,il ghiaccio,氷,noun,m,ghiacci,食事・飲み物,"Un'acqua con molto ghiaccio, per favore.",氷をたくさん入れた水をください。,複数形は ghiacci（-io で i にアクセントなし、i は1つ）。飲み物に入れる氷は ghiaccio、アイスクリームは gelato。,,カフェとバール
L1-0093,1,la birra,ビール,noun,f,birre,食事・飲み物,"Una birra, per favore.",ビールを1杯ください。,注文では birra piccola（小）、media（中）、grande（大）で量を指定。生ビールは birra alla spina。,,カフェとバール
L1-0135,1,il vino,ワイン,noun,m,vini,食事・飲み物,"Un bicchiere di vino rosso, per favore.",赤ワインをグラスで1杯ください。,vino rosso（赤）、vino bianco（白）、vino rosato（ロゼ）。グラスは un bicchiere、ボトルは una bottiglia。,,カフェとバール
L1-0525,1,la tazza,カップ,noun,f,tazze,食事・飲み物,"Vorrei una tazza di tè, per favore.",紅茶を1杯お願いします。,tazza di tè のように「di＋中身」で使う。コーヒー用の小さなカップは tazzina。,,カフェとバール
L1-0476,1,il bicchiere,グラス|コップ,noun,m,bicchieri,食事・飲み物,"Un bicchiere di vino rosso, per favore.",赤ワインをグラスで1杯ください。,un bicchiere di ~ で「グラス1杯の~」。ワインなら calice は脚付きの高級なグラス。,,カフェとバール
L1-0479,1,la bottiglia,瓶|ボトル,noun,f,bottiglie,食事・飲み物,"Una bottiglia di vino rosso, per favore.",赤ワインを1本ください。,容器の単位としても使う（una bottiglia di acqua）。複数形は -glie で i は残る。,,カフェとバール
L1-0062,1,il pane,パン,noun,m,pani,食事・飲み物,"Vorrei del pane, per favore.",パンを少しください。,不可算的に使うことが多く、del pane（少しのパン）の形がよく出る。複数形 pani は種類や個数を表すとき。,,食べもの
L1-0346,1,il panino,サンドイッチ|小型のパン,noun,m,panini,食事・飲み物,Vorrei un panino al prosciutto.,ハムのサンドイッチをください。,パンに具を挟んだものを指す。tramezzino は食パンの三角サンドで別物。,,食べもの
L1-0065,1,la pizza,ピザ,noun,f,pizze,食事・飲み物,"Vorrei una pizza margherita, per favore.",マルゲリータピザをお願いします。,複数形は pizze（-ze）。pizza margherita はトマト、モッツァレラ、バジリコの定番。,,食べもの

L1-0266,1,la carne,肉,noun,f,carni,食事・飲み物,"Non mangio carne, sono vegetariano.",私は肉を食べません、ベジタリアンです。,食材としては不可算で単数が普通。複数 carni は肉の種類を指すときに使う。,,食べもの
L1-0453,1,il pollo,鶏肉|鶏,noun,m,polli,食事・飲み物,Per me il pollo con le patate.,私は鶏肉のポテト添えにします。,料理名では肉を指す。pollo arrosto は「ローストチキン」。,,食べもの
L1-0260,1,il pesce,魚,noun,m,pesci,食事・飲み物,Oggi vorrei mangiare il pesce.,今日は魚を食べたいです。,食材としての魚は不可算的に単数で使う。生きた魚の複数は pesci。,,食べもの
L1-0458,1,il prosciutto,ハム|生ハム,noun,m,prosciutti,食事・飲み物,Vorrei un panino con il prosciutto.,ハムのパニーノをください。,prosciutto crudo は生ハム、prosciutto cotto は加熱したハム。単に prosciutto と言うと文脈によりどちらも指す。,,食べもの
L1-0279,1,il formaggio,チーズ,noun,m,formaggi,食事・飲み物,"Vorrei del formaggio, per favore.",チーズを少しください。,「少量のチーズ」は del formaggio（部分冠詞）。種類を言うときは複数形 formaggi も使う。,,食べもの
L1-0493,1,la mozzarella,モッツァレラチーズ|モッツァレラ,noun,f,mozzarelle,食事・飲み物,"Vorrei una mozzarella, per favore.",モッツァレラを1つください。,水牛の乳のものは mozzarella di bufala。カプレーゼ（トマトとモッツァレラのサラダ）の定番素材。,,食べもの
L1-0469,1,l'uovo,卵,noun,m,le uova（複数は女性形）,食事・飲み物,Vorrei due uova al tegamino.,目玉焼きを2個お願いします。,単数は男性、複数は女性の不規則形 le uova。数えるときも due uova のように女性複数。,,食べもの
L1-0471,1,lo yogurt,ヨーグルト,noun,m,yogurt（不変）,食事・飲み物,Per colazione mangio uno yogurt con la frutta.,朝食にフルーツ入りのヨーグルトを食べます。,外来語で複数形も同形。y で始まるので冠詞は lo / uno。yoghurt とも綴る。,lo yoghurt,食べもの
L1-0454,1,il pomodoro,トマト,noun,m,pomodori,食事・飲み物,Vorrei una pizza con i pomodori.,トマトのピザをください。,複数形は pomodori。トマトソースは salsa di pomodoro または sugo と言う。,,食べもの
L1-0373,1,la frutta,果物|フルーツ,noun,f,,食事・飲み物,Mangio molta frutta ogni giorno.,私は毎日たくさん果物を食べます。,集合的に「果物」を指し、通常は単数形で使う。個々の果実は il frutto（複数 i frutti）。,,食べもの
L1-0164,1,la mela,りんご,noun,f,mele,食事・飲み物,Mangio una mela ogni mattina.,私は毎朝りんごを1個食べます。,"りんごの実。木は il melo。「りんごジュース」は il succo di mela。果物の名前は女性名詞が多い（la pera, la banana）。",,食べもの
L1-0264,1,la banana,バナナ,noun,f,banane,食事・飲み物,Mangio una banana a colazione.,朝食にバナナを1本食べます。,"1房は un casco di banane。果物の名前は女性名詞が多い（la mela, la pera）。",,食べもの
L1-0342,1,l'arancia,オレンジ,noun,f,arance,食事・飲み物,"Vorrei un succo d'arancia, per favore.",オレンジジュースをください。,複数形は -cia → -ce で arance（子音＋cia の語は i を落とす。c の音は変わらない）。果樹は arancio、色の「オレンジ色」は arancione。,,食べもの
L1-0175,1,il sale,塩,noun,m,sali,食事・飲み物,"Può passarmi il sale, per favore?",塩を取っていただけますか？,語尾は -e だが男性名詞。複数形 sali はあまり使わない。「塩気が足りない」は poco salato。,,食べもの
L1-0230,1,la colazione,朝食,noun,f,colazioni,食事・飲み物,La colazione è inclusa nel prezzo?,朝食は料金に含まれていますか？,fare colazione で「朝食をとる」。イタリアの朝食は甘いパンとカプチーノなど軽めが一般的。,,食事とレストラン
L1-0275,1,fare colazione,朝食をとる|朝ごはんを食べる,phrase,,"faccio, fai, fa, facciamo, fate, fanno（過去分詞 fatto）",食事・飲み物,Di solito faccio colazione al bar.,普段はバールで朝食をとります。,fare は不規則動詞。イタリアの朝食は cappuccino と cornetto が定番。,,食事とレストラン
L1-0207,1,il pranzo,昼食|ランチ,noun,m,pranzi,食事・飲み物,Il pranzo è all'una.,昼食は1時です。,動詞は pranzare（昼食をとる）。夕食は la cena、朝食は la colazione。,,食事とレストラン
L1-0105,1,la cena,夕食|晩ご飯,noun,f,cene,食事・飲み物,A che ora è la cena?,夕食は何時ですか？,ホテルやレストランで頻出。昼食は il pranzo、朝食は la colazione。「夕食に」は a cena を使う。,,食事とレストラン
L1-0085,1,mangiare,食べる,verb,,"mangio, mangi, mangia, mangiamo, mangiate, mangiano",食事・飲み物,Dove mangiamo stasera?,今夜はどこで食べましょうか？,規則動詞。tu と noi では語幹 mangi- の i と語尾の i が1つにまとまり、mangi（×mangii）、mangiamo（×mangiiamo）と綴る。名詞では il mangiare（食べること、食べ物）も。,,食事とレストラン
L1-0070,1,bere,飲む,verb,,"bevo, bevi, beve, beviamo, bevete, bevono（過去分詞 bevuto）",食事・飲み物,Vuoi bere qualcosa?,何か飲みますか？,不規則動詞で語幹が bev- に変わる。薬を飲む場合は prendere を使う。,,食事とレストラン
L1-0139,1,ho fame,お腹がすいた|空腹です,phrase,,,食事・飲み物,"Ho fame, andiamo al ristorante?",お腹がすいた、レストランに行かない？,avere fame の直説法現在1人称。「とても」は ho molta fame。喉が渇いたは ho sete。essere は使わない。,,食事とレストラン
L1-0282,1,ho sete,喉が渇いた|喉が渇いている,phrase,,,食事・飲み物,"Ho sete, vorrei dell'acqua.",喉が渇きました、水をください。,"avere sete で「喉が渇いている」。主語に合わせて avere を活用する（hai sete, ha sete）。「お腹が空いた」は ho fame。",,食事とレストラン
L1-0515,1,la fame,空腹|飢え,noun,f,,食事・飲み物,"Ho molta fame, andiamo al ristorante.",とてもお腹がすいた、レストランに行きましょう。,「お腹がすいた」は avere fame と言い、essere は使わない。通常は単数形のみで使う。,,食事とレストラン

L1-0214,1,un tavolo per due,二人用のテーブル|2名でお願いします,phrase,,,食事・飲み物,"Buonasera, un tavolo per due, per favore.",こんばんは、2名でお願いします。,"レストランで席を頼む定番表現。人数は per tre, per quattro と数字を替える。予約済みなら Ho prenotato と言う。",un tavolo per due persone,食事とレストラン
L1-0402,1,il posto,席|場所|仕事（職）,noun,m,posti,食事・飲み物,"Scusi, questo posto è libero?",すみません、この席は空いていますか？,劇場や列車の座席も posto。「予約席」は posto prenotato。luogo は「場所」で、より改まった語。,,食事とレストラン

L1-0482,1,che cosa prende,何になさいますか？|何を召し上がりますか？,phrase,,,食事・飲み物,"Buonasera, che cosa prende?",こんばんは、何になさいますか？,Lei（丁寧）の形。親しい相手には che cosa prendi? を使う。店員が客に聞く定番表現。,cosa prende|che prende,食事とレストラン
L1-0292,1,ordinare,注文する|整理する|命じる,verb,,"ordino, ordini, ordina, ordiniamo, ordinate, ordinano",食事・飲み物,Che cosa ordini da bere?,飲み物は何を注文する？,規則動詞（-are）。レストランでは Vorrei ordinare.（注文したいのですが）が定番。,,食事とレストラン

L1-0293,1,il piatto,皿|料理|一皿,noun,m,piatti,食事・飲み物,Qual è il piatto del giorno?,本日のおすすめ料理は何ですか？,メニューでは primo piatto（第1皿）、secondo piatto（メイン）のように、コースの一皿も指す。,,食事とレストラン

L1-0324,1,dolce,甘い|優しい,adj,,dolci,食事・飲み物,Questo caffè è troppo dolce.,このコーヒーは甘すぎます。,男女同形の -e 形容詞。名詞 il dolce は「デザート」の意味でも使う。,,食事とレストラン

L1-0153,1,"il conto, per favore",お会計をお願いします,phrase,,,食事・飲み物,"Scusi, il conto, per favore.",すみません、お会計をお願いします。,レストランで会計を頼む定番表現。「割り勘で」は il conto separato、「一緒に」は il conto insieme。,"il conto, per piacere",食事とレストラン
L1-0362,1,cucinare,料理する|調理する,verb,,"cucino, cucini, cucina, cuciniamo, cucinate, cucinano",食事・飲み物,Stasera cucino io.,今夜は私が料理します。,規則動詞（-are）。「料理」という名詞は la cucina で、「台所」「料理法」の意味もある。,,食事とレストラン
L1-0436,1,la cucina,台所|料理|キッチン,noun,f,cucine,食事・飲み物,La cucina italiana è molto buona.,イタリア料理はとてもおいしい。,「台所」と「料理（の種類）」の両方を表す。cucinare は「料理する」という動詞。,,食事とレストラン

L1-0304,1,il supermercato,スーパーマーケット|スーパー,noun,m,supermercati,店・買い物,Il supermercato è vicino alla stazione.,スーパーは駅の近くにあります。,小さな食料品店は alimentari。日曜は休業や短縮営業のスーパーもある。,,お店と買い物
L1-0444,1,il mercato,市場|マーケット,noun,m,mercati,店・買い物,Il mercato è aperto la mattina.,市場は朝に開いています。,イタリアの町では露店の市 mercato が曜日を決めて立つことが多い。屋内市場は mercato coperto。,,お店と買い物
L1-0516,1,fare la spesa,買い物をする|食料品を買う,phrase,,,店・買い物,Oggi faccio la spesa al mercato.,今日は市場で食料品の買い物をします。,"主に食料品・日用品の買い物。服などを買う買い物は fare shopping。fare は不規則動詞（faccio, fai, fa...）。",,お店と買い物
L1-0152,1,comprare,買う,verb,,"compro, compri, compra, compriamo, comprate, comprano",店・買い物,Vorrei comprare un biglietto.,切符を1枚買いたいのですが。,規則動詞（-are）。近過去は avere を助動詞にとる（ho comprato）。,,お店と買い物

L1-0226,1,cercare,探す|求める,verb,,"cerco, cerchi, cerca, cerchiamo, cercate, cercano",店・買い物,Cerco una farmacia qui vicino.,この近くの薬局を探しています。,"cercare di + 不定詞で「〜しようと努める」。cerchi, cerchiamo のように h を入れて c の硬い音を保つ。",,お店と買い物

L1-0358,1,chiudere,閉める|閉まる|閉店する,verb,,"chiudo, chiudi, chiude, chiudiamo, chiudete, chiudono（過去分詞 chiuso）",店・買い物,A che ora chiude il negozio?,お店は何時に閉まりますか？,過去分詞が不規則。掲示の CHIUSO は「閉店中」。反対語は aprire。,,お店と買い物
L1-0151,1,la città,都市|町,noun,f,città（不変）,方向・場所,Questa città è molto bella.,この町はとても美しいです。,-à で終わる名詞は複数形も同形（le città）。centro は「中心街」。,,町と道案内

L1-0289,1,il museo,博物館|美術館,noun,m,musei,方向・場所,Il museo è aperto oggi?,博物館は今日開いていますか？,museo は博物館にも美術館にも使う。複数形は musei。絵画中心なら pinacoteca や galleria とも言う。,,町と道案内

L1-0303,1,la spiaggia,浜辺|ビーチ,noun,f,spiagge,天気・自然,La spiaggia è vicina all'albergo.,ビーチはホテルの近くです。,複数形は spiagge。-gia の i が落ち、h は入らず発音も軟音のまま。有料の海水浴場は lido や stabilimento balneare と言う。,,天気と自然
L1-0371,1,il fiore,花,noun,m,fiori,天気・自然,Questi fiori sono molto belli.,これらの花はとてもきれいです。,-e で終わるが男性名詞。複数形は fiori。花束は un mazzo di fiori。,,天気と自然
L1-0474,1,l'animale,動物,noun,m,animali,天気・自然,Hai degli animali in casa?,家で動物を飼っていますか？,母音で始まるので単数は l'animale。「ペット」は animale domestico。,,天気と自然
L1-0483,1,il corpo,体|身体,noun,m,複数形: i corpi,トラブル・緊急,Mi fa male tutto il corpo.,体じゅうが痛いです。,体全体を指す語。「体じゅう」は tutto il corpo、体の部位は le parti del corpo。体調は stare bene / male で言うことが多い。,,体と緊急のひとこと
L1-0307,1,la testa,頭,noun,f,teste,トラブル・緊急,Ho mal di testa.,頭が痛いです。,avere mal di testa で「頭痛がする」。体の不調を伝える定番表現。,,体と緊急のひとこと
L1-0199,1,la mano,手,noun,f,mani,トラブル・緊急,Mi fa male la mano.,手が痛いです。,-o で終わるが女性名詞。複数形は le mani。冠詞や形容詞は女性形にする。,,体と緊急のひとこと
L1-0374,1,la gamba,脚|足（脚部）,noun,f,gambe,トラブル・緊急,Mi fa male la gamba.,脚が痛いです。,gamba は太もも〜足首の脚全体。くるぶしから先の「足」は piede。,,体と緊急のひとこと
L1-0393,1,l'occhio,目,noun,m,occhi,トラブル・緊急,Ho male all'occhio destro.,右目が痛いです。,複数形は occhi（-chio → -chi）。Attenzione!（気をつけて）の意で Occhio! とも言う。,,体と緊急のひとこと
L1-0218,1,aiuto,助けて,interj,,,トラブル・緊急,Aiuto! Chiamate la polizia!,助けて！警察を呼んでください！,緊急時に叫ぶ間投詞。名詞 l'aiuto（助け）は男性名詞で、動詞 aiutare（助ける）と同じ語源。,,体と緊急のひとこと
L1-0099,1,attenzione,気をつけて|注意,interj,,,トラブル・緊急,"Attenzione, il pavimento è bagnato.",気をつけて、床が濡れています。,名詞 l'attenzione（女性）としても使う。fare attenzione a は「〜に注意する」。,attenti,体と緊急のひとこと
L1-0315,1,ho bisogno di aiuto,助けが必要です|助けてほしいです,phrase,,,トラブル・緊急,"Scusi, ho bisogno di aiuto.",すみません、助けが必要です。,avere bisogno di + 名詞／不定詞で「〜が必要だ」。主語に合わせて avere を活用する（hai bisogno di...）。,ho bisogno d'aiuto,体と緊急のひとこと
L1-0431,1,chiamate la polizia,警察を呼んでください,phrase,,,トラブル・緊急,Aiuto! Chiamate la polizia!,助けて！警察を呼んでください！,chiamate は voi への命令形。1人に丁寧に頼むなら chiami la polizia（Lei）、親しい相手なら chiama la polizia。,chiami la polizia,体と緊急のひとこと
L1-0379,1,ho paura,怖い|心配だ,phrase,,,トラブル・緊急,Ho paura dei cani.,私は犬が怖いです。,avere paura di ~ で「~が怖い」。動詞が続くときは Ho paura di volare. のように di＋不定詞。主語が変わると ho は活用する。,,体と緊急のひとこと
L2-0017,2,alla prossima,また今度ね|じゃあ、また,phrase,,,挨拶・定型表現,"Grazie di tutto, alla prossima!",いろいろありがとう、また今度ね！,くだけた別れの挨拶。次に会う時までという意味で、友人や顔見知りに使う。,a presto,気持ちを伝えるあいさつ
L2-0278,2,ci sentiamo,また連絡するね|また話そう,phrase,,,挨拶・定型表現,"Ora devo andare, ci sentiamo domani!",もう行かなきゃ、明日また連絡するね！,電話やメッセージで「また連絡し合おう」の意。直接会う約束なら ci vediamo（また会おう）を使う。,ci sentiamo presto,気持ちを伝えるあいさつ
L2-0631,2,addio,さようなら（永遠の別れ）|さらば,interj,,,挨拶・定型表現,Dice addio a tutti e parte.,彼はみんなに別れを告げて出発する。,長い別れや永遠の別れに使う重い表現。日常の別れ際は arrivederci や ciao。名詞 l'addio（別れ）としても使う。,,気持ちを伝えるあいさつ
L2-0622,2,tanti saluti,（〜に）よろしく|ではまた（手紙・メールの結び）,phrase,,,挨拶・定型表現,Tanti saluti a tua madre!,お母さんによろしくね！,手紙やメールの結びにも使う。a + 人 で「〜によろしく」。改まった結びには Cordiali saluti を使う。,,気持ちを伝えるあいさつ
L2-0027,2,buon riposo,ゆっくり休んでね|おやすみなさい,phrase,,,挨拶・定型表現,Sei stanco? Buon riposo!,疲れた？ ゆっくり休んでね！,休む人に向けた気遣いの一言。就寝前なら buonanotte が定番。,,気持ちを伝えるあいさつ
L2-0682,2,buon lavoro,お仕事がんばって|仕事頑張ってください,phrase,,,挨拶・定型表現,"Ciao Marco, buon lavoro!",じゃあねマルコ、仕事がんばって！,仕事に向かう人や作業中の人にかける励ましの挨拶。丁寧な相手にも使える。同僚や店員にもよく言う。,buon lavoro a tutti,気持ちを伝えるあいさつ
L2-0334,2,buon divertimento,楽しんでね|楽しんできてください,phrase,,,挨拶・定型表現,Andate al concerto? Buon divertimento!,コンサートに行くの？楽しんでね！,出かける人にかける言葉。親しい相手にも丁寧にも使える。「divertiti!」は tu への命令形。,buon divertimento a tutti,気持ちを伝えるあいさつ
L2-0347,2,in bocca al lupo,頑張って|幸運を祈る,phrase,,,挨拶・定型表現,Domani hai l'esame? In bocca al lupo!,明日は試験なの？頑張ってね！,試験や本番前に言う定番表現。返事は Crepi!（または Crepi il lupo!）。「ありがとう」と返すのは縁起が悪いとされる。,,気持ちを伝えるあいさつ
L2-0250,2,guarisci presto,早く良くなってね|お大事に,phrase,,,挨拶・定型表現,"Ciao Marco, guarisci presto!",やあマルコ、早く良くなってね！,tu に対する親しい表現。丁寧な相手には Guarisca presto。複数の相手には Guarite presto。,,気持ちを伝えるあいさつ
L2-0175,2,auguri,おめでとう|幸運を祈ります,interj,,,挨拶・定型表現,Auguri! Buon compleanno!,おめでとう！誕生日おめでとう！,誕生日・祝日・試験など幅広い場面で使う。複数形のみで使うのが普通。Tanti auguri! で「本当におめでとう」と強調できる（丁寧さではなく気持ちの強さが変わる）。,tanti auguri,気持ちを伝えるあいさつ
L2-0281,2,complimenti,おめでとう|お見事|すごいね,interj,,,挨拶・定型表現,Hai passato l'esame? Complimenti!,試験に受かったの？おめでとう！,成功や努力をほめる言葉。間投詞としては常に複数形で使う（単数の il complimento は「褒め言葉」という名詞）。「おめでとう」は auguri と区別し、誕生日や祝祭は auguri、成果は complimenti。,congratulazioni,気持ちを伝えるあいさつ
L2-0468,2,buone feste,良い年末年始を|楽しい祝祭シーズンを,phrase,,,挨拶・定型表現,Buone feste a tutti!,皆さん、良い年末年始を！,クリスマスや年末年始など祝祭シーズンの挨拶。年末には Buon Natale や Buon anno もよく使う。,,気持ちを伝えるあいさつ
L2-0553,2,buona Pasqua,イースターおめでとう|よい復活祭を,phrase,,,挨拶・定型表現,Buona Pasqua a tutti voi!,皆さん、イースターおめでとう！,復活祭の前後に交わす挨拶。祝日名としての Pasqua は大文字で書く。「Buon Natale」と対にして覚えるとよい。,buona Pasqua a tutti,気持ちを伝えるあいさつ
L2-0101,2,benarrivato,ようこそ|いらっしゃい,phrase,,"benarrivata, benarrivati, benarrivate",挨拶・定型表現,"Benarrivato a Roma, Marco!",ローマへようこそ、マルコ！,相手の性数に一致させる。男性単数 benarrivato、女性 benarrivata。あまり使われない語で、日常では benvenuto がずっと一般的。bentornato は「お帰り」。,,気持ちを伝えるあいさつ
L2-0390,2,bentornato,おかえりなさい|ようこそ（戻ってきた人に）|おかえり,phrase,,"bentornata, bentornati, bentornate",挨拶・定型表現,Bentornato! Come è andato il viaggio?,おかえり！旅行はどうだった？,"相手の性数に合わせて変化する（bentornata, bentornati, bentornate）。標準的な綴りは1語の bentornato。",ben tornato,気持ちを伝えるあいさつ
L2-0010,2,grazie di tutto,いろいろとありがとう|何から何までありがとう,phrase,,,挨拶・定型表現,"Grazie di tutto, siete stati gentilissimi.",いろいろとありがとう、とても親切にしてくれました。,世話になった後の別れ際などに使う。丁寧に言うなら molte grazie di tutto。grazie per tutto も使われる。,grazie per tutto,気持ちを伝えるあいさつ
L2-0193,2,grazie a te,こちらこそ|君のおかげで,phrase,,,挨拶・定型表現,"Grazie a te, è stata una bella serata.",こちらこそ、素敵な夜でした。,お礼への返答として使う。丁寧な相手には grazie a lei。「〜のおかげで」の意味でも使う。,,気持ちを伝えるあいさつ
L2-0728,2,figurati,どういたしまして|気にしないで,phrase,,,挨拶・定型表現,Grazie mille! – Figurati!,どうもありがとう！ – どういたしまして！,親しい相手（tu）に使う。丁寧な相手には si figuri、複数には figuratevi。「とんでもない」の意でも使う。,di niente|prego,気持ちを伝えるあいさつ
L2-0057,2,mi fa piacere,うれしいです|（〜して）うれしい,phrase,,,挨拶・定型表現,Mi fa piacere vederti.,あなたに会えてうれしいです。,直訳は「私に喜びを与える」。相手の気持ちを尋ねるときは Ti fa piacere?（うれしい？）、丁寧には Le fa piacere? と代名詞を変える。,mi fa molto piacere,気持ちを伝えるあいさつ
L2-0166,2,volentieri,喜んで|よろこんで,adv,,,挨拶・定型表現,Vengo volentieri alla tua festa.,喜んであなたのパーティーに行きます。,誘いや依頼への返事として単独でも使える（Volentieri!）。比較的くだけた場面でも丁寧でも使える。,con piacere,気持ちを伝えるあいさつ
L2-0324,2,ti prego,お願い|頼むから,phrase,,,挨拶・定型表現,"Aiutami, ti prego.",助けて、お願い。,tu に対するくだけた言い方。lei には La prego、複数には vi prego。per favore より切実な響きになる。,,気持ちを伝えるあいさつ
L2-0544,2,ti va,〜したい？（誘い）|どう？|いい？,phrase,,,挨拶・定型表現,Ti va un gelato?,アイスクリームはどう？,andare の ti va は「君の気に入る、したい気分か」の意。ti va di + 不定詞、ti va un + 名詞の形も使う。丁寧には Le va。,,気持ちを伝えるあいさつ
L2-0305,2,offro io,私がおごります|私が払います,phrase,,,挨拶・定型表現,"Offro io, non preoccuparti.",私がおごるよ、気にしないで。,offrire（おごる、提供する）の1人称に io を添えて「私が」を強調。会計の場面で「ここは私が持つ」と言うときの定番表現。Pago io も近い場面で使えるが、offrire は「ご馳走する」、pagare は「支払う」のニュアンス。,,気持ちを伝えるあいさつ
L2-0159,2,ti voglio bene,大好きだよ|大切に思っているよ,phrase,,,挨拶・定型表現,"Mamma, ti voglio bene.",ママ、大好きだよ。,家族や友人など親しい人への愛情表現。恋人にも使うが、強い恋愛の「愛してる」は ti amo。,,気持ちを伝えるあいさつ
L2-0662,2,mi manchi,会いたいよ|寂しいよ,phrase,,,挨拶・定型表現,"Mi manchi tanto, torna presto!",すごく会いたいよ、早く帰ってきて！,直訳は「君は私に欠けている」。mancare は欠ける側が主語。複数なら Mi mancate、相手が丁寧形なら Mi manca。,mi manchi tanto,気持ちを伝えるあいさつ
L2-0637,2,non vedo l'ora,待ちきれない|楽しみにしている,phrase,,,挨拶・定型表現,Non vedo l'ora di partire!,出発が待ちきれない！,〜するのが待ち遠しいは non vedere l'ora di + 不定詞。主語に合わせて活用し、noi なら non vediamo l'ora。,,気持ちを伝えるあいさつ
L2-0559,2,come è andata,どうだった？|首尾はどうだった？,phrase,,,挨拶・定型表現,"Ciao Marco, come è andata la visita?",やあマルコ、見学はどうだった？,過去の出来事の結果を尋ねる表現。Com'è andata? と縮約もする。現在の様子は come va? を使う。,com'è andata,様子をたずねる・あいづち
L2-0683,2,che succede,どうしたの|何が起きたの|どうしたんですか,phrase,,,挨拶・定型表現,Che succede? Perché piangi?,どうしたの？なんで泣いてるの？,丁寧な相手にも使える。同義の cosa succede もよく使う。cosa è successo は「何があったの」で過去の出来事を尋ねる。,cosa succede|che cosa succede,様子をたずねる・あいづち
L2-0449,2,tutto a posto,万事順調|問題ない|大丈夫,phrase,,,挨拶・定型表現,"Tutto a posto, grazie.",すべて順調です、ありがとう。,"Tutto a posto? と聞かれたら、Sì, tutto a posto. のように答える。くだけた会話で頻出。",,様子をたずねる・あいづち
L2-0700,2,niente di nuovo,特に変わりない|何も新しいことはない,phrase,,,挨拶・定型表現,"Come va? Niente di nuovo, grazie.",調子はどう？特に変わりないよ、ありがとう。,近況を聞かれたときの定番の返事。niente は後ろに di＋形容詞（男性単数）を取る。nulla di nuovo も同義。,nulla di nuovo,様子をたずねる・あいづち
L2-0652,2,eccomi,ここにいます|はい、私です,phrase,,,挨拶・定型表現,"Eccomi, sono pronto.",ここにいます、準備できました。,ecco + mi の結合形。呼ばれたときや到着時に使う。「ほら君だ」は eccoti、「ほら彼だ」は eccolo など。,,様子をたずねる・あいづち
L2-0023,2,avanti,どうぞ（入ってください）|進め|前へ|前に,interj,,,挨拶・定型表現,"Avanti, si accomodi pure!",どうぞ、お入りください！,ノックされたときに「どうぞ」と返す定番表現。副詞として「前へ・先へ」の意味もあり（andare avanti 先へ進む）、「〜の前に」は通常 davanti a を使う。,,様子をたずねる・あいづち
L2-0117,2,dai,さあ|ほら|まさか,interj,,,挨拶・定型表現,"Dai, andiamo al mare!",さあ、海に行こうよ！,励まし・催促・「まさか」の意味で使う口語。動詞 dare の二人称単数命令形（da' / dai）に由来し、親しい相手に使う。,,様子をたずねる・あいづち
L2-0124,2,ehi,ねえ|おい|やあ,interj,,,挨拶・定型表現,"Ehi, aspetta un momento!",ねえ、ちょっと待って！,親しい相手への呼びかけや注意を引くときに使うくだけた表現。目上の人や初対面の相手には失礼に響くことがある。,,様子をたずねる・あいづち
L2-0141,2,oh,おっ|ああ,interj,,,挨拶・定型表現,"Oh, che bella sorpresa!",おや、うれしい驚きだ！,驚き・感嘆・納得などを表す間投詞。文脈で意味が変わる。ah とも似るが、oh は驚きや感嘆が強め。,,様子をたずねる・あいづち
L2-0171,2,mamma mia,あらまあ|なんてこと|おやまあ,phrase,,,挨拶・定型表現,"Mamma mia, che caldo oggi!",あらまあ、今日はなんて暑いの！,驚き・感嘆・困惑・感心など幅広く使う間投詞的表現。文字通りには「私のお母さん」。,,様子をたずねる・あいづち
L2-0399,2,Dio mio,なんてこと|おや|ああ神様,phrase,,,挨拶・定型表現,"Dio mio, ho perso il treno!",なんてこと、電車に乗り遅れた！,驚き・困惑・嘆きを表す感嘆表現。直訳は「私の神」。Oddio や mamma mia も近い表現。,mio Dio|oddio,様子をたずねる・あいづち
L2-0108,2,che paura,なんて怖い|怖い！,phrase,,,挨拶・定型表現,Che paura! Il cane è grande.,怖い！その犬は大きい。,che＋名詞で「なんて〜！」という感嘆表現。che fame! なども同じ型（che bello! のように形容詞も続けられる）。強い恐怖でなくても気軽に使う。,,様子をたずねる・あいづち
L2-0109,2,che strano,変だね|不思議だね,phrase,,,挨拶・定型表現,"Che strano, non risponde al telefono.",変だな、電話に出ないよ。,感嘆表現。che + 形容詞で「なんて〜」。状況全体を指すときは男性単数の che strano が定型。特定の人や物について言うときは、その性数に合わせて che strana / che strani / che strane となる。,,様子をたずねる・あいづち
L2-0472,2,che peccato,残念|それは残念|気の毒に,phrase,,,挨拶・定型表現,Non vieni alla festa? Che peccato!,パーティーに来ないの？残念！,残念な気持ちや同情を表す感嘆表現。peccato だけでも言える。che pena は同情寄り。,peccato,様子をたずねる・あいづち
L2-0473,2,che sollievo,ああ、ほっとした|よかった,phrase,,,挨拶・定型表現,Che sollievo! Il treno è arrivato.,ほっとした！電車が来たよ。,安心したときの感嘆表現。che + 名詞で「なんて〜だ」。che fortuna や che bello も同じ型。,,様子をたずねる・あいづち
L2-0735,2,meno male,よかった|不幸中の幸い,phrase,,,挨拶・定型表現,Meno male che non piove oggi.,今日は雨が降っていなくてよかった。,安堵を表す表現。「meno male che＋接続法／直説法」の形でもよく使う。会話では単独でも言える。,,様子をたずねる・あいづち
L2-0335,2,calma,落ち着いて|静かに,interj,,,挨拶・定型表現,"Calma, non c'è problema.",落ち着いて、問題ないですよ。,親しい相手への呼びかけ。丁寧に言うなら si calmi（敬称 Lei）。名詞 la calma は「静けさ、冷静さ」。,,様子をたずねる・あいづち
L2-0729,2,forza,がんばれ|さあ,interj,,,挨拶・定型表現,"Forza, andiamo!",さあ、行こう！,励ましや掛け声。スポーツの応援では Forza Italia! のように使う。名詞 la forza は「力」。,,様子をたずねる・あいづち
