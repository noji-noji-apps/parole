L3-0808,3,il cortile,中庭,noun,m,cortili,住まい・日用品,I bambini giocano nel cortile del palazzo.,子どもたちは建物の中庭で遊んでいます。,建物に囲まれた中庭。学校の校庭や集合住宅の庭にも使う。,,家の中
L3-0487,3,il tetto,屋根,noun,m,tetti,住まい・日用品,Il tetto della casa è rosso.,その家の屋根は赤い。,建物の屋根全般を指す。「天井」は soffitto で別の語。,,家の中
L3-0211,3,la parete,壁（室内の）|内壁,noun,f,pareti,住まい・日用品,Ho appeso un quadro alla parete.,壁に絵を掛けました。,室内や面としての壁は parete。外壁・塀などは muro（複数形 muri）。城壁・市壁は le mura（女性複数）。,,家の中
L3-0403,3,il condominio,集合住宅|マンション|管理組合（住民の）,noun,m,condomini,住まい・日用品,Abito in un condominio vicino alla stazione.,私は駅の近くの集合住宅に住んでいます。,建物そのものと、住民による共同所有・管理の仕組みの両方を指す。spese condominiali は共益費。,,家の中
L3-0559,3,l'affitto,家賃|賃貸,noun,m,affitti,住まい・日用品,L'affitto è molto alto in centro.,中心部では家賃がとても高い。,「貸し出し中・貸します」の掲示は affittasi。in affitto は「賃貸で」。動詞は affittare（借りる・貸す両方）。,,家の中
L3-0501,3,affittare,借りる|貸す|賃貸する,verb,,"affitto, affitti, affitta, affittiamo, affittate, affittano",住まい・日用品,Vorrei affittare una macchina per due giorni.,2日間、車を借りたいのですが。,「借りる」「貸す」どちらも表す。貸す側は affittare、借りる側も affittare と言う。掲示の Affittasi は「貸家・貸室」。,noleggiare,家の中
L3-0671,3,trasferirsi,引っ越す|移住する,verb,,"mi trasferisco, ti trasferisci, si trasferisce, ci trasferiamo, vi trasferite, si trasferiscono",住まい・日用品,Il mese prossimo mi trasferisco a Roma.,来月、私はローマに引っ越します。,再帰動詞で -isc- 型。近過去は essere を使う（mi sono trasferito/a）。行き先は a＋都市、in＋国。,,家の中
L3-0252,3,la tenda,カーテン|テント,noun,f,tende,住まい・日用品,"Puoi chiudere la tenda, per favore?",カーテンを閉めてくれますか？,「テント」の意味もあり、キャンプで使うのも tenda。fare campeggio は「キャンプをする」。,,家具と水まわり
L3-0122,3,la coperta,毛布,noun,f,coperte,住まい・日用品,"Posso avere un'altra coperta, per favore?",もう1枚毛布をいただけますか？,coprire の過去分詞 coperto と同語源。ホテルで寒いときの依頼に使える。,,家具と水まわり
L3-0828,3,il lenzuolo,シーツ,noun,m,"i lenzuoli, le lenzuola",住まい・日用品,"Posso avere un altro lenzuolo, per favore?",もう1枚シーツをいただけますか？,複数形は2通り。1枚ずつ数えるときは lenzuoli、ベッド用の一組は女性複数の le lenzuola が普通。,,家具と水まわり
L3-0344,3,il vaso,花瓶|壺|植木鉢,noun,m,vasi,住まい・日用品,Vorrei comprare un vaso di ceramica.,陶器の花瓶を買いたいのですが。,花瓶や植木鉢は vaso da fiori とも言う（vaso di fiori は「花の入った花瓶」）。土産物では陶器の vaso が定番。,,家具と水まわり
L3-0746,3,lo scaffale,棚|陳列棚,noun,m,scaffali,住まい・日用品,Il latte è sullo scaffale in basso.,牛乳は下の棚にあります。,店や本屋、倉庫などの棚。s＋子音で始まるので冠詞は lo。壁に取り付ける棚は mensola。,,家具と水まわり
L3-0398,3,il cassetto,引き出し,noun,m,cassetti,住まい・日用品,Le chiavi sono nel cassetto della scrivania.,鍵は机の引き出しに入っています。,家具の引き出し。cassa（箱、レジ）や cassaforte（金庫）と混同しないこと。,,家具と水まわり
L3-0651,3,il rubinetto,蛇口,noun,m,rubinetti,住まい・日用品,Il rubinetto del bagno è rotto.,バスルームの蛇口が壊れています。,水が出ない・漏れるときは Il rubinetto perde.（蛇口から水が漏れる）のように言う。,,家具と水まわり
L3-0718,3,il lavandino,洗面台|流し台,noun,m,lavandini,住まい・日用品,Il lavandino del bagno è intasato.,洗面所の洗面台が詰まっています。,浴室の洗面台にも台所の流し台にも使える。台所の流しは acquaio、洗面台は lavabo とも言う。,il lavabo,家具と水まわり
L3-0256,3,la vasca,浴槽|バスタブ,noun,f,vasche,住まい・日用品,Nel bagno c'è una vasca grande.,バスルームには大きな浴槽があります。,vasca da bagno が省略しない言い方で、会話では vasca だけで浴槽を指すことが多い。水槽・水盤の意味もある。一般的な「プール」は piscina。,la vasca da bagno,家具と水まわり
L3-0023,3,la lavatrice,洗濯機,noun,f,lavatrici,住まい・日用品,"La lavatrice è in bagno, accanto alla doccia.",洗濯機は浴室のシャワーの横にあります。,lavare（洗う）から派生。乾燥機は asciugatrice、食器洗い機は lavastoviglie。,,家電と電気
L3-0301,3,la lavastoviglie,食器洗い機|食洗機,noun,f,lavastoviglie（不変）,住まい・日用品,La lavastoviglie in cucina non funziona.,キッチンの食器洗い機が動きません。,単数も複数も lavastoviglie で同形。lavare＋stoviglie（食器類）の合成語。,la lavapiatti,家電と電気
L3-0271,3,l'asciugacapelli,ヘアドライヤー|ドライヤー,noun,m,asciugacapelli（不変）,住まい・日用品,"Scusi, c'è un asciugacapelli in camera?",すみません、部屋にドライヤーはありますか？,単複同形の男性名詞。母音で始まるので冠詞は l'、不定冠詞は un。phon も同義で使われる。,il fon|il phon,家電と電気
L3-0763,3,il ventilatore,扇風機,noun,m,ventilatori,住まい・日用品,"Accendo il ventilatore, fa troppo caldo.",暑すぎるので扇風機をつけます。,天井に取り付けるタイプは ventilatore a soffitto。エアコンは condizionatore。,,家電と電気
L3-0323,3,il riscaldamento,暖房|加熱,noun,m,riscaldamenti,住まい・日用品,Il riscaldamento non funziona in camera.,部屋の暖房が動きません。,「暖房を入れる」は accendere il riscaldamento。集中暖房は riscaldamento centralizzato。「地球温暖化」は riscaldamento globale。,,家電と電気
L3-0484,3,il telecomando,リモコン,noun,m,telecomandi,住まい・日用品,Dov'è il telecomando della televisione?,テレビのリモコンはどこですか？,テレビやエアコンなど遠隔操作の機器全般に使う。,,家電と電気
L3-0317,3,la presa,コンセント|差込口,noun,f,prese,住まい・日用品,Dov'è la presa per il caricabatterie?,充電器のコンセントはどこですか？,壁のコンセントは presa (di corrente)。プラグは spina。変換アダプターは adattatore。,la presa di corrente,家電と電気
L3-0314,3,la pila,電池|(積み重ねた)山,noun,f,pile,住まい・日用品,Devo comprare delle pile per il telecomando.,リモコン用の電池を買わなければなりません。,乾電池は pila と言うことが多く、スマホ等の充電式は batteria。口語では乾電池も batteria と呼ぶ。「山積み」の意味もある。,la batteria,家電と電気
L3-0678,3,la batteria,バッテリー|電池|（楽器の）ドラム,noun,f,batterie,住まい・日用品,La batteria del telefono è scarica.,携帯電話のバッテリーが切れています。,batteria は車や携帯の充電式電池。音楽のドラムセットの意味もある。懐中電灯などの乾電池は pila が一般的。,,家電と電気
L3-0395,3,il caricabatterie,充電器,noun,m,caricabatterie（不変）,住まい・日用品,Ho dimenticato il caricabatterie in camera.,部屋に充電器を忘れてしまいました。,複数形も同形で不変。スマホ用は caricatore（del telefono）とも言う。,il caricatore,家電と電気
L3-0805,3,la corrente,電気|電流|流れ,noun,f,correnti,住まい・日用品,Non c'è corrente in camera.,部屋の電気が来ていません。,「停電」は manca la corrente や blackout。corrente は「流れ」「風の通り道（隙間風 corrente d'aria）」の意味もある。,l'elettricità,家電と電気
L3-0039,3,spegnere,消す|（電源を）切る|消火する,verb,,"spengo, spegni, spegne, spegniamo, spegnete, spengono（過去分詞 spento）",住まい・日用品,"Puoi spegnere la luce, per favore?",電気を消してもらえますか？,"io と loro の活用で gn が ng になり不規則（spengo, spengono）。過去分詞は spento。反対語は accendere（つける）。",,家電と電気
L3-0268,3,acceso,点いている|つけたままの,adj,,"accesa, accesi, accese",住まい・日用品,La luce è accesa in cucina.,台所の電気がついています。,accendere の過去分詞（不規則）が形容詞化した語。反対は spento。「電気がついている」は essere acceso。,,家電と電気
L3-0031,3,la pulizia,掃除|清潔さ,noun,f,pulizie,住まい・日用品,Le pulizie in camera si fanno ogni mattina.,部屋の掃除は毎朝行われます。,「掃除をする」は fare le pulizie と複数形で言うことが多い。清潔さの意味では単数形を使う。,,掃除と身じたく
L3-0245,3,la spazzatura,ごみ|廃棄物,noun,f,spazzature,住まい・日用品,Dove posso buttare la spazzatura?,ごみはどこに捨てられますか？,普通は単数で使う。分別ごみは raccolta differenziata。「ごみを出す」は portare fuori la spazzatura。,i rifiuti,掃除と身じたく
L3-0392,3,buttare,捨てる|投げる,verb,,"butto, butti, butta, buttiamo, buttate, buttano",住まい・日用品,Dove posso buttare la plastica?,プラスチックはどこに捨てればいいですか？,ごみを捨てるときの定番動詞。buttare via で「捨て去る」。buttarsi は「飛び込む」。規則動詞。,gettare,掃除と身じたく
L3-0462,3,riciclare,リサイクルする|再利用する,verb,,"riciclo, ricicli, ricicla, ricicliamo, riciclate, riciclano",住まい・日用品,Dobbiamo riciclare la plastica e la carta.,プラスチックと紙はリサイクルしなければなりません。,規則動詞（-are）。ごみの分別収集は raccolta differenziata と言う。名詞は il riciclaggio。,,掃除と身じたく
L3-0813,3,il detersivo,洗剤,noun,m,detersivi,住まい・日用品,Dobbiamo comprare il detersivo per i piatti.,食器用洗剤を買わなければなりません。,用途で区別する。detersivo per i piatti（食器用）、per il bucato（洗濯用）。,,掃除と身じたく
L3-0555,3,la spugna,スポンジ,noun,f,spugne,住まい・日用品,Mi serve una spugna per lavare i piatti.,お皿を洗うためのスポンジが必要です。,台所用だけでなく、体や車を洗うスポンジにも使う。海綿動物も spugna。,,掃除と身じたく
L3-0334,3,sistemare,片づける|整える|解決する,verb,,"sistemo, sistemi, sistema, sistemiamo, sistemate, sistemano",住まい・日用品,Devo sistemare la camera prima di uscire.,出かける前に部屋を片づけなければなりません。,再帰形 sistemarsi は「落ち着く、身なりを整える」。問題を「解決する」の意味でも日常的に使う。,,掃除と身じたく
L3-0622,3,ordinato,整頓された|きちんとした,adj,,"ordinata, ordinati, ordinate",住まい・日用品,La mia camera è sempre molto ordinata.,私の部屋はいつもとてもきちんとしています。,ordinare（整える、注文する）の過去分詞から。人にも使え「きちんとした人」の意味になる。反対は disordinato。,,掃除と身じたく
L3-0232,3,riparare,修理する|直す,verb,,"riparo, ripari, ripara, ripariamo, riparate, riparano",住まい・日用品,"Può riparare questa borsa, per favore?",このかばんを修理していただけますか？,他動詞で、近過去は avere を使う。riparare da で「〜から守る」の意味もある。,aggiustare,掃除と身じたく
L3-0539,3,asciugare,乾かす|拭く,verb,,"asciugo, asciughi, asciuga, asciughiamo, asciugate, asciugano",住まい・日用品,Posso asciugare i capelli con il fon?,ドライヤーで髪を乾かしてもいいですか？,"-gare の動詞は tu と noi で h が入る（asciughi, asciughiamo）。再帰形 asciugarsi は「自分の体を拭く」。",,掃除と身じたく
L3-0038,3,lo spazzolino,歯ブラシ,noun,m,spazzolini,住まい・日用品,Ho dimenticato lo spazzolino in albergo.,ホテルに歯ブラシを忘れてしまいました。,正式には spazzolino da denti。s＋子音で始まるので冠詞は lo。,lo spazzolino da denti,掃除と身じたく
L3-0165,3,il deodorante,制汗剤|デオドラント,noun,m,deodoranti,住まい・日用品,"Cerco un deodorante senza profumo, per favore.",無香料の制汗剤を探しています。,スプレーは spray、スティックは stick、ロールオンは roll-on と言う。薬局（farmacia）や profumeria、スーパー（supermercato）で買える。,,掃除と身じたく
L3-0755,3,la spazzola,ブラシ|ヘアブラシ,noun,f,spazzole,住まい・日用品,Cerco una spazzola per i capelli.,髪用のブラシを探しています。,spazzola per capelli は髪用、spazzolino は小さいブラシで特に歯ブラシ（spazzolino da denti）を指す。,,掃除と身じたく
L3-0631,3,pettinarsi,髪をとかす|自分の髪を整える,verb,,"mi pettino, ti pettini, si pettina, ci pettiniamo, vi pettinate, si pettinano",住まい・日用品,Mi pettino prima di uscire di casa.,家を出る前に髪をとかします。,再帰動詞。髪を主語自身がとかす。他人の髪なら pettinare を使う。近過去は essere を助動詞にとる（mi sono pettinato/a）。,,掃除と身じたく
L3-0146,3,la barba,あごひげ|ひげ,noun,f,barbe,住まい・日用品,Mio padre ha la barba bianca.,私の父は白いあごひげを生やしています。,主にあごひげを指す。口ひげは i baffi。farsi la barba は「ひげを剃る」。,,掃除と身じたく
L3-0014,3,svegliare,起こす|目を覚まさせる,verb,,"sveglio, svegli, sveglia, svegliamo, svegliate, svegliano",住まい・日用品,"Domani mi svegli alle sei, per favore?",明日は6時に起こしてくれますか？,他動詞で「人を起こす」。自分が起きるときは再帰動詞 svegliarsi を使う（mi sveglio）。,,掃除と身じたく
L3-0003,3,il passeggero,乗客,noun,m,passeggeri,交通・移動,I passeggeri aspettano il treno sul binario.,乗客たちはホームで列車を待っています。,女性形は passeggera（複数 passeggere）。電車・飛行機・船など乗り物全般の乗客に使う。,,電車とバスに乗る
L3-0015,3,il viaggiatore,旅行者|旅人,noun,m,viaggiatori,交通・移動,I viaggiatori aspettano il treno sul binario due.,旅行者たちは2番線で列車を待っています。,女性は la viaggiatrice（複数 le viaggiatrici）。turista は観光目的、viaggiatore は旅をする人一般。,,電車とバスに乗る
L3-0020,3,il finestrino,窓（車・列車の）,noun,m,finestrini,交通・移動,"Posso aprire il finestrino, per favore?",窓を開けてもいいですか？,finestra（建物の窓）の指小形だが、車・列車・飛行機の窓は finestrino を使う。,,電車とバスに乗る
L3-0151,3,la carrozza,車両|客車|馬車,noun,f,carrozze,交通・移動,Il mio posto è nella carrozza numero sette.,私の席は7号車です。,列車の車両は carrozza のほか vagone とも言う。vagone は貨車にも使う。座席指定の切符には carrozza の番号が書かれている。,,電車とバスに乗る
L3-0674,3,il vagone,車両|客車|貨車,noun,m,vagoni,交通・移動,Il nostro posto è nel vagone numero cinque.,私たちの席は5号車です。,列車の1両を指し、貨車（vagone merci）も含む。「5号車」は口語で il vagone numero cinque とも言うが、切符や駅の案内では旅客車両に carrozza を使うのが普通。,la carrozza,電車とバスに乗る
L3-0565,3,la banchina,ホーム|埠頭,noun,f,banchine,交通・移動,Aspettiamo il treno sulla banchina.,私たちはホームで列車を待っています。,「○番線」は binario で言う（例: binario due）。banchina は乗り降りする台の部分。港では「埠頭・岸壁」の意味にもなる。,,電車とバスに乗る
L3-0572,3,il capolinea,終点|始発駅,noun,m,capolinea（不変）,交通・移動,Scendo al capolinea del tram.,トラムの終点で降ります。,バスや電車の起点・終点どちらにも使う。複数形はふつう不変の i capolinea で、capilinea という形も見られる。,,電車とバスに乗る
L3-0680,3,la coincidenza,乗り継ぎ|接続便|偶然の一致,noun,f,coincidenze,交通・移動,Perdo la coincidenza per Firenze.,フィレンツェ行きの乗り継ぎに乗り遅れてしまう。,電車・バスの乗り継ぎ便を指す。「偶然の一致」の意味もある。perdere la coincidenza は乗り継ぎを逃す。,,電車とバスに乗る
L3-0562,3,l'andata,行き|往路,noun,f,andate,交通・移動,Vorrei due biglietti di andata e ritorno.,往復切符を2枚ください。,andata e ritorno は「往復」、solo andata は「片道」。反対語は il ritorno（復路）。,,電車とバスに乗る
L3-0382,3,l'abbonamento,定期券|定期購読,noun,m,abbonamenti,交通・移動,Vorrei fare un abbonamento mensile per la metro.,地下鉄の1か月定期券を作りたいのですが。,交通機関の定期券のほか、雑誌・ジムなどの会員契約や購読にも使う。fare un abbonamento で「契約する」。,,電車とバスに乗る
L3-0579,3,convalidare,刻印する（切符を）|有効にする|承認する|認証する,verb,,"convalido, convalidi, convalida, convalidiamo, convalidate, convalidano",交通・移動,Devi convalidare il biglietto prima di salire sul treno.,電車に乗る前に切符に刻印しなければなりません。,イタリアでは乗車前に刻印機で切符を有効にする。しないと罰金。timbrare も口語でよく使う。,timbrare,電車とバスに乗る
L3-0416,3,la ferrovia,鉄道|線路,noun,f,ferrovie,交通・移動,La stazione è vicino alla ferrovia.,駅は線路のすぐ近くにあります。,路線網や制度としての「鉄道」を指す。個々の列車は treno、国鉄は le Ferrovie dello Stato。,la strada ferrata,電車とバスに乗る
L3-0280,3,il controllore,車掌|検札係,noun,m,controllori,交通・移動,Il controllore chiede i biglietti a tutti i passeggeri.,検札係は乗客全員に切符を求めます。,列車やバスで切符を確認する人。女性は la controllora も使われる。切符は打刻（convalidare）を忘れずに。,,電車とバスに乗る
L3-0311,3,la navetta,シャトルバス|送迎バス,noun,f,navette,交通・移動,C'è una navetta gratuita per l'aeroporto?,空港行きの無料シャトルバスはありますか？,空港やホテルへの短距離の送迎便を指す。fare la navetta は「往復する」の意味でも使う。,,電車とバスに乗る
L3-0530,3,il pullman,長距離バス|観光バス,noun,m,pullman（不変）,交通・移動,Il pullman per Firenze parte alle nove.,フィレンツェ行きの長距離バスは9時に出発します。,外来語なので複数形も pullman で不変。市内バスは autobus、近郊や長距離は pullman。,,電車とバスに乗る
L3-0432,3,il mezzo,乗り物|手段|真ん中,noun,m,mezzi,交通・移動,Qual è il mezzo più veloce per andare al centro?,中心街へ行く一番早い交通手段は何ですか？,mezzo di trasporto で「交通機関」。i mezzi（公共交通）もよく使う。形容詞 mezzo は「半分の」。,,電車とバスに乗る
L3-0514,3,la funivia,ロープウェイ|空中ケーブル,noun,f,funivie,交通・移動,Prendiamo la funivia per salire in cima alla montagna.,山頂まではロープウェイで上がりましょう。,空中ケーブルの乗り物。地面のレール式ケーブルカーは funicolare で、別物。,,電車とバスに乗る
L3-0420,3,la galleria,トンネル|画廊|アーケード,noun,f,gallerie,交通・移動,Il treno entra in una lunga galleria.,列車は長いトンネルに入ります。,道路や鉄道のトンネルのほか、美術館・画廊（galleria d'arte）や商店街のアーケードも指す。,il tunnel,電車とバスに乗る
L3-0028,3,noleggiare,レンタルする|借りる（有料で）|賃貸しする（有料で貸す）,verb,,"noleggio, noleggi, noleggia, noleggiamo, noleggiate, noleggiano",交通・移動,Vorrei noleggiare una macchina per tre giorni.,3日間、車を借りたいのですが。,"車・自転車などを有料で借りる（または貸す）意味。-gi- の i は g の後で発音を保つため、tu noleggi, noi noleggiamo では i が重ならない。",affittare,車を運転する
L3-0446,3,la patente,運転免許証|免許証,noun,f,patenti,交通・移動,Ho dimenticato la patente a casa.,免許証を家に忘れてしまいました。,レンタカーでは patente の提示を求められる。「運転免許」は patente di guida とも言う。,la patente di guida,車を運転する
L3-0065,3,il distributore,ガソリンスタンド|自動販売機,noun,m,distributori,交通・移動,C'è un distributore di benzina qui vicino?,この近くにガソリンスタンドはありますか？,略さずに言うと distributore di benzina。自動販売機は distributore automatico。セルフ式の給油機は self や self service と表示されることが多い。,il benzinaio,車を運転する
L3-0447,3,il pedaggio,通行料金|(高速道路の)料金,noun,m,pedaggi,交通・移動,Quanto costa il pedaggio fino a Firenze?,フィレンツェまでの通行料金はいくらですか？,主に高速道路 (autostrada) の料金。料金所は casello、支払いは pagare il pedaggio。,,車を運転する
L3-0422,3,la gomma,タイヤ|ゴム|消しゴム,noun,f,gomme,交通・移動,Ho una gomma a terra.,タイヤがパンクしています。,「パンクした」は avere una gomma a terra / forata。消しゴムの意味でも使う。ガソリンスタンドや修理の場面で頻出。,lo pneumatico,車を運転する
L3-0535,3,la ruota,車輪|タイヤ,noun,f,ruote,交通・移動,La ruota della bicicletta è bucata.,自転車のタイヤがパンクしています。,ruota は車輪全体を指す。ゴム部分のタイヤは pneumatico や gomma とも言う。「観覧車」は la ruota panoramica。,,車を運転する
L3-0435,3,il motore,エンジン|モーター,noun,m,motori,交通・移動,Il motore fa un rumore strano.,エンジンが変な音を立てています。,車の故障を伝えるときの定番語。電気の「モーター」も motore。,,車を運転する
L3-0706,3,il freno,ブレーキ,noun,m,freni,交通・移動,Il freno della bicicletta non funziona.,自転車のブレーキが効きません。,freno a mano はハンドブレーキ（サイドブレーキ）。「ブレーキをかける」は frenare。,,車を運転する
L3-0436,3,il motorino,原付|スクーター,noun,m,motorini,交通・移動,Noleggio un motorino per girare la città.,街を回るために原付を借ります。,小型のバイクやスクーター全般を指す。大型バイクは moto。イタリアではヘルメット着用が義務。,lo scooter,車を運転する
L3-0275,3,il casco,ヘルメット,noun,m,caschi,交通・移動,Per andare in motorino devi mettere il casco.,スクーターに乗るにはヘルメットをかぶらなければいけません。,複数形は caschi（h を入れて c の音を保つ）。「かぶる」は mettere。イタリアではバイクで着用義務。,,車を運転する
L3-0836,3,il navigatore,カーナビ|ナビゲーター|航海者,noun,m,navigatori,交通・移動,Il navigatore dice di girare a destra.,ナビは右に曲がれと言っています。,il navigatore satellitare を略した言い方。女性の航海者・助手席の案内役は la navigatrice。,il navigatore satellitare,車を運転する
L3-0779,3,allacciarsi,（シートベルトを）締める|身につける（ベルトなどを）,verb,,"mi allaccio, ti allacci, si allaccia, ci allacciamo, vi allacciate, si allacciano",交通・移動,"Allacciatevi le cinture, per favore.",シートベルトをお締めください。,再帰動詞。allacciarsi le cinture で「シートベルトを締める」。allacciarsi le scarpe（靴紐を結ぶ）のようにも使う。,,車を運転する
L3-0803,3,il conducente,運転手,noun,mf,conducenti,交通・移動,Il conducente dell'autobus è molto gentile.,バスの運転手はとても親切です。,-e で終わる男女同形の名詞で、男性は il conducente、女性は la conducente。バスなどの職業運転手だけでなく、車を運転している人（運転者）一般も指す。,l'autista,車を運転する
L3-0116,3,il tassista,タクシー運転手,noun,m,"i tassisti, le tassiste",交通・移動,Il tassista mi aiuta con la valigia.,タクシーの運転手がスーツケースを手伝ってくれます。,語尾は -a だが男性名詞。女性は la tassista で、複数は男性 tassisti、女性 tassiste。,,車を運転する
L3-0806,3,la corsia,車線|（店などの）通路|（プールの）コース|（病院の）大部屋・病棟,noun,f,corsie,交通・移動,Prendi la corsia di destra per uscire.,出るには右の車線に入って。,道路の車線のほか、スーパーなどの通路、プールのコース、病院の大部屋（病棟）も指す。機内の通路は普通 corridoio。高速の非常用車線は corsia di emergenza。,,道路と交通ルール
L3-0283,3,la curva,カーブ|曲がり角,noun,f,curve,交通・移動,"Attenzione, c'è una curva pericolosa.",気をつけて、危険なカーブがあります。,道路標識では curva pericolosa（危険なカーブ）。曲線全般にも使う。,,道路と交通ルール
L3-0753,3,sorpassare,追い越す|追い抜く,verb,,"sorpasso, sorpassi, sorpassa, sorpassiamo, sorpassate, sorpassano",交通・移動,Non si può sorpassare qui.,ここでは追い越しできません。,車の追い越しに使う。名詞は il sorpasso。「追い越し禁止」は divieto di sorpasso。,superare,道路と交通ルール
L3-0664,3,superare,追い越す|超える|（試験に）合格する,verb,,"supero, superi, supera, superiamo, superate, superano",交通・移動,Ho superato l'esame di italiano.,私はイタリア語の試験に合格しました。,superare un esame で「試験に合格する」、superare una difficoltà で「困難を乗り越える」。運転の「追い越す」は sorpassare が一般的。近過去は avere を使う（ho superato）。,sorpassare,道路と交通ルール
L3-0022,3,l'incrocio,交差点|十字路,noun,m,incroci,交通・移動,Al prossimo incrocio giri a destra.,次の交差点で右に曲がってください。,道案内で頻出。crocevia も「十字路」の意味だが、やや文語的。bivio は道が二股に分かれる「分岐点」で、交差点とは別物。日常では incrocio が普通。,,道路と交通ルール
L3-0428,3,il marciapiede,歩道|(駅の)プラットホーム,noun,m,marciapiedi,交通・移動,Non si può parcheggiare sul marciapiede.,歩道に駐車してはいけません。,複数形は i marciapiedi（単数と形が異なる）。駅のホームの意味でも使うが、駅では番線を表す binario や、banchina のほうがよく使われる。,,道路と交通ルール
L3-0629,3,il pedone,歩行者,noun,m,pedoni,交通・移動,I pedoni aspettano il semaforo verde.,歩行者は青信号を待っています。,横断歩道は passaggio pedonale や strisce pedonali。pedonale は「歩行者用の」という形容詞。,,道路と交通ルール
L3-0235,3,la salita,上り坂|登り,noun,f,salite,交通・移動,"La salita è molto ripida, andiamo piano.",上り坂はとても急なので、ゆっくり行きましょう。,反対語は discesa（下り坂）。「Salita」は道路標識や地名にも出てくる。動詞 salire（上る）から派生した名詞。,,道路と交通ルール
L3-0218,3,il percorso,経路|道のり|コース,noun,m,percorsi,交通・移動,Qual è il percorso più veloce per la stazione?,駅まで一番早い経路はどれですか？,移動の道筋や距離、ハイキングやバスの路線にも使う。動詞 percorrere（たどる）と同語源。,il tragitto,道路と交通ルール
L3-0258,3,la velocità,速度|速さ,noun,f,velocità（不変）,交通・移動,Qui il limite di velocità è cinquanta chilometri all'ora.,ここの制限速度は時速50キロです。,-à で終わる名詞は複数形も同形。limite di velocità（制限速度）は道路でよく使う表現。,,道路と交通ルール
L3-0473,3,il segnale,標識|信号|合図,noun,m,segnali,交通・移動,Non vedo il segnale per l'autostrada.,高速道路の標識が見当たりません。,道路標識は segnale stradale。交差点の信号機は semaforo と言う。携帯の電波も segnale。,,道路と交通ルール
L3-0573,3,il cartello,標識|看板|掲示,noun,m,cartelli,交通・移動,Non vedo il cartello per l'uscita.,出口の標識が見当たりません。,道路標識は cartello stradale。掲示や貼り紙、プラカードにも使う。,,道路と交通ルール
L3-0817,3,il divieto,禁止|禁止事項,noun,m,divieti,交通・移動,Qui c'è il divieto di sosta.,ここは駐車禁止です。,標識で頻出。divieto di sosta（駐車禁止）、divieto di accesso（立入禁止）、divieto di fumare（禁煙）。,,道路と交通ルール
L3-0437,3,la multa,罰金|違反切符,noun,f,multe,交通・移動,Ho preso una multa per divieto di sosta.,駐車禁止で違反切符を切られました。,prendere una multa（罰金を受ける）、fare una multa（切符を切る）、pagare una multa（払う）がよく使われる。,la contravvenzione,道路と交通ルール
L3-0476,3,la sosta,停車|駐車|休憩,noun,f,soste,交通・移動,Qui la sosta è vietata dalle otto alle venti.,ここは8時から20時まで駐停車禁止です。,標識の divieto di sosta は「駐停車禁止」。長い旅の途中の「休憩・小休止」の意味でも使う。,,道路と交通ルール
L3-0294,3,l'incidente,事故|出来事,noun,m,incidenti,交通・移動,Ho visto un incidente in autostrada.,高速道路で事故を見ました。,-e で終わるが男性名詞。交通事故は incidente stradale。,,道路と交通ルール
L3-0789,3,bloccato,動かない|封鎖された|立ち往生した,adj,,"bloccata, bloccati, bloccate",交通・移動,La strada è bloccata per un incidente.,事故のため道路が通行止めです。,bloccare の過去分詞から来た形容詞。「渋滞」の名詞は traffico や coda を使う。,,道路と交通ルール
L3-0407,3,decollare,離陸する,verb,,"decollo, decolli, decolla, decolliamo, decollate, decollano",交通・移動,L'aereo decolla alle otto e mezza.,飛行機は8時半に離陸します。,反対は atterrare（着陸する）。近過去の助動詞は avere も essere も使われる（ha decollato / è decollato）。,,空港と旅の手続き
L3-0540,3,atterrare,着陸する,verb,,"atterro, atterri, atterra, atterriamo, atterrate, atterrano",交通・移動,L'aereo atterra a Roma alle dieci.,飛行機は10時にローマに着陸します。,規則動詞。近過去は essere を使う（è atterrato）。反対語は decollare（離陸する）。,,空港と旅の手続き
L3-0733,3,la pista,滑走路|ゲレンデ|コース,noun,f,piste,交通・移動,L'aereo è sulla pista di decollo.,飛行機は離陸用の滑走路にいます。,pista ciclabile は自転車専用道、pista da sci はスキーのゲレンデ。,,空港と旅の手続き
L3-0826,3,l'imbarco,搭乗|乗船,noun,m,imbarchi,交通・移動,L'imbarco inizia alle dieci al gate cinque.,搭乗は10時に5番ゲートで始まります。,空港では carta d'imbarco（搭乗券）が頻出。反対は lo sbarco（下船）。imbarco は l' で始まる男性名詞。,,空港と旅の手続き
L3-0825,3,imbarcarsi,搭乗する|乗船する,verb,,"mi imbarco, ti imbarchi, si imbarca, ci imbarchiamo, vi imbarcate, si imbarcano",交通・移動,I passeggeri si imbarcano al gate dodici.,乗客は12番ゲートから搭乗します。,"再帰動詞。船にも飛行機にも使う。tu と noi では綴りが imbarchi, imbarchiamo と h が入る。",,空港と旅の手続き
L3-0589,3,l'elicottero,ヘリコプター,noun,m,elicotteri,交通・移動,Il turista prende un elicottero per vedere la città.,観光客は街を見るためにヘリコプターに乗ります。,母音で始まる男性名詞なので冠詞は l'。英語の helicopter と違い、イタリア語では h を書かない。,,空港と旅の手続き
L3-0794,3,il capitano,船長|機長|キャプテン,noun,m,capitani,交通・移動,Il capitano parla ai passeggeri.,機長が乗客に話しかけています。,スポーツチームの主将の意味でも使う。女性形は la capitana。,,空港と旅の手続き
L3-0586,3,dichiarare,申告する|宣言する|述べる,verb,,"dichiaro, dichiari, dichiara, dichiariamo, dichiarate, dichiarano",交通・移動,Ha qualcosa da dichiarare?,何か申告するものはありますか？,税関の定番表現 qualcosa da dichiarare。規則動詞（-are）で、過去分詞は dichiarato。,,空港と旅の手続き
L3-0279,3,il confine,国境|境界,noun,m,confini,交通・移動,Il confine con la Svizzera è vicino.,スイスとの国境は近いです。,confine は国境のほか、土地・県・分野などの境界も表す。frontiera は主に国と国の国境を指す。複数形は i confini。,,空港と旅の手続き
L3-0418,3,la frontiera,国境|境界,noun,f,frontiere,交通・移動,Domani passiamo la frontiera con la Svizzera.,明日、スイスとの国境を越えます。,国境を指す一般的な語。confine も近いが、frontiera は検問のある国境線を指すことが多い。,,空港と旅の手続き
L3-0785,3,l'assicurazione,保険,noun,f,assicurazioni,交通・移動,Ho un'assicurazione di viaggio per tutta la famiglia.,家族全員分の旅行保険に入っています。,レンタカーでは assicurazione completa（フルカバー）などと言う。母音始まりなので冠詞は l' / un'。,,空港と旅の手続き
L3-0004,3,il permesso,許可|許可証|在留許可,noun,m,permessi,交通・移動,Serve un permesso per entrare qui?,ここに入るには許可が必要ですか？,「Permesso?」は人の家や部屋に入る時や人混みで通る時の「失礼します」。permesso di soggiorno は滞在許可証。,,空港と旅の手続き
L3-0605,3,l'itinerario,旅程|行程|ルート,noun,m,itinerari,観光・文化,Abbiamo preparato un itinerario per tre giorni a Roma.,私たちはローマ3日間の旅程を立てました。,l'itinerario は母音始まりなので冠詞は l'。複数形は gli itinerari。「旅程」のほか道筋・ルートの意味でも使う。,il percorso,旅を計画する
L3-0351,3,la gita,小旅行|日帰り旅行|遠足,noun,f,gite,観光・文化,Domenica facciamo una gita al lago.,日曜日に湖へ小旅行に行きます。,近場への短い旅行や遠足を指す。fare una gita で「小旅行に行く」。長期の旅行は viaggio。,l'escursione,旅を計画する
L3-0590,3,l'escursione,小旅行|遠足|ハイキング,noun,f,escursioni,観光・文化,Domani facciamo un'escursione in montagna.,明日は山へハイキングに行きます。,観光ツアーや山歩きなど日帰りの小旅行に広く使う。fare un'escursione で「小旅行をする」。,la gita,旅を計画する
L3-0376,3,soggiornare,滞在する|宿泊する,verb,,"soggiorno, soggiorni, soggiorna, soggiorniamo, soggiornate, soggiornano",観光・文化,Vorrei soggiornare in questo hotel per tre notti.,このホテルに3泊したいのですが。,規則動詞。近過去の助動詞は avere（ho soggiornato）。名詞 il soggiorno は「滞在」「居間」の意味もある。,,旅を計画する
L3-0502,3,alloggiare,宿泊する|泊まる|泊める,verb,,"alloggio, alloggi, alloggia, alloggiamo, alloggiate, alloggiano",観光・文化,Alloggiamo in un piccolo albergo vicino alla stazione.,私たちは駅の近くの小さなホテルに泊まっています。,-giare 動詞なので、語尾が i や e で始まる活用では語幹の i が落ちる（tu alloggi ×alloggii、alloggerò）。alloggiamo の i は綴りに残るが発音しない。他動詞だと「泊める」。近過去は avere を使う。,,旅を計画する
L3-0453,3,il portiere,フロント係|（建物の）管理人|ドアマン|ゴールキーパー,noun,m,portieri,観光・文化,Chiedo al portiere dov'è la stazione.,フロント係に駅がどこか尋ねます。,ホテルの受付係やマンションの管理人も指す。サッカーのゴールキーパーの意味もある。受付カウンターそのものは la reception と言う。,,旅を計画する
L3-0516,3,la guida,ガイド|案内書|運転,noun,f,guide,観光・文化,"Vorrei una guida della città, per favore.",市内のガイドブックをください。,「ガイド（人）」の意味でも、男性を指す場合を含めて通常 la guida（例: Marco è una guida alpina.）。「ガイドブック」も la guida。「運転」の意味もあり、auto con guida a destra は右ハンドル車。,,旅を計画する
L3-0166,3,disponibile,利用できる|在庫がある|空いている,adj,,disponibili,観光・文化,Questa camicia è disponibile in blu?,このシャツは青もありますか？,男女同形の -e 形容詞。人にも使え「手が空いている、対応できる」の意味にもなる。,,旅を計画する
L3-0107,3,il servizio,サービス|業務|奉仕,noun,m,servizi,観光・文化,Il servizio in questo ristorante è molto veloce.,このレストランのサービスはとても速いです。,servizio è compreso は「サービス料込み」。トイレは i servizi とも言う。,,旅を計画する
L3-0053,3,la cattedrale,大聖堂|カテドラル,noun,f,cattedrali,観光・文化,La cattedrale è aperta tutti i giorni.,大聖堂は毎日開いています。,司教座のある教会。il duomo もほぼ同義で、イタリアでは町の主要な教会をこう呼ぶ（多くは大聖堂だが、司教座のない場合もある）。,il duomo,教会・美術館・記念碑
L3-0566,3,la basilica,聖堂|バシリカ,noun,f,basiliche,観光・文化,Domani visitiamo la basilica di San Pietro.,明日、サン・ピエトロ大聖堂を訪れます。,カトリックで特別な地位を持つ大きな教会。複数形は -che（basiliche）と綴りが変わる。duomo は都市の主聖堂。,,教会・美術館・記念碑
L3-0810,3,la cupola,ドーム|丸屋根|円天井,noun,f,cupole,観光・文化,Dalla cupola si vede tutta la città.,ドームからは街全体が見渡せます。,教会の大きな丸屋根を指すことが多い。フィレンツェの大聖堂のクーポラが有名。,,教会・美術館・記念碑
L3-0614,3,la messa,ミサ,noun,f,messe,観光・文化,La messa comincia alle dieci.,ミサは10時に始まります。,カトリックの礼拝。日曜の教会ではミサの時間に見学を控えるのがマナー。同形で mettere の名詞形「置くこと」の意味もあり、messa in scena（上演・演出）などの表現に使う。,,教会・美術館・記念碑
L3-0527,3,pregare,祈る|頼む|お願いする,verb,,"prego, preghi, prega, preghiamo, pregate, pregano",観光・文化,"Ti prego, aiutami.",お願いだから、助けて。,"-gare 動詞なので tu と noi で h が入る（preghi, preghiamo）。Prego は「どういたしまして」「どうぞ」の返答でも頻出。",,教会・美術館・記念碑
L3-0400,3,il cimitero,墓地,noun,m,cimiteri,観光・文化,Il cimitero è vicino alla chiesa.,墓地は教会の近くにあります。,イタリアの墓地は観光名所になっていることも多い。cimitero は -o で終わる男性名詞で複数形は cimiteri。,,教会・美術館・記念碑
L3-0433,3,il monumento,記念碑|モニュメント|歴史的建造物,noun,m,monumenti,観光・文化,Questo monumento è molto famoso in tutta la città.,この記念碑は街中でとても有名です。,観光では記念碑だけでなく、史跡・歴史的建造物全般も指す。複数形 monumenti は「名所旧跡」の意味でもよく使う。,,教会・美術館・記念碑
L3-0378,3,la statua,彫像|像,noun,f,statue,観光・文化,Questa statua è molto famosa.,この彫像はとても有名です。,広場や美術館で目にする大理石やブロンズの像を指す。複数形は statue。,,教会・美術館・記念碑
L3-0095,3,il quadro,絵画|額入りの絵,noun,m,quadri,観光・文化,Questo quadro è molto famoso.,この絵はとても有名です。,壁にかける額入りの絵（個々の作品）を指す。il dipinto はほぼ同義だが、la pittura は絵画という芸術・技法全般を指すので区別する。,il dipinto,教会・美術館・記念碑
L3-0452,3,il pittore,画家,noun,m,i pittori,観光・文化,Mio nonno è un pittore famoso.,私の祖父は有名な画家です。,女性形は la pittrice（複数 le pittrici）。pittore は絵を描く画家のほか、壁などを塗る塗装工も指すことがある。,,教会・美術館・記念碑
L3-0027,3,la mostra,展覧会|展示,noun,f,mostre,観光・文化,Vorrei vedere la mostra di Leonardo.,レオナルドの展覧会を見たいです。,mostrare（見せる）と同語源。美術館の常設展示は collezione permanente と言い、mostra は主に期間限定の企画展を指す。,l'esposizione,教会・美術館・記念碑
L3-0767,3,ammirare,鑑賞する|称賛する|見とれる|尊敬する,verb,,"ammiro, ammiri, ammira, ammiriamo, ammirate, ammirano",観光・文化,Dalla terrazza si può ammirare tutta la città.,テラスから街全体を眺めて楽しめます。,景色や芸術作品を眺めて楽しむ意味で観光でよく使う。人を尊敬する意味でも使う。規則動詞。,,教会・美術館・記念碑
L3-0800,3,la collezione,コレクション|収集品,noun,f,collezioni,観光・文化,Questo museo ha una collezione di arte moderna.,この美術館には近代美術のコレクションがあります。,ファッションの「新作コレクション」も collezione。「集めること」は collezionismo。,,教会・美術館・記念碑
L3-0480,3,storico,歴史的な|歴史の,adj,,"storica, storici, storiche",観光・文化,Il centro storico è molto bello.,歴史地区はとても美しい。,centro storico は「旧市街、歴史地区」。男性複数は -chi でなく -ci（storici）になる点に注意。,,教会・美術館・記念碑
L3-0563,3,artistico,芸術的な|芸術の,adj,,"artistica, artistici, artistiche",観光・文化,Firenze ha un grande patrimonio artistico.,フィレンツェには豊かな芸術遺産があります。,男性複数は -ci（artistici）で、c の音は [k] から [tʃ] に変わる（女性複数 artistiche は [k] のまま）。patrimonio artistico は「芸術遺産」。,,教会・美術館・記念碑
L3-0063,3,la cultura,文化|教養,noun,f,culture,観光・文化,Mi interessa molto la cultura italiana.,私はイタリア文化にとても興味があります。,「教養・知識」の意味もある（una persona di cultura）。英語の culture に似るが、風習は tradizioni とも言う。,,教会・美術館・記念碑
L3-0406,3,culturale,文化の|文化的な,adj,,culturali,観光・文化,Questa città ha una ricca vita culturale.,この街は文化的な生活が豊かです。,-e 形容詞なので男女同形で、複数形は culturali。名詞 cultura から派生。,,教会・美術館・記念碑
L3-0496,3,la villa,別荘|邸宅,noun,f,ville,観光・文化,Abbiamo affittato una villa sul lago.,私たちは湖畔の別荘を借りました。,一戸建ての大きな家や庭付きの邸宅を指す。歴史的な別荘は観光名所になっていることも多い。,,教会・美術館・記念碑
L3-0202,3,il municipio,市役所|役場,noun,m,i municipi,観光・文化,Il municipio è vicino alla stazione.,市役所は駅の近くにあります。,il comune は「市町村（自治体）」も指し、「市役所」の意味でも使う。municipio は庁舎（建物）を指すことが多い。,il comune,教会・美術館・記念碑
L3-0396,3,il carnevale,カーニバル|謝肉祭,noun,m,carnevali,観光・文化,A Venezia il carnevale è molto famoso.,ヴェネツィアのカーニバルはとても有名です。,復活祭前の祭り。ヴェネツィアのものが特に有名。複数形はあまり使われない。,,祭りと楽しみ
L3-0214,3,la Pasqua,復活祭|イースター,noun,f,Pasque,観光・文化,A Pasqua andiamo dai nonni.,復活祭には祖父母の家に行きます。,大文字で書くのが普通。Buona Pasqua! は「イースターおめでとう」。翌日の月曜は Pasquetta と呼ぶ。,,祭りと楽しみ
L3-0182,3,il giorno festivo,祝日|休日,noun,m,giorni festivi,観光・文化,Nei giorni festivi i negozi sono chiusi.,祝日は店が閉まっています。,反対は giorno feriale（平日）。日曜も含む。festivi だけで名詞的にも使う（aperto anche i festivi「日曜・祝日も営業」）。,la festa,祭りと楽しみ
L3-0086,3,l'opera,オペラ|作品,noun,f,opere,観光・文化,Stasera andiamo all'opera a Verona.,今夜はヴェローナでオペラを観に行きます。,「オペラ」は l'opera lirica とも言う。「作品」の意味では l'opera d'arte（芸術作品）が頻出。複数形は le opere。,l'opera lirica,祭りと楽しみ
L3-0681,3,la danza,ダンス|舞踊,noun,f,danze,観光・文化,Mi piace molto la danza classica.,私はクラシックバレエがとても好きです。,ballo は社交的な踊りや舞踏会、danza は芸術・舞踊としてのダンスを指すことが多い。,,祭りと楽しみ
L3-0481,3,lo strumento,楽器|道具,noun,m,strumenti,観光・文化,Suono uno strumento da molti anni.,私は何年も前から楽器を演奏しています。,s＋子音で始まるので冠詞は lo。楽器は strumento musicale とも言う。楽器を演奏するのは suonare。,,祭りと楽しみ
L3-0040,3,suonare,演奏する|鳴る|鳴らす,verb,,"suono, suoni, suona, suoniamo, suonate, suonano",観光・文化,Mio fratello suona la chitarra molto bene.,兄はギターをとても上手に弾きます。,楽器は suonare＋定冠詞（suonare il pianoforte）。電話やベルが鳴るときにも使う。近過去は avere が基本だが、「鳴る」の意味では essere も使う（è suonata la sveglia）。,,祭りと楽しみ
L3-0203,3,il/la musicista,音楽家|ミュージシャン,noun,mf,"i musicisti, le musiciste",観光・文化,Mio fratello è un musicista di strada.,私の兄は大道芸のミュージシャンです。,語尾は -a だが男女同形。複数は男性 musicisti、女性 musiciste。-ista の職業名は同じ型。,,祭りと楽しみ
L3-0270,3,l'artista,芸術家|アーティスト,noun,mf,"gli artisti, le artiste",観光・文化,Mia sorella è un'artista molto brava.,私の姉はとても優れた芸術家です。,語尾は -a だが男女同形。冠詞で性を区別する（un artista / un'artista）。複数は男性 artisti、女性 artiste。,,祭りと楽しみ
L3-0701,3,il divertimento,楽しみ|娯楽,noun,m,divertimenti,観光・文化,Il cinema è un buon divertimento per tutta la famiglia.,映画は家族みんなにとってよい娯楽です。,Buon divertimento! は「楽しんでね」の定番表現。動詞 divertire / divertirsi（楽しませる／楽しむ）から派生した名詞。,,祭りと楽しみ
L3-0512,3,la folla,人混み|群衆,noun,f,folle,観光・文化,C'è troppa folla in centro oggi.,今日は中心街が人でごった返しています。,集合名詞で単数が基本。「人混み」は molta folla、「人混みの中で」は nella folla。,,祭りと楽しみ
L3-0134,3,affollato,混雑した|人でいっぱいの,adj,,"affollata, affollati, affollate",観光・文化,Il treno è molto affollato la mattina.,朝は電車がとても混んでいます。,場所・乗り物に使う。同義の gremito は「ぎっしり満員の」でより強い。pieno di gente も近い。,,祭りと楽しみ
L3-0117,3,tipico,典型的な|特有の|名物の,adj,,"tipica, tipici, tipiche",観光・文化,Vorrei provare un piatto tipico della zona.,この地方の名物料理を食べてみたいです。,piatto tipico は「郷土料理」。tipico di ... で「〜に特有の」。アクセントは tì-pi-co。,,祭りと楽しみ
L3-0427,3,locale,地元の|現地の|地方の,adj,,"locale, locali, locali",観光・文化,Vorrei provare un piatto locale.,地元の料理を試してみたいです。,-e 形容詞なので男女同形で、複数形は locali。il locale と名詞で使うと「店、飲食店」の意味になる。,,祭りと楽しみ
L3-0624,3,il panorama,眺め|パノラマ|景色,noun,m,panorami,天気・自然,Dalla terrazza si vede un panorama bellissimo.,テラスからはとても美しい眺めが見えます。,語尾は -a だが男性名詞。複数形は panorami。冠詞は il panorama。,la vista,景色と地形
L3-0119,3,la vista,眺め|景色|視力,noun,f,viste,天気・自然,La camera ha una bella vista sul mare.,その部屋は海がきれいに見えます。,ホテルでは vista mare（オーシャンビュー）のように使う。「視力」の意味もある。,il panorama,景色と地形
L3-0523,3,il paesaggio,風景|景色,noun,m,paesaggi,天気・自然,Il paesaggio toscano è bellissimo.,トスカーナの風景はとても美しい。,-aggio で終わる名詞は男性名詞。paese（国、村）と同じ語源の語（フランス語 paysage 経由）。,il panorama,景色と地形
L3-0060,3,la costa,海岸|沿岸,noun,f,coste,天気・自然,Vorrei visitare la costa amalfitana in estate.,夏にアマルフィ海岸を訪れたいです。,costa は海岸線や沿岸地帯。砂浜は spiaggia。「肋骨」の意味もある。,,景色と地形
L3-0042,3,il vulcano,火山,noun,m,vulcani,天気・自然,Possiamo salire sul vulcano con una guida.,ガイドと一緒に火山に登ることができます。,イタリアにはヴェスヴィオ、エトナ、ストロンボリなどの火山がある。複数形は語尾の -o を -i に変える規則的な形。,,景色と地形
L3-0493,3,la valle,谷|渓谷,noun,f,valli,天気・自然,Il paese si trova in una valle tra le montagne.,その村は山あいの谷にあります。,-e で終わる女性名詞で、複数形は valli。地名では la Valle d'Aosta（ヴァッレ・ダオスタ州）のように使う。,,景色と地形
L3-0397,3,la cascata,滝,noun,f,cascate,天気・自然,Domani andiamo a vedere la cascata.,明日は滝を見に行きます。,cascata は動詞 cascare（落ちる）に由来する。大小や自然・人工を問わず、滝全般を指して広く使う。,,景色と地形
L3-0710,3,la grotta,洞窟|洞穴,noun,f,grotte,天気・自然,Visitiamo la grotta domani mattina.,明日の朝、洞窟を見学します。,観光地の洞窟は grotta。caverna は奥深く大きな洞穴を指すことが多く、やや硬い語。,la caverna,景色と地形
L3-0399,3,la cima,頂上|山頂,noun,f,cime,天気・自然,Dalla cima si vede tutta la valle.,頂上から谷全体が見渡せます。,山だけでなく木や塔の先端にも使う。山頂を指す vetta もほぼ同義。,la vetta,景色と地形
L3-0744,3,la roccia,岩|岩石,noun,f,rocce,天気・自然,Il sentiero sale tra le rocce.,その小道は岩の間を登っていきます。,複数形は rocce（-cce は「ッチェ」で「ロッチェ」）。単数 roccia の -ccia は「ッチャ」で「ロッチャ」。「岩壁」は parete di roccia と言う。,,景色と地形
L3-0408,3,il deserto,砂漠,noun,m,deserti,天気・自然,Il deserto è molto caldo di giorno.,砂漠は昼間とても暑い。,形容詞として「人のいない」の意味もある（isola deserta＝無人島）。,,景色と地形
L3-0618,3,l'oceano,大洋|海洋,noun,m,oceani,天気・自然,Vorrei vedere l'oceano almeno una volta.,一度は大海原を見てみたいです。,mare（海）より大きな海域を指す。母音で始まるので冠詞は l'。,,景色と地形
L3-0550,3,l'onda,波,noun,f,onde,天気・自然,Oggi il mare è mosso e le onde sono molto alte.,今日は海が荒れていて、波がとても高い。,海の波は onda。「電波」「音波」にも使い、onda radio は電波。「波に乗る」は cavalcare l'onda。,,景色と地形
L3-0174,3,la foresta,森林|森,noun,f,foreste,天気・自然,Vicino al lago c'è una grande foresta.,湖の近くに大きな森があります。,foresta は広大で深い森。小さめの森や林は bosco。,,森と生きもの
L3-0567,3,il bosco,森|林,noun,m,boschi,天気・自然,Facciamo una passeggiata nel bosco.,森へ散歩に行きましょう。,複数形は boschi。-co → -chi と綴ることで /k/ の音を保つ。foresta はより大きく深い森。,,森と生きもの
L3-0526,3,il prato,草地|芝生,noun,m,prati,天気・自然,I bambini giocano sul prato.,子どもたちは草地で遊んでいます。,公園などの「芝生」にも使う。庭の手入れされた芝は tappeto erboso や erba とも言う。,,森と生きもの
L3-0739,3,il ramo,枝|分野（比喩的）,noun,m,rami,天気・自然,Un uccellino è posato sul ramo.,小鳥が枝にとまっています。,複数形は rami。ramo は木の枝全般を指す語で、小さな枝は指小語の rametto。比喩的に「分野・部門」の意味でも使う（例: il ramo della medicina）。,,森と生きもの
L3-0645,3,la radice,根|根っこ,noun,f,radici,天気・自然,Le radici di questo albero sono molto profonde.,この木の根はとても深い。,比喩的に「ルーツ、起源」の意味でも使う。数学の「根」や、髪・歯の付け根も radice。,,森と生きもの
L3-0297,3,l'insetto,昆虫|虫,noun,m,insetti,天気・自然,In estate ci sono molti insetti in giardino.,夏は庭にたくさん虫がいます。,母音で始まるので冠詞は l'。複数は gli insetti。口語では bestiolina（小さな生き物）と言うこともある。,,森と生きもの
L3-0130,3,la zanzara,蚊,noun,f,zanzare,天気・自然,Di notte ci sono molte zanzare in camera.,夜は部屋に蚊がたくさんいます。,夏の旅行で役立つ語。蚊よけは repellente per zanzare、蚊に刺された跡は puntura di zanzara。,,森と生きもの
L3-0387,3,l'ape,ミツバチ|蜂,noun,f,api,天気・自然,Un'ape è entrata dalla finestra.,ミツバチが窓から入ってきた。,複数形は api。母音で始まる女性名詞なので冠詞は l'、不定冠詞は un'。蜂蜜は il miele、スズメバチは la vespa。,,森と生きもの
L3-0206,3,l'ombra,日陰|影,noun,f,ombre,天気・自然,Cerchiamo un posto all'ombra.,日陰の場所を探しましょう。,all'ombra は「日陰で」。ombra は「日陰」と、人や物が地面などに落とす「影」の両方に使う。,,森と生きもの
L3-0207,3,l'ombrellone,ビーチパラソル|パラソル,noun,m,ombrelloni,天気・自然,Vorrei noleggiare un ombrellone e due lettini.,パラソル1本とビーチベッド2台を借りたいのですが。,海水浴場で借りる大型の日よけ。雨傘は ombrello、日傘は ombrellino や parasole。母音で始まるので単数は l'ombrellone。,,森と生きもの
L3-0732,3,pescare,釣る|魚を捕る,verb,,"pesco, peschi, pesca, peschiamo, pescate, pescano",天気・自然,Mi piace pescare nel lago la domenica.,日曜日に湖で釣りをするのが好きです。,"語幹が -c で終わるので、peschi, pescheremo のように e/i の前で h が入る。andare a pescare で「釣りに行く」。",,森と生きもの
L3-0635,3,la previsione,予報|予測,noun,f,previsioni,天気・自然,Le previsioni dicono che domani piove.,予報では明日は雨だそうです。,天気予報は le previsioni del tempo と複数形で言うのが普通。単数は「予測」の意味でも使う。,,天気予報
L3-0377,3,soleggiato,晴れた|日当たりのよい,adj,,"soleggiata, soleggiati, soleggiate",天気・自然,Oggi è una giornata soleggiata.,今日は晴れた日です。,天気は Il cielo è sereno や C'è il sole とも言う。部屋や場所の日当たりのよさにも使う。,,天気予報
L3-0749,3,sereno,晴れた|澄んだ|穏やかな,adj,,"serena, sereni, serene",天気・自然,Domani il cielo sarà sereno.,明日は空が晴れるでしょう。,空や天気に使う。人や気持ちが「穏やか・落ち着いた」の意味でも使える。,,天気予報
L3-0357,3,ventoso,風の強い|風の多い,adj,,"ventosa, ventosi, ventose",天気・自然,Oggi è una giornata molto ventosa.,今日はとても風の強い日です。,天気を言うときは Tira vento. や C'è vento. もよく使う。,,天気予報
L3-0485,3,la tempesta,嵐|暴風雨,noun,f,tempeste,天気・自然,"Stasera arriva una tempesta, restiamo in albergo.",今夜は嵐が来るので、ホテルにいましょう。,海や山の荒天にも使う。比喩的に「大騒ぎ」の意味でも使う。雷雨は temporale。,,天気予報
L3-0486,3,il temporale,雷雨|嵐,noun,m,temporali,天気・自然,Stasera c'è un temporale in arrivo.,今夜は雷雨が近づいています。,雷を伴う短時間の激しい雨。tempesta は海の嵐など、より大規模なもの。,,天気予報
L3-0770,3,il fulmine,稲妻|雷,noun,m,fulmini,天気・自然,Ho visto un fulmine durante il temporale.,嵐のとき、稲妻を見ました。,光る稲妻が fulmine、雷鳴は tuono。lampo は閃光で、落雷は fulmine を使う。,,天気予報
L3-0343,3,il tramonto,日没|夕焼け,noun,m,tramonti,天気・自然,Il tramonto sul mare è bellissimo.,海の夕日はとても美しい。,太陽が沈む時刻にも、その時間帯の夕焼けの景色にも使う。反対語は l'alba（夜明け）。,,天気予報
L3-0667,3,il terremoto,地震,noun,m,terremoti,天気・自然,Ieri c'è stato un terremoto vicino a Roma.,昨日、ローマの近くで地震がありました。,sisma も「地震」だが主に報道用語。揺れそのものは scossa（余震は scossa di assestamento）。,il sisma,天気予報
L3-0374,3,secco,乾燥した|乾いた|辛口の（ワインの）,adj,,"secca, secchi, secche",天気・自然,"Vorrei un vino bianco secco, per favore.",辛口の白ワインをお願いします。,"複数形は secchi, secche（-chi, -che）。ワインでは「辛口」、frutta secca は「ナッツ・ドライフルーツ」。",asciutto,天気予報
L3-0145,3,bagnato,濡れた|湿った,adj,,"bagnata, bagnati, bagnate",天気・自然,Ho i capelli bagnati per la pioggia.,雨で髪が濡れています。,動詞 bagnare（濡らす）の過去分詞から。「びしょ濡れ」は bagnato fradicio と言う。,,天気予報
L3-0787,3,bagnare,濡らす|湿らせる,verb,,"bagno, bagni, bagna, bagniamo, bagnate, bagnano",天気・自然,"Non bagnare il pavimento, per favore.",床を濡らさないでください。,再帰形 bagnarsi は「濡れる」「水浴びする」。海が町を洗う意味でも使う。,,天気予報
L3-0564,3,asciutto,乾いた|乾燥した,adj,,"asciutta, asciutti, asciutte",天気・自然,I panni sono già asciutti.,洗濯物はもう乾いています。,pasta asciutta は汁気のないパスタ料理。clima asciutto は乾燥した気候。,secco,天気予報
L3-0011,3,la spalla,肩,noun,f,spalle,体・健康,Mi fa male la spalla destra.,右肩が痛いです。,複数 spalle は「背中、背後」の意味でも使う（alle spalle di は「〜の背後に」）。体の部位の所有は冠詞で示し、所有形容詞は通常不要。,,体の部分
L3-0219,3,il petto,胸,noun,m,petti,体・健康,Ho un dolore al petto.,胸が痛いです。,複数形は regolare に i petti。乳房は seno、胸部の前面を指す。鶏の胸肉は petto di pollo。,,体の部分
L3-0176,3,la fronte,額|おでこ,noun,f,fronti,体・健康,"Ho un po' di febbre, la fronte è calda.",少し熱があって、額が熱いです。,il fronte と男性名詞になると「前線、戦線」の意味。女性の la fronte は身体の額。,,体の部分
L3-0080,3,il labbro,唇,noun,m,"le labbra, i labbri",体・健康,Ho le labbra secche per il freddo.,寒さで唇が乾燥しています。,複数形は不規則で、体の唇は le labbra（女性複数）が普通。i labbri は容器や傷口の縁などに使う。,,体の部分
L3-0369,3,il mento,あご|あご先,noun,m,menti,体・健康,Mi fa male il mento.,あごが痛いです。,mento は下あご先の部分。あご全体や顎の骨は mascella や mandibola。,,体の部分
L3-0515,3,il gomito,肘,noun,m,i gomiti,体・健康,Mi fa male il gomito destro.,右の肘が痛いです。,複数形は規則的に i gomiti（男性）。体の部位は所有形容詞を付けず定冠詞を使うのが普通。,,体の部分
L3-0524,3,il pollice,親指|インチ,noun,m,pollici,体・健康,Mi sono fatto male al pollice.,親指をけがしました。,手の親指を指す語。足の親指は alluce。長さの単位「インチ」の意味もある。,,体の部分
L3-0761,3,l'unghia,爪,noun,f,unghie,体・健康,Devo tagliarmi le unghie.,爪を切らなければいけません。,手足どちらの爪にも使う。複数形は unghie（-ia から -ie）。,,体の部分
L3-0726,3,il muscolo,筋肉,noun,m,muscoli,体・健康,Ho dolore a un muscolo della gamba.,脚の筋肉が痛いです。,複数形は i muscoli（規則的な男性複数）。運動後の痛みは dolori muscolari とも言う。,,体の部分
L3-0798,3,il cervello,脳|頭脳,noun,m,"i cervelli, le cervella",体・健康,Il cervello controlla tutto il corpo.,脳は体全体を制御しています。,複数は普通 i cervelli で、「頭脳（優れた人材）」の意味でもこれを使う（fuga di cervelli＝頭脳流出）。le cervella は脳みそという物質を指す集合的な女性複数で、料理や farsi saltare le cervella（頭を撃ち抜く）などの表現で使う。,,体の部分
L3-0716,3,l'intestino,腸,noun,m,intestini,体・健康,"Ho mal di pancia, forse è l'intestino.",お腹が痛いです、たぶん腸のせいです。,intestino tenue は小腸、intestino crasso は大腸。母音で始まるので冠詞は l'。,,体の部分
L3-0741,3,il respiro,呼吸|息,noun,m,respiri,体・健康,Ho il respiro corto dopo le scale.,階段を上ると息が切れます。,一回ごとの息や呼吸の状態を指す。動詞は respirare。「息切れ」は avere il fiato corto とも言う。,la respirazione,体の部分
L3-0032,3,il raffreddore,風邪|鼻風邪,noun,m,raffreddori,体・健康,Ho il raffreddore e un po' di tosse.,風邪をひいていて、少し咳が出ます。,「風邪をひいている」は avere il raffreddore。「風邪をひく」は prendere il raffreddore。主に鼻水・鼻づまりなど鼻の症状が中心の軽い風邪を指す。,,症状を伝える
L3-0646,3,raffreddarsi,風邪をひく|冷える,verb,,"mi raffreddo, ti raffreddi, si raffredda, ci raffreddiamo, vi raffreddate, si raffreddano",体・健康,Mi sono raffreddato in montagna.,山で風邪をひいてしまった。,再帰動詞なので近過去は essere（mi sono raffreddato/a）。「冷める」の意味でも使い、スープなどが主語になる。,,症状を伝える
L3-0503,3,ammalarsi,病気になる|体調を崩す,verb,,"mi ammalo, ti ammali, si ammala, ci ammaliamo, vi ammalate, si ammalano",体・健康,Mi sono ammalato la settimana scorsa.,先週、私は病気になりました。,再帰動詞なので近過去は essere を使う（mi sono ammalato/a）。「病気である」は essere malato。,,症状を伝える
L3-0189,3,l'influenza,インフルエンザ|影響,noun,f,influenze,体・健康,Ho l'influenza e rimango a casa.,インフルエンザにかかったので家にいます。,「風邪」は raffreddore。「影響」の意味でも使う（avere influenza su）。,la grippe,症状を伝える
L3-0200,3,il mal di gola,のどの痛み|喉の痛み,noun,m,,体・健康,Ho mal di gola da due giorni.,2日前からのどが痛いです。,「のどが痛い」は avere mal di gola のように冠詞なしで言うのが普通。mal di testa（頭痛）、mal di pancia（腹痛）なども同型。歯痛は mal di denti と複数形になる。,il dolore alla gola,症状を伝える
L3-0303,3,il mal di schiena,腰痛|背中の痛み,noun,m,i mal di schiena,体・健康,Ho un forte mal di schiena da ieri.,昨日からひどい腰痛があります。,avere mal di ... で「〜が痛い」。mal di testa（頭痛）、mal di denti（歯痛）など。複数形は通常 mal の形が変わらない。,,症状を伝える
L3-0205,3,la nausea,吐き気|むかつき,noun,f,nausee,体・健康,Ho la nausea e mal di testa.,吐き気と頭痛があります。,「吐き気がする」は avere la nausea。薬局や病院で症状を伝えるときに使う。,,症状を伝える
L3-0675,3,vomitare,吐く|嘔吐する,verb,,"vomito, vomiti, vomita, vomitiamo, vomitate, vomitano",体・健康,Ho mal di stomaco e mi viene da vomitare.,胃が痛くて、吐きそうです。,近過去は avere を助動詞にとる（ho vomitato）。「吐きそう」は avere voglia di vomitare や ho la nausea とも言う。,,症状を伝える
L3-0585,3,la diarrea,下痢,noun,f,複数 le diarree（通常は単数）,体・健康,Ho la diarrea da ieri sera.,昨日の夜から下痢をしています。,症状は avere la diarrea で表す。通常は単数形で使う。,,症状を伝える
L3-0341,3,tossire,咳をする|咳が出る,verb,,"tossisco, tossisci, tossisce, tossiamo, tossite, tossiscono",体・健康,Ho il raffreddore e tossisco molto.,風邪をひいていて、咳がたくさん出ます。,-isco型の動詞。名詞の「咳」は la tosse。「咳が出る」は avere la tosse とも言う。,,症状を伝える
L3-0661,3,starnutire,くしゃみをする,verb,,"starnutisco, starnutisci, starnutisce, starnutiamo, starnutite, starnutiscono",体・健康,Ho il raffreddore e starnutisco tutto il giorno.,風邪をひいていて、一日中くしゃみが出ます。,-isc- 型の動詞。名詞は lo starnuto（くしゃみ）。近過去は avere を助動詞にとる（ho starnutito）。,,症状を伝える
L3-0339,3,sudare,汗をかく,verb,,"sudo, sudi, suda, sudiamo, sudate, sudano",体・健康,"Quando fa caldo, sudo molto.",暑いときは、たくさん汗をかきます。,名詞は il sudore（汗）。「冷や汗をかく」は sudare freddo と言う。,,症状を伝える
L3-0528,3,la pressione,血圧|圧力,noun,f,pressioni,体・健康,Ho la pressione alta e prendo una medicina.,血圧が高いので薬を飲んでいます。,血圧は pressione（del sangue）。「血圧が高い・低い」は avere la pressione alta / bassa。,,症状を伝える
L3-0253,3,il termometro,体温計|温度計,noun,m,termometri,体・健康,Hai un termometro? Credo di avere la febbre.,体温計を持っている？熱があると思う。,-o で終わる規則的な男性名詞。体温計にも、気温などを測る温度計にも同じ語を使う。,,症状を伝える
L3-0497,3,il virus,ウイルス,noun,m,virus（不変）,体・健康,Questo virus è molto contagioso.,このウイルスはとても感染力が強い。,語尾が -us の外来語で複数形も同形。冠詞は複数で i virus。,,症状を伝える
L3-0288,3,la ferita,傷|けが,noun,f,ferite,体・健康,Ho una ferita sulla mano.,手に傷があります。,切り傷・刺し傷など体の外傷を指す。心の傷も比喩で使える。動詞 ferire（傷つける）の過去分詞が名詞化した語。,,けがと治療
L3-0414,3,ferirsi,怪我をする|負傷する,verb,,"mi ferisco, ti ferisci, si ferisce, ci feriamo, vi ferite, si feriscono",体・健康,Mi sono ferito al piede ieri.,昨日、足を怪我しました。,再帰動詞で、近過去は essere を使う（mi sono ferito/a）。-isc- 型の活用。傷つけるのは ferire。,farsi male,けがと治療
L3-0415,3,ferito,怪我をした|負傷した,adj,,"ferita, feriti, ferite",体・健康,Il mio amico è ferito a una gamba.,私の友達は脚を怪我しています。,ferire の過去分詞から来た形容詞。名詞では「負傷者」（il ferito）。体の部位は a を使う。,,けがと治療
L3-0650,3,rompersi,折れる|壊れる|（体の部位を）骨折する,verb,,"mi rompo, ti rompi, si rompe, ci rompiamo, vi rompete, si rompono（過去分詞 rotto）",体・健康,Mi sono rotto il braccio sciando.,スキーをしていて腕を骨折しました。,再帰動詞。過去分詞は不規則で、近過去は essere を使う。体の部位は定冠詞で、mi sono rotto la gamba のように言う。,,けがと治療
L3-0570,3,la caduta,転倒|落下|転落|崩壊・失脚,noun,f,cadute,体・健康,Ho avuto una brutta caduta sulle scale.,階段でひどく転んでしまいました。,動詞 cadere（落ちる・倒れる）から派生した名詞。人や物が落ちる・転ぶことのほか、la caduta della neve（降雪）や政権の崩壊、価格の下落などにも使う。,,けがと治療
L3-0788,3,la benda,包帯|目隠し,noun,f,bende,体・健康,Il dottore mi mette una benda sul braccio.,医者が私の腕に包帯を巻いてくれます。,傷に巻く包帯。ガーゼは garza、絆創膏は cerotto。目隠しの意味でも使う。,la fasciatura,けがと治療
L3-0734,3,la pomata,軟膏|塗り薬,noun,f,pomate,体・健康,Ho bisogno di una pomata per la schiena.,背中に塗る軟膏が必要です。,薬局（farmacia）で使う語。crema は保湿クリームなど、pomata は薬用の軟膏を指すことが多い。,,けがと治療
L3-0221,3,la pillola,錠剤|ピル,noun,f,pillole,体・健康,Devo prendere una pillola dopo cena.,夕食後に錠剤を1錠飲まなければなりません。,la pillola だけで「経口避妊薬」を指すことも多い。薬一般は medicina、錠剤は compressa も使う。,la compressa,けがと治療
L3-0626,3,la pastiglia,錠剤|トローチ|のど飴,noun,f,pastiglie,体・健康,Prendo una pastiglia dopo cena.,夕食のあとに錠剤を1錠飲みます。,薬の錠剤は pastiglia のほか compressa もよく使う。のど用は pastiglie per la gola。,la compressa,けがと治療
L3-0430,3,il medicinale,薬|医薬品,noun,m,medicinali,体・健康,Questo medicinale si prende due volte al giorno.,この薬は1日2回服用します。,medicina や farmaco も「薬」。medicinale はやや改まった語で、薬局や説明書で使われる。,il farmaco,けがと治療
L3-0594,3,fare una visita medica,診察を受ける|健康診断を受ける,phrase,,,体・健康,Domani devo fare una visita medica.,明日は診察を受けなければなりません。,fare は「行う」の意で、受ける側にも使う。医者が診察する場合は visitare。「予約する」は prenotare una visita。,farsi visitare,けがと治療
L3-0561,3,l'analisi,検査|分析,noun,f,analisi（不変）,体・健康,Domani devo fare le analisi del sangue.,明日、血液検査を受けなければなりません。,-i で終わる女性名詞は複数形も同形。医療では le analisi で「検査」。血液検査は analisi del sangue。,,けがと治療
L3-0348,3,la clinica,クリニック|診療所|病院（民間の）,noun,f,cliniche,体・健康,La clinica è aperta fino alle sei.,クリニックは6時まで開いています。,複数形は cliniche（硬い c の音を保つため h を入れて -che）。公立の大きな病院は ospedale、民間の医療施設は clinica が多い。,,けがと治療
L3-0094,3,il pronto soccorso,救急外来|（病院の）救急部門,noun,m,pronto soccorso（不変）,体・健康,"Devo andare al pronto soccorso, mi fa male il braccio.",救急外来に行かないと。腕が痛いんです。,複数形も語形は不変（i pronto soccorso）。救急車を呼ぶ番号は118。病院そのものは ospedale。,,けがと治療
L3-0811,3,la cura,治療|世話|手入れ,noun,f,cure,体・健康,Il medico mi ha dato una nuova cura.,医者は私に新しい治療法を処方してくれました。,avere cura di ~ で「~を大切にする、気を配る」。薬による治療・療法の意味でも使う。,la terapia,けがと治療
L3-0700,3,curarsi,治療を受ける|養生する|体をいたわる,verb,,"mi curo, ti curi, si cura, ci curiamo, vi curate, si curano",体・健康,"Devi curarti, hai la febbre alta.",ちゃんと治療しないと。熱が高いよ。,再帰動詞。近過去は essere を使う（mi sono curato/a）。curare は「治療する」、curarsi di は「〜に気を配る」の意味もある。,,けがと治療
L3-0603,3,guarire,治る|治す,verb,,"guarisco, guarisci, guarisce, guariamo, guarite, guariscono",体・健康,Spero di guarire presto.,早く治るといいのですが。,-isco 型の動詞。自動詞（治る）は essere、他動詞（治す）は avere を助動詞にとる。,,けがと治療
L3-0362,3,la dieta,ダイエット|食事療法,noun,f,diete,体・健康,Da lunedì sono a dieta.,月曜日からダイエット中です。,「ダイエット中」は essere a dieta や fare la dieta。「食事制限」の意味が基本で、体重減だけを指すとは限らない。,,食生活・眠り・運動
L3-0394,3,la caloria,カロリー,noun,f,calorie,体・健康,Questo dolce ha molte calorie.,このお菓子はカロリーが高いです。,「カロリーが高い／低い」は molte／poche calorie、alto／basso contenuto calorico とも言う。,,食生活・眠り・運動
L3-0345,3,la vitamina,ビタミン,noun,f,vitamine,体・健康,Mi servono delle vitamine per l'inverno.,冬に備えてビタミンが必要です。,複数形は vitamine。ビタミンCは vitamina C と言う。,,食生活・眠り・運動
L3-0762,3,vegano,ヴィーガンの|完全菜食主義の,adj,,"vegana, vegani, vegane",体・健康,Ho un amico vegano e non mangia formaggio.,私にはヴィーガンの友人がいて、チーズを食べません。,"名詞としても使う（un vegano, una vegana）。vegetariano は肉・魚を避けるが、卵や乳製品は食べる人も含む。",,食生活・眠り・運動
L3-0720,3,magro,痩せた|細い,adj,,"magra, magri, magre",体・健康,Mio fratello è alto e magro.,私の兄は背が高くて痩せています。,肉や牛乳などでは「脂肪の少ない」の意味にもなる。比較的ストレートな表現なので、人には snello（すらりとした）も使う。,,食生活・眠り・運動
L3-0291,3,il grasso,脂肪|脂身|油脂,noun,m,grassi,体・健康,Non mangio il grasso della carne.,私は肉の脂身は食べません。,形容詞 grasso は「太った、脂っこい」。料理では「脂身」、体では「脂肪」。「低脂肪」は a basso contenuto di grassi。,,食生活・眠り・運動
L3-0111,3,il sonno,眠気|睡眠|眠り,noun,m,sonni,体・健康,"Ho molto sonno, vado a letto.",とても眠いので、寝ます。,avere sonno で「眠い」。il sonno は「眠気」のほか「眠り・睡眠」も表す。動詞 dormire は「眠る」、il riposo は「休息」。複数形はほぼ使わない。,,食生活・眠り・運動
L3-0249,3,stancarsi,疲れる,verb,,"mi stanco, ti stanchi, si stanca, ci stanchiamo, vi stancate, si stancano",体・健康,Mi stanco subito quando cammino in salita.,上り坂を歩くとすぐに疲れます。,再帰動詞で近過去は essere を使う（mi sono stancato/a）。状態「疲れている」は essere stanco。tu の活用は stanchi（h を入れる）。,,食生活・眠り・運動
L3-0472,3,sdraiarsi,横になる|寝そべる,verb,,"mi sdraio, ti sdrai, si sdraia, ci sdraiamo, vi sdraiate, si sdraiano",体・健康,Mi sdraio un po' sul divano.,ソファで少し横になります。,再帰動詞なので近過去は essere を使う（mi sono sdraiato/a）。,stendersi,食生活・眠り・運動
L3-0778,3,addormentarsi,寝入る|眠りにつく,verb,,"mi addormento, ti addormenti, si addormenta, ci addormentiamo, vi addormentate, si addormentano",体・健康,Ieri sera mi sono addormentato subito.,昨日の夜はすぐに寝入ってしまった。,再帰動詞なので近過去は essere を使う（mi sono addormentato/a）。「寝る」の dormire は状態、こちらは寝入る瞬間。,,食生活・眠り・運動
L3-0464,3,il riposo,休息|休養,noun,m,riposi,体・健康,Dopo il viaggio ho bisogno di riposo.,旅行のあとは休息が必要です。,動詞 riposare（休む）の名詞形。giorno di riposo は「休業日・休日」の意味で店の掲示にもよく出る。,,食生活・眠り・運動
L3-0231,3,rilassarsi,リラックスする|くつろぐ,verb,,"mi rilasso, ti rilassi, si rilassa, ci rilassiamo, vi rilassate, si rilassano",体・健康,Dopo il lavoro mi rilasso sul divano.,仕事のあとはソファでくつろぎます。,再帰動詞なので近過去は essere を使う（mi sono rilassato/a）。命令形は Rilassati! / Si rilassi!（丁寧）。,,食生活・眠り・運動
L3-0742,3,rilassato,くつろいだ|リラックスした,adj,,"rilassata, rilassati, rilassate",体・健康,Dopo la doccia mi sento molto rilassato.,シャワーを浴びた後、とてもリラックスしています。,動詞 rilassare の過去分詞から来た形容詞。再帰動詞 rilassarsi（くつろぐ）と一緒に覚えると便利。,,食生活・眠り・運動
L3-0780,3,allenarsi,トレーニングする|練習する,verb,,"mi alleno, ti alleni, si allena, ci alleniamo, vi allenate, si allenano",体・健康,Mi alleno in palestra tre volte a settimana.,私は週に3回ジムでトレーニングします。,再帰動詞。近過去は essere を使う（mi sono allenato/a）。他動詞 allenare は「(人を)鍛える」。,,食生活・眠り・運動
L3-0660,3,la squadra,チーム|班,noun,f,squadre,体・健康,La nostra squadra lavora molto bene insieme.,私たちのチームはとても息がぴったりです。,スポーツのチームにも仕事の班にも使う。サッカーの代表チームは la nazionale。,,食生活・眠り・運動
L3-0599,3,il giocatore,選手|プレーヤー,noun,m,i giocatori,体・健康,Il giocatore più bravo della squadra è mio fratello.,チームで一番上手な選手は私の兄です。,女性形は la giocatrice（複数 le giocatrici）。giocare（遊ぶ、競技する）から派生。賭け事をする人は giocatore d'azzardo と言う。,,食生活・眠り・運動
L3-0659,3,sportivo,スポーティーな|スポーツの|運動好きな,adj,,"sportiva, sportivi, sportive",体・健康,"Cerco una giacca sportiva, non troppo elegante.",あまりエレガントすぎない、スポーティーなジャケットを探しています。,名詞として使うと「スポーツ選手、スポーツ好きの人」の意味にもなる。abbigliamento sportivo はスポーツウェア、カジュアルな服。,,食生活・眠り・運動
L3-0169,3,l'emergenza,緊急事態|非常事態,noun,f,emergenze,トラブル・緊急,"In caso di emergenza, chiami questo numero.",緊急の場合は、この番号に電話してください。,in caso di emergenza は「緊急時には」。uscita di emergenza は「非常口」。pronto soccorso は救急の窓口。,,緊急と事件
L3-0255,3,urgente,緊急の|急を要する,adj,,urgenti,トラブル・緊急,"Ho bisogno di un medico, è urgente.",医者が必要です、緊急です。,-e 形容詞で男女同形。複数は urgenti。名詞 l'urgenza（緊急）や pronto soccorso（救急）とあわせて覚えると便利。,,緊急と事件
L3-0766,3,l'allarme,警報|アラーム,noun,m,allarmi,トラブル・緊急,L'allarme suona di notte.,夜に警報が鳴ります。,-e で終わるが男性名詞。dare l'allarme は「警報を発する」、falso allarme は「誤報」。,,緊急と事件
L3-0730,3,il panico,パニック|恐慌,noun,m,panici（稀）,トラブル・緊急,"Quando ho visto il ragno, sono andato nel panico.",クモを見て、私はパニックになった。,通常は不可算で、複数形はほとんど使われない。essere in preda al panico（パニックに陥っている）、farsi prendere dal panico（パニックに襲われる）が定番。andare nel panico は日常会話でよく使われる表現。,,緊急と事件
L3-0072,3,il fumo,煙|喫煙,noun,m,fumi,トラブル・緊急,Il fumo fa male alla salute.,喫煙は健康に悪い。,「煙」と「喫煙（習慣）」の両方を表す。divieto di fumo は「禁煙」。複数形はあまり使わない。,,緊急と事件
L3-0359,3,bruciare,燃える|燃やす|焼く|焦がす,verb,,"brucio, bruci, brucia, bruciamo, bruciate, bruciano",トラブル・緊急,"Attenzione, la pasta brucia!",気をつけて、パスタが焦げるよ！,他動詞は「燃やす」、自動詞は「燃える」。近過去は他動詞が avere、自動詞は基本的に essere（la casa è bruciata）。「ひりひりする」の意味でも使う。,,緊急と事件
L3-0081,3,il ladro,泥棒,noun,m,ladri,トラブル・緊急,Al ladro! Mi ha rubato la borsa!,泥棒！バッグを盗まれた！,女性は la ladra（複数 le ladre）。スリは borseggiatore、強盗は rapinatore と区別する。,,緊急と事件
L3-0822,3,il furto,盗難|窃盗,noun,m,furti,トラブル・緊急,Vorrei denunciare un furto.,盗難を届け出たいのですが。,人を指す「泥棒」は il ladro。ひったくりは lo scippo、強盗は la rapina と区別する。,,緊急と事件
L3-0577,3,il commissariato,警察署,noun,m,commissariati,トラブル・緊急,Dov'è il commissariato più vicino?,一番近い警察署はどこですか？,市街地の警察署（国家警察）。盗難届は fare la denuncia。carabinieri の駐屯所は caserma という。,,緊急と事件
L3-0469,3,scappare,逃げる|逃走する,verb,,"scappo, scappi, scappa, scappiamo, scappate, scappano",トラブル・緊急,Il ladro è scappato con la mia borsa.,泥棒が私のバッグを持って逃げました。,近過去は essere を助動詞にとる（è scappato/a）。scappare da で「〜から逃げる」。,fuggire,緊急と事件
L3-0467,3,salvare,救う|助ける,verb,,"salvo, salvi, salva, salviamo, salvate, salvano",トラブル・緊急,Il bagnino ha salvato un bambino in mare.,監視員が海で子どもを救助しました。,近過去は avere を助動詞にとる。再帰形 salvarsi は「助かる、逃げ延びる」。データの保存（salvare un file）にも使う。,,緊急と事件
L3-0489,3,uccidere,殺す,verb,,"uccido, uccidi, uccide, uccidiamo, uccidete, uccidono（過去分詞 ucciso）",トラブル・緊急,"Le zanzare non mi lasciano dormire, vorrei ucciderle.",蚊のせいで眠れないので、殺してしまいたい。,過去分詞 ucciso が不規則。再帰形 uccidersi は「自殺する」。事故の「死ぬ」は morire。,ammazzare,緊急と事件
L3-0077,3,la guerra,戦争|戦い,noun,f,guerre,トラブル・緊急,Mio nonno ricorda ancora la guerra.,祖父は今でも戦争を覚えています。,「戦争をする」は fare la guerra。la prima guerra mondiale（第一次世界大戦）のように序数と使う。,,緊急と事件
L3-0208,3,la pace,平和|安らぎ,noun,f,paci,トラブル・緊急,Tutti vogliamo la pace nel mondo.,私たちは皆、世界の平和を望んでいます。,複数形 paci はあまり使わない。lasciare in pace（そっとしておく）、fare pace（仲直りする）などの表現がある。,,緊急と事件
L3-0144,3,l'azienda,会社|企業,noun,f,aziende,仕事・学校,Lavoro in un'azienda molto grande.,私はとても大きな会社で働いています。,組織としての会社・企業を指す。società は法人としての会社（株式会社など）、azienda は事業を営む組織。ditta や impresa も近い意味。,la ditta,会社で働く
L3-0683,3,l'impiegato,会社員|事務員|従業員,noun,m,impiegati,仕事・学校,Mio padre è impiegato in una banca.,父は銀行員です。,女性は l'impiegata（複数 le impiegate）。職業を言うとき essere の後では冠詞を省くのが普通。,,会社で働く
L3-0606,3,il lavoratore,労働者|働く人,noun,m,"i lavoratori, le lavoratrici",仕事・学校,Molti lavoratori prendono il treno la mattina.,多くの労働者が朝に電車に乗ります。,女性形は la lavoratrice。形容詞としては「働き者の」の意味でも使う。,,会社で働く
L3-0543,3,il capo,上司|長|ボス,noun,m,capi,仕事・学校,Il mio capo è molto gentile.,私の上司はとても親切です。,「頭」「岬」の意味もある。複数形は capi。女性の上司にも il capo が使われることが多く、口語では la capa と言うこともある。,il boss,会社で働く
L3-0064,3,il direttore,支配人|部長|校長,noun,m,direttori,仕事・学校,Vorrei parlare con il direttore dell'albergo.,ホテルの支配人とお話ししたいのですが。,女性は la direttrice（複数 le direttrici）。組織の長を広く指し、ホテル・学校・会社などで使う。,,会社で働く
L3-0226,3,il/la presidente,社長|大統領|議長,noun,mf,"i presidenti, le presidenti",仕事・学校,Il presidente arriva domani mattina.,社長は明日の朝に到着します。,-e で終わり男女同形。女性も la presidente が一般的で、presidentessa はやや古風。複数は男女とも presidenti。,,会社で働く
L3-0655,3,il segretario,秘書|書記,noun,m,i segretari,仕事・学校,Il segretario risponde al telefono e prende gli appuntamenti.,秘書は電話に出て、予約を取ります。,女性は la segretaria（複数 le segretarie）。,,会社で働く
L3-0388,3,l'assistente,助手|アシスタント,noun,mf,"gli assistenti, le assistenti",仕事・学校,L'assistente del professore risponde alle email.,教授の助手がメールに返信します。,語尾は -e だが男女同形。複数は男性 assistenti、女性 assistenti で同形。assistente di volo は客室乗務員。,,会社で働く
L3-0553,3,la riunione,会議|ミーティング|集まり,noun,f,riunioni,仕事・学校,Domani ho una riunione importante alle nove.,明日の9時に大事な会議があります。,仕事の会議の定番語。友人などの集まりにも使える。「会議に出る」は partecipare a una riunione。,,会社で働く
L3-0319,3,il progetto,計画|プロジェクト,noun,m,progetti,仕事・学校,Domani presento il mio progetto al capo.,明日、上司に私の企画を発表します。,progettare（計画する、設計する）は関連する動詞。piano も「計画」だが、予定や段取りに近い。,,会社で働く
L3-0087,3,organizzare,企画する|手配する|組織する,verb,,"organizzo, organizzi, organizza, organizziamo, organizzate, organizzano",仕事・学校,Domani organizziamo una cena con gli amici.,明日、友達と夕食会を企画します。,旅行・会合・イベントなどを手配する意味でよく使う。再帰形 organizzarsi は「自分の予定を整える」。,,会社で働く
L3-0638,3,la professione,職業|専門職,noun,f,professioni,仕事・学校,Qual è la tua professione?,あなたの職業は何ですか？,-sione・-zione で終わる名詞は女性名詞。「職業」を尋ねる定番表現。くだけた会話では lavoro もよく使う。,il mestiere,会社で働く
L3-0187,3,impegnato,忙しい|手がふさがっている,adj,,"impegnata, impegnati, impegnate",仕事・学校,"Mi dispiace, oggi sono molto impegnato.",すみません、今日はとても忙しいんです。,予定や仕事で手が離せない意味。essere impegnato/a で「予定がある」。『忙しい』全般は occupato も使う。,occupato,会社で働く
L3-0662,3,lo stipendio,給料|給与,noun,m,stipendi,仕事・学校,Lo stipendio arriva alla fine del mese.,給料は月末に振り込まれます。,s＋子音で始まるので冠詞は lo。複数は gli stipendi。時給・日給は paga、報酬全般は retribuzione。,il salario,会社で働く
L3-0292,3,guadagnare,稼ぐ|得る|勝ち取る,verb,,"guadagno, guadagni, guadagna, guadagniamo, guadagnate, guadagnano",仕事・学校,Mio fratello guadagna bene in questa azienda.,兄はこの会社でたくさん稼いでいます。,guadagnare tempo は「時間を稼ぐ」。guadagnarsi da vivere は「生計を立てる」。-gn- の後では tu と noi の i が重ならない。,,会社で働く
L3-0653,3,lo sciopero,ストライキ|スト,noun,m,scioperi,仕事・学校,Domani c'è lo sciopero dei treni.,明日は列車のストライキがあります。,s＋子音で始まるので冠詞は lo、複数は gli scioperi。「スト中である」は essere in sciopero。,,会社で働く
L3-0143,3,l'avvocato,弁護士,noun,m,複数: gli avvocati / 女性形: l'avvocata (複数: le avvocate),仕事・学校,Ho bisogno di un avvocato.,弁護士が必要です。,女性の弁護士は l'avvocata。複数形は gli avvocati（男性・混合）、le avvocate（女性のみ）。,,いろいろな職業
L3-0771,3,l'ingegnere,エンジニア|技師,noun,mf,gli ingegneri（女性複数: le ingegnere）,仕事・学校,Mio fratello è ingegnere e lavora a Torino.,兄はエンジニアで、トリノで働いています。,男性形は ingegnere。女性を指すときは la ingegnere のほか ingegnera も使われる。職業を言うときは冠詞なしが普通。,,いろいろな職業
L3-0306,3,il meccanico,整備士|修理工,noun,m,i meccanici,仕事・学校,Il meccanico controlla la macchina oggi.,整備士が今日、車を点検します。,機械の整備士で、特に自動車の修理工を指すことが多い。女性は la meccanica と言うが、「機械工学・力学」の意味の語と同形で紛らわしい。,,いろいろな職業
L3-0601,3,il/la giornalista,ジャーナリスト|記者,noun,mf,"i giornalisti, le giornaliste",仕事・学校,Mia sorella è giornalista e lavora a Roma.,姉は記者で、ローマで働いています。,語尾は -a だが男女同形。複数は男性 giornalisti、女性 giornaliste。職業名は冠詞なしで使う。,,いろいろな職業
L3-0368,3,la maestra,先生（小学校の）|（小学校の）女性教師,noun,f,maestre,仕事・学校,La maestra di mio figlio è molto gentile.,息子の先生はとても親切です。,男性形は il maestro（複数 i maestri）。小学校の先生を指すことが多い。中高の先生は professoressa。,,いろいろな職業
L3-0774,3,il postino,郵便配達員|郵便屋さん,noun,m,postini,仕事・学校,Il postino arriva ogni mattina alle dieci.,郵便配達員は毎朝10時に来ます。,女性は la postina。郵便局は l'ufficio postale、郵便物は la posta。,il portalettere,いろいろな職業
L3-0633,3,il/la pompiere,消防士,noun,mf,pompieri,仕事・学校,Il pompiere spegne il fuoco nel palazzo.,消防士がビルの火を消します。,緊急電話は 115（vigili del fuoco）。複数形は pompieri。,il vigile del fuoco,いろいろな職業
L3-0173,3,firmare,署名する|サインする,verb,,"firmo, firmi, firma, firmiamo, firmate, firmano",仕事・学校,"Può firmare qui, per favore?",ここに署名していただけますか？,規則動詞。書類や契約、カードの署名に使う。firmare un contratto は「契約書に署名する」。,,書類と手続き
L3-0682,3,la fattura,請求書|領収書（税務用の）,noun,f,fatture,仕事・学校,"Vorrei la fattura, per favore.",請求書（領収書）をお願いします。,fattura は税務上の正式な請求書・インボイス。会社だけでなく個人も codice fiscale を伝えれば発行してもらえる。レシートは scontrino や ricevuta。,,書類と手続き
L3-0560,3,l'agenda,手帳|予定表,noun,f,agende,仕事・学校,Scrivo l'appuntamento sull'agenda.,約束を手帳に書きます。,agenda は予定を書く手帳。英語の agenda（議題）の意味は普通 ordine del giorno。,,書類と手続き
L3-0440,3,la nota,メモ|注釈|音符,noun,f,note,仕事・学校,Scrivo una nota sul mio quaderno.,ノートにメモを書きます。,「メモ」は prendere nota（書き留める）が頻出。成績・点数は voto で、学校の nota は先生が書く注意・連絡の記録を指す。,l'appunto,書類と手続き
L3-0479,3,stampare,印刷する|プリントする,verb,,"stampo, stampi, stampa, stampiamo, stampate, stampano",仕事・学校,Posso stampare il biglietto qui?,ここで切符を印刷できますか？,規則動詞（-are）。他動詞で、近過去は avere を使う（ho stampato）。「スタンプを押す」は timbrare。,,書類と手続き
L3-0513,3,la fotocopia,コピー|複写,noun,f,fotocopie,仕事・学校,Può fare una fotocopia di questo documento?,この書類をコピーしていただけますか？,複数形は fotocopie（-ia → -ie の規則変化）。fare una fotocopia で「コピーを取る」。コピー機は la fotocopiatrice。,la copia,書類と手続き
L3-0019,3,la busta,封筒|袋,noun,f,buste,仕事・学校,Mi serve una busta per la lettera.,手紙用の封筒が必要です。,封筒も紙袋・ビニール袋も busta。店のレジ袋は sacchetto とも言う。,,書類と手続き
L3-0658,3,spedire,発送する|送る,verb,,"spedisco, spedisci, spedisce, spediamo, spedite, spediscono",仕事・学校,Vorrei spedire questo pacco in Giappone.,この荷物を日本に送りたいのですが。,-isc- 型の動詞。郵便や荷物を送るときに使う。mandare はより口語的で幅広い。,inviare,書類と手続き
L3-0300,3,inviare,送る|送信する,verb,,"invio, invii, invia, inviamo, inviate, inviano",仕事・学校,Ti invio il documento per email domani.,明日、書類をメールで送ります。,mandare より改まった語で、メールや書類、郵便によく使う。io invio のアクセントは vi の i に置く（invìo）。,mandare,書類と手続き
L3-0769,3,consegnare,配達する|引き渡す|提出する,verb,,"consegno, consegni, consegna, consegniamo, consegnate, consegnano",仕事・学校,Quando consegnate la spesa a domicilio?,食料品はいつ自宅に配達してくれますか？,規則動詞。近過去は avere を使う（ho consegnato）。書類や鍵を渡す、提出する場面でも使う。,,書類と手続き
L3-0552,3,ritirare,受け取る|引き取る|引き出す（お金を）,verb,,"ritiro, ritiri, ritira, ritiriamo, ritirate, ritirano",仕事・学校,Dove posso ritirare i bagagli?,荷物はどこで受け取れますか？,預けた物や注文品を受け取る時に使う。ritirare i soldi は「お金を下ろす」。規則動詞。,,書類と手続き
L3-0557,3,l'accordo,合意|協定|同意,noun,m,accordi,仕事・学校,Abbiamo trovato un accordo sul prezzo.,私たちは価格について合意に達しました。,D'accordo! は「了解！」「いいよ」。essere d'accordo con は「〜に賛成だ」。音楽では「和音」の意味もある。,,書類と手続き
L3-0412,3,la fabbrica,工場,noun,f,fabbriche,仕事・学校,Mio padre lavora in una fabbrica di scarpe.,父は靴の工場で働いています。,複数形は -che（c の /k/ の音を保つ）。stabilimento も工場（生産拠点）を指すが、施設一般にも使う広い語（stabilimento balneare＝海水浴場の施設）。,lo stabilimento,書類と手続き
L3-0609,3,il magazzino,倉庫|在庫置き場,noun,m,magazzini,仕事・学校,Le scatole sono nel magazzino dietro il negozio.,箱は店の裏の倉庫にあります。,grande magazzino は「デパート」。ただし通常は複数形 i grandi magazzini の形で使う。,il deposito,書類と手続き
L3-0457,3,produrre,生産する|製造する|生み出す,verb,,"produco, produci, produce, produciamo, producete, producono（過去分詞 prodotto）",仕事・学校,Questa regione produce un ottimo vino.,この地方はとても良いワインを生産しています。,tradurre など -durre 動詞の仲間で、過去分詞が不規則（prodotto）。名詞は il prodotto（製品）。,,書類と手続き
L3-0228,3,il prodotto,商品|製品,noun,m,prodotti,仕事・学校,Questo prodotto è in offerta oggi.,この商品は今日セール中です。,prodotti tipici は「特産品」。店では articolo も「商品、品物」の意味で使う。,,書類と手続き
L3-0333,3,il sistema,システム|制度|体系,noun,m,sistemi,仕事・学校,Il sistema dei trasporti qui funziona bene.,ここの交通システムはよく機能しています。,"-ma で終わるギリシャ語由来の男性名詞（il problema, il programma も同様）。複数は i sistemi。",,書類と手続き
L3-0141,3,l'aula,教室|講義室,noun,f,aule,仕事・学校,Dov'è l'aula di italiano?,イタリア語の教室はどこですか？,学校や大学の教室・講義室。aula magna は大講堂（式典などに使う大きなホール）。,la classe,授業と勉強
L3-0829,3,il liceo,高校|リチェオ（高等学校）,noun,m,licei,仕事・学校,Mia sorella frequenta il liceo qui vicino.,妹はこの近くの高校に通っています。,大学進学向けの5年制の高校。複数形は licei（語尾 -o が -i になる規則変化）。,,授業と勉強
L3-0833,3,la mensa,食堂（学食・社食）|社員食堂,noun,f,mense,仕事・学校,A mezzogiorno mangio sempre alla mensa dell'università.,お昼はいつも大学の食堂で食べます。,学校・会社・病院などの食堂を指す。一般のレストランは ristorante、家庭的な料理を出す大衆食堂は trattoria と区別する。,,授業と勉強
L3-0613,3,la materia,科目|物質|素材,noun,f,materie,仕事・学校,La mia materia preferita è la storia.,私の好きな科目は歴史です。,学校の「科目」の意味で最頻出。materia prima は「原料」。「素材」は materiale が一般的。,,授業と勉強
L3-0721,3,la matematica,数学,noun,f,matematiche,仕事・学校,"Mi piace la matematica, ma è difficile.",数学は好きですが、難しいです。,-ica で終わる学問名。複数形 matematiche は「数学の分野」の意味でまれ。普通は単数で使う。,,授業と勉強
L3-0470,3,la scienza,科学|学問,noun,f,scienze,仕事・学校,"Mi piace la scienza, soprattutto la biologia.",私は科学、特に生物学が好きです。,複数形 le scienze は「理科」「自然科学」の意味でも使う。scienza の発音は「シェンツァ」で、sci の後の i は発音しない。,,授業と勉強
L3-0719,3,la letteratura,文学,noun,f,letterature,仕事・学校,Mi piace molto la letteratura italiana.,私はイタリア文学がとても好きです。,複数形 letterature は「各国の文学」などの意味で使う。-ura で終わる名詞は多くが女性名詞。,,授業と勉強
L3-0281,3,il corso,講座|コース|大通り,noun,m,corsi,仕事・学校,Faccio un corso di italiano a Firenze.,私はフィレンツェでイタリア語の講座を受けています。,corso di〜で「〜の講座」。街の大通りも corso と呼ぶ（Corso Vittorio Emanuele など）。,,授業と勉強
L3-0804,3,la conferenza,講演|会議|講演会,noun,f,conferenze,仕事・学校,La conferenza comincia alle nove di mattina.,講演は朝9時に始まります。,conferenza stampa は「記者会見」。「会議」は riunione の方が日常的で、conferenza は講演や公式な会議を指す。,,授業と勉強
L3-0157,3,il compito,宿題|課題|任務,noun,m,compiti,仕事・学校,Ho molti compiti da fare stasera.,今晩はやるべき宿題がたくさんあります。,学校の宿題は普通 i compiti と複数形で使う。fare i compiti で「宿題をする」。,,授業と勉強
L3-0286,3,l'esercizio,練習問題|運動|練習,noun,m,esercizi,仕事・学校,Gli esercizi di oggi sono molto facili.,今日の練習問題はとても簡単です。,複数形は esercizi（-io の i は1つ）。「運動」は fare esercizio / fare movimento とも言う。,,授業と勉強
L3-0641,3,la prova,試験|証拠|試着,noun,f,prove,仕事・学校,Ho una prova di matematica domani.,明日、数学のテストがあります。,動詞 provare（試す・試着する）に対応する名詞。「証拠」の意味でも使う。la prova scritta（筆記試験）、la prova orale（口頭試験）のように使う。学校・大学の正式な試験全般は l'esame が一般的。試着は fare una prova とも言い、試着室は il camerino。,il test,授業と勉強
L3-0260,3,il voto,成績|評点|投票,noun,m,voti,仕事・学校,Ho preso un bel voto all'esame.,試験でいい成績を取りました。,学校の点数は voto。イタリアの学校では10点満点が一般的。「投票」の意味もあり、文脈で判断する。,,授業と勉強
L3-0743,3,ripassare,復習する|また立ち寄る|もう一度通る,verb,,"ripasso, ripassi, ripassa, ripassiamo, ripassate, ripassano",仕事・学校,Devo ripassare la lezione prima dell'esame.,試験の前に授業の復習をしなければなりません。,「復習する」は他動詞（avere）。「また立ち寄る」の意味では自動詞で essere を使う（sono ripassato/a）。,,授業と勉強
L3-0784,3,l'assenza,欠席|不在,noun,f,assenze,仕事・学校,Ho giustificato l'assenza di ieri con un certificato.,昨日の欠席は診断書で届け出ました。,反意語は la presenza（出席）。「〜がいない間に」は in assenza di や durante l'assenza di を使う。,,授業と勉強
L3-0140,3,assente,不在の|欠席の,adj,,assenti,仕事・学校,Oggi il direttore è assente.,今日は部長は不在です。,男女同形の -e 形容詞。反意語は presente。名詞 l'assenza（欠席、不在）も覚えるとよい。,,授業と勉強
L3-0818,3,l'educazione,教育|礼儀,noun,f,educazioni,仕事・学校,L'educazione dei bambini è molto importante.,子どもの教育はとても大切です。,「礼儀、しつけ」の意味も重要。maleducato は「無作法な」、mancanza di educazione は「無礼」。,l'istruzione,授業と勉強
L3-0832,3,la memoria,記憶力|記憶|メモリー,noun,f,memorie,仕事・学校,Mia nonna ha una buona memoria.,私の祖母は記憶力がいい。,avere buona memoria（記憶力がいい）、a memoria（暗記で）が頻出。パソコンやスマホの「メモリー」の意味でも使う。,,授業と勉強
L3-0184,3,la grammatica,文法,noun,f,grammatiche,仕事・学校,La grammatica italiana non è facile.,イタリア語の文法は簡単ではありません。,複数形は -che になる（c の音を保つため h を挿入）。,,読む・訳す
L3-0124,3,la frase,文|フレーズ,noun,f,frasi,仕事・学校,"Puoi ripetere la frase, per favore?",その文をもう一度言ってもらえますか？,文法上の「文」のほか、決まり文句や言い回しの意味でも使う。frase fatta は「決まり文句」。,,読む・訳す
L3-0668,3,il testo,文章|テキスト|本文,noun,m,testi,仕事・学校,Puoi leggere questo testo ad alta voce?,この文章を声に出して読んでくれますか？,「教科書」は libro di testo。スマホのメッセージは messaggio（di testo）と言う。,,読む・訳す
L3-0759,3,il tema,テーマ|作文|主題,noun,m,temi,仕事・学校,Il tema della lezione di oggi è la famiglia.,今日の授業のテーマは家族です。,"-ma で終わる男性名詞（il problema, il programma なども同様）。複数形は temi。学校の「作文」の意味でも使う。",,読む・訳す
L3-0243,3,il significato,意味|意義,noun,m,significati,仕事・学校,Non capisco il significato di questa parola.,この単語の意味がわかりません。,語や文の意味を指す。「どういう意味？」は Che cosa significa? と動詞 significare を使うのが自然。,,読む・訳す
L3-0242,3,significare,意味する|〜を表す,verb,,"significo, significhi, significa, significhiamo, significate, significano",仕事・学校,Che cosa significa questa parola?,この単語はどういう意味ですか？,"-chi, -chiamo で h が入る。「〜はどういう意味？」は Cosa vuol dire? とも言う。",voler dire,読む・訳す
L3-0488,3,tradurre,翻訳する|訳す,verb,,"traduco, traduci, traduce, traduciamo, traducete, traducono（過去分詞 tradotto）",仕事・学校,Può tradurre questa frase in inglese?,この文を英語に訳していただけますか？,不規則動詞（語幹 traduc-）。過去分詞は tradotto。tradurre A in B で「AをBに訳す」。,,読む・訳す
L3-0760,3,la traduzione,翻訳|訳文,noun,f,traduzioni,仕事・学校,Può farmi una traduzione di questo menù?,このメニューを訳していただけますか？,動詞は tradurre（不規則）。「翻訳する」は fare una traduzione とも言える。,,読む・訳す
L3-0745,3,il romanzo,長編小説|小説,noun,m,romanzi,仕事・学校,Sto leggendo un romanzo molto bello.,とても面白い小説を読んでいるところです。,短編小説は racconto。複数形は規則どおり -o→-i で romanzi。,,読む・訳す
L3-0233,3,la rivista,雑誌,noun,f,riviste,仕事・学校,Vorrei comprare una rivista di moda.,ファッション雑誌を買いたいのですが。,駅や街角の edicola（新聞雑誌売り場）で買える。rivista は定期刊行の雑誌で、新聞は giornale。,,読む・訳す
L3-0073,3,la gioia,喜び|うれしさ,noun,f,gioie,感情・性格,Che gioia vederti!,あなたに会えてなんてうれしいの！,gioia は大きな喜びを表す。複数形は gioie。「Che gioia!」は喜びを表す感嘆表現。,,うれしい・心配・こわい
L3-0037,3,sorpreso,驚いた|びっくりした,adj,,"sorpresa, sorpresi, sorprese",感情・性格,Sono molto sorpreso dalla tua notizia.,君の知らせにとても驚いています。,sorprendere の過去分詞が形容詞化した語。驚く原因は di や da で示す。,,うれしい・心配・こわい
L3-0244,3,soddisfatto,満足した|満足している,adj,,"soddisfatta, soddisfatti, soddisfatte",感情・性格,Sono molto soddisfatto del servizio.,サービスにとても満足しています。,soddisfare の過去分詞から来た形容詞。「〜に満足」は soddisfatto di。,,うれしい・心配・こわい
L3-0623,3,orgoglioso,誇りに思う|誇り高い|高慢な,adj,,"orgogliosa, orgogliosi, orgogliose",感情・性格,Sono orgoglioso di mio figlio.,私は息子を誇りに思っています。,「〜を誇りに思う」は essere orgoglioso di ...。前置詞は di を使う。,fiero,うれしい・心配・こわい
L3-0819,3,emozionato,感動した|わくわくした|緊張した,adj,,"emozionata, emozionati, emozionate",感情・性格,Sono molto emozionato per il viaggio.,私は旅行にとてもわくわくしています。,嬉しさにも緊張にも使う。人の気持ちを表し、主語の性数に一致する。女性なら emozionata。,commosso,うれしい・心配・こわい
L3-0702,3,emozionante,感動的な|わくわくさせる,adj,,emozionanti,感情・性格,Il concerto di ieri sera era emozionante.,昨夜のコンサートは感動的でした。,-e 形容詞で男女同形。「感動した」と人の状態を言うなら emozionato。,,うれしい・心配・こわい
L3-0451,3,piacevole,心地よい|楽しい|快適な,adj,,piacevoli,感情・性格,È stata una serata molto piacevole.,とても楽しい夜でした。,-e 形容詞なので男女同形。複数は piacevoli。反対語は spiacevole。,,うれしい・心配・こわい
L3-0006,3,preoccuparsi,心配する|気にする,verb,,"mi preoccupo, ti preoccupi, si preoccupa, ci preoccupiamo, vi preoccupate, si preoccupano",感情・性格,"Non ti preoccupare, va tutto bene.",心配しないで、すべて大丈夫だから。,再帰動詞。preoccuparsi di/per 〜で「〜を心配する」。命令形 Non ti preoccupare! / Non si preoccupi!（丁寧）は頻出。,,うれしい・心配・こわい
L3-0371,3,preoccupato,心配している|不安な,adj,,"preoccupata, preoccupati, preoccupate",感情・性格,Sono preoccupato per l'esame di domani.,明日の試験が心配です。,「〜のことを心配している」は essere preoccupato per ...。動詞 preoccuparsi（心配する）の過去分詞から来た形容詞。,,うれしい・心配・こわい
L3-0634,3,la preoccupazione,心配|不安,noun,f,preoccupazioni,感情・性格,Non c'è motivo di preoccupazione.,心配する理由はありません。,動詞 preoccuparsi（心配する）の名詞形。「心配事」の意味では複数形もよく使う。,l'ansia,うれしい・心配・こわい
L3-0083,3,nervoso,緊張した|神経質な|イライラした,adj,,"nervosa, nervosi, nervose",感情・性格,Sono nervoso per l'esame di domani.,明日の試験で緊張しています。,essere nervoso は「緊張している、いらいらしている」。「神経質」は性格にも使う。,,うれしい・心配・こわい
L3-0554,3,spaventato,怖がった|おびえた,adj,,"spaventata, spaventati, spaventate",感情・性格,Il bambino è spaventato dal temporale.,その子は雷雨を怖がっています。,spaventare の過去分詞から来た形容詞。原因は da で示す。「怖い」という性質は spaventoso。,impaurito,うれしい・心配・こわい
L3-0754,3,spaventarsi,怖がる|びっくりする,verb,,"mi spavento, ti spaventi, si spaventa, ci spaventiamo, vi spaventate, si spaventano",感情・性格,Mi spavento quando sento i tuoni.,雷の音を聞くと怖くなります。,再帰動詞。近過去は essere を使う（mi sono spaventato/a）。原因は di や per で示す。,impaurirsi,うれしい・心配・こわい
L3-0673,3,tremare,震える|身震いする,verb,,"tremo, tremi, trema, tremiamo, tremate, tremano",感情・性格,Ho freddo e tremo tutto.,寒くて体中が震えています。,寒さ・恐怖・緊張で震えるときに使う。tremare di freddo（寒さで震える）、tremare di paura（恐怖で震える）。,,うれしい・心配・こわい
