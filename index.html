L3-0247,3,spostarsi,移動する|動く,verb,,"mi sposto, ti sposti, si sposta, ci spostiamo, vi spostate, si spostano",基本動詞,Per spostarci in città usiamo la metropolitana.,街の中を移動するのに地下鉄を使います。,再帰動詞。近過去は essere を使う（mi sono spostato/a）。他動詞 spostare は「動かす、ずらす」。,,動き・移動の動詞
L3-0521,3,muovere,動かす|動かす（体の一部を）,verb,,"muovo, muovi, muove, muoviamo, muovete, muovono（過去分詞 mosso）",基本動詞,Non riesco a muovere il braccio.,腕を動かすことができません。,過去分詞が不規則。「動く」は再帰形 muoversi を使う（Mi muovo = 私は動く）。,,動き・移動の動詞
L3-0265,3,muoversi,動く|移動する,verb,,"mi muovo, ti muovi, si muove, ci muoviamo, vi muovete, si muovono（過去分詞 mosso）",基本動詞,"Non riesco a muovermi, mi fa male la schiena.",背中が痛くて動けません。,再帰動詞で過去分詞は不規則（mosso）。近過去は essere を使う（mi sono mosso/a）。Muoviti! は「急いで！」。,,動き・移動の動詞
L3-0018,3,avvicinarsi,近づく|近寄る,verb,,"mi avvicino, ti avvicini, si avvicina, ci avviciniamo, vi avvicinate, si avvicinano",基本動詞,Il treno si avvicina alla stazione.,列車が駅に近づいています。,再帰動詞で、近づく先は a を使う（avvicinarsi a Roma）。近過去は essere を使う（mi sono avvicinato/a）。,,動き・移動の動詞
L3-0044,3,accompagnare,同行する|送っていく|付き添う,verb,,"accompagno, accompagni, accompagna, accompagniamo, accompagnate, accompagnano",基本動詞,Ti accompagno io alla stazione.,駅まで私が送っていくよ。,人を目的地まで連れて行く意味で使う。「物を送る」は mandare や spedire で、accompagnare ではない。,,動き・移動の動詞
L3-0330,3,seguire,ついて行く|従う|受講する,verb,,"seguo, segui, segue, seguiamo, seguite, seguono",基本動詞,Seguite le indicazioni per la stazione.,駅への案内表示に従ってください。,道順は Segua la strada.（道なりに進む）のようにも使う。助動詞は avere（ho seguito）。,,動き・移動の動詞
L3-0640,3,proseguire,進み続ける|続ける|直進する,verb,,"proseguo, prosegui, prosegue, proseguiamo, proseguite, proseguono（過去分詞 proseguito）",基本動詞,"Prosegua dritto fino al semaforo, poi giri a destra.",信号までまっすぐ進んで、それから右に曲がってください。,道案内で頻出。自動詞（進む）にも他動詞（続ける）にも使う。近過去の助動詞は、自動詞なら essere、他動詞なら avere。,,動き・移動の動詞
L3-0647,3,raggiungere,到達する|着く|追いつく,verb,,"raggiungo, raggiungi, raggiunge, raggiungiamo, raggiungete, raggiungono（過去分詞 raggiunto）",基本動詞,Come posso raggiungere la stazione a piedi?,駅へは歩いてどう行けばいいですか？,他動詞なので目的語を直接とる（前置詞なし）。近過去は avere を使う。「連絡を取る」の意味でも使える。,,動き・移動の動詞
L3-0463,3,ripartire,再出発する|また出発する|発つ,verb,,"riparto, riparti, riparte, ripartiamo, ripartite, ripartono",基本動詞,Il treno riparte tra cinque minuti.,列車は5分後にまた発車します。,"「再出発する」の意味（自動詞）は essere を助動詞にとる（sono ripartito/a）。「分配する・割り振る」の意味（他動詞）では -isco 型（ripartisco, ripartisci…）で活用し、助動詞は avere。",,動き・移動の動詞
L3-0102,3,rientrare,戻る|帰る,verb,,"rientro, rientri, rientra, rientriamo, rientrate, rientrano",基本動詞,A che ora rientri in hotel stasera?,今夜は何時にホテルに戻りますか？,近過去は essere を助動詞にとる（sono rientrato/a）。tornare より「中に戻る、帰宅する」の意味が強い。,,動き・移動の動詞
L3-0468,3,sbrigarsi,急ぐ|急いでする,verb,,"mi sbrigo, ti sbrighi, si sbriga, ci sbrighiamo, vi sbrigate, si sbrigano",基本動詞,"Sbrigati, il treno parte tra cinque minuti!",急いで、列車は5分後に出発するよ！,"再帰動詞。tu と noi の活用は sbrighi, sbrighiamo と h が入る。命令形は sbrigati（Lei には si sbrighi）。近過去は essere を使う。",affrettarsi,動き・移動の動詞
L3-0373,3,saltare,跳ぶ|飛び越える|抜かす,verb,,"salto, salti, salta, saltiamo, saltate, saltano",基本動詞,I bambini saltano nel parco.,子どもたちは公園で跳びはねています。,他動詞なら近過去は avere（ho saltato il pranzo）、移動の意味では essere も使う。saltare il pranzo は「昼食を抜く」。,,動き・移動の動詞
L3-0748,3,scivolare,滑る|滑って転ぶ,verb,,"scivolo, scivoli, scivola, scivoliamo, scivolate, scivolano",基本動詞,"Attenzione, il pavimento è bagnato: si scivola.",気をつけて、床が濡れていて滑ります。,近過去は essere を使う（sono scivolato/a）。「滑って転ぶ」は scivolare e cadere とも言う。,,動き・移動の動詞
L3-0192,3,lanciare,投げる|発射する|発売する,verb,,"lancio, lanci, lancia, lanciamo, lanciate, lanciano",基本動詞,Lancia la palla a Marco!,マルコにボールを投げて！,-ciare 動詞なので tu の活用は lanci（i が重ならない）。lanciarsi は「飛び込む、身を投じる」。,gettare,動き・移動の動詞
L3-0356,3,premere,押す|（ボタンを）押す,verb,,"premo, premi, preme, premiamo, premete, premono",基本動詞,Premi il pulsante per chiamare l'ascensore.,エレベーターを呼ぶにはボタンを押してください。,「押す」は premere のほか spingere（ドアなどを押す）も使う。premere su は「〜に圧力をかける」の意味。また mi preme は「私にとって大事だ、気にかかる」の意味もある。,,動き・移動の動詞
L3-0581,3,coprire,覆う|かぶせる|カバーする,verb,,"copro, copri, copre, copriamo, coprite, coprono（過去分詞 coperto）",基本動詞,"Copri il bambino, fa freddo.",子どもに何か掛けてあげて、寒いから。,aprire と同じ型の活用で過去分詞は不規則。再帰形 coprirsi は「厚着する」の意味でも使う。,,動き・移動の動詞
L3-0204,3,nascondere,隠す|隠しておく,verb,,"nascondo, nascondi, nasconde, nascondiamo, nascondete, nascondono（過去分詞 nascosto）",基本動詞,Ho nascosto le chiavi nella borsa.,鍵をかばんの中に隠しました。,過去分詞が不規則（nascosto）。再帰形 nascondersi は「隠れる」。,,動き・移動の動詞
L3-0775,3,sparire,消える|なくなる,verb,,"sparisco, sparisci, sparisce, spariamo, sparite, spariscono（過去分詞 sparito）",基本動詞,Il mio portafoglio è sparito!,私の財布がなくなった！,-isco型の動詞。近過去は essere を助動詞にとる（è sparito/a）。,scomparire,動き・移動の動詞
L3-0013,3,succedere,起こる|起きる,verb,,"succedo, succedi, succede, succediamo, succedete, succedono（過去分詞 successo）",基本動詞,Che cosa è successo?,何があったのですか？,近過去は essere を助動詞にとる。「何があったの？」は Cosa è successo? が定番（Che succede? は「何が起きているの？／どうしたの？」）。,accadere,起こる・始める・終える
L3-0383,3,accadere,起こる|生じる,verb,,"accado, accadi, accade, accadiamo, accadete, accadono（過去分詞 accaduto）",基本動詞,Che cosa è accaduto ieri sera?,昨夜、何があったのですか？,近過去は essere を助動詞にとる（è accaduto）。主に3人称で使う。happen の意味では succedere とほぼ同義。,succedere,起こる・始める・終える
L3-0591,3,esistere,存在する|ある|実在する,verb,,"esisto, esisti, esiste, esistiamo, esistete, esistono（過去分詞 esistito）",基本動詞,Questo problema non esiste.,こんな問題は存在しません。,近過去は essere を助動詞にとる（è esistito）。c'è とは違い、存在そのものを述べる硬めの語。,,起こる・始める・終える
L3-0240,3,sembrare,〜のように思われる|〜に見える,verb,,"sembro, sembri, sembra, sembriamo, sembrate, sembrano",基本動詞,Sembra una buona idea.,それはいい考えのようです。,近過去は essere を使う（è sembrato）。「sembra che＋接続法」の非人称用法も頻出。,,起こる・始める・終える
L3-0815,3,dipendere,〜次第である|依存する|左右される,verb,,"dipendo, dipendi, dipende, dipendiamo, dipendete, dipendono（過去分詞 dipeso）",基本動詞,Dipende dal tempo che farà domani.,明日の天気次第です。,「〜次第」は dipendere da。単独の Dipende. は「場合によるね」の定番返答。近過去は essere をとる（è dipeso）。,,起こる・始める・終える
L3-0611,3,mancare,足りない|欠けている|いなくて寂しい,verb,,"manco, manchi, manca, manchiamo, mancate, mancano",基本動詞,Mi manchi molto.,あなたがいなくてとても寂しい。,「A manca a B」でBはAがいなくて寂しい。主語は恋しい相手で、mi manchi は「君が恋しい」。この意味の近過去の助動詞は essere（Mi sei mancato/a）。,,起こる・始める・終える
L3-0522,3,occorrere,必要である|要る,verb,,"occorro, occorri, occorre, occorriamo, occorrete, occorrono（過去分詞 occorso）",基本動詞,Occorre un documento per entrare.,入るには身分証が必要です。,多くは3人称で使い、助動詞は essere。Mi occorre un biglietto.（私には切符が要る）の形も頻出。,servire,起こる・始める・終える
L3-0441,3,occupare,占める|占領する|（場所・時間を）取る|ふさぐ,verb,,"occupo, occupi, occupa, occupiamo, occupate, occupano",基本動詞,Questo posto è occupato?,この席はふさがっていますか？,再帰形 occuparsi di は「〜を担当する、世話をする」。席やトイレの「使用中」は occupato。,,起こる・始める・終える
L3-0100,3,ricominciare,再び始める|やり直す,verb,,"ricomincio, ricominci, ricomincia, ricominciamo, ricominciate, ricominciano",基本動詞,Dopo la pausa ricominciamo a lavorare.,休憩の後、また仕事を始めます。,「再び〜し始める」は ricominciare a＋不定詞。近過去は他動詞では avere（Ho ricominciato il lavoro.）、自動詞では essere（La scuola è ricominciata.）を使う。,rincominciare,起こる・始める・終える
L3-0041,3,terminare,終える|終わる,verb,,"termino, termini, termina, terminiamo, terminate, terminano",基本動詞,A che ora termina la lezione?,授業は何時に終わりますか？,他動詞は avere、自動詞（終わる）は essere で近過去を作る。finire とほぼ同義だが、やや改まった響き。,finire,起こる・始める・終える
L3-0061,3,costruire,建設する|作る|建てる,verb,,"costruisco, costruisci, costruisce, costruiamo, costruite, costruiscono",基本動詞,Vogliono costruire una nuova casa vicino al mare.,彼らは海の近くに新しい家を建てたがっています。,-isco型の動詞。過去分詞は規則形（costruito）。建物や橋など大きなものを作る時に使う。,,起こる・始める・終える
L3-0163,3,creare,創造する|作り出す|生み出す,verb,,"creo, crei, crea, creiamo, create, creano",基本動詞,Mi piace creare nuovi piatti in cucina.,私は台所で新しい料理を作り出すのが好きです。,fare より改まった「作る」で、新しいものを生み出す意味。規則動詞で、過去分詞は creato。,,起こる・始める・終える
L3-0827,3,inventare,発明する|作り出す|でっち上げる,verb,,"invento, inventi, inventa, inventiamo, inventate, inventano",基本動詞,Chi ha inventato la pizza?,ピザを発明したのは誰ですか？,規則動詞（-are）。「話をでっち上げる」の意味でも頻出（inventare una scusa）。名詞は invenzione。,,起こる・始める・終える
L3-0649,3,realizzare,実現する|作る|実感する,verb,,"realizzo, realizzi, realizza, realizziamo, realizzate, realizzano",基本動詞,Voglio realizzare il mio sogno.,私は自分の夢を実現したい。,夢や計画を「実現する」が基本。英語 realize の影響で「気づく」の意味でも使われるが、普通は capire や rendersi conto を使う。,attuare,起こる・始める・終える
L3-0773,3,ottenere,得る|手に入れる|取得する,verb,,"ottengo, ottieni, ottiene, otteniamo, ottenete, ottengono（過去分詞 ottenuto）",基本動詞,Ho ottenuto il visto per due mesi.,2か月のビザを取得しました。,tenere と同型の不規則活用。近過去は avere を助動詞にとる。未来形は otterrò。,conseguire,起こる・始める・終える
L3-0831,3,mantenere,維持する|保つ|守る（約束を）,verb,,"mantengo, mantieni, mantiene, manteniamo, mantenete, mantengono（過去分詞 mantenuto）",基本動詞,Dobbiamo mantenere la calma.,私たちは落ち着きを保たなければなりません。,tenere と同型の不規則活用。mantenere la promessa は「約束を守る」。再帰形 mantenersi は「（状態を）保つ」。,,起こる・始める・終える
L3-0834,3,migliorare,改善する|良くする|上達する,verb,,"miglioro, migliori, migliora, miglioriamo, migliorate, migliorano",基本動詞,Voglio migliorare il mio italiano.,私はイタリア語を上達させたい。,他動詞（〜を改善する）にも自動詞（良くなる）にも使う。自動詞の近過去は essere が普通。,,起こる・始める・終える
L3-0490,3,unire,結びつける|一つにする|合わせる,verb,,"unisco, unisci, unisce, uniamo, unite, uniscono",基本動詞,Questo ponte unisce le due parti della città.,この橋は街の二つの地区をつないでいます。,-isco型の動詞。再帰形 unirsi は「加わる、一緒になる」（unirsi a un gruppo）。,,起こる・始める・終える
L3-0672,3,trattare,扱う|取り扱う|交渉する,verb,,"tratto, tratti, tratta, trattiamo, trattate, trattano",基本動詞,Il medico tratta tutti i pazienti con gentilezza.,その医者はすべての患者を親切に扱います。,trattare di ～で「～を論じる、～がテーマだ」。trattarsi di ～は「～が問題だ」。例: Si tratta di un errore.,,起こる・始める・終える
L3-0738,3,raccogliere,集める|拾う|収穫する,verb,,"raccolgo, raccogli, raccoglie, raccogliamo, raccogliete, raccolgono（過去分詞 raccolto）",基本動詞,Dobbiamo raccogliere le mele domani mattina.,私たちは明日の朝、りんごを収穫しなければなりません。,過去分詞が不規則。io raccolgo と loro raccolgono は語幹が変わる。果物の収穫や落ちた物を拾う時にも使う。,,起こる・始める・終える
L3-0389,3,bloccare,ブロックする|止める|封鎖する,verb,,"blocco, blocchi, blocca, blocchiamo, bloccate, bloccano",基本動詞,Un incidente blocca la strada.,事故で道路が通れなくなっています。,"規則動詞だが blocchi, blocchiamo のように h が入る。再帰形 bloccarsi は「動かなくなる、固まる」。",,起こる・始める・終える
L3-0017,3,accettare,受け入れる|受け取る|（支払いを）受け付ける,verb,,"accetto, accetti, accetta, accettiamo, accettate, accettano",基本動詞,Accettate le carte di credito?,クレジットカードは使えますか？,店では「カードは使えますか」を Accettate carte di credito? と聞く。過去分詞は規則形 accettato。,,人に関わる動詞
L3-0084,3,offrire,おごる|提供する|勧める,verb,,"offro, offri, offre, offriamo, offrite, offrono（過去分詞 offerto）",基本動詞,Stasera offro io la cena.,今夜の夕食は私がおごります。,過去分詞が不規則（offerto）。Offro io! は「私がおごるよ」。aprire と同じ活用型。,,人に関わる動詞
L3-0227,3,prestare,貸す,verb,,"presto, presti, presta, prestiamo, prestate, prestano",基本動詞,"Mi presti la tua penna, per favore?",あなたのペンを貸してくれませんか？,お金や物を無料で貸す意味。借りるは prendere in prestito。prestare attenzione は「注意を払う」。,,人に関わる動詞
L3-0213,3,partecipare,参加する,verb,,"partecipo, partecipi, partecipa, partecipiamo, partecipate, partecipano",基本動詞,Domani partecipo a una visita guidata in città.,明日は市内のガイドツアーに参加します。,「〜に参加する」は partecipare a ...。前置詞 a を忘れないこと。近過去の助動詞は avere。,,人に関わる動詞
L3-0698,3,consigliare,勧める|助言する,verb,,"consiglio, consigli, consiglia, consigliamo, consigliate, consigliano",基本動詞,Che cosa mi consiglia di mangiare?,何を食べるのがおすすめですか？,consigliare qualcosa a qualcuno、または consigliare di + 不定詞の形で使う。店で「おすすめは？」と聞くときに便利。,,人に関わる動詞
L3-0458,3,proporre,提案する|勧める,verb,,"propongo, proponi, propone, proponiamo, proponete, propongono（過去分詞 proposto）",基本動詞,Propongo di andare al ristorante stasera.,今夜はレストランに行くことを提案します。,porre 系の不規則動詞。proporre di + 不定詞、または proporre qualcosa a qualcuno の形で使う。,,人に関わる動詞
L3-0529,3,promettere,約束する,verb,,"prometto, prometti, promette, promettiamo, promettete, promettono（過去分詞 promesso）",基本動詞,Ti prometto che arrivo presto.,早く着くと約束するよ。,過去分詞は promesso（不規則）。promettere di＋不定詞、promettere che＋節の形で使う。,,人に関わる動詞
L3-0639,3,proibire,禁止する|禁じる,verb,,"proibisco, proibisci, proibisce, proibiamo, proibite, proibiscono",基本動詞,Il regolamento proibisce di fumare qui.,規則によりここでの喫煙は禁止されています。,-isco型の動詞。proibire di + 不定詞の形で使う。掲示の Vietato fumare も同じ意味。,vietare,人に関わる動詞
L3-0325,3,rispettare,尊重する|尊敬する|守る（規則を）,verb,,"rispetto, rispetti, rispetta, rispettiamo, rispettate, rispettano",基本動詞,Bisogna rispettare le regole della città.,街のルールは守らなければなりません。,人には「尊敬する」、規則・約束・意見には「守る、尊重する」。規則的な -are 動詞で、近過去は avere を使う。,,人に関わる動詞
L3-0170,3,evitare,避ける|（〜を）しないようにする,verb,,"evito, eviti, evita, evitiamo, evitate, evitano",基本動詞,Evito il traffico e vado a piedi.,渋滞を避けて歩いて行きます。,他動詞。「〜しないようにする」は evitare di＋不定詞（Evito di mangiare tardi.）。近過去は avere を使う。,,人に関わる動詞
L3-0009,3,raccontare,語る|話して聞かせる|物語る,verb,,"racconto, racconti, racconta, raccontiamo, raccontate, raccontano",基本動詞,Mi racconti com'è andato il viaggio?,旅行がどうだったか話してくれる？,出来事や物語を順序立てて話すときに使う。parlare は「話す」一般、dire は「言う」。過去分詞は規則形 raccontato。,narrare,人に関わる動詞
L3-0012,3,spiegare,説明する|解説する,verb,,"spiego, spieghi, spiega, spieghiamo, spiegate, spiegano",基本動詞,Mi può spiegare come arrivare al museo?,博物館への行き方を説明していただけますか？,"tu と noi では h を入れて spieghi, spieghiamo と綴る。spiegare A a B で「BにAを説明する」。",,人に関わる動詞
L3-0188,3,indicare,指し示す|示す|教える（道などを）,verb,,"indico, indichi, indica, indichiamo, indicate, indicano",基本動詞,Può indicarmi la strada per la stazione?,駅への道を教えていただけますか？,"-care 動詞なので tu と noi で h が入る（indichi, indichiamo）。道を尋ねるとき頻出。",,人に関わる動詞
L3-0186,3,immaginare,想像する|思い描く,verb,,"immagino, immagini, immagina, immaginiamo, immaginate, immaginano",基本動詞,Non riesco a immaginare una vita senza musica.,音楽のない生活は想像できません。,規則動詞。Immagino di sì. は「そうだと思います」。会話では「たぶん〜でしょう」の意味でも頻出。,,人に関わる動詞
L3-0239,3,scoprire,発見する|（初めて）知る|見つける,verb,,"scopro, scopri, scopre, scopriamo, scoprite, scoprono（過去分詞 scoperto）",基本動詞,Oggi scopriamo il centro storico di Siena.,今日はシエナの歴史地区を探訪します。,aprire と同型で過去分詞が不規則。観光では「新しい場所を知る、探訪する」の意味でよく使う。,,人に関わる動詞
L3-0587,3,dimostrare,証明する|示す|（感情などを）表す|（年齢が）〜に見える,verb,,"dimostro, dimostri, dimostra, dimostriamo, dimostrate, dimostrano",基本動詞,I risultati dimostrano che il metodo funziona.,結果はその方法が有効であることを示している。,規則動詞。再帰形 dimostrarsi + 形容詞は「〜であることがわかる・〜だと示す」（例: si è dimostrato onesto）。dimostrare 30 anni は「30歳に見える」、non dimostrare gli anni は「年齢より若く見える」。,,人に関わる動詞
L3-0423,3,informare,知らせる|情報を与える,verb,,"informo, informi, informa, informiamo, informate, informano",基本動詞,Mi può informare sugli orari dei treni?,電車の時刻について教えていただけますか？,informare qualcuno di/su qualcosa の形。再帰形 informarsi は「情報を得る、問い合わせる」。,,人に関わる動詞
L3-0691,3,avvisare,知らせる|通知する|警告する,verb,,"avviso, avvisi, avvisa, avvisiamo, avvisate, avvisano",基本動詞,Ti avviso se arrivo in ritardo.,遅れそうなら知らせるね。,avvisare qlcn di qlco で「人に〜を知らせる」。近過去は avere を助動詞にとる（ho avvisato）。,,人に関わる動詞
L4-0011,4,il pranzo è servito,食事の用意ができました|昼食の用意ができました,phrase,,,挨拶・定型表現,"Ragazzi, venite a tavola: il pranzo è servito!",みんな、食卓に来て。お昼ごはんができたよ！,食事の準備ができたと知らせる決まり文句。昼食が前提だが、夕食なら la cena è servita と言う。,,ひとことと祝福
L4-0403,4,buon onomastico,名の日おめでとう|聖人の祝日おめでとう,phrase,,,挨拶・定型表現,"Buon onomastico, Marco! Questo regalo è per te.",マルコ、名の日おめでとう！このプレゼントは君にだよ。,onomastico は自分と同じ名前の聖人の祝日。誕生日は compleanno で、お祝いは Buon compleanno。Tanti auguri とも言う。,tanti auguri di buon onomastico,ひとことと祝福
L4-0304,4,congratularsi,お祝いを言う|祝福する,verb,,"mi congratulo, ti congratuli, si congratula, ci congratuliamo, vi congratulate, si congratulano",挨拶・定型表現,Mi congratulo con te per la laurea.,卒業おめでとう。,再帰動詞。祝う相手は con、祝う内容は per で示す。近過去は essere を使う（mi sono congratulato/a）。,complimentarsi,ひとことと祝福
L4-0417,4,con affetto,愛情を込めて|心を込めて,phrase,,,挨拶・定型表現,"Ti scrivo con affetto, a presto.",愛情を込めて書いているよ。また近いうちにね。,手紙やカードの結びの言葉。親しい人向けで、日本語の「親愛なる」は冒頭の caro/cara に当たる。,con tanto affetto,ひとことと祝福
L4-0148,4,magari,そうだったらいいのに|ぜひ|もしかすると|そうだといいな,interj,,,挨拶・定型表現,Vieni in vacanza con noi? Magari!,一緒に休暇に行く？そうできたらいいなあ！,単独で「そうだといいな」の強い願望を表す。副詞では「もしかして」、接続法半過去・大過去とともに「〜だったらなあ」の願望にも使う（Magari fosse vero!）。,,ひとことと祝福
L4-0048,4,uffa,ちぇっ|やれやれ|もう（うんざり）,interj,,,挨拶・定型表現,"Uffa, che caldo oggi!",ああもう、今日はなんて暑いんだ！,退屈・苛立ち・うんざりした気持ちを表す口語の間投詞。親しい間柄で使い、改まった場面には不向き。,,ひとことと祝福
L4-0003,4,perciò,だから|それゆえ,conj,,,副詞・接続詞・前置詞,"Ho perso il treno, perciò sono arrivato tardi.",電車に乗り遅れたので、遅れて着きました。,結果を導く接続詞。dunque や quindi もほぼ同義で、会話では quindi がよく使われる。,quindi|dunque,理由と逆接のつなぎ
L4-0572,4,pertanto,したがって|それゆえ,conj,,,副詞・接続詞・前置詞,"Il treno è in ritardo, pertanto arriveremo più tardi.",列車が遅れているので、私たちは到着が遅くなります。,やや改まった表現で、書き言葉や公的な案内でよく使う。会話では quindi や allora が普通。,perciò|dunque,理由と逆接のつなぎ
L4-0246,4,siccome,〜なので|〜だから,conj,,,副詞・接続詞・前置詞,"Siccome piove, restiamo a casa.",雨が降っているので、私たちは家にいます。,理由を表す節を主節の前に置くのが普通。主節のあとに置く理由には perché を使う。,,理由と逆接のつなぎ
L4-0352,4,poiché,〜なので|〜だから,conj,,,副詞・接続詞・前置詞,"Poiché piove, restiamo a casa.",雨が降っているので、家にいます。,理由を表す接続詞で、やや改まった表現。文頭に置くことが多い。会話では perché や siccome もよく使う。,,理由と逆接のつなぎ
L4-0260,4,tuttavia,しかしながら|それでも,conj,,,副詞・接続詞・前置詞,"Ero stanco, tuttavia ho continuato a lavorare.",疲れていたが、それでも仕事を続けた。,ma より硬めの逆接で、書き言葉や改まった場面で多い。,,理由と逆接のつなぎ
L4-0341,4,nonostante,〜にもかかわらず|〜だけれども,prep,,,副詞・接続詞・前置詞,"Nonostante la pioggia, siamo usciti a fare una passeggiata.",雨にもかかわらず、私たちは散歩に出かけた。,後ろに名詞を置く。節を続けるときは nonostante＋接続法（nonostante sia tardi）。,malgrado,理由と逆接のつなぎ
L4-0591,4,sebbene,〜だけれど|〜にもかかわらず,conj,,,副詞・接続詞・前置詞,"Sebbene sia stanco, esco con gli amici stasera.",疲れているけれど、今夜は友達と出かけます。,後ろは接続法を使う（sebbene sia）。benché と近い意味。anche se も近いが、こちらは通常直説法をとる。,benché,理由と逆接のつなぎ
L4-0434,4,finché,〜するまで|〜する限り|〜している間は,conj,,,副詞・接続詞・前置詞,Aspetto qui finché non arrivi.,君が来るまでここで待っているよ。,「〜まで」の意味では finché non＋接続法/直説法が普通で、non は否定の意味を持たない。「〜する間は」の意味では non なしで使う。,fino a quando,理由と逆接のつなぎ
L4-0233,4,piuttosto,むしろ|かなり,adv,,,副詞・接続詞・前置詞,"Oggi fa piuttosto freddo, prendi la giacca.",今日はかなり寒いから、上着を持っていきなさい。,piuttosto che は「〜よりむしろ、〜ではなく」。近年「〜や、あるいは」の意味で列挙に使う人もいるが、規範的には避けるべきとされることが多い。,,理由と逆接のつなぎ
L4-0399,4,anzi,むしろ|それどころか|いや、それどころか,adv,,,副詞・接続詞・前置詞,"Non mi disturbi, anzi, mi fa piacere.",邪魔じゃないよ、それどころか嬉しいくらいだ。,"前の内容を訂正・強調して言い直す語。「Non è caro, anzi è economico.」のように使う。",,理由と逆接のつなぎ
L4-0394,4,affatto,まったく（〜ない）|少しも（〜ない）,adv,,,副詞・接続詞・前置詞,Non sono affatto stanco.,私はまったく疲れていません。,否定文で non と一緒に使うのが基本。Per niente も同義。単独で「Affatto.」とも答える（全然）。,per niente,理由と逆接のつなぎ
L4-0270,4,persino,〜さえ|〜でさえ|さらには,adv,,,副詞・接続詞・前置詞,Persino mio nonno usa lo smartphone.,私の祖父でさえスマートフォンを使います。,強調したい語の直前に置く。同義の perfino や addirittura もよく使う。,perfino,理由と逆接のつなぎ
L4-0388,4,neppure,〜さえ〜ない|〜もまた〜ない,adv,,,副詞・接続詞・前置詞,Non ho neppure un euro con me.,私は1ユーロさえ持っていません。,動詞の後ろに置くときは non が必要（non ... neppure）。文頭では non は不要。neanche、nemmeno とほぼ同義。,neanche|nemmeno,理由と逆接のつなぎ
L4-0338,4,né,〜も〜ない|〜でも〜でもない,conj,,,副詞・接続詞・前置詞,Non mangio né carne né pesce.,私は肉も魚も食べません。,né A né B で「AもBも〜ない」。動詞の前に né を置く時以外は non を併用する。例: Non parla né inglese né francese。,,理由と逆接のつなぎ
L4-0337,4,ne,それについて|それの|そのうちの|そこから,pron,,,副詞・接続詞・前置詞,"Vuoi del pane? Sì, ne voglio due fette.",パンはいる？うん、2切れほしい。,"数量や部分（di＋名詞）を受ける代名詞。活用した動詞の前に置く（不定詞・命令形では後ろにつく: mangiarne, mangiane）。近過去では過去分詞が ne の指す名詞の性数に一致する（le mele → ne ho mangiate tre）。",,範囲と関係を示すことば
L4-0130,4,ciò,そのこと|それ,pron,,,副詞・接続詞・前置詞,Ciò che dici è vero.,あなたの言うことは本当です。,指示代名詞で不変。ciò che で「〜すること・もの」。やや改まった語で、会話では quello che も多用。,,範囲と関係を示すことば
L4-0524,4,cui,（前置詞＋cui で）関係代名詞：その人・その物|〜について／〜に／〜の中で（di cui / a cui / in cui など）,pron,,,副詞・接続詞・前置詞,La ragazza di cui parlo è mia sorella.,私が話している女の子は私の妹です。,前置詞と共に使う関係代名詞で、人にも物にも使う。性数不変。冠詞つきの il cui / la cui / i cui / le cui は「その〜の」（所有）の意味で、冠詞は後ろの名詞の性数に合わせる。,,範囲と関係を示すことば
L4-0477,4,tale,そのような|このような,adj,,tali,副詞・接続詞・前置詞,Non ho mai visto un tale spettacolo.,そのような光景は見たことがありません。,-e 形容詞で男女同形。名詞の前では un tale のように使う。il tale は「某氏」、tale e quale は「そっくり」。,,範囲と関係を示すことば

L4-0454,4,ognuno,各自|誰でも|めいめい,pron,,ognuna（女性形）,副詞・接続詞・前置詞,Ognuno paga il suo conto.,各自が自分の分を支払います。,単数扱いで動詞も単数。男性 ognuno、女性 ognuna。主に人を指し、形容詞の ogni は名詞の前に置く。,ciascuno,範囲と関係を示すことば
L4-0300,4,chiunque,誰でも|誰が〜しても,pron,,,副詞・接続詞・前置詞,Chiunque può entrare in questo museo.,誰でもこの美術館に入れます。,不変。単数扱いで、主語のときは動詞が3人称単数。「誰が〜しても」の譲歩用法では接続法を伴う（chiunque sia）。「〜する人は誰でも」の用法でも接続法が多いが、直説法も使われる。,,範囲と関係を示すことば

L4-0022,4,riguardo a,〜について|〜に関して,prep,,,副詞・接続詞・前置詞,Ho una domanda riguardo a questo biglietto.,この切符について質問があります。,「riguardo a＋名詞」の形で使う。同じ意味で a proposito di や in merito a、やや硬い表現では circa も使われる。,a proposito di,範囲と関係を示すことば

L4-0344,4,oltre,〜の向こうに|〜を越えて|〜に加えて,prep,,,副詞・接続詞・前置詞,Il ristorante è subito oltre il ponte.,レストランは橋を渡ってすぐのところです。,oltre a＋名詞で「〜に加えて、〜のほかに」。副詞としても使う（andare oltre＝先へ進む）。,,範囲と関係を示すことば
L4-0353,4,presso,〜で（勤務先・所属先）|〜のところで|〜方で|〜の近くに|〜気付,prep,,,副詞・接続詞・前置詞,Lavoro presso una piccola agenzia di viaggi.,私は小さな旅行代理店で働いています。,やや改まった語。勤務先・所属先（lavorare presso 〜）や「〜宅で」の意味が多く、住所の c/o（〜方）にも使う。「近く」の意味では日常では vicino a が自然。,,範囲と関係を示すことば

L4-0083,4,il doppio,2倍|ダブル,noun,m,(通常は単数形で使う) i doppi:ダブルス,数・時間・曜日,Questo biglietto costa il doppio dell'altro.,この切符はもう一方の2倍の値段です。,「2倍」は il doppio di ～ の形で使う。形容詞 doppio は camera doppia（ダブルルーム）など。,,数・割合・頻度
L4-0230,4,la percentuale,割合|パーセンテージ,noun,f,percentuali,数・時間・曜日,Qual è la percentuale di studenti stranieri?,外国人学生の割合はどのくらいですか？,「〜パーセント」は per cento（例: il dieci per cento）。percentuale は割合そのものを指す名詞。,,数・割合・頻度

L4-0497,4,sommare,足す|合計する,verb,,"sommo, sommi, somma, sommiamo, sommate, sommano",数・時間・曜日,"Se sommi tutti gli scontrini, spendiamo troppo.",レシートを全部足すと、私たちは使いすぎです。,規則動詞。「AにBを足す」は sommare B a A。「合計は〜になる」は fare や ammontare も使う。,addizionare,数・割合・頻度
L4-0596,4,sottrarre,引く|差し引く,verb,,"sottraggo, sottrai, sottrae, sottraiamo, sottraete, sottraggono（過去分詞 sottratto）",数・時間・曜日,Devi sottrarre le spese dal totale.,合計から経費を引かなければなりません。,trarre 系の不規則動詞で、過去分詞は sottratto。「盗む、奪う」の意味でも使う。,,数・割合・頻度
L4-0004,4,pesare,重さを量る|重さがある,verb,,"peso, pesi, pesa, pesiamo, pesate, pesano",数・時間・曜日,"Può pesare questo pacco, per favore?",この小包の重さを量っていただけますか？,他動詞なら「量る」、自動詞なら「重さがある」。近過去の助動詞は、量るなら avere、重さがあるでも通常 avere。,,数・割合・頻度

L4-0616,4,il grado,度|等級|段階,noun,m,gradi,数・時間・曜日,Oggi ci sono trenta gradi a Roma.,今日ローマは30度あります。,気温は gradi で表す。「度」の他に階級・程度の意味もある。「〜度」は数詞＋gradi。,,数・割合・頻度
L4-0592,4,il semestre,半年|学期,noun,m,semestri,数・時間・曜日,Studio l'italiano da un semestre.,私は半年前からイタリア語を勉強しています。,1年を2期に分けた「半年間」を指し、大学では前期・後期の「学期」にあたる。,,数・割合・頻度
L4-0181,4,annuale,年1回の|毎年の|1年間の,adj,,annuali,数・時間・曜日,Ho un abbonamento annuale ai musei.,私は美術館の年間パスを持っています。,-e 形容詞で男女同形。annuo もほぼ同義だが、reddito annuo（年収）のように行政・経済の書き言葉で多い。,,数・割合・頻度

L4-0359,4,regolare,規則的な|定期的な|正規の,adj,,"regolare, regolari, regolari",数・時間・曜日,Faccio esercizio fisico in modo regolare.,私は定期的に運動しています。,-e 形容詞で男女同形。同形の動詞 regolare（調整する）もあるので文脈に注意。,,数・割合・頻度
L4-0577,4,precedente,前の|先の,adj,,precedenti,数・時間・曜日,"Ho perso il treno precedente, aspetto il prossimo.",前の電車に乗り遅れたので、次のを待ちます。,男女同形の -e 形容詞。名詞の前にも後ろにも置ける。名詞として il precedente（前例）もある。,,数・割合・頻度
L4-0058,4,attuale,現在の|今の|現行の,adj,,attuale（男女同形）/ attuali（複数）,数・時間・曜日,Qual è il suo indirizzo attuale?,あなたの現住所はどこですか？,英語の actual（実際の）とは意味が異なる偽の友達。「実際の」は reale / effettivo を使う。,,数・割合・頻度

L4-0070,4,all'alba,夜明けに|明け方に,phrase,,,数・時間・曜日,Domani partiamo all'alba per vedere il panorama.,明日は景色を見るために夜明けに出発します。,alba は女性名詞（複数 albe）で、all'alba は alla alba の縮約形。「夕暮れに」は al tramonto。,all'aurora,数・割合・頻度
L4-0088,4,il maschio,男の子|雄|男性（性別として）,noun,m,maschi,家族・人,Hanno due figli: un maschio e una femmina.,彼らには子どもが2人いて、男の子と女の子です。,性別を表す語。書類の性別欄は M と F。人の「男性」は uomo が一般的で、maschio は子や動物の性別に多用。,,親族と身近な人
L4-0174,4,la vecchia,老女|おばあさん,noun,f,vecchie,家族・人,La vecchia abita da sola in una casa vicino alla chiesa.,そのおばあさんは教会の近くの家に一人で住んでいます。,形容詞 vecchio の名詞用法。人に使うと失礼に響くことがあり、anziana が丁寧。男性は il vecchio。,l'anziana,親族と身近な人

L4-0624,4,l'adolescente,思春期の若者|ティーンエイジャー,noun,mf,"gli adolescenti, le adolescenti",家族・人,Mia figlia è un'adolescente molto socievole.,私の娘はとても社交的な思春期の子です。,語尾は -e だが男女同形。複数は男性 adolescenti、女性 adolescenti（冠詞で区別: gli / le）。形容詞「思春期の」としても使う。,il/la teenager,親族と身近な人
L4-0541,4,la gioventù,青春|若さ|若者たち,noun,f,gioventù（不変）,家族・人,Ho passato la gioventù in una piccola città.,私は青春時代を小さな町で過ごしました。,-ù で終わる名詞は不変。「若者全体」を指す集合的な意味でも使う。個々の若者は giovane。,,親族と身近な人

L4-0418,4,il/la conoscente,知人|顔見知り,noun,mf,"i conoscenti, le conoscenti",家族・人,Ho incontrato un conoscente in stazione.,駅で知人に会いました。,amico ほど親しくない人。語尾 -e の男女同形名詞で、性は冠詞で区別する。複数形も男女とも conoscenti（i/le conoscenti）。,,親族と身近な人

L4-0571,4,il pensionato,退職者|年金生活者,noun,m,pensionati,家族・人,Mio nonno è un pensionato e ha molto tempo libero.,祖父は退職していて、自由な時間がたくさんあります。,女性は la pensionata（複数 le pensionate）。「年金」は la pensione で、「民宿」の意味もある。,,親族と身近な人
L4-0570,4,il/la pendolare,通勤者|通勤客|通学者,noun,mf,"i pendolari, le pendolari",家族・人,Al mattino il treno è pieno di pendolari.,朝、電車は通勤客でいっぱいです。,"男女同形の名詞で、冠詞で性を区別する。複数は i pendolari, le pendolari。通学者にも使う。形容詞で「通勤・通学の」の意味もある（lavoratori pendolari）。",,親族と身近な人
L4-0001,4,il padrone,持ち主|主人|雇い主,noun,m,padroni,家族・人,Il padrone del cane è molto gentile con tutti.,その犬の飼い主はみんなにとても親切です。,女性は la padrona。padrone di casa は「家主、家の主人」。犬の飼い主にも使う。,,親族と身近な人

L4-0192,4,il benzinaio,ガソリンスタンドの店員|ガソリンスタンド,noun,m,benzinai,仕事・学校,Il benzinaio mi ha detto che la strada è chiusa.,ガソリンスタンドの店員は、道路が閉鎖されていると教えてくれた。,人（店員）のほか、口語では給油所そのものも指す。給油所は distributore di benzina とも言う。,,町で働く人

L4-0604,4,il/la vigile,交通警官|市警察官|消防士,noun,mf,"i vigili (男), le vigili (女)",仕事・学校,Il vigile ci ha detto di girare a destra.,交通警官は私たちに右へ曲がるよう言いました。,vigile urbano は市の警察官（地方警察官）で、交通整理も担当する。消防士は通常 vigile del fuoco と言う。男女同形で、冠詞だけが il / la と変わる。,il vigile urbano,町で働く人

L4-0224,4,l'infermiere,看護師|看護士（男性）,noun,m,infermieri,仕事・学校,L'infermiere mi misura la febbre.,看護師が私の熱を測ってくれます。,女性は l'infermiera（複数 le infermiere）。男女で語尾が変わる。,,町で働く人
L4-0154,4,il/la pediatra,小児科医,noun,mf,"i pediatri, le pediatre",仕事・学校,"Mia figlia ha la febbre, chiamo il pediatra.",娘が熱を出したので、小児科医に電話します。,語尾は -a だが男女同形。複数は男性 pediatri、女性 pediatre。医師の -a 名詞は他に dentista など。,,町で働く人

L4-0269,4,il merluzzo,タラ,noun,m,merluzzi,食事・飲み物,Stasera mangio il merluzzo con le patate.,今夜はタラをジャガイモと一緒に食べます。,baccalà（干しダラの塩漬け）や stoccafisso（干しダラ）の原料魚。メニューでは別物として並ぶ。,,肉と魚介
L4-0172,4,la trota,マス|トラウト,noun,f,trote,食事・飲み物,Per secondo prendo la trota alla griglia.,メインにはマスのグリルをいただきます。,淡水魚。メニューでは trota alla griglia（グリル）や trota al forno（オーブン焼き）がよく見られる。,,肉と魚介
L4-0500,4,l'acciuga,アンチョビ|カタクチイワシ,noun,f,acciughe,食事・飲み物,"Vorrei una pizza con le acciughe, per favore.",アンチョビのピザをお願いします。,alice（複数 alici）も同じ魚を指す別名で、特に中南部でよく使われる。複数形は g の硬い音を保つため h が入り acciughe になる。,l'alice,肉と魚介
L4-0458,4,il polpo,タコ,noun,m,polpi,食事・飲み物,"Prendo l'insalata di polpo, per favore.",タコのサラダをください。,料理名では polpo alla griglia（タコのグリル）などが定番。小さいタコは moscardino、「イカ」は calamaro。,,肉と魚介
L4-0285,4,l'aragosta,伊勢海老|ロブスター,noun,f,aragoste,食事・飲み物,Per secondo vorrei l'aragosta alla griglia.,メインに伊勢海老のグリルをお願いします。,aragosta は主にイセエビ類（大きなハサミを持たない種）を指す。大きなハサミのある種は astice。,,肉と魚介
L4-0020,4,la ricotta,リコッタ|リコッタチーズ,noun,f,ricotte,食事・飲み物,Per primo prendo i ravioli di ricotta e spinaci.,プリモにリコッタとほうれん草のラビオリをいただきます。,乳清から作る柔らかい白いフレッシュチーズ。ラビオリやドルチェの詰め物によく使う。複数形はほとんど使わない。,,肉と魚介
L4-0445,4,il legume,豆類|豆,noun,m,legumi,食事・飲み物,"Mangio spesso legumi, come fagioli e lenticchie.",私はよく豆類、たとえばインゲン豆やレンズ豆を食べます。,複数形 i legumi で使うことが多い。fagioli（インゲン豆）、ceci（ひよこ豆）、lenticchie（レンズ豆）などの総称。,,豆・野菜・木の実
L4-0127,4,il cece,ひよこ豆,noun,m,ceci,食事・飲み物,Mi piace la zuppa di ceci.,私はひよこ豆のスープが好きです。,複数形 ceci で使うことが多い。発音は「チェーチェ」で、複数形は「チェーチ」。,,豆・野菜・木の実
L4-0117,4,l'asparago,アスパラガス,noun,m,asparagi,食事・飲み物,Per primo prendo il risotto agli asparagi.,プリモにアスパラガスのリゾットをいただきます。,母音で始まる男性名詞なので冠詞は l'。料理では複数形 asparagi で使うことが多い。,,豆・野菜・木の実
L4-0158,4,il ravanello,ラディッシュ|ハツカダイコン,noun,m,ravanelli,食事・飲み物,Mi piace l'insalata con i ravanelli.,私はラディッシュ入りのサラダが好きです。,サラダに入れる小さな赤い根菜。男性名詞で、複数形は ravanelli。,,豆・野菜・木の実
L4-0244,4,il sedano,セロリ,noun,m,sedani,食事・飲み物,"Per il soffritto servono cipolla, carota e sedano.",ソフリットには玉ねぎ、にんじん、セロリが必要です。,単数のまま野菜の総称として使うことが多い。carota、cipolla と並ぶ煮込み料理の基本の香味野菜。,,豆・野菜・木の実
L4-0091,4,il mirtillo,ブルーベリー,noun,m,mirtilli,食事・飲み物,"Vorrei una torta ai mirtilli, per favore.",ブルーベリーのケーキをお願いします。,ジャムやケーキの味でよく見かける。mirtillo は野生種のビルベリーも指し、栽培種は mirtillo gigante とも言う。,,豆・野菜・木の実
L4-0197,4,la castagna,栗,noun,f,castagne,食事・飲み物,In autunno compriamo le castagne al mercato.,秋になると、私たちは市場で栗を買います。,木は castagno（男性名詞）。焼き栗は caldarroste と呼び、秋の屋台の定番。,,豆・野菜・木の実
L4-0433,4,il fico,いちじく|いちじくの木,noun,m,fichi,食事・飲み物,Mi piacciono molto i fichi freschi con il prosciutto.,生ハムと合わせた新鮮ないちじくが大好きです。,木も実も il fico と言う（複数 fichi）。fico d'India はウチワサボテン（の実）。,,豆・野菜・木の実
L4-0340,4,la noce,くるみ,noun,f,noci,食事・飲み物,Mi piace il pane con le noci.,私はくるみ入りのパンが好きです。,複数形は noci。ナッツ類は frutta secca とも言う。noce は木材のクルミ材も指す。,,豆・野菜・木の実
L4-0232,4,il pistacchio,ピスタチオ,noun,m,pistacchi,食事・飲み物,"Vorrei un gelato al pistacchio, per favore.",ピスタチオのジェラートをください。,ジェラートの定番フレーバー。gusto al pistacchio のように al を使う。シチリア産のピスタチオが有名。,,豆・野菜・木の実
L4-0054,4,lo zenzero,ショウガ|生姜,noun,m,zenzeri,食事・飲み物,Vorrei un tè con zenzero e limone.,ショウガとレモン入りの紅茶をください。,z で始まるので冠詞は lo。実際には複数形はほとんど使わず、不可算名詞として扱うことが多い。,,スパイスと郷土の味
L4-0077,4,la cannella,シナモン,noun,f,cannelle,食事・飲み物,Mi piace il cappuccino con un po' di cannella.,少しシナモンを入れたカプチーノが好きです。,粉末は cannella in polvere、棒状は stecca di cannella。,,スパイスと郷土の味
L4-0068,4,la vaniglia,バニラ,noun,f,vaniglie,食事・飲み物,"Vorrei un gelato alla vaniglia, per favore.",バニラのジェラートをください。,ジェラートの味は gelato alla vaniglia のように alla ＋ 味で言う。,,スパイスと郷土の味
L4-0026,4,il rosmarino,ローズマリー,noun,m,rosmarini,食事・飲み物,Le patate al forno sono buone con il rosmarino.,ローストポテトはローズマリーとよく合います。,肉やじゃがいも料理に使う代表的なハーブ。複数形はあまり使わず、通常は単数で用いる。,,スパイスと郷土の味
L4-0466,4,la salvia,セージ,noun,f,salvie,食事・飲み物,Il burro e salvia è un condimento semplice.,セージバターは簡単なソースです。,ハーブの一種。burro e salvia はラビオリやニョッキの定番ソース。,,スパイスと郷土の味
L4-0568,4,l'origano,オレガノ,noun,m,origani,食事・飲み物,Metto un po' di origano sulla pizza.,ピザにオレガノを少しかけます。,ピザやトマトソースに欠かせないハーブ。複数形はほとんど使われず、普通は不可算的に使う。,,スパイスと郷土の味
L4-0370,4,la spezia,香辛料|スパイス,noun,f,spezie,食事・飲み物,In cucina uso molte spezie diverse.,私は料理にいろいろなスパイスをたくさん使います。,複数形 le spezie で使うことが多い。La Spezia と大文字なら港町の地名。,,スパイスと郷土の味
L4-0165,4,la senape,マスタード|からし,noun,f,（ふつう単数のみ）,食事・飲み物,"Vorrei un po' di senape sul panino, per favore.",パニーノに少しマスタードをください。,マスタード・からしのこと。ふつう不可算で、複数形はほとんど使われない。mostarda は果物のシロップ煮にからしの風味を加えた北イタリアの付け合わせで、別の食品なので混同しないこと。,la mostarda,スパイスと郷土の味
L4-0557,4,il lievito,イースト|酵母|ふくらし粉,noun,m,lieviti,食事・飲み物,Per fare la pizza serve il lievito di birra.,ピザを作るにはイースト（lievito di birra）が必要です。,lievito di birra は生イースト、lievito in polvere はベーキングパウダー。菓子用は lievito per dolci とも言う。,,スパイスと郷土の味
L4-0122,4,il cacao,ココア|カカオ,noun,m,cacao（複数形はほとんど使われない）,食事・飲み物,Mi piace il gelato al cacao.,私はココア味のジェラートが好きです。,粉末のカカオ（ココアパウダー）も指す。飲み物は cioccolata calda（ホットチョコレート）が一般的。,,スパイスと郷土の味
L4-0163,4,lo sciroppo,シロップ|シロップ剤,noun,m,sciroppi,食事・飲み物,Il dottore mi ha dato uno sciroppo per la tosse.,医者は私に咳止めのシロップ薬をくれました。,s＋子音で始まるので冠詞は lo、不定冠詞は uno。薬の「シロップ剤」は sciroppo per la tosse（咳止め）のように使う。,,スパイスと郷土の味
L4-0007,4,la polenta,ポレンタ|トウモロコシ粥,noun,f,polente,食事・飲み物,Per cena mangiamo la polenta con i funghi.,夕食はきのこ入りのポレンタを食べます。,北イタリアの郷土料理。トウモロコシ粉を煮て作る。そのまま食べるほか、固めて焼くこともある。,,スパイスと郷土の味
L4-0170,4,il tortellino,トルテリーニ,noun,m,tortellini,食事・飲み物,Vorrei un piatto di tortellini in brodo.,トルテリーニのスープを1皿お願いします。,ボローニャやエミリア地方の名物。通常は複数形 tortellini で使い、ブロード（brodo）入りが定番。,,スパイスと郷土の味
L4-0325,4,la frittura,揚げ物|フライ,noun,f,fritture,食事・飲み物,Prendiamo una frittura di pesce per due.,魚介のフライを2人分お願いします。,frittura di pesce は魚介のフリット盛り合わせ。揚げ物全般にも使う。,il fritto,スパイスと郷土の味
L4-0150,4,la merenda,おやつ|軽食（午後の）,noun,f,merende,食事・飲み物,I bambini fanno merenda alle quattro del pomeriggio.,子供たちは午後4時におやつを食べます。,「おやつを食べる」は fare merenda。子供の午後の軽食を指すことが多い。,lo spuntino,スパイスと郷土の味
L4-0494,4,la grappa,グラッパ|ブドウの搾りかすの蒸留酒,noun,f,grappe,食事・飲み物,Dopo cena prendiamo una grappa.,夕食後にグラッパを一杯飲みましょう。,ワインの搾りかすから作る強い蒸留酒。食後酒（digestivo）として飲まれることが多い。,,スパイスと郷土の味
L4-0625,4,analcolico,ノンアルコールの|アルコールを含まない,adj,,"analcolica, analcolici, analcoliche",食事・飲み物,Avete qualche bevanda analcolica?,何かノンアルコールの飲み物はありますか？,名詞として un analcolico（ノンアルコール飲料）の形でもよく使う。複数形は analcolici。,,スパイスと郷土の味
L4-0279,4,l'alimento,食品|食料,noun,m,alimenti,食事・飲み物,Questi alimenti vanno conservati in frigorifero.,これらの食品は冷蔵庫で保存してください。,複数形 alimenti で「食料品」の意味でよく使う。cibo より改まった語。,,スパイスと郷土の味
L4-0031,4,sbucciare,皮をむく,verb,,"sbuccio, sbucci, sbuccia, sbucciamo, sbucciate, sbucciano",食事・飲み物,"Puoi sbucciare le patate, per favore?",ジャガイモの皮をむいてくれますか？,果物・野菜の皮をむく動作。-are 動詞で規則変化。近過去は avere を使う（ho sbucciato）。,,下ごしらえと調理
L4-0544,4,grattugiare,すりおろす|おろし金でおろす,verb,,"grattugio, grattugi, grattugia, grattugiamo, grattugiate, grattugiano",食事・飲み物,Puoi grattugiare il formaggio sulla pasta?,パスタにチーズをすりおろしてくれる？,チーズや野菜をおろし金（grattugia）で削るときに使う。parmigiano grattugiato は粉チーズ。,,下ごしらえと調理
L4-0220,4,grigliare,網焼きにする|グリルする,verb,,"griglio, grigli, griglia, grigliamo, grigliate, grigliano",食事・飲み物,Domenica grigliamo la carne in giardino.,日曜日は庭で肉を焼きます。,規則動詞（-are）。名詞は la griglia（グリル）、una grigliata は焼き肉パーティー。,,下ごしらえと調理
L4-0288,4,arrostire,ローストする|焼く,verb,,"arrostisco, arrostisci, arrostisce, arrostiamo, arrostite, arrostiscono",食事・飲み物,Domenica arrostisco il pollo con le patate.,日曜日はジャガイモと一緒に鶏肉をオーブンで焼きます。,-isco型の動詞。肉や野菜をオーブンや直火で焼くときに使う。過去分詞は規則形 arrostito。,,下ごしらえと調理
L4-0618,4,lessare,茹でる,verb,,"lesso, lessi, lessa, lessiamo, lessate, lessano",食事・飲み物,Lessiamo le patate per dieci minuti.,じゃがいもを10分間茹でましょう。,水や湯で茹でる意味。名詞 lesso は茹で肉。パスタを茹でるなら cuocere や buttare la pasta がよく使われる。,,下ごしらえと調理
L4-0050,4,versare,注ぐ|こぼす|振り込む,verb,,"verso, versi, versa, versiamo, versate, versano",食事・飲み物,Posso versare un po' di vino?,ワインを少し注いでもいいですか？,規則動詞。飲み物を注ぐ以外に、お金を払い込む意味や液体をこぼす意味でも使う。,,下ごしらえと調理
L4-0104,4,sciogliere,溶かす|ほどく|解く,verb,,"sciolgo, sciogli, scioglie, sciogliamo, sciogliete, sciolgono（過去分詞 sciolto）",食事・飲み物,Sciogli il burro in una pentola.,鍋でバターを溶かしてください。,過去分詞が不規則。再帰形 sciogliersi は「溶ける」。sciogliere i capelli は「髪を下ろす」。,,下ごしらえと調理
L4-0059,4,conservare,保存する|保つ|取っておく,verb,,"conservo, conservi, conserva, conserviamo, conservate, conservano",食事・飲み物,Dove posso conservare questi documenti importanti?,この大切な書類はどこに保管できますか？,食品は「冷蔵庫で保存」conservare in frigo。「Conservare in luogo fresco」は商品表示の定番。規則動詞。,,下ごしらえと調理
L4-0523,4,la cottura,調理|加熱|焼き加減,noun,f,cotture,食事・飲み物,Come preferisce la cottura della carne?,お肉の焼き加減はどうなさいますか？,レストランでは肉の焼き加減の意味でよく使う。cottura al forno は「オーブン調理」。,,下ごしらえと調理
L4-0116,4,apparecchiare,食卓の用意をする|食卓を整える,verb,,"apparecchio, apparecchi, apparecchia, apparecchiamo, apparecchiate, apparecchiano",食事・飲み物,Puoi apparecchiare la tavola per cinque persone?,5人分のテーブルの用意をしてくれる？,普通は apparecchiare la tavola の形で使う。反対は sparecchiare（食卓を片付ける）。,apparecchiare la tavola,下ごしらえと調理
L4-0314,4,la dispensa,食料庫|食品棚|配布資料,noun,f,dispense,食事・飲み物,Prendo la pasta dalla dispensa.,食料庫からパスタを取ってくるね。,台所の食品を保管する小部屋や棚。大学の講義資料（プリント）の意味もある。,,下ごしらえと調理
L4-0191,4,il barattolo,瓶|保存容器|缶,noun,m,barattoli,食事・飲み物,Metti la marmellata in un barattolo di vetro.,ジャムをガラスの瓶に入れてください。,広口の瓶や缶、容器を指す。ジャムやツナ缶のように食品の容器によく使う。飲み物用の細口の瓶は bottiglia。,,下ごしらえと調理
L4-0599,4,il tagliere,まな板|カッティングボード,noun,m,taglieri,食事・飲み物,"Puoi passarmi il tagliere di legno, per favore?",木のまな板を取ってもらえますか？,料理用のまな板のほか、レストランで出る盛り合わせ（tagliere di salumi e formaggi）も指す。,,台所の道具
L4-0621,4,il tegame,平鍋|浅鍋,noun,m,tegami,食事・飲み物,"Metti il tegame sul fuoco, per favore.",鍋を火にかけてください。,取っ手付きの浅い平鍋。フライパンは padella が一般的。複数形 tegami は日本語の「手紙」と同音だが無関係。,,台所の道具
L4-0517,4,la casseruola,両手鍋|片手鍋,noun,f,casseruole,食事・飲み物,Metti l'acqua nella casseruola e accendi il fuoco.,鍋に水を入れて、火をつけて。,深さのある調理用の鍋で、長い柄が1本のものも両側に取っ手が付くものもある。pentola は鍋一般、pentolino は小さな片手鍋（ミルクパンなど）。,,台所の道具
L4-0402,4,il bollitore,やかん|電気ケトル,noun,m,bollitori,食事・飲み物,Metto l'acqua nel bollitore per il tè.,お茶のために、やかんに水を入れます。,bollire（沸騰する）からできた語。電気式は bollitore elettrico とも言う。,,台所の道具
L4-0510,4,la caffettiera,マキネッタ|コーヒーメーカー|コーヒーポット,noun,f,caffettiere,食事・飲み物,Ogni mattina preparo il caffè con la caffettiera.,毎朝、マキネッタでコーヒーを淹れます。,イタリアの家庭では直火式のモカ（マキネッタ）を指すことが多い。caffettiera napoletana は別型の器具。,,台所の道具
L4-0214,4,il frullatore,ミキサー|ブレンダー,noun,m,frullatori,食事・飲み物,Uso il frullatore per fare il frullato di frutta.,フルーツスムージーを作るのにミキサーを使います。,動詞 frullare（泡立てる、ミキサーにかける）から。frullato はスムージーやシェイク。,,台所の道具
L4-0046,4,il tostapane,トースター,noun,m,tostapane（不変）,食事・飲み物,"Il tostapane è rotto, non funziona più.",トースターが壊れていて、もう動きません。,複合名詞で複数形も同形（i tostapane）。動詞 tostare（こんがり焼く）の活用形 tosta ＋ pane（パン）から成る。,,台所の道具
L4-0308,4,il cucchiaino,ティースプーン|小さじ,noun,m,cucchiaini,食事・飲み物,Mi serve un cucchiaino per il caffè.,コーヒー用のティースプーンが必要です。,cucchiaio（スプーン）の指小形。レシピでは「小さじ1杯」の意味でも使う。,,台所の道具
L4-0379,4,il vassoio,盆|トレイ,noun,m,vassoi,食事・飲み物,Il cameriere porta i bicchieri su un vassoio.,ウェイターはグラスをトレイに載せて運びます。,複数形は vassoi（-io で i にアクセントなし → 語尾 -i のみ）。カフェやセルフサービスの食堂でよく使う。,,台所の道具
L4-0042,4,squisito,とても美味しい|絶品の,adj,,"squisita, squisiti, squisite",食事・飲み物,"Questo tiramisù è squisito, complimenti al cuoco!",このティラミスは絶品です、シェフに賛辞を！,buono より強い褒め言葉。料理や飲み物に使い、人の親切さや上品さにも使える。,,味わう・食べる
L4-0221,4,gustoso,おいしい|風味のよい,adj,,"gustosa, gustosi, gustose",食事・飲み物,Questo piatto di pasta è molto gustoso.,このパスタ料理はとてもおいしい。,味が豊かで食欲をそそるという意味。buono より味の濃さや風味を強調する。,,味わう・食べる
L4-0617,4,gustare,味わう|堪能する,verb,,"gusto, gusti, gusta, gustiamo, gustate, gustano",食事・飲み物,Mi piace gustare un buon gelato in piazza.,広場でおいしいジェラートを味わうのが好きです。,他動詞で、ゆっくり味わって楽しむニュアンス。日常でも普通に使う。assaggiare は「味見する・少し試す」で意味が異なる。,,味わう・食べる
L4-0081,4,croccante,カリカリの|パリッとした|サクサクの,adj,,croccanti,食事・飲み物,La pizza è sottile e molto croccante.,このピザは薄くて、とてもパリッとしています。,-e 形容詞なので男女同形で、複数は croccanti。パン、ピザ、揚げ物、ビスケットなどによく使う。,,味わう・食べる
L4-0386,4,cremoso,クリーミーな|なめらかな,adj,,"cremosa, cremosi, cremose",食事・飲み物,Questo gelato è davvero molto cremoso.,このジェラートは本当にとてもクリーミーです。,ジェラート、リゾット、ソース、チーズなどの舌触りを表す。名詞は crema（クリーム）。,,味わう・食べる
L4-0179,4,acido,酸っぱい|酸性の,adj,,"acida, acidi, acide",食事・飲み物,Questo limone è troppo acido per me.,このレモンは私には酸っぱすぎます。,味の「酸っぱい」は acido のほか agro も使う（agrodolce「甘酸っぱい」など）。日常会話では acido が一般的。,agro,味わう・食べる
L4-0030,4,sazio,満腹の|お腹がいっぱいの,adj,,"sazia, sazi, sazie",食事・飲み物,"Grazie, sono sazio, non mangio più.",ありがとう、お腹がいっぱいで、もう食べません。,会話では Sono pieno. や Sono a posto.（もう結構です）もよく使う。,pieno,味わう・食べる
L4-0559,4,masticare,噛む|咀嚼する,verb,,"mastico, mastichi, mastica, mastichiamo, masticate, masticano",食事・飲み物,Devi masticare bene il cibo prima di mandarlo giù.,食べ物は飲み込む前によく噛まなければいけません。,食べ物を噛む意味。噛みつく・かじるは mordere。chewing gum は gomma da masticare。,,味わう・食べる
L4-0563,4,mordere,噛む|噛みつく,verb,,"mordo, mordi, morde, mordiamo, mordete, mordono（過去分詞 morso）",食事・飲み物,"Attenzione, quel cane morde!",気をつけて、あの犬は噛みますよ！,過去分詞 morso が不規則。食べ物を噛み砕くのは masticare。動物や虫が噛むときは mordere。,,味わう・食べる
L4-0426,4,la digestione,消化,noun,f,digestioni,食事・飲み物,Una passeggiata dopo cena aiuta la digestione.,夕食後の散歩は消化を助けます。,「消化が悪い」は ho problemi di digestione や digestione difficile と言う。食後に飲む酒は digestivo（食後酒）。,,味わう・食べる
L4-0427,4,dimagrire,やせる|体重が減る,verb,,"dimagrisco, dimagrisci, dimagrisce, dimagriamo, dimagrite, dimagriscono",食事・飲み物,Vorrei dimagrire un po' prima dell'estate.,夏の前に少しやせたいです。,-isc- 型の動詞。近過去は essere を助動詞にとる（sono dimagrito/a）。反意語は ingrassare。,,味わう・食べる
L4-0028,4,la salumeria,ハム・サラミ専門店|惣菜店,noun,f,salumerie,店・買い物,Compro il prosciutto in una salumeria vicino a casa.,家の近くのハム専門店で生ハムを買います。,ハム・サラミ・チーズなどを量り売りする店。salumi は加工肉類の総称。,,お店で
L4-0320,4,la ferramenta,金物店|金物,noun,f,ferramenta（不変）,店・買い物,Dove posso trovare una ferramenta qui vicino?,この近くに金物店はありますか？,店の意味では negozio di ferramenta とも言う。工具や釘、電球などを買える店。,il negozio di ferramenta,お店で
L4-0384,4,la bottega,工房|小さな店,noun,f,botteghe,店・買い物,Questa bottega vende ceramiche fatte a mano.,この工房は手作りの陶器を売っています。,職人の仕事場を兼ねた店を指すことが多い。複数形は -ghe で、h を入れて g の硬い音を保つ。,,お店で
L4-0099,4,il reparto,売り場|部門|病棟,noun,m,reparti,店・買い物,Il reparto scarpe è al secondo piano.,靴売り場は3階にあります。,イタリアの階数は1階が piano terra なので、secondo piano は日本式では3階。デパートの売り場や病院の病棟にも使う。,,お店で
L4-0199,4,il cestino,買い物かご|ごみ箱（小型の）|かご,noun,m,cestini,店・買い物,Metto la frutta nel cestino del negozio.,果物を店のかごに入れます。,cesto（大きなかご）の指小形。紙くず用の小さなごみ箱も cestino と言う。,il cesto,お店で
L4-0203,4,la confezione,包装|パック|パッケージ,noun,f,confezioni,店・買い物,"Vorrei una confezione di biscotti, per favore.",ビスケットを1パックください。,店では「箱入り・袋入りの商品」の意味でよく使う。confezione regalo は「ギフト包装」。,,お店で
L4-0439,4,incartare,包装する|包む,verb,,"incarto, incarti, incarta, incartiamo, incartate, incartano",店・買い物,"Può incartarlo per regalo, per favore?",プレゼント用に包んでいただけますか？,店で「包んでください」は Me lo incarta? とも言う。プレゼント用は un pacchetto regalo。,impacchettare,お店で
L4-0227,4,la marca,ブランド|銘柄,noun,f,marche,店・買い物,Che marca di vino preferisci?,どの銘柄のワインが好き？,商品のブランド・メーカー名。marca da bollo は「収入印紙」で、役所の手続きで必要になる。,il marchio,お店で
L4-0334,4,il marchio,ブランド|商標,noun,m,marchi,店・買い物,Questo marchio è molto famoso in Italia.,このブランドはイタリアでとても有名です。,複数形は marchi（-chi）。「ブランド」は marca も使う。marchio は商標・刻印の意味が強い。,la marca,お店で
L4-0098,4,la pubblicità,広告|宣伝|公表,noun,f,pubblicità（不変）,店・買い物,Non mi piace la pubblicità in televisione.,私はテレビの広告が好きではありません。,-à で終わる名詞は複数形も同形。広告1件は annuncio pubblicitario、スポットは spot とも言う。,,お店で
L4-0465,4,il saldo,残高|差引残額|（複数形 i saldi で）セール,noun,m,saldi,店・買い物,In gennaio ci sono i saldi in tutti i negozi.,1月はどの店でもセールがあります。,「セール」の意味では普通は複数形 i saldi を使う。単数 il saldo は「残高、残金」の意味。,,お店で
L4-0295,4,la bolletta,公共料金の請求書|請求書（電気・ガスなどの）,noun,f,bollette,店・買い物,Devo pagare la bolletta della luce entro venerdì.,金曜日までに電気代を払わなければなりません。,luce（電気）、gas、acqua など公共料金の請求書。レストランの勘定書は conto、店のレシートは scontrino。,,お店で
L4-0032,4,scambiare,交換する|取り違える,verb,,"scambio, scambi, scambia, scambiamo, scambiate, scambiano",店・買い物,Posso scambiare questa maglia con una più grande?,このセーターをもっと大きいものと交換できますか？,店での交換は scambiare や cambiare。「A を B と取り違える」は scambiare A per B。,,お店で
L4-0019,4,restituire,返す|返品する|返却する,verb,,"restituisco, restituisci, restituisce, restituiamo, restituite, restituiscono",店・買い物,Posso restituire questa camicia se non va bene?,このシャツが合わなければ返品できますか？,-isc- 型の動詞。近過去は avere を助動詞にとる（ho restituito）。店の返品は restituire か rendere とも言う。,rendere,お店で
L4-0272,4,rendere,返す|〜にする,verb,,"rendo, rendi, rende, rendiamo, rendete, rendono（過去分詞 reso）",店・買い物,Questa notizia mi rende molto felice.,このニュースを聞いてとても嬉しいです。,過去分詞 reso は不規則。rendere + 形容詞で「〜にする」。「返す」は restituire のほうが一般的。,restituire,お店で
L4-0264,4,il cancello,門扉|門,noun,m,cancelli,住まい・日用品,"Per favore, chiudi il cancello quando esci.",出かけるときは門を閉めてください。,庭や敷地の出入口にある開閉式の門。cancello d'ingresso は「入口の門」。空港の搭乗口は cancello ではなく uscita や gate と言う。,,玄関から部屋まで
L4-0459,4,il portone,（建物の）大扉|正面玄関|表門,noun,m,portoni,住まい・日用品,Il portone del palazzo è sempre chiuso a chiave.,建物の大扉はいつも鍵がかかっています。,アパートなど建物の共用入口の大きな扉。部屋や家の玄関ドアは porta。指小形ではなく porta の増大形。,,玄関から部屋まで
L4-0266,4,il citofono,インターホン,noun,m,citofoni,住まい・日用品,Suona il citofono e aspetta che qualcuno risponda.,インターホンを鳴らして、誰かが応答するのを待ってください。,建物の入口にある呼び出し用の機器。citofonare は「インターホンを鳴らす」。複数形は -i。,,玄関から部屋まで
L4-0076,4,il campanello,呼び鈴|ベル,noun,m,campanelli,住まい・日用品,"Ho suonato il campanello, ma nessuno ha aperto.",呼び鈴を鳴らしましたが、誰も開けてくれませんでした。,玄関の呼び鈴は suonare il campanello で「鳴らす」。campana（鐘）の指小形。,,玄関から部屋まで
L4-0193,4,bussare,ノックする|たたく,verb,,"busso, bussi, bussa, bussiamo, bussate, bussano",住まい・日用品,Qualcuno bussa alla porta.,誰かがドアをノックしています。,「ドアをノックする」は bussare alla porta と前置詞 a を使う。自動詞で直接目的語はとらない。,,玄関から部屋まで
L4-0629,4,l'atrio,ロビー|玄関ホール,noun,m,atri,住まい・日用品,Ci vediamo nell'atrio dell'albergo alle otto.,8時にホテルのロビーで会いましょう。,ホテルのロビーは la hall とも言う（reception は「フロント・受付」のことで別物）。複数形は atri。,la hall,玄関から部屋まで
L4-0274,4,il soffitto,天井,noun,m,soffitti,住まい・日用品,Il soffitto della camera è molto alto.,部屋の天井はとても高いです。,複数形は soffitti。家の「天井」を指す一般的な語で、天井画なら il soffitto affrescato のように使う。,,玄関から部屋まで
L4-0009,4,la poltrona,肘掛け椅子|安楽椅子,noun,f,poltrone,住まい・日用品,Mi siedo sulla poltrona e leggo un libro.,私は肘掛け椅子に座って本を読みます。,肘掛けのある一人用の椅子。劇場や映画館の座席（客席）も poltrona と言う。ソファは divano。,,玄関から部屋まで
L4-0611,4,il comodino,ナイトテーブル|ベッドサイドテーブル,noun,m,comodini,住まい・日用品,Ho lasciato gli occhiali sul comodino della camera.,部屋のナイトテーブルに眼鏡を置き忘れました。,ベッドの脇に置く小さな収納家具。形容詞 comodo（便利な、快適な）に由来する語。,,玄関から部屋まで
L4-0063,4,il materasso,マットレス,noun,m,materassi,住まい・日用品,Questo materasso è troppo duro per me.,このマットレスは私には硬すぎます。,ホテルや民宿で寝具の硬さを伝えるときに使う。duro（硬い）、morbido（柔らかい）と合わせて覚えるとよい。,,玄関から部屋まで
L4-0169,4,il tappeto,じゅうたん|敷物,noun,m,tappeti,住まい・日用品,Abbiamo comprato un tappeto per il salotto.,私たちは居間用にじゅうたんを買いました。,床全体を覆う絨毯も小さな敷物も tappeto。玄関マットは zerbino、バスマットは tappetino。,,玄関から部屋まで
L4-0560,4,la mensola,棚板|壁付け棚,noun,f,mensole,住まい・日用品,Metto i libri sulla mensola in salotto.,本をリビングの棚に置きます。,壁に取り付ける小さな棚。本棚全体は scaffale や libreria、棚の段は ripiano。,,玄関から部屋まで
L4-0610,4,l'arredamento,家具調度|インテリア,noun,m,arredamenti,住まい・日用品,L'arredamento di questo appartamento è moderno e semplice.,このアパートの家具調度は現代的でシンプルです。,部屋全体の家具・内装を指す集合的な語。家具1点は il mobile、複数は i mobili。,,玄関から部屋まで
L4-0600,4,il termosifone,放熱器|ラジエーター,noun,m,termosifoni,住まい・日用品,Il termosifone in camera non funziona.,部屋の暖房が動きません。,温水式の放熱器を指す。日本のエアコン暖房ではなく、壁際に据え付ける鋳鉄製やパネル型の暖房。,il calorifero,玄関から部屋まで
L4-0550,4,l'interruttore,スイッチ|開閉器,noun,m,interruttori,住まい・日用品,Dov'è l'interruttore della luce?,電気のスイッチはどこですか？,壁の電灯スイッチなど。機器の押しボタンは pulsante と言う。家庭のブレーカー（漏電遮断器）は通称 salvavita と呼ぶことが多く、正式には interruttore differenziale と言う。,,玄関から部屋まで
L4-0554,4,la lampadina,電球,noun,f,lampadine,住まい・日用品,"La lampadina del bagno è bruciata, ne serve una nuova.",浴室の電球が切れたので、新しいのが必要です。,電球が切れるは bruciarsi / fulminarsi。lampada は「ランプ・照明器具」で別物。,,玄関から部屋まで
L4-0406,4,la candela,ろうそく,noun,f,candele,住まい・日用品,Accendiamo una candela sul tavolo.,テーブルの上にろうそくをともしましょう。,candela は車の「点火プラグ」の意味でも使う。「火をつける」は accendere。,,玄関から部屋まで
L4-0245,4,la serratura,錠前|鍵穴,noun,f,serrature,住まい・日用品,La serratura della porta è rotta e non riesco ad aprire.,ドアの錠が壊れていて、開けられません。,ドアなどに付く錠そのもの。鍵は la chiave。鍵穴は buco della serratura とも言う。,,玄関から部屋まで
L4-0196,4,la cassaforte,金庫|セーフティボックス,noun,f,casseforti,住まい・日用品,C'è una cassaforte nella camera?,部屋に金庫はありますか？,複数形は casseforti（まれに cassaforti）。cassa と forte の複合語で、ホテルの貴重品用金庫に使う。,,玄関から部屋まで
L4-0112,4,traslocare,引っ越す|転居する,verb,,"trasloco, traslochi, trasloca, traslochiamo, traslocate, traslocano",住まい・日用品,Il mese prossimo trasloco a Bologna per lavoro.,来月、仕事でボローニャに引っ越します。,"名詞は il trasloco（引っ越し）。-care 動詞なので tu と noi で h が入る（traslochi, traslochiamo）。",cambiare casa,玄関から部屋まで
L4-0167,4,spazzare,掃く|掃除する（ほうきで）,verb,,"spazzo, spazzi, spazza, spazziamo, spazzate, spazzano",住まい・日用品,Devo spazzare il pavimento della cucina.,台所の床を掃かなければなりません。,ほうき（la scopa）で掃くこと。scopare は卑俗な意味もあるので避ける。,,家事と道具
L4-0168,4,stirare,アイロンをかける,verb,,"stiro, stiri, stira, stiriamo, stirate, stirano",住まい・日用品,Devo stirare la camicia prima di uscire.,出かける前にシャツにアイロンをかけなければなりません。,アイロンは il ferro da stiro。stirarsi un muscolo は「筋を違える」の意味でも使う。,,家事と道具
L4-0211,4,il ferro da stiro,アイロン,noun,m,ferri da stiro,住まい・日用品,C'è un ferro da stiro in camera?,部屋にアイロンはありますか？,stirare（アイロンをかける）から。il ferro だけだと「鉄」。ホテルでは貸し出しを頼むことが多い。,,家事と道具
L4-0205,4,cucire,縫う|縫い物をする,verb,,"cucio, cuci, cuce, cuciamo, cucite, cuciono",住まい・日用品,Mia nonna cuce i vestiti per tutta la famiglia.,祖母は家族みんなの服を縫ってくれます。,-ire 動詞だが -isc- 型ではない。cucio・cuciono は c を「チ」の音に保つため i が入り、cucio は「クーチョ」と読む（この i は発音しない）。過去分詞は cucito。,,家事と道具
L4-0250,4,stendere,広げる|干す|伸ばす,verb,,"stendo, stendi, stende, stendiamo, stendete, stendono（過去分詞 steso）",住まい・日用品,Stendo il bucato sul balcone.,バルコニーに洗濯物を干します。,過去分詞が不規則。stendere il bucato で「洗濯物を干す」、stendere la tovaglia は「テーブルクロスを広げる」。,,家事と道具
L4-0241,4,riordinare,片づける|整理する,verb,,"riordino, riordini, riordina, riordiniamo, riordinate, riordinano",住まい・日用品,Devo riordinare la camera prima di uscire.,出かける前に部屋を片づけなければなりません。,規則動詞（-are）。散らかったものを元の順序や場所に戻すニュアンス。「注文し直す」の意味もある。,,家事と道具
L4-0313,4,disordinato,散らかった|だらしない|乱雑な,adj,,"disordinata, disordinati, disordinate",住まい・日用品,La tua camera è sempre molto disordinata.,君の部屋はいつもとても散らかっている。,物（部屋・机）にも人にも使える。反対語は ordinato（整頓された、きちんとした）。,,家事と道具
L4-0400,4,l'aspirapolvere,掃除機,noun,m,aspirapolvere（不変）,住まい・日用品,Passo l'aspirapolvere in salotto ogni sabato.,毎週土曜日にリビングに掃除機をかけます。,複数形も同形（gli aspirapolvere）。「掃除機をかける」は passare l'aspirapolvere。,,家事と道具
L4-0346,4,la pattumiera,ゴミ箱|ごみ入れ,noun,f,pattumiere,住まい・日用品,"Per favore, butta la carta nella pattumiera.",その紙はゴミ箱に捨ててください。,主に台所などで使う家庭用のゴミ箱。紙くず用の小さなくずかごや街頭の小型ゴミ箱は cestino、屋外の大型収集容器は bidone や cassonetto と言う。,il cestino,家事と道具
L4-0100,4,il rifiuto,ごみ|廃棄物|拒絶,noun,m,rifiuti,住まい・日用品,Dove posso buttare i rifiuti?,ごみはどこに捨てられますか？,「ごみ」の意味では複数形 rifiuti が普通。単数 rifiuto は「拒否、拒絶」の意味でも使う。分別収集は raccolta differenziata。,,家事と道具
L4-0273,4,il secchio,バケツ,noun,m,secchi,住まい・日用品,Mi serve un secchio per lavare il pavimento.,床を洗うのにバケツが必要です。,複数形は secchi（-chi で綴る）。ビーチ用の砂遊びバケツも secchiello（指小形）と言う。,,家事と道具
L4-0237,4,la polvere,ほこり|粉末|粉,noun,f,polveri,住まい・日用品,C'è molta polvere sui mobili.,家具にたくさんほこりがたまっています。,「ほこり」の意味では通常単数で使う。複数 polveri は粉末の種類を指す。caffè in polvere は粉末コーヒー。,,家事と道具
L4-0404,4,il cacciavite,ドライバー|ねじ回し,noun,m,cacciaviti,住まい・日用品,Mi presti un cacciavite? Devo aprire questo piccolo coperchio.,ドライバーを貸してくれる？この小さなふたを開けたいの。,複数形は cacciaviti で単数と綴りが変わる（-e → -i）。cacciavite は合成語で、複数は語末が変わる。,,家事と道具
L4-0129,4,il chiodo,釘|くぎ,noun,m,chiodi,住まい・日用品,Mi serve un martello per piantare questo chiodo.,この釘を打つのにハンマーが必要です。,複数形は -i で規則的。慣用表現 avere un chiodo fisso は「頭から離れない考えがある」の意。,,家事と道具
L4-0435,4,il gancio,フック|かぎ,noun,m,ganci,住まい・日用品,Puoi appendere la giacca a quel gancio.,その上着はあのフックにかけていいですよ。,壁やドアの吊り具からクレーンのフック、留め金まで、物を引っかける「かぎ」全般を指す。gancio は「ボクシングのフック」の意味でも使う。,,家事と道具
L4-0057,4,appendere,掛ける|吊るす,verb,,"appendo, appendi, appende, appendiamo, appendete, appendono（過去分詞 appeso）",住まい・日用品,Appendo il quadro in salotto.,絵をリビングに掛けます。,過去分詞が不規則（appeso）。「電話を切る」は riattaccare、「服を掛ける」にも使える。,,家事と道具
L4-0301,4,la colla,のり|接着剤,noun,f,colle,住まい・日用品,Mi serve della colla per attaccare questa foto.,この写真を貼るのりが必要です。,colla は文房具ののりから強力接着剤まで広く指す。「のりで貼る・接着する」は incollare、「貼る・くっつける」は attaccare（テープや画鋲にも使う）。,l'adesivo,家事と道具
L4-0126,4,la cassetta,小箱|箱|ケース,noun,f,cassette,住まい・日用品,Ho messo le chiavi nella cassetta delle lettere.,鍵を郵便受けに入れました。,cassa（大きな箱）の指小形。cassetta delle lettere は郵便受け、cassetta di sicurezza は貸金庫。,,家事と道具
L4-0410,4,il cesto,かご|バスケット,noun,m,cesti,住まい・日用品,Metto la frutta nel cesto sul tavolo.,果物をテーブルの上のかごに入れます。,編んだかごをはじめ、かご全般を指す。洗濯かごは cesto della biancheria、ごみ箱は cestino。,la cesta,家事と道具
L4-0177,4,l'accendino,ライター,noun,m,accendini,住まい・日用品,"Scusi, ha un accendino?",すみません、ライターをお持ちですか？,母音で始まるので単数は l'accendino。「火を貸してください」は Ha da accendere? とも言う。,,家事と道具
L4-0111,4,lo sportello,（戸棚・車などの）扉|窓口,noun,m,sportelli,住まい・日用品,Lo sportello della cucina è rotto.,キッチンの戸棚の扉が壊れています。,戸棚・車のドアなど小さな扉。銀行・郵便局の窓口（sportello）の意味でも頻出。建物の大きな扉は porta。,,家事と道具
L4-0069,4,l'accappatoio,バスローブ,noun,m,accappatoi,住まい・日用品,Nella camera c'è un accappatoio per ogni ospite.,部屋には宿泊客ごとにバスローブがあります。,母音で始まる単数名詞なので冠詞は l'。ホテルやプールで使う。,,身じたくと小物
L4-0189,4,il bagnoschiuma,ボディソープ|バスジェル,noun,m,bagnoschiuma（不変）,住まい・日用品,"Ho finito il bagnoschiuma, ne compro uno nuovo.",ボディソープがなくなったので、新しいのを買います。,複合語で複数形は不変。bagno（入浴）と schiuma（泡）から成る。シャワージェルは docciaschiuma とも言う。,il docciaschiuma,身じたくと小物
L4-0578,4,il rasoio,かみそり|シェーバー,noun,m,rasoi,住まい・日用品,Ho dimenticato il rasoio in albergo.,ホテルにかみそりを忘れてきました。,電気シェーバーは rasoio elettrico。複数形は rasoi。,,身じたくと小物
L4-0349,4,il pettine,くし,noun,m,pettini,住まい・日用品,Ho dimenticato il pettine in albergo.,ホテルにくしを忘れてきました。,髪をとかす道具。「とかす」は pettinare、再帰形 pettinarsi は「自分の髪をとかす」。,,身じたくと小物
L4-0027,4,il rossetto,口紅,noun,m,rossetti,住まい・日用品,"Vorrei provare questo rossetto rosso, per favore.",この赤い口紅を試してみたいのですが。,rosso（赤）に縮小辞 -etto が付いた語。「口紅を塗る」は mettersi il rossetto。,,身じたくと小物
L4-0276,4,truccarsi,化粧をする|メイクをする,verb,,"mi trucco, ti trucchi, si trucca, ci trucchiamo, vi truccate, si truccano",住まい・日用品,Mi trucco sempre prima di uscire.,出かける前にいつも化粧をします。,再帰動詞。tu の trucchi と noi の trucchiamo は h を挿入して /k/ の音を保つ。近過去は essere を使う（mi sono truccata）。,,身じたくと小物
L4-0061,4,il fazzoletto,ハンカチ|ティッシュ,noun,m,fazzoletti,住まい・日用品,Hai un fazzoletto di carta? Ho il naso che cola.,ティッシュ持ってる？鼻水が出るんだ。,紙のものは fazzoletto di carta。布のハンカチは fazzoletto di stoffa。首や頭に巻くスカーフ状のものも指す。,,身じたくと小物
L4-0118,4,il berretto,（縁なしの）帽子|ニット帽,noun,m,berretti,住まい・日用品,"Vorrei provare questo berretto di lana, per favore.",このウールの帽子を試着したいのですが。,縁のない帽子の総称。縁付きの帽子は cappello。ベレー帽は basco とも言う。,,身じたくと小物
L4-0201,4,la collana,ネックレス|首飾り,noun,f,collane,住まい・日用品,Vorrei comprare una collana per mia madre.,母にネックレスを買いたいのですが。,宝飾店は la gioielleria。「指輪」は l'anello、「ブレスレット」は il braccialetto。,,身じたくと小物
L4-0376,4,la tuta,ジャージ|トレーニングウェア|作業着,noun,f,tute,住まい・日用品,Per correre metto sempre la tuta.,走るときはいつもジャージを着ます。,上下そろいのスポーツウェアや、つなぎの作業着を指す。tuta da ginnastica は「ジャージ上下」。,,身じたくと小物
L4-0106,4,la seta,絹|シルク,noun,f,sete,住まい・日用品,Questa sciarpa è di seta pura.,このスカーフはシルク100%です。,素材を言うときは di seta（絹の）。seta には動植物の「剛毛」という意味もある。,,身じたくと小物
L4-0481,4,il tessuto,生地|布|織物,noun,m,tessuti,住まい・日用品,Questo tessuto è morbido e molto leggero.,この生地は柔らかくてとても軽いです。,服や家具用の布地全般。stoffa もほぼ同じ意味で日常的によく使う。生物学の「組織」の意味もある。,la stoffa,身じたくと小物
L4-0603,4,il veicolo,車両|乗り物,noun,m,veicoli,交通・移動,I veicoli privati non possono entrare nel centro storico.,自家用車は歴史地区に入れません。,自動車・バイクなど道路を走る乗り物全般を指す改まった語。日常会話では macchina や auto がよく使われる。,,車とバイク
L4-0539,4,il furgone,バン|小型トラック,noun,m,furgoni,交通・移動,Abbiamo noleggiato un furgone per il trasloco.,引っ越しのためにバンを借りました。,荷物を運ぶ箱型の商用車。furgoncino はさらに小型の車を指す。,,車とバイク
L4-0582,4,il rimorchio,トレーラー|牽引|レッカー移動,noun,m,rimorchi,交通・移動,Il camion traina un grosso rimorchio.,トラックは大きなトレーラーを引いている。,車に引かれる被牽引車（キャンピングトレーラーなど）も指す。牽引する動詞は rimorchiare。,,車とバイク
L4-0462,4,il pulmino,マイクロバス|小型バス,noun,m,pulmini,交通・移動,Il pulmino dell'albergo ci aspetta all'aeroporto.,ホテルのマイクロバスが空港で私たちを待っています。,pullman（観光バス）の指小形。ホテルの送迎や小グループのツアーでよく使う。,il minibus,車とバイク
L4-0450,4,il monopattino,キックスクーター|電動キックボード,noun,m,monopattini,交通・移動,In città si può noleggiare un monopattino elettrico.,街では電動キックボードを借りることができます。,都市ではレンタルの電動 monopattino elettrico をよく見かける。子ども用の、足で地面を蹴って進むキックスクーターもこの語で呼ぶ。,,車とバイク
L4-0564,4,il/la motociclista,バイクに乗る人|ライダー,noun,mf,"i motociclisti, le motocicliste",交通・移動,Il motociclista si ferma al semaforo rosso.,バイクの運転者は赤信号で止まります。,-ista で終わる名詞は単数が男女同形（il/la motociclista）。複数は男性が -isti、女性が -iste になる。,,車とバイク
L4-0265,4,il/la ciclista,サイクリスト|自転車に乗る人,noun,mf,"i ciclisti, le cicliste",交通・移動,Molti ciclisti passano sul lungofiume la domenica.,日曜日には多くのサイクリストが川沿いを通ります。,語尾は -a だが男女同形。複数は男性 ciclisti、女性 cicliste。-ista の名詞は同様。,,車とバイク
L4-0558,4,il manubrio,ハンドル（自転車・バイクの）,noun,m,manubri,交通・移動,Il manubrio della bici è troppo basso per me.,この自転車のハンドルは私には低すぎます。,自転車・バイクのハンドル。車のハンドルは volante と言い、使い分ける。,,車とバイク
L4-0623,4,il volante,ハンドル|ステアリング,noun,m,volanti,交通・移動,"Tieni le mani sul volante, per favore.",ハンドルから手を離さないでください。,車のハンドルは volante。日本語の「ハンドル」を maniglia と訳さないこと。自転車のハンドルは manubrio。,,車とバイク
L4-0164,4,il sedile,座席|シート,noun,m,sedili,交通・移動,Il sedile anteriore dell'auto è molto comodo.,車の前の座席はとても快適です。,車・バス・電車などの座席そのもの（物）を指す。「席が空いていますか」は posto を使う（Questo posto è libero?）。,,車とバイク
L4-0157,4,la portiera,（車の）ドア|守衛（女性）,noun,f,portiere,交通・移動,"Per favore, chiudi bene la portiera.",ドアをきちんと閉めてください。,車や列車の乗降ドアは portiera、建物や部屋のドアは porta。男性形 il portiere は門番やゴールキーパー。,,車とバイク
L4-0412,4,il clacson,クラクション|警笛,noun,m,clacson（不変）,交通・移動,"Non suonare il clacson di notte, per favore.",夜はクラクションを鳴らさないでください。,外来語なので複数形も同形。「鳴らす」は suonare il clacson。,,車とバイク
L4-0149,4,la marcia,ギア|行進,noun,f,marce,交通・移動,Non riesco a mettere la prima marcia.,ギアが1速に入りません。,車のギアは marcia。1速は prima、バックは retromarcia。「行進、デモ行進」の意味もある。,,車とバイク
L4-0113,4,accelerare,加速する|スピードを上げる,verb,,"accelero, acceleri, accelera, acceleriamo, accelerate, accelerano",交通・移動,Il conducente accelera appena il semaforo diventa verde.,運転手は信号が青になるとすぐ加速します。,他動詞（〜を速める）にも自動詞にも使う。近過去の助動詞は、人が主語なら avere。反対語は rallentare。,,車とバイク
L4-0324,4,frenare,ブレーキをかける|減速させる,verb,,"freno, freni, frena, freniamo, frenate, frenano",交通・移動,Il conducente ha frenato all'improvviso.,運転手は突然ブレーキをかけた。,規則動詞。近過去は avere を使う（ha frenato）。il freno は「ブレーキ」。freno a mano はサイドブレーキ。,,車とバイク
L4-0234,4,lo pneumatico,タイヤ,noun,m,pneumatici,交通・移動,Lo pneumatico anteriore è a terra.,前のタイヤがパンクしています。,pneumatico は gomma より正式な語。日常会話では la gomma もよく使う。pn- で始まるので冠詞は lo（複数は gli pneumatici）が標準。il も見られるが口語的。,la gomma,車とバイク
L4-0125,4,il carburante,燃料|ガソリン（広義）,noun,m,carburanti,交通・移動,Il prezzo del carburante è aumentato questa settimana.,今週は燃料の価格が上がりました。,ガソリン・軽油などの総称。ガソリンは benzina、軽油は gasolio。ガソリンスタンドは distributore di benzina。,,車とバイク
L4-0215,4,il gasolio,軽油|ディーゼル燃料,noun,m,gasoli,交通・移動,"Questa macchina va a gasolio, non a benzina.",この車はガソリンではなく軽油で走ります。,ガソリンは la benzina。給油所では diesel とも表示される。複数形はほとんど使われない。,il diesel,車とバイク
L4-0371,4,la targa,ナンバープレート|プレート（銘板）,noun,f,targhe,交通・移動,Ho annotato la targa della macchina.,私はその車のナンバーを控えました。,複数形は h が入って targhe になる（発音は /g/ のまま）。車のナンバーは targa、番号は numero di targa。,,車とバイク
L4-0545,4,il guasto,故障|不具合,noun,m,guasti,交通・移動,C'è un guasto al motore e non possiamo partire.,エンジンに故障があって、出発できません。,機械・車・電気設備の故障に使う。guasto は形容詞「壊れた」にもなり、「故障中です」は È guasto、貼り紙では Guasto や Fuori servizio と書く。,,車とバイク
L4-0051,4,il viale,大通り|並木道,noun,m,viali,交通・移動,Il nostro albergo si trova in fondo a questo viale.,私たちのホテルはこの大通りの突き当たりにあります。,木が植えられた広い通り。地名では V.le と略され、Viale Garibaldi のように固有名の前に付く。,,道路と移動
L4-0380,4,il vicolo,路地|小道,noun,m,vicoli,交通・移動,Ci siamo persi nei vicoli del centro storico.,私たちは旧市街の路地で迷子になりました。,狭い裏通りを指す。広い通りは via、大通りは viale。,,道路と移動
L4-0155,4,la periferia,郊外|周辺部,noun,f,periferie,交通・移動,"Abito in periferia, lontano dal centro della città.",私は市の中心から遠い郊外に住んでいます。,都市の中心から離れた地域を指す。「in periferia」の形でよく使う。反対語は il centro。,,道路と移動
L4-0102,4,la rotonda,ロータリー|環状交差点,noun,f,rotonde,交通・移動,Alla rotonda prenda la seconda uscita.,ロータリーで2番目の出口から出てください。,"道路のロータリーを指す。「〜番目の出口」は la prima, la seconda uscita と言う。",,道路と移動
L4-0507,4,il bivio,分岐点|分かれ道,noun,m,bivi,交通・移動,Al prossimo bivio giri a destra.,次の分かれ道で右に曲がってください。,道路の分岐点。比喩的に「岐路、重大な選択」の意味でも使う。,,道路と移動
L4-0207,4,la deviazione,迂回路|迂回,noun,f,deviazioni,交通・移動,C'è una deviazione perché la strada è chiusa.,道路が通行止めなので迂回路があります。,道路標識の DEVIAZIONE は「迂回」。-zione で終わる名詞は女性名詞。,,道路と移動
L4-0225,4,l'ingorgo,渋滞,noun,m,ingorghi,交通・移動,Siamo bloccati in un ingorgo sulla tangenziale.,私たちは環状道路の渋滞にはまっています。,l'ingorgo は母音始まりなので冠詞は l'。交通渋滞は traffico や coda とも言う。,il traffico,道路と移動
L4-0516,4,il casello,料金所|(高速道路の)出入口,noun,m,caselli,交通・移動,Usciamo al prossimo casello e prendiamo la statale.,次の料金所で降りて、国道に入りましょう。,高速道路の料金所。uscire al casello で「インターを出る」。支払いは pagare il pedaggio（通行料）。,il casello autostradale,道路と移動
L4-0187,4,l'attraversamento,横断|通過|横断箇所,noun,m,attraversamenti,交通・移動,"Attenzione, c'è un attraversamento pedonale qui.",気をつけて、ここには横断歩道があります。,横断歩道は attraversamento pedonale が正式。会話では strisce pedonali ともいう。,,道路と移動
L4-0472,4,il sottopassaggio,地下道|アンダーパス,noun,m,sottopassaggi,交通・移動,"Per arrivare al binario, usi il sottopassaggio.",ホームへ行くには地下道を使ってください。,駅では線路の下をくぐる歩行者用通路を指す。passaggio sotterraneo とも言う。,il sottopasso,道路と移動
L4-0194,4,il cantiere,工事現場|造船所,noun,m,cantieri,交通・移動,La strada è chiusa per un cantiere.,工事のため道路は通行止めです。,道路工事や建設現場の標識 Cantiere / Lavori in corso でよく見る。cantiere navale は造船所。,,道路と移動
L4-0491,4,la discesa,下り坂|下降,noun,f,discese,交通・移動,"Attenzione, la discesa è molto ripida.",気をつけて、この下り坂はとても急です。,反対語は la salita（上り坂）。道だけでなく、スキーの滑降や価格・数値の下落にも使う。,,道路と移動
L4-0464,4,ripido,急な|険しい,adj,,"ripida, ripidi, ripide",交通・移動,La strada per il rifugio è molto ripida.,山小屋への道はとても急です。,坂道・階段・斜面など傾斜に使う。「急な（突然の）」の意味では使わない。,erto,道路と移動
L4-0275,4,il tragitto,道のり|行程|経路,noun,m,tragitti,交通・移動,Il tragitto dalla stazione all'hotel dura dieci minuti.,駅からホテルまでの道のりは10分です。,出発点から目的地までの移動の道のり（区間）を指す。percorso は「ルート、コース」、viaggio は「旅」。,il percorso,道路と移動
L4-0258,4,il trasporto,輸送|運送|交通機関,noun,m,trasporti,交通・移動,I trasporti pubblici in questa città funzionano bene.,この街の公共交通機関はよく機能しています。,mezzo di trasporto は「交通手段」。複数形 i trasporti は「交通機関」の意味でよく使う。,,道路と移動
L4-0257,4,trasportare,運ぶ|輸送する,verb,,"trasporto, trasporti, trasporta, trasportiamo, trasportate, trasportano",交通・移動,Questo autobus trasporta molti turisti ogni giorno.,このバスは毎日たくさんの観光客を運んでいます。,規則動詞（-are）。名詞は il trasporto（輸送）で、i trasporti pubblici は「公共交通機関」。,,道路と移動
L4-0311,4,dirigersi,（〜へ）向かう|進む,verb,,"mi dirigo, ti dirigi, si dirige, ci dirigiamo, vi dirigete, si dirigono（過去分詞 diretto）",交通・移動,Ci dirigiamo verso la stazione.,私たちは駅に向かっています。,再帰動詞で、行き先は verso や a で示す。過去分詞は diretto で、近過去は essere を使う（mi sono diretto/a）。,,道路と移動
L4-0460,4,procedere,進む|続行する|進行する,verb,,"procedo, procedi, procede, procediamo, procedete, procedono（過去分詞 proceduto）",交通・移動,"Per favore, procedete verso l'uscita.",出口の方へお進みください。,助動詞は、動作主を主語に「進む」の意では avere、「進展する」の意では essere。案内表示では「進め」の意でよく使われる。,,道路と移動
L4-0075,4,bloccarsi,止まる|動かなくなる|固まる,verb,,"mi blocco, ti blocchi, si blocca, ci blocchiamo, vi bloccate, si bloccano",交通・移動,L'ascensore si è bloccato tra il secondo e il terzo piano.,エレベーターが2階と3階の間で止まってしまった。,再帰動詞で、近過去は essere を使う（mi sono bloccato/a）。機械の故障や、人が緊張で固まる場面にも使う。,,道路と移動
L4-0377,4,urtare,ぶつかる|突き当たる|怒らせる,verb,,"urto, urti, urta, urtiamo, urtate, urtano",交通・移動,"Scusi, ho urtato la sua borsa.",すみません、あなたのかばんにぶつかってしまいました。,他動詞は「〜にぶつかる」で直接目的語をとる。urtare contro や in も使う。人の気持ちを害する意味もある。,,道路と移動
L4-0589,4,lo scontro,衝突|衝突事故|対立,noun,m,scontri,交通・移動,C'è stato uno scontro tra due auto.,2台の車の衝突事故がありました。,s＋子音で始まるので冠詞は lo。車の事故は incidente も使う。デモや意見の「衝突」にも使える。,,道路と移動
L4-0052,4,il visto,ビザ|査証,noun,m,visti,宿泊,Per entrare in questo paese serve il visto?,この国に入るにはビザが必要ですか？,過去分詞 visto（vedere）と同形。ビザ申請は fare domanda di visto。visto turistico は観光ビザ。,,船旅と宿
L4-0204,4,la crociera,クルーズ|船旅,noun,f,crociere,宿泊,Facciamo una crociera nel Mediterraneo questa estate.,今年の夏は地中海クルーズに行きます。,「クルーズに行く」は fare una crociera。船上の客室は cabina。,,船旅と宿
L4-0121,4,la cabina,客室（船の）|キャビン|運転室,noun,f,cabine,宿泊,"La nostra cabina è al secondo ponte, vicino alle scale.",私たちの客室は2階デッキの階段の近くです。,船の客室や飛行機の機内を指す。cabina telefonica は電話ボックス、cabina di prova は試着室。,,船旅と宿
L4-0534,4,l'equipaggio,乗務員|乗組員,noun,m,equipaggi,宿泊,L'equipaggio vi augura un buon viaggio.,乗務員一同、皆さまのご旅行の無事をお祈りしています。,飛行機・船の乗務員全体を指す集合名詞。個人は membro dell'equipaggio。,,船旅と宿
L4-0391,4,sbarcare,下船する|上陸する|（飛行機・船から）降りる|（積荷・乗客を）降ろす,verb,,"sbarco, sbarchi, sbarca, sbarchiamo, sbarcate, sbarcano",宿泊,Domani sbarchiamo a Napoli alle otto.,明日8時にナポリで下船します。,"船・飛行機から降りる場面で使う。-chi, -chiamo と h が入る綴りに注意。近過去は自動詞なら essere、他動詞なら avere。",,船旅と宿
L4-0562,4,il molo,桟橋|埠頭|防波堤,noun,m,moli,宿泊,Il traghetto parte dal molo numero due.,フェリーは2番桟橋から出ます。,港で船が着く突き出た岸壁。船着き場の意味でよく使う。防波堤の意味もある。,,船旅と宿
L4-0105,4,lo scompartimento,（列車の）客室|コンパートメント,noun,m,scompartimenti,宿泊,Il nostro scompartimento è in fondo al treno.,私たちの客室は列車の後ろの方にあります。,s＋子音で始まるので冠詞は lo。複数形は gli scompartimenti。夜行列車の簡易寝台は cuccetta といい、ふつう scompartimento の中に並ぶ。,,船旅と宿
L4-0482,4,il tornello,改札のゲート|回転式ゲート,noun,m,tornelli,宿泊,Il biglietto non funziona e il tornello non si apre.,切符が使えなくて、ゲートが開きません。,駅や地下鉄の改札にある回転式のバー。「改札口」そのものではなく、通過を制限する装置を指す。,,船旅と宿
L4-0480,4,la tappa,立ち寄り地|区間|行程の一区切り|段階,noun,f,tappe,宿泊,Firenze è la prima tappa del nostro viaggio.,フィレンツェは私たちの旅の最初の滞在地です。,旅や競技（自転車レースなど）の「区切り」。fare tappa a ... は「〜に立ち寄る、泊まる」。,,船旅と宿
L4-0171,4,il trasferimento,移動|送迎|移転,noun,m,trasferimenti,宿泊,Il trasferimento dall'aeroporto all'hotel è incluso nel prezzo.,空港からホテルまでの送迎は料金に含まれています。,旅行では空港とホテル間の送迎サービスを指す。動詞は trasferire（移す）、再帰形 trasferirsi は「引っ越す」。,,船旅と宿
L4-0186,4,l'attesa,待つこと|待ち時間|期待,noun,f,attese,宿泊,L'attesa all'aeroporto è stata molto lunga.,空港での待ち時間はとても長かった。,sala d'attesa は待合室。in attesa di ... は「〜を待っている」で、書面でよく使う。,,船旅と宿
L4-0347,4,pernottare,宿泊する|泊まる,verb,,"pernotto, pernotti, pernotta, pernottiamo, pernottate, pernottano",宿泊,Vorremmo pernottare qui due notti.,ここに二晩泊まりたいのですが。,規則動詞。近過去の助動詞は avere（ho pernottato）。pernottare は「夜を過ごす・泊まる」ことに焦点があり、soggiornare は期間を問わず「滞在する」を表す。,,船旅と宿
L4-0332,4,la locanda,小さな宿屋|旅籠|食事処つきの宿,noun,f,locande,宿泊,Abbiamo dormito in una locanda in campagna.,私たちは田舎の小さな宿に泊まりました。,素朴で家庭的な宿や食事処を指す。ホテルより小規模で、やや古風な響き。,,船旅と宿
L4-0160,4,il rifugio,山小屋|避難所,noun,m,rifugi,宿泊,Dormiamo in un rifugio in montagna.,私たちは山で山小屋に泊まります。,登山道沿いの山小屋は rifugio alpino。戦時の防空壕も rifugio と呼ぶ。複数形は rifugi。単数の -gio の i は g を軟音にする綴りで発音しない。,,船旅と宿
L4-0449,4,la mezza pensione,ハーフボード|朝食・夕食付き宿泊,noun,f,mezze pensioni,宿泊,Vorrei la mezza pensione per tre notti.,3泊、朝食と夕食付きでお願いしたいのですが。,朝食と夕食（または昼食）が付くプラン。全食付きは pensione completa、朝食のみは camera con colazione。,,船旅と宿
L4-0145,4,il lettino,ビーチベッド|ベビーベッド|診察台,noun,m,lettini,宿泊,Vorrei affittare due lettini e un ombrellone.,ビーチベッドを2台とパラソルを1本借りたいのですが。,letto の指小形。海水浴場では lettino と ombrellone を借りる。ベビーベッドや診察台の意味もある。,,船旅と宿
L4-0084,4,esplorare,探検する|探索する|散策する,verb,,"esploro, esplori, esplora, esploriamo, esplorate, esplorano",宿泊,Domani vogliamo esplorare il centro storico a piedi.,明日は歩いて旧市街を探索したいです。,他動詞なので前置詞なしで目的語をとる。近過去は avere を助動詞にとる（ho esplorato）。,,船旅と宿
L4-0312,4,disfare,（荷物を）解く|ほどく|崩す|解体する,verb,,"disfaccio, disfai, disfa, disfacciamo, disfate, disfanno（過去分詞 disfatto）",宿泊,Devo disfare la valigia appena arrivo in albergo.,ホテルに着いたらすぐスーツケースの荷物を解かなければなりません。,fare と同じ活用の不規則動詞。disfare la valigia で荷物を解く、disfare il letto は寝具をはがす・寝床を崩す意味で、fare il letto（ベッドを整える）の反対。,,船旅と宿
L4-0281,4,l'anfiteatro,円形闘技場|円形劇場,noun,m,anfiteatri,観光・文化,Domani visitiamo l'anfiteatro romano.,明日はローマ時代の円形闘技場を見学します。,古代ローマの遺跡を指すことが多い。母音で始まる男性名詞なので冠詞は l'、複数は gli anfiteatri。,,遺跡と芸術
L4-0162,4,la rovina,遺跡|廃墟|破滅,noun,f,rovine,観光・文化,Domani visitiamo le rovine romane vicino alla città.,明日は町の近くのローマ遺跡を訪れます。,「遺跡」の意味では複数形 le rovine が普通。単数は「破滅、荒廃」の意味でも使う。考古学的遺跡は gli scavi も使う。,,遺跡と芸術
L4-0255,4,il tempio,神殿|寺院|寺,noun,m,templi,観光・文化,Il tempio greco di Paestum è molto bello.,パエストゥムのギリシャ神殿はとても美しい。,古代の神殿にも日本の寺にも使う。日本の神社は santuario、キリスト教の教会は chiesa。複数形は templi。,,遺跡と芸術
L4-0536,4,la fortezza,要塞|城塞,noun,f,fortezze,観光・文化,Dalla fortezza si vede tutta la città.,要塞からは街全体が見渡せます。,観光地では「城塞」を指すことも多い。fortezza には「堅固さ、不屈の精神」の意味もある。,,遺跡と芸術
L4-0413,4,la colonna,円柱|柱,noun,f,colonne,観光・文化,Le colonne del tempio sono molto antiche.,神殿の円柱はとても古いです。,建築の柱は colonna、壁や構造の角柱は pilastro。新聞の「欄」や背骨（colonna vertebrale）の意味もある。,,遺跡と芸術
L4-0335,4,il marmo,大理石,noun,m,marmi,観光・文化,Questa statua è fatta di marmo bianco.,この像は白い大理石でできています。,トスカーナのカッラーラ産の大理石が有名。di marmo で「大理石の」という意味になる。,,遺跡と芸術
L4-0408,4,la cappella,礼拝堂|チャペル,noun,f,cappelle,観光・文化,La cappella Sistina è aperta tutti i giorni tranne la domenica.,システィーナ礼拝堂は日曜以外毎日開いています。,教会の中の小さな礼拝堂や、独立した小さな礼拝所を指す。観光では cappella Sistina が有名。,,遺跡と芸術
L4-0029,4,il santo,聖人|聖者,noun,m,santi,観光・文化,Oggi è la festa del santo patrono della città.,今日は街の守護聖人の祝日です。,女性の聖人は la santa。名前の前では語形が変わる：san Pietro（子音の前）、sant'Antonio（母音の前）、Santo Stefano（s+子音の前）。「守護聖人」は santo patrono。,,遺跡と芸術
L4-0159,4,la religione,宗教,noun,f,religioni,観光・文化,In Italia la religione più diffusa è quella cattolica.,イタリアで最も広まっている宗教はカトリックです。,-ione で終わる名詞は基本的に女性名詞。形容詞は religioso（宗教的な）。,,遺跡と芸術
L4-0580,4,religioso,宗教的な|信心深い,adj,,"religiosa, religiosi, religiose",観光・文化,In Italia ci sono molte feste religiose.,イタリアには宗教的な祝祭がたくさんあります。,名詞の後ろに置くのが普通。人に使うと「信心深い」の意味にもなる。,,遺跡と芸術
L4-0365,4,la scultura,彫刻|彫像,noun,f,sculture,観光・文化,Nel museo ci sono molte sculture antiche.,その美術館にはたくさんの古代の彫刻があります。,芸術ジャンルとしても作品としても使う。作品は statua（立像）とも言う。scultore は「彫刻家」。,,遺跡と芸術
L4-0006,4,la pittura,絵画|絵を描くこと|塗料|ペンキ|塗装,noun,f,pitture,観光・文化,Mi piace molto la pittura del Rinascimento.,私はルネサンスの絵画がとても好きです。,作品としての「絵」は il dipinto や il quadro。pittura は芸術分野や塗料・ペンキの意味にも使う。,,遺跡と芸術
L4-0208,4,il dipinto,絵画|絵,noun,m,dipinti,観光・文化,Questo dipinto è del Rinascimento.,この絵画はルネサンス期のものです。,dipingere の過去分詞から生まれた名詞。壁画なども含む。quadro は額に入った絵を指す。,il quadro,遺跡と芸術
L4-0082,4,dipingere,（絵を）描く|塗る,verb,,"dipingo, dipingi, dipinge, dipingiamo, dipingete, dipingono（過去分詞 dipinto）",観光・文化,Mia sorella dipinge paesaggi molto belli.,姉はとても美しい風景画を描きます。,過去分詞が不規則。絵の具で描くのが dipingere、鉛筆などで描くのは disegnare。壁を塗るのにも使う。,,遺跡と芸術
L4-0235,4,la poesia,詩|詩作,noun,f,poesie,観光・文化,Mi piace leggere le poesie di Leopardi.,私はレオパルディの詩を読むのが好きです。,個々の詩も詩というジャンルも指す。詩人は il poeta / la poetessa。複数形は poesie（-ie）。,,遺跡と芸術
L4-0555,4,la leggenda,伝説|言い伝え,noun,f,leggende,観光・文化,"Secondo la leggenda, questa fontana porta fortuna.",伝説によれば、この噴水は幸運をもたらします。,secondo la leggenda「伝説によれば」は観光案内で頻出。地図や凡例の意味でも使う。,,遺跡と芸術
L4-0067,4,la tradizione,伝統|慣習,noun,f,tradizioni,観光・文化,Questa festa è una tradizione molto antica della nostra città.,この祭りは私たちの街のとても古い伝統です。,-zione で終わる名詞は女性名詞。形容詞 tradizionale（伝統的な）も頻出。,,遺跡と芸術
L4-0152,4,l'orchestra,オーケストラ|管弦楽団,noun,f,orchestre,観光・文化,Stasera andiamo a sentire l'orchestra del teatro.,今夜は劇場のオーケストラを聴きに行きます。,語頭が母音なので l' と省略される。オペラ劇場の「オーケストラピット」や「平土間席」の意味でも使われる。,,遺跡と芸術
L4-0421,4,il coro,合唱団|合唱,noun,m,cori,観光・文化,Il coro della chiesa canta ogni domenica.,教会の合唱団は毎週日曜日に歌います。,複数形は cori（-o の男性名詞で規則変化）。教会の聖歌隊も coro と呼ぶ。「皆で声をそろえて」は in coro。,,遺跡と芸術
L4-0597,4,suggestivo,趣のある|印象的な|雰囲気のある,adj,,"suggestiva, suggestivi, suggestive",観光・文化,Il centro storico è molto suggestivo di sera.,旧市街は夜にはとても趣があります。,景色や場所の情緒ある魅力をほめる語。「暗示的な」の意味もあるが、観光では「雰囲気がある」が中心。,,遺跡と芸術
L4-0005,4,la pianura,平野|平原,noun,f,pianure,天気・自然,La pianura padana è molto grande e coltivata.,ポー平野はとても広く、耕作されています。,山 (montagna)・丘 (collina) と対になる地形語。有名なのは pianura padana（ポー平野）。,,大地と光
L4-0218,4,il golfo,湾|入り江,noun,m,golfi,天気・自然,Il golfo di Napoli è molto bello al tramonto.,ナポリ湾は夕暮れ時にとても美しい。,baia は小さめの湾、golfo は大きな湾を指すことが多い。複数形は規則どおり golfi。,,大地と光
L4-0292,4,la baia,湾|入り江,noun,f,baie,天気・自然,Dalla terrazza si vede tutta la baia.,テラスから湾全体が見えます。,golfo より小さい湾を指すことが多い。複数形は綴りが -ie になる。,,大地と光
L4-0552,4,la laguna,潟湖|ラグーン,noun,f,lagune,天気・自然,Venezia si trova in una laguna.,ヴェネツィアは潟湖の中にあります。,ヴェネツィアの la Laguna veneta が有名。砂州や細長い島で外海から隔てられた浅い水域を指す。,,大地と光
L4-0583,4,la riserva,保護区|蓄え|予備,noun,f,riserve,天気・自然,Domenica andiamo in una riserva naturale vicino al lago.,日曜日は湖の近くの自然保護区に行きます。,riserva naturale は自然保護区。ほかに「蓄え」「予備」「（ワインの）リゼルヴァ」の意味もある。「予約」は prenotazione を使う。,,大地と光
L4-0468,4,il sentiero,小道|山道,noun,m,sentieri,天気・自然,Questo sentiero porta a un piccolo lago.,この小道は小さな湖に通じています。,ハイキング道や遊歩道を指す。舗装された道は strada、市街の細い道は vicolo。,,大地と光
L4-0373,4,il terreno,土地|地面|土壌,noun,m,terreni,天気・自然,Il terreno è bagnato dopo la pioggia.,雨のあとで地面が濡れています。,「土地」は不動産の区画にも使う（comprare un terreno）。地面は suolo、床は pavimento。,il suolo,大地と光
L4-0467,4,il sasso,石|小石,noun,m,sassi,天気・自然,Il bambino lancia un sasso nel lago.,男の子は湖に石を投げます。,sasso は手で持てる大きさの石。pietra は素材や建材としての石も指し、より一般的。,,大地と光
L4-0350,4,il pianeta,惑星,noun,m,pianeti,天気・自然,La Terra è un pianeta molto bello.,地球はとても美しい惑星です。,語尾は -a だが男性名詞。複数は i pianeti。il problema などと同じ型。,,大地と光
L4-0463,4,il raggio,光線|半径|（車輪の）スポーク,noun,m,raggi,天気・自然,I raggi del sole sono molto forti oggi.,今日は太陽の光がとても強い。,複数形は raggi。raggio di sole は「日の光」、raggi X は「X線」。,,大地と光
L4-0509,4,il buio,暗闇|暗がり,noun,m,il buio は通常複数形を使わない（不可算）,天気・自然,Ho paura del buio.,私は暗闇が怖いです。,通常は単数のみ。fare buio（暗くなる）、al buio（暗闇の中で）が頻出。形容詞 buio（暗い、女性形 buia）としても使われる。,l'oscurità,大地と光
L4-0184,4,l'arcobaleno,虹,noun,m,arcobaleni,天気・自然,Dopo la pioggia è apparso un bellissimo arcobaleno.,雨の後に、とてもきれいな虹が現れました。,arco（弧）＋baleno（稲妻）の合成語。母音で始まるので単数は l'arcobaleno。複数形は -i で arcobaleni。,,大地と光
L4-0535,4,fiorire,花が咲く|開花する,verb,,"fiorisco, fiorisci, fiorisce, fioriamo, fiorite, fioriscono",天気・自然,In primavera i fiori sbocciano e gli alberi fioriscono.,春には花が開き、木々が花をつける。,-isco型の動詞。複合時制の助動詞は essere（è fiorito）が一般的だが、avere も使われる。比喩的に「栄える」の意味もある。,,大地と光
L4-0457,4,il petrolio,石油|原油,noun,m,petroli（ごくまれ）,天気・自然,Il prezzo del petrolio è salito molto.,石油の価格が大きく上がりました。,普通は不可算で単数形のみ使う。複数形 petroli は「種類の異なる石油」を指すときなど、ごくまれ。ガソリンは benzina。,,大地と光
L4-0263,4,l'argento,銀|シルバー,noun,m,argenti,天気・自然,"Questo anello è d'argento, non d'oro.",この指輪は金ではなく銀製です。,「銀製の」は d'argento。色の「銀色」は argento（不変の形容詞としても使う）。複数形はあまり使わない。,,大地と光
L4-0315,4,dorato,金色の|金めっきの,adj,,"dorata, dorati, dorate",天気・自然,Mi piace la cornice dorata di questo specchio.,この鏡の金色の枠が気に入っています。,動詞 dorare（金色にする）の過去分詞から来た形容詞。料理では「きつね色の」の意味でも使う。,,大地と光
L4-0198,4,celeste,空色の|水色の,adj,,celesti,天気・自然,Mi piace la tua giacca celeste.,君の水色のジャケットが好きだな。,-e 形容詞なので男女同形で、複数は celesti。azzurro は明るい青、celeste は淡い空色。,,大地と光
L4-0483,4,turchese,ターコイズ色の|青緑色の,adj,,turchesi,天気・自然,Il mare è turchese e molto limpido.,海はターコイズブルーで、とても澄んでいます。,-e で終わる形容詞なので男女同形、複数は turchesi。名詞では「ターコイズ色」「トルコ石」の意味でも使う。,,大地と光
L4-0049,4,umido,湿った|湿度の高い|じめじめした,adj,,"umida, umidi, umide",天気・自然,Oggi il tempo è molto umido e fa caldo.,今日は天気がとても湿っぽくて暑い。,名詞 l'umido は「湿気」。イタリアでは生ゴミ（ごみ分別）の意味でも使う。,,湿度・雷・霜
L4-0484,4,l'umidità,湿度|湿気,noun,f,umidità（不変）,天気・自然,In estate l'umidità è molto alta qui.,夏はここは湿度がとても高いです。,-à で終わる名詞は複数形も同形。母音で始まるので冠詞は l'。「湿気が多い」は c'è molta umidità。,,湿度・雷・霜
L4-0396,4,afoso,蒸し暑い,adj,,"afosa, afosi, afose",天気・自然,Oggi il tempo è afoso e non c'è vento.,今日は蒸し暑くて、風がありません。,湿度が高く風のない暑さを表す。「蒸し暑い日」は una giornata afosa。名詞 afa（蒸し暑さ）も覚えると便利。,,湿度・雷・霜
L4-0282,4,annuvolarsi,曇る|雲に覆われる,verb,,"mi annuvolo, ti annuvoli, si annuvola, ci annuvoliamo, vi annuvolate, si annuvolano",天気・自然,Il cielo si annuvola e forse piove.,空が曇ってきて、雨が降るかもしれない。,再帰動詞。天気では「si annuvola」と3人称で使うのが普通。近過去は essere を使う（si è annuvolato）。,rannuvolarsi,湿度・雷・霜
L4-0173,4,il tuono,雷鳴|雷,noun,m,tuoni,天気・自然,Ho sentito un tuono molto forte.,とても大きな雷鳴が聞こえた。,tuono は音としての雷。稲妻（光）は il fulmine、雷雨は il temporale。,,湿度・雷・霜
L4-0375,4,tuonare,雷が鳴る|雷鳴がとどろく,verb,,"tuono, tuoni, tuona, tuoniamo, tuonate, tuonano",天気・自然,Stanotte ha tuonato per ore.,昨夜は何時間も雷が鳴っていた。,天候動詞で通常は三人称単数のみ（tuona）。近過去は essere も avere も可。名詞 il tuono は「雷鳴」。,,湿度・雷・霜
L4-0442,4,il lampo,稲妻|閃光,noun,m,lampi,天気・自然,Ho visto un lampo e poi ho sentito il tuono.,稲妻が見えて、そのあと雷の音が聞こえました。,lampo は光、tuono は音。fulmine は落雷を指す。chiusura lampo はファスナー、「電光石火の」の意味でも使う。,,湿度・雷・霜
L4-0436,4,gelare,凍る|凍らせる|氷点下になる,verb,,"gelo, geli, gela, geliamo, gelate, gelano",天気・自然,"Stanotte gela, porta una giacca pesante.",今夜は氷点下になるから、厚い上着を持って行って。,天候では非人称（gela）。助動詞は自動詞なら essere、非人称は essere/avere 両方可。他動詞は avere。,congelare,湿度・雷・霜
L4-0469,4,soffiare,吹く|息を吹きかける,verb,,"soffio, soffi, soffia, soffiamo, soffiate, soffiano",天気・自然,Oggi soffia un vento molto forte.,今日はとても強い風が吹いている。,風が主語なら il vento soffia（例文のように soffia un vento と倒置も多い）。鼻をかむは soffiarsi il naso。ろうそくを吹き消すは soffiare sulle candeline。,,湿度・雷・霜
L4-0217,4,la goccia,しずく|水滴,noun,f,gocce,天気・自然,Una goccia di pioggia mi è caduta sulla mano.,雨のしずくが手に落ちてきました。,複数形は gocce（-cia の前が子音なので i が落ちて -ce になる。arancia → arance と同じ）。慣用句に una goccia nel mare（大海の一滴＝取るに足らない量）がある。,,湿度・雷・霜
L4-0378,4,il vapore,蒸気|水蒸気,noun,m,vapori,天気・自然,Dalla pentola esce molto vapore.,鍋からたくさん湯気が出ています。,cuocere a vapore は「蒸す」。vapore acqueo は水蒸気。nave a vapore は蒸気船。,,湿度・雷・霜
L4-0008,4,il polmone,肺,noun,m,polmoni,体・健康,Il dottore controlla i polmoni del paziente.,医者は患者の肺を調べます。,複数形 polmoni で使うことが多い。「肺炎」は polmonite。,,体の中と外
L4-0493,4,il fegato,肝臓|レバー,noun,m,fegati,体・健康,Mi piace il fegato alla veneziana.,私はヴェネツィア風のレバー料理が好きです。,体の器官にも料理の食材にも使う。fegato alla veneziana はレバーと玉ねぎの炒め料理。,,体の中と外
L4-0293,4,il battito,鼓動|脈拍,noun,m,battiti,体・健康,Il dottore controlla il battito del cuore.,医者は心臓の鼓動を確認します。,il battito cardiaco で「心拍」。脈拍は il polso とも言う。動詞 battere（打つ）から派生。,,体の中と外
L4-0095,4,il polso,手首|脈,noun,m,polsi,体・健康,Mi fa male il polso destro.,右の手首が痛いです。,「脈」の意味でも使い、il medico mi controlla il polso（脈を測る）のように言う。複数形 i polsi は規則的。,,体の中と外
L4-0141,4,la guancia,頬,noun,f,guance,体・健康,Il bambino ha le guance rosse per il freddo.,その子は寒さで頬が赤くなっています。,複数形は guance。-cia が子音＋ia のため i が落ち、c の音を保つ綴りになる。挨拶の頬へのキスは baci sulle guance。,,体の中と外
L4-0298,4,la caviglia,足首,noun,f,caviglie,体・健康,Mi fa male la caviglia destra.,右の足首が痛いです。,「足首を捻挫した」は Mi sono slogato/a la caviglia。体の部位には所有形容詞でなく定冠詞を使う。,,体の中と外
L4-0612,4,la coscia,太もも|もも肉,noun,f,cosce,体・健康,Mi fa male la coscia destra dopo la corsa.,走った後、右の太ももが痛いです。,料理では鶏のもも肉などにも使う（coscia di pollo）。複数形は規則的に cosce。,,体の中と外
L4-0478,4,il tallone,かかと,noun,m,talloni,体・健康,Mi fa male il tallone destro.,右のかかとが痛いです。,靴や足の痛みを伝える時に使う。「アキレス腱」は tendine d'Achille。複数形は talloni。,,体の中と外
L4-0486,4,il ventre,腹|お腹|下腹部,noun,m,i ventri,体・健康,Ho un forte dolore al ventre da ieri sera.,昨日の夜から下腹部がひどく痛みます。,やや文語的・医学的。日常では pancia を使うことが多い（stomaco は本来「胃」の意味）。,la pancia,体の中と外
L4-0372,4,il tatto,触覚|気配り,noun,m,tatti,体・健康,Il tatto è uno dei cinque sensi.,触覚は五感のひとつです。,「気配り、機転」の意味でも使う（avere tatto）。複数形はほとんど使われない。,,体の中と外
L4-0038,4,il sintomo,症状|兆候,noun,m,sintomi,体・健康,Quali sono i sintomi dell'influenza?,インフルエンザの症状はどんなものですか？,医療の場面で頻出。複数形 sintomi の形で使うことが多い。,,つらい症状
L4-0195,4,il capogiro,めまい,noun,m,capogiri,体・健康,"Ho un capogiro, devo sedermi un attimo.",めまいがします、ちょっと座らなければ。,avere un capogiro で「めまいがする」。複数形は capogiri。vertigine は回転性のめまい全般や高所でのくらくら感を指し、Ho le vertigini（めまいがする）もよく使う。,,つらい症状
L4-0499,4,la vertigine,めまい|(高所での)目がくらむ感じ,noun,f,vertigini,体・健康,Ho le vertigini quando guardo giù dal balcone.,バルコニーから下を見るとめまいがします。,「めまいがする」は avere le vertigini と複数形で言うことが多い。soffrire di vertigini は口語で「高い所が苦手だ」の意味でも使う（高所恐怖症は acrofobia）。,,つらい症状
L4-0474,4,svenire,気を失う|失神する,verb,,"svengo, svieni, sviene, sveniamo, svenite, svengono（過去分詞 svenuto）",体・健康,Ho caldo e ho paura di svenire.,暑くて、気を失いそうで怖いです。,venire と同型の不規則活用。近過去は essere を助動詞にとる（è svenuto/a）。,,つらい症状
L4-0461,4,il prurito,かゆみ,noun,m,pruriti,体・健康,Ho un forte prurito alla schiena.,背中がとてもかゆいです。,「かゆい」は avere prurito (a ...) で表す。薬局で症状を伝えるときに便利。,,つらい症状
L4-0328,4,gonfio,腫れた|むくんだ|膨らんだ,adj,,"gonfia, gonfi, gonfie",体・健康,Ho la caviglia gonfia dopo la caduta.,転んでから足首が腫れています。,体の部位が腫れている時に使う。「ふくれた」の意味で風船やタイヤにも使える。性数は名詞に一致させる。,,つらい症状
L4-0587,4,sanguinare,出血する|血が出る,verb,,"sanguino, sanguini, sanguina, sanguiniamo, sanguinate, sanguinano",体・健康,Il mio dito sanguina molto.,指からたくさん血が出ています。,自動詞で、近過去は avere を使う（ha sanguinato）。「鼻血が出る」は sanguinare dal naso。,,つらい症状
L4-0608,4,il vomito,嘔吐|吐いたもの（吐瀉物）,noun,m,vomiti,体・健康,Ho la febbre e il vomito da ieri sera.,昨夜から熱があって、嘔吐もあります。,「吐き気」は nausea、動詞は vomitare。医者に症状を伝えるとき avere il vomito と言う。,,つらい症状
L4-0044,4,il sudore,汗,noun,m,sudori,体・健康,Ho la camicia bagnata di sudore.,シャツが汗でぬれています。,複数形 sudori は通常あまり使わない。「汗をかく」は sudare。,,つらい症状
L4-0043,4,la stanchezza,疲労|疲れ,noun,f,stanchezze,体・健康,Dopo il viaggio sentivo una grande stanchezza.,旅行のあと、私はひどい疲れを感じていた。,形容詞 stanco（疲れた）の名詞形。「疲れている」は essere stanco/a が普通。複数形はまれ。,l'affaticamento,つらい症状
L4-0268,4,la fatica,疲れ|苦労|骨折り,noun,f,fatiche,体・健康,Dopo il viaggio sento molta fatica.,旅行のあと、とても疲れを感じます。,fare fatica a +不定詞は「〜するのに苦労する」。a fatica は「やっとのことで」。,,つらい症状
L4-0156,4,il pisolino,昼寝|うたた寝,noun,m,pisolini,体・健康,Dopo pranzo faccio un pisolino di mezz'ora.,昼食の後に30分ほど昼寝をします。,fare un pisolino で「ちょっと昼寝する」。軽い短時間の睡眠を指す。s＋子音ではないので冠詞は il。,il sonnellino,つらい症状
L4-0045,4,sveglio,目が覚めている|起きている,adj,,"sveglia, svegli, sveglie",体・健康,Sono già sveglio da due ore.,もう2時間前から目が覚めています。,状態を表す形容詞で essere sveglio。「目を覚ます」は svegliarsi。人について「頭の回転が速い」の意味もある。,,つらい症状
L4-0548,4,l'infezione,感染症|感染,noun,f,infezioni,体・健康,Ho un'infezione alla gola e prendo un antibiotico.,喉に感染症があって、抗生物質を飲んでいます。,-zione で終わる名詞は女性。細菌・ウイルスなどの病原体が体内に入って起こる感染（症）に使う。contagio は「接触などによる感染（伝染）」。,,つらい症状
L4-0425,4,la diagnosi,診断,noun,f,diagnosi（不変）,体・健康,Il medico ha fatto la diagnosi dopo le analisi.,医師は検査のあとで診断を下しました。,-i で終わるギリシャ語由来の女性名詞で、複数形も同形。crisi、tesi なども同様。,,つらい症状
L4-0132,4,curare,治療する|世話をする|手入れする,verb,,"curo, curi, cura, curiamo, curate, curano",体・健康,Il medico cura il paziente con attenzione.,医者は患者を注意深く治療します。,近過去は avere を使う（ho curato）。再帰形 curarsi は「自分の体をいたわる、治療を受ける」。,,治療と体づくり
L4-0345,4,operare,手術する|作用する|働く,verb,,"opero, operi, opera, operiamo, operate, operano",体・健康,Il dottore deve operare mio padre domani.,医者は明日、父を手術しなければなりません。,「手術を受ける」は operarsi または essere operato。「手術する」の意味の operare は他動詞で、患者を直接目的語にとる（「作用する・活動する」の意味では自動詞）。,,治療と体づくり
L4-0086,4,l'iniezione,注射,noun,f,iniezioni,体・健康,Il medico mi fa un'iniezione per il dolore.,医者は痛みのために私に注射をします。,fare un'iniezione で「注射を打つ」。母音で始まるので冠詞は l' になる。,la puntura,治療と体づくり
L4-0485,4,il vaccino,ワクチン,noun,m,vaccini,体・健康,Ho fatto il vaccino contro l'influenza.,私はインフルエンザの予防接種を受けました。,「予防接種を受ける」は fare il vaccino。接種そのものは vaccinazione とも言う。,,治療と体づくり
L4-0283,4,l'antibiotico,抗生物質,noun,m,antibiotici,体・健康,Il medico mi ha prescritto un antibiotico.,医者は私に抗生物質を処方しました。,複数形は antibiotici。薬局では処方箋(ricetta)が必要なことが多い。母音始まりなので冠詞は l'。,,治療と体づくり
L4-0504,4,l'antidolorifico,鎮痛剤|痛み止め,noun,m,antidolorifici,体・健康,"Vorrei un antidolorifico, per favore. Ho mal di testa.",鎮痛剤をください。頭が痛いんです。,薬局（farmacia）で使える語。analgesico も同義だがやや専門的。,l'analgesico,治療と体づくり
L4-0210,4,il farmaco,薬|薬剤,noun,m,farmaci,体・健康,Devo prendere questo farmaco due volte al giorno.,この薬を1日2回飲まなければなりません。,複数形は farmaci（farmachi ではない）。日常会話では medicina もよく使う。薬局は farmacia。,la medicina,治療と体づくり
L4-0518,4,il collirio,目薬,noun,m,colliri,体・健康,"Ho gli occhi secchi, vorrei un collirio, per favore.",目が乾くので、目薬をください。,薬局（farmacia）で使う語。複数形は colliri（-io で語尾にアクセントがない名詞は -i）。,,治療と体づくり
L4-0128,4,il cerotto,絆創膏|ばんそうこう,noun,m,cerotti,体・健康,Hai un cerotto? Mi sono tagliato il dito.,絆創膏を持っていますか？指を切ってしまいました。,薬局（farmacia）で買える。貼り薬（湿布）も cerotto と呼ぶ。,,治療と体づくり
L4-0326,4,la garza,ガーゼ,noun,f,garze,体・健康,Mi serve una garza per la ferita.,傷口用のガーゼが必要です。,薬局や応急処置で使う。包帯は la benda、絆創膏は il cerotto。,,治療と体づくり
L4-0390,4,peggiorare,悪化する|悪くなる|悪化させる,verb,,"peggioro, peggiori, peggiora, peggioriamo, peggiorate, peggiorano",体・健康,Il tempo peggiora nel pomeriggio.,午後は天気が悪くなります。,自動詞では「悪化する」で近過去は essere、他動詞では「悪化させる」で avere を使う。反対語は migliorare。,,治療と体づくり
L4-0432,4,essere in forma,体調が良い|調子が良い,phrase,,"sono in forma, sei in forma, è in forma, siamo in forma, siete in forma, sono in forma（過去分詞 stato）",体・健康,Dopo le vacanze sono in forma.,休暇のあとは体調がいいです。,体力があって好調という意味合い。病気でないという意味の「健康」は stare bene や essere sano。mantenersi in forma は「体型や体調を保つ」。,stare in forma,治療と体づくり
L4-0114,4,l'allenamento,トレーニング|練習,noun,m,allenamenti,体・健康,Oggi ho l'allenamento di calcio alle sei.,今日は6時にサッカーの練習があります。,動詞 allenare（鍛える）の名詞形。再帰動詞 allenarsi は「トレーニングする」。l'allenatore は「コーチ、監督」。,,治療と体づくり
L4-0039,4,la sirena,サイレン|人魚,noun,f,sirene,トラブル・緊急,Ho sentito la sirena dell'ambulanza.,救急車のサイレンが聞こえました。,神話の「人魚」「セイレーン」の意味もある。救急車・パトカー・工場などのサイレン（装置とその音）を指す。警報そのものは allarme。,,事件と災害
