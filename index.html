L4-0133,4,la curiosità,好奇心|物珍しさ,noun,f,curiosità（不変）,感情・性格,"Per curiosità, quanto costa questa borsa?",ちょっと気になるのですが、このバッグはいくらですか？,-à 終わりの名詞は複数形も同形。per curiosità は「興味本位で」という定番表現。,,喜び・懐かしさ・孤独
L4-0395,4,l'affetto,愛情|親愛の情,noun,m,affetti,感情・性格,Mia nonna ci tratta con molto affetto.,祖母は私たちをとても愛情をこめて扱ってくれます。,家族や友人への穏やかな愛情。恋愛的な amore より控えめ。手紙の結びに「Con affetto」（愛をこめて）とも書く。,,人との関係の気持ち
L4-0277,4,affettuoso,愛情深い|優しい|情のこもった,adj,,"affettuosa, affettuosi, affettuose",感情・性格,Mia nonna è una persona molto affettuosa.,私の祖母はとても愛情深い人です。,人だけでなく、abbraccio affettuoso（温かい抱擁）のように言動にも使う。親しい相手への手紙の結びには affettuosi saluti も使われる。,,人との関係の気持ち
L4-0107,4,la simpatia,好感|感じのよさ|親しみ,noun,f,simpatie,感情・性格,Ho molta simpatia per i tuoi genitori.,私はあなたのご両親にとても好感を持っています。,人に対する好感や、人柄の感じのよさを表す。英語の sympathy（同情）とは意味が異なる。形容詞 simpatico は「感じのいい」。avere simpatia per は「〜に好感を持つ」。,,人との関係の気持ち
L4-0228,4,l'odio,憎しみ|憎悪,noun,m,odi,感情・性格,Non provo odio per nessuno.,私は誰に対しても憎しみを感じません。,動詞 odiare（憎む）の名詞形。l'odio は母音始まりなので冠詞は l' になる。複数形 odi はまれ。,,人との関係の気持ち
L4-0216,4,geloso,嫉妬深い|やきもちを焼く,adj,,"gelosa, gelosi, gelose",感情・性格,Marco è geloso della sua ragazza.,マルコは恋人に嫉妬している。,「〜に嫉妬している」は geloso di。invidioso（うらやむ）とは区別し、恋愛の嫉妬は geloso を使う。,,人との関係の気持ち
L4-0321,4,la fiducia,信頼|信用,noun,f,fiducie,感情・性格,Ho molta fiducia in te.,私はあなたをとても信頼しています。,avere fiducia in qualcuno で「〜を信頼する」。fare affidamento su は「頼りにする」。複数形はあまり使わない。,,人との関係の気持ち
L4-0212,4,fidarsi,信頼する|信用する,verb,,"mi fido, ti fidi, si fida, ci fidiamo, vi fidate, si fidano",感情・性格,Mi fido di te.,私はあなたを信頼しています。,再帰動詞で、信頼する相手は fidarsi di ... で表す。近過去は essere を使う（mi sono fidato/a）。,,人との関係の気持ち
L4-0002,4,la pazienza,忍耐|我慢,noun,f,pazienze,感情・性格,"Un po' di pazienza, il treno arriva presto.",もう少しの辛抱です、電車はもうすぐ来ます。,Pazienza! は「仕方ない、しょうがない」というあきらめの定型表現。avere pazienza で「我慢する」。,,人との関係の気持ち
L4-0037,4,la sicurezza,自信|安心|安全,noun,f,sicurezze,感情・性格,Parla con molta sicurezza.,彼はとても自信を持って話します。,「安全、保安」の意味も重要。空港の保安検査は controllo di sicurezza、シートベルトは cintura di sicurezza。,,人との関係の気持ち
L4-0393,4,la tranquillità,平穏|安心|静けさ,noun,f,tranquillità（不変）,感情・性格,In campagna si trova molta tranquillità.,田舎ではとても穏やかな時間が過ごせます。,-à で終わる名詞は複数形も同形。形容詞は tranquillo。「落ち着いて」は con tranquillità。,la calma|la quiete,人との関係の気持ち
L4-0374,4,tranquillizzarsi,安心する|落ち着く,verb,,"mi tranquillizzo, ti tranquillizzi, si tranquillizza, ci tranquillizziamo, vi tranquillizzate, si tranquillizzano",感情・性格,"Tranquillizzati, va tutto bene.",落ち着いて、すべて大丈夫だから。,再帰動詞。他動詞 tranquillizzare は「安心させる」。命令形は tranquillizzati（tu）。近過去の助動詞は essere。,calmarsi,人との関係の気持ち
L4-0579,4,rassicurare,安心させる|安心させるように言う,verb,,"rassicuro, rassicuri, rassicura, rassicuriamo, rassicurate, rassicurano",感情・性格,Il medico ha rassicurato la mia famiglia.,医者は私の家族を安心させてくれました。,他動詞。再帰形 rassicurarsi は「安心する」。形容詞は rassicurante（安心感を与える）。,,人との関係の気持ち
L4-0566,4,offendere,侮辱する|気を悪くさせる|傷つける,verb,,"offendo, offendi, offende, offendiamo, offendete, offendono（過去分詞 offeso）",感情・性格,"Scusa, non volevo offenderti.",ごめん、傷つけるつもりはなかったんだ。,過去分詞が不規則（offeso）。再帰形 offendersi は「気を悪くする」。Non si offenda. 「気を悪くしないでください」。,,人との関係の気持ち
L4-0343,4,offendersi,気を悪くする|腹を立てる|侮辱されたと感じる,verb,,"mi offendo, ti offendi, si offende, ci offendiamo, vi offendete, si offendono（過去分詞 offeso）",感情・性格,"Non offenderti, stavo solo scherzando.",気を悪くしないで、冗談を言っていただけだよ。,再帰動詞で、過去分詞が不規則（offeso）。近過去は essere を使う（mi sono offeso/a）。他動詞 offendere は「侮辱する」。,,人との関係の気持ち
L4-0428,4,dispiacere,申し訳なく思う|残念である|気の毒に思う,verb,,"dispiaccio, dispiaci, dispiace, dispiacciamo, dispiacete, dispiacciono（過去分詞 dispiaciuto）",感情・性格,"Mi dispiace, non posso venire stasera.",ごめんなさい、今夜は行けません。,"mi dispiace は「すみません、残念です」。人が主語でなく、感じる人は間接目的語（mi, ti）。近過去は essere を使う。",,人との関係の気持ち
L4-0553,4,lamentarsi,不平を言う|嘆く,verb,,"mi lamento, ti lamenti, si lamenta, ci lamentiamo, vi lamentate, si lamentano",感情・性格,Si lamenta sempre del rumore in strada.,彼はいつも通りの騒音に文句を言っている。,再帰動詞。「〜について」は di か per を使う（lamentarsi del servizio）。,,人との関係の気持ち
L4-0331,4,litigare,口論する|けんかする,verb,,"litigo, litighi, litiga, litighiamo, litigate, litigano",感情・性格,I miei genitori litigano spesso per i soldi.,両親はよくお金のことで口論します。,"g の発音を保つため、tu と noi で litighi, litighiamo と h が入る。「〜と口論する」は litigare con。近過去は avere を使う。",,人との関係の気持ち
L4-0219,4,gridare,叫ぶ|大声を出す,verb,,"grido, gridi, grida, gridiamo, gridate, gridano",感情・性格,"Non gridare, ti sento bene.",叫ばないで、ちゃんと聞こえているよ。,助動詞は avere（ho gridato）。「〜に向かって叫ぶ」は gridare a qualcuno。助けを求める声は Aiuto! と叫ぶ。,urlare,人との関係の気持ち
L4-0166,4,sincero,誠実な|率直な|正直な,adj,,"sincera, sinceri, sincere",感情・性格,Voglio essere sincero con te.,君には正直でいたいんだ。,人の性格にも発言にも使える。「心からの」の意味で un sincero grazie（心からの感謝）のようにも言う。,,人柄（ほめる）
L4-0306,4,coraggioso,勇敢な|勇気のある,adj,,"coraggiosa, coraggiosi, coraggiose",感情・性格,Mio fratello è molto coraggioso e non ha paura di niente.,弟はとても勇敢で、何も怖がりません。,名詞 coraggio（勇気）から派生。「勇気を出して」は Coraggio! とも言う。,valoroso,人柄（ほめる）
L4-0540,4,generoso,気前がよい|寛大な,adj,,"generosa, generosi, generose",感情・性格,Mia zia è molto generosa con tutti.,私の叔母は誰にでもとても気前がよい。,お金や物を惜しまない「気前のよさ」にも、心の広さにも使う。反意語は avaro（けちな）。,,人柄（ほめる）
L4-0561,4,modesto,控えめな|謙虚な|質素な,adj,,"modesta, modesti, modeste",感情・性格,Mio nonno è un uomo molto modesto.,私の祖父はとても謙虚な人です。,人柄のほか、収入・家・食事などが「慎ましい、質素な」の意味でも使う。,,人柄（ほめる）
L4-0492,4,educato,礼儀正しい|行儀のよい,adj,,"educata, educati, educate",感情・性格,Il cameriere è sempre molto educato con i clienti.,そのウェイターはお客さんにいつもとても礼儀正しい。,反対語は maleducato（無礼な）。名詞 educazione は「礼儀」「教育」の両方の意味がある。,cortese,人柄（ほめる）
L4-0593,4,socievole,社交的な|人付き合いのよい,adj,,socievoli,感情・性格,Mia sorella è molto socievole e ha tanti amici.,姉はとても社交的で、友達がたくさんいます。,-e 形容詞なので男女同形、複数は socievoli。反対語は introverso や timido。,,人柄（ほめる）
L4-0175,4,vivace,活発な|生き生きした|鮮やかな,adj,,vivaci,感情・性格,Mia figlia è una bambina molto vivace.,私の娘はとても活発な子です。,-e 形容詞で男女同形。複数は vivaci。色や街の雰囲気にも使う。音楽用語では「活発に、生き生きと」。,,人柄（ほめる）
L4-0532,4,energico,精力的な|エネルギッシュな|元気な,adj,,"energica, energici, energiche",感情・性格,Mia nonna è ancora molto energica.,私の祖母は今でもとても活力にあふれています。,男性複数は energici（-ci）。人の性格や活力を表す。体調が良い意味の「元気」は stare bene。,,人柄（ほめる）
L4-0489,4,ambizioso,野心的な|意欲的な,adj,,"ambiziosa, ambiziosi, ambiziose",感情・性格,Mia sorella è molto ambiziosa e vuole diventare medico.,私の姉はとても野心的で、医者になりたがっている。,人にも計画・目標にも使える。日本語の「野心的」より肯定的な場合が多い。,,人柄（ほめる）
L4-0502,4,affidabile,信頼できる|頼りになる,adj,,affidabili,感情・性格,Il mio collega è una persona molto affidabile.,私の同僚はとても信頼できる人です。,-e 形容詞なので男女同形。人にも物や機械にも使える。fidato は「（すでに）信頼を置かれている」という響きが強く、主に人に使う（un amico fidato）。,,人柄（ほめる）
L4-0036,4,sensibile,繊細な|敏感な|感受性の強い|著しい,adj,,sensibili,感情・性格,Mia sorella è molto sensibile al freddo.,私の妹は寒さにとても敏感です。,-e 形容詞なので男女同形。sensibile a ... で「〜に敏感な」。英語の sensible（賢明な）とは意味が違うので注意。,,人柄（ほめる）
L4-0135,4,delicato,繊細な|デリケートな|優しい（味・香りが）|微妙な（問題などが）,adj,,"delicata, delicati, delicate",感情・性格,"Questa pelle è molto delicata, uso una crema speciale.",この肌はとても繊細なので、特別なクリームを使っています。,味・香りが穏やか、素材が壊れやすい、話題が微妙という意味でも使う。un problema delicato は「微妙な問題」。,,人柄（ほめる）
L4-0018,4,responsabile,責任感のある|責任がある,adj,,responsabili,感情・性格,Marco è una persona molto responsabile.,マルコはとても責任感のある人です。,男女同形の -e 形容詞。essere responsabile di ... で「〜に責任がある」。名詞（責任者）としても使う。,,人柄（ほめる）
L4-0073,4,antipatico,感じの悪い|いけ好かない,adj,,"antipatica, antipatici, antipatiche",感情・性格,Il mio vicino è molto antipatico.,私の隣人はとても感じが悪い。,反対語は simpatico。「simpatico＝感じのいい」と覚えると便利。主に人に使うが、una situazione antipatica（嫌な状況）のように物事にも使える。,,人柄（けなす）
L4-0180,4,aggressivo,攻撃的な|好戦的な|アグレッシブな,adj,,"aggressiva, aggressivi, aggressive",感情・性格,Il cane è molto aggressivo con gli estranei.,その犬は見知らぬ人にとても攻撃的です。,人や動物の性格のほか、運転・戦略など「積極果敢な」の意味でも使う。名詞は aggressività。,,人柄（けなす）
L4-0287,4,arrogante,傲慢な|横柄な|偉そうな,adj,,arroganti,感情・性格,Il cameriere è stato molto arrogante con noi.,そのウェイターは私たちにとても横柄でした。,-e 形容詞で男女同形、複数は arroganti。名詞としても使える（un arrogante）。,,人柄（けなす）
L4-0291,4,avaro,けちな|吝嗇な,adj,,"avara, avari, avare",感情・性格,Mio zio è molto avaro e non spende mai.,私の叔父はとてもけちで、決してお金を使わない。,名詞としても使い、un avaro は「けちな人」。類語の tirchio は口語的な言い方。,tirchio,人柄（けなす）
L4-0120,4,bugiardo,嘘つきの|嘘つき,adj,,"bugiarda, bugiardi, bugiarde",感情・性格,"Non fidarti di lui, è un bugiardo.",彼を信用しないで、嘘つきだから。,名詞としても使い、un bugiardo（嘘つきの男）、una bugiarda（女）。,falso,人柄（けなす）
L4-0430,4,egoista,利己的な|わがままな,adj,,"egoisti, egoiste",感情・性格,"Non essere egoista, condividi il dolce con tua sorella.",自分勝手にならないで、お菓子を妹と分けなさい。,-a で終わる形容詞は男女同形。複数は男性 egoisti、女性 egoiste。名詞（利己主義者）としても使う。,,人柄（けなす）
L4-0447,4,maleducato,無礼な|行儀の悪い,adj,,"maleducata, maleducati, maleducate",感情・性格,"Non essere maleducato, saluta la signora.",失礼なことをしないで、奥さんに挨拶しなさい。,人や態度に使う。名詞としても使え、un maleducato は「無作法な人」。反対語は educato。,scortese,人柄（けなす）
L4-0243,4,scortese,無礼な|不親切な|失礼な,adj,,scortesi,感情・性格,Il cameriere è stato molto scortese con noi.,そのウェイターは私たちにとても無礼でした。,男女同形の -e 形容詞。反対語は cortese（丁寧な、親切な）。maleducato も近い意味で使われるが、「しつけが悪い」というニュアンスが強い。,maleducato,人柄（けなす）
L4-0231,4,pigro,怠惰な|無精な|のろい,adj,,"pigra, pigri, pigre",感情・性格,Oggi sono troppo pigro per uscire.,今日は怠けていて出かける気になれません。,人の性格にも一時的な状態にも使う。名詞は la pigrizia（怠惰）。,,人柄（けなす）
L4-0538,4,furbo,ずる賢い|抜け目ない|賢い（要領のよい）,adj,,"furba, furbi, furbe",感情・性格,Il mio gatto è molto furbo.,うちの猫はとても賢い（要領がいい）。,良い意味では「機転が利く」、悪い意味では「ずる賢い」。文脈次第。fare il furbo は「抜け駆けする、ずるをする」。,,人柄（けなす）
L4-0438,4,impaziente,せっかちな|待ちきれない|我慢できない,adj,,impazienti,感情・性格,Sono impaziente di vedere la città.,早く街を見たくてたまりません。,-e 形容詞で男女同形。「〜するのが待ちきれない」は impaziente di + 不定詞。反意語は paziente。,,人柄（けなす）
L4-0529,4,distratto,ぼんやりした|不注意な|気が散っている,adj,,"distratta, distratti, distratte",感情・性格,"Scusa, ero distratto e non ho sentito.",ごめん、ぼんやりしていて聞いていなかった。,distrarre の過去分詞が形容詞化した語。「気が散っている」状態を表し、人の性格にも一時的な状態にも使える。,,人柄（けなす）
L4-0124,4,il carattere,性格|文字,noun,m,caratteri,感情・性格,Mia sorella ha un carattere molto forte.,姉はとても気が強い性格です。,「文字」の意味もあり、複数 caratteri は活字や文字を指すことが多い。avere un buon carattere は「性格がいい」。,,性格・能力・ふるまい
L4-0348,4,la personalità,性格|人格|個性,noun,f,personalità（不変）,感情・性格,Mia sorella ha una personalità molto forte.,私の姉はとても個性が強いです。,-à で終わる名詞は複数形も同形。「性格」は carattere とも言う。avere una bella personalità で「魅力的な人柄だ」。,,性格・能力・ふるまい
L4-0415,4,il comportamento,振る舞い|行動|態度,noun,m,comportamenti,感情・性格,Non mi piace il suo comportamento con i clienti.,彼のお客さんへの態度は好きではありません。,動詞 comportarsi（振る舞う）の名詞形。comportarsi bene で「行儀よくする」。,la condotta,性格・能力・ふるまい
L4-0416,4,comportarsi,振る舞う|行動する,verb,,"mi comporto, ti comporti, si comporta, ci comportiamo, vi comportate, si comportano",感情・性格,Si comporta sempre bene a scuola.,彼は学校ではいつも行儀がいい。,再帰動詞。bene / male などの副詞を伴うことが多い。近過去は essere を使う（mi sono comportato/a）。,,性格・能力・ふるまい
L4-0176,4,l'abitudine,習慣|癖,noun,f,abitudini,感情・性格,Ho l'abitudine di camminare dopo cena.,私は夕食後に散歩する習慣があります。,avere l'abitudine di + 不定詞「〜する習慣がある」。per abitudine は「習慣で」、di solito は「普通は」。,,性格・能力・ふるまい
L4-0307,4,la cortesia,礼儀正しさ|親切|好意,noun,f,cortesie,感情・性格,Grazie per la vostra cortesia.,ご親切にありがとうございます。,per cortesia は「お願いします」の意味で per favore とほぼ同じ（やや改まった響き）。fare una cortesia a qualcuno は「人に親切にする、頼みを聞く」。,la gentilezza,性格・能力・ふるまい
L4-0498,4,il talento,才能|天賦の才,noun,m,talenti,感情・性格,Tua sorella ha un grande talento per la musica.,君のお姉さんには音楽の大きな才能がある。,avere talento per ... で「〜の才能がある」。同義の dono は生まれつきの資質を強調する。,,性格・能力・ふるまい
L4-0549,4,l'intelligenza,知性|知能|賢さ,noun,f,intelligenze,感情・性格,Ammiro la sua intelligenza e la sua gentilezza.,私は彼女の知性と優しさを尊敬しています。,「人工知能」は intelligenza artificiale。形容詞は intelligente（男女同形）。,,性格・能力・ふるまい
L4-0514,4,la capacità,能力|才能|収容人数,noun,f,capacità（不変）,感情・性格,Ha una grande capacità di ascoltare gli altri.,彼は人の話を聞く能力が高い。,-à で終わる名詞は複数形も同形。capacità di + 不定詞で「〜する能力」。,l'abilità,性格・能力・ふるまい
L4-0607,4,la volontà,意志|意欲,noun,f,volontà（不変）,感情・性格,Con la buona volontà si può fare tutto.,やる気があれば何でもできる。,-à で終わる名詞は複数形も同形。buona volontà（善意、やる気）や a volontà（好きなだけ）が頻出。,,性格・能力・ふるまい
L4-0448,4,la mente,心|精神|頭（思考の）,noun,f,menti,感情・性格,Ho bisogno di rilassare la mente.,心をリラックスさせる必要があります。,知性・思考としての「心」。感情や気持ちの「心」は cuore。avere in mente は「念頭に置く」。,,性格・能力・ふるまい
L4-0146,4,liscio,滑らかな|つるつるした|ストレートの（髪が）,adj,,"liscia, lisci, lisce",形容詞・色,Ho i capelli lisci e non mi piacciono.,私の髪はストレートで、気に入っていません。,髪が直毛なら capelli lisci。水などが「炭酸なし」の意味で acqua liscia とも言う。andare liscio は「順調にいく」。,,手ざわりと状態
