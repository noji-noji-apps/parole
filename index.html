L2-0585,2,la natura,自然|本性,noun,f,nature,天気・自然,Mi piace camminare nella natura.,私は自然の中を歩くのが好きです。,「自然」は集合的に単数で使うことが多い。in natura は「現物で、自然のままで」の意味。,,自然
L2-0469,2,la campagna,田舎|田園|キャンペーン,noun,f,campagne,天気・自然,Il fine settimana andiamo in campagna.,週末は田舎に行きます。,「田舎に」は in campagna。「キャンペーン」の意味もあり、campagna pubblicitaria は広告キャンペーン。,,自然
L2-0133,2,il lago,湖,noun,m,laghi,天気・自然,Il lago di Como è molto bello.,コモ湖はとても美しい。,複数形は -go → -ghi と h が入り、発音の g を保つ。,,自然
L2-0484,2,il fiume,川,noun,m,fiumi,天気・自然,Il fiume attraversa la città.,川は街を横切っています。,一年中水が流れる比較的大きな川が fiume。急流・渓流は torrente、小川は ruscello、支流は affluente。-e で終わる男性名詞。,,自然
L2-0140,2,il monte,山,noun,m,monti,天気・自然,Il Monte Bianco è il monte più alto delle Alpi.,モンテ・ビアンコはアルプスで最も高い山だ。,固有名詞では il Monte Bianco のように使う。日常で「山」と言うときは la montagna のほうが一般的。,,自然
L2-0397,2,la collina,丘|小高い山,noun,f,colline,天気・自然,Dalla collina si vede tutta la città.,丘から街全体が見渡せます。,トスカーナなどの風景を表す語で、観光でよく出る。montagna（山）より低く、なだらかな地形を指す。,,自然
L2-0296,2,l'isola,島,noun,f,isole,天気・自然,Vorrei visitare un'isola vicino a Napoli.,ナポリの近くの島に行ってみたいです。,母音で始まるので単数の冠詞は l'isola、不定冠詞は un'isola（女性は アポストロフィあり）。,,自然
L2-0446,2,la terra,地球|土地|土,noun,f,terre,天気・自然,La Terra gira intorno al Sole.,地球は太陽の周りを回っています。,天体の地球は大文字 la Terra。「土・地面」や「土地」の意味でも使う。per terra は「地面に」。,,自然
L2-0238,2,la stella,星,noun,f,stelle,天気・自然,Stasera si vedono molte stelle.,今夜は星がたくさん見えます。,ホテルやレストランの等級（星の数）にも使う。stella marina はヒトデ。,,自然
L2-0299,2,la luna,月,noun,f,lune,天気・自然,Stasera la luna è molto bella.,今夜は月がとてもきれいです。,天体の「月」。暦の「月」は mese。固有名詞的に使うときは大文字で Luna と書くこともある。,,自然
L2-0241,2,l'albero,木|樹木,noun,m,alberi,天気・自然,C'è un grande albero nel parco.,公園に大きな木があります。,複数形は alberi。船のマストや系統図（albero genealogico）の意味もある。,,自然
L2-0064,2,la pianta,植物|地図（市街の）,noun,f,piante,天気・自然,Questa pianta ha bisogno di molta acqua.,この植物にはたくさんの水が必要です。,「市街地図」の意味もあり、観光では pianta della città と言う。足の裏は pianta del piede。,,自然
L2-0481,2,l'erba,草|ハーブ,noun,f,erbe,天気・自然,Mi siedo sull'erba vicino al lago.,湖のそばの草の上に座ります。,erbe aromatiche は「香草」。料理では erba の複数形でハーブ類を指す。,,自然
L2-0485,2,la foglia,葉|木の葉,noun,f,foglie,天気・自然,In autunno le foglie cadono dagli alberi.,秋になると木の葉が落ちます。,複数形 foglie では i が消えず、-glie の綴りに注意。紙の「1枚」は foglio（男性）で別語。,,自然
L2-0362,2,l'uccello,鳥,noun,m,uccelli,天気・自然,"Guarda, c'è un uccello sull'albero.",見て、木に鳥がいるよ。,母音で始まるので単数の冠詞は l'。複数は gli uccelli。,,自然
L2-0509,2,la pietra,石|石材,noun,f,pietre,天気・自然,Il ponte è fatto di pietra.,その橋は石でできています。,小さな石ころは sasso、宝石は pietra preziosa。「石造りの」は di pietra。,,自然
L2-0616,2,la sabbia,砂,noun,f,sabbie,天気・自然,La sabbia è molto calda oggi.,今日は砂がとても熱い。,海辺では la sabbia della spiaggia（浜辺の砂）のように使う。複数形 sabbie はあまり使われない。,,自然
L2-0258,2,l'oro,金|ゴールド,noun,m,ori,天気・自然,Questo anello è d'oro.,この指輪は金製です。,複数形 ori は「金製品」の意味などで稀。素材は d'oro で表す。oro 18 carati は18金。,,自然
L3-0007,3,presentare,紹介する|提出する|発表する,verb,,"presento, presenti, presenta, presentiamo, presentate, presentano",挨拶・定型表現,Vorrei presentare mia sorella a Marco.,妹をマルコに紹介したいです。,人を紹介するときは presentare A a B。再帰形 presentarsi は「自己紹介する、出頭する」。書類は presentare i documenti。,,紹介・おわび・ひとこと
L3-0455,3,presentarsi,自己紹介する|出頭する|現れる,verb,,"mi presento, ti presenti, si presenta, ci presentiamo, vi presentate, si presentano",挨拶・定型表現,Permette? Mi presento: sono Marco.,失礼します。自己紹介します、マルコです。,再帰動詞で近過去は essere を使う（mi sono presentato/a）。他人を紹介するのは presentare。,,紹介・おわび・ひとこと
L3-0450,3,il piacere è mio,こちらこそ|どういたしまして（丁寧）,phrase,,,挨拶・定型表現,Grazie dell'aiuto. - Il piacere è mio.,手伝ってくれてありがとう。- こちらこそ。,«Piacere»（はじめまして）と言われたときや、感謝への返答。«Piacere mio» と短くも言い、«Il piacere è tutto mio» は強調形。,piacere mio,紹介・おわび・ひとこと
L3-0046,3,altrettanto,同じく|あなたも（同様に）,adv,,,挨拶・定型表現,"Buon appetito! - Grazie, altrettanto!",召し上がれ！ - ありがとう、あなたもね！,"相手の挨拶や祝福の言葉に「そちらも同じく」と返す定番表現。Buon appetito! や Buon viaggio! などに Grazie, altrettanto! と返す。副詞としては不変化で、形容詞・代名詞（「同じだけの」）では altrettanta / altrettanti / altrettante と性数変化する。",,紹介・おわび・ひとこと
L3-0133,3,accomodarsi,お掛けになる|くつろぐ|お入りになる,verb,,"mi accomodo, ti accomodi, si accomoda, ci accomodiamo, vi accomodate, si accomodano",挨拶・定型表現,"Prego, si accomodi qui.",どうぞ、こちらにお掛けください。,再帰動詞。丁寧な命令形 si accomodi は「どうぞ（お掛けください、お入りください）」の定番表現。親しい相手には accomodati。,,紹介・おわび・ひとこと
L3-0466,3,un saluto,挨拶|よろしくお伝えください,noun,m,,挨拶・定型表現,Un saluto a tua madre!,お母さんによろしくね！,Un saluto a 〜 は「〜によろしく」と伝言を頼むときに使う。手紙やメールの結びには Cordiali saluti や Distinti saluti がよく使われ、Tanti saluti のように複数形で使う定型句も多い。,,紹介・おわび・ひとこと
L3-0536,3,salutarsi,挨拶を交わす|別れの挨拶をする,verb,,"mi saluto, ti saluti, si saluta, ci salutiamo, vi salutate, si salutano",挨拶・定型表現,Ci salutiamo sempre al mattino.,私たちはいつも朝に挨拶を交わします。,相互の再帰動詞。他人に挨拶するのは salutare。近過去は essere を使う（ci siamo salutati/e）。,,紹介・おわび・ひとこと
L3-0693,3,ben ritrovati,また会えましたね|再会できて嬉しい,phrase,,,挨拶・定型表現,"Ben ritrovati, ragazzi! Come state?",みんな、また会えたね！元気？,複数の相手に使う。単数男性は ben ritrovato、単数女性は ben ritrovata、女性だけの複数は ben ritrovate。似た表現の ben trovati は、再会の挨拶のほか、benvenuti（ようこそ）への返事としても使われる。,bentrovati,紹介・おわび・ひとこと
L3-0582,3,cordiali saluti,敬具|よろしくお願いします（手紙・メールの結び）,phrase,,,挨拶・定型表現,"Grazie per la risposta. Cordiali saluti, Marco Rossi.",ご返信ありがとうございます。敬具、マルコ・ロッシ。,メールや手紙の結びの定型句。より丁寧な表現は distinti saluti。親しい相手には un caro saluto や a presto。,,紹介・おわび・ひとこと
L3-0765,3,un abbraccio,ハグを送ります|ではまた（親しい人への結び）,phrase,,,挨拶・定型表現,Ti scrivo presto. Un abbraccio!,またすぐ書くね。ハグを送るよ！,親しい人への手紙やメッセージの結び。もとは名詞で「抱擁」の意味。より親しい間柄では un abbraccio forte や un abbraccione も使う。,,紹介・おわび・ひとこと
L3-0155,3,chiedere scusa,謝る|詫びる,phrase,,"chiedo scusa, chiedi scusa, chiede scusa, chiediamo scusa, chiedete scusa, chiedono scusa（過去分詞 chiesto）",挨拶・定型表現,Devo chiedere scusa a Marta per il ritardo.,遅刻したことをマルタに謝らなければなりません。,謝る相手は a、理由は per で表す。過去分詞 chiesto は不規則。scusarsi もほぼ同義。,scusarsi|chiedere perdono,紹介・おわび・ひとこと
L3-0471,3,scusarsi,謝る|わびる,verb,,"mi scuso, ti scusi, si scusa, ci scusiamo, vi scusate, si scusano",挨拶・定型表現,Mi scuso per il ritardo.,遅れたことをお詫びします。,scusarsi di/per で「〜を謝る」。「すみません」と声をかける時は Scusi（丁寧）、Scusa（親しい相手）を使う。,,紹介・おわび・ひとこと
L3-0449,3,perdonare,許す|容赦する,verb,,"perdono, perdoni, perdona, perdoniamo, perdonate, perdonano",挨拶・定型表現,"Perdonami, non volevo offenderti.",ごめんね、傷つけるつもりはなかったんだ。,人を許すときは perdonare qualcuno、事柄は perdonare qualcosa。丁寧な「失礼」は Mi perdoni / Scusi。,,紹介・おわび・ひとこと
L3-0723,3,mi raccomando,くれぐれも|頼んだよ|お願いだから,phrase,,,挨拶・定型表現,"Mi raccomando, non arrivare in ritardo.",くれぐれも遅れないでね。,相手に念を押す表現。raccomandarsi（頼み込む、強く頼む）の直説法現在1人称単数形。親しい相手によく使うが、Lei で話す相手にも使える。,,紹介・おわび・ひとこと
L3-0642,3,pure,どうぞ（許可）|〜も|それでも,adv,,,挨拶・定型表現,"Si accomodi pure, prego.",どうぞお座りください。,"命令形に添えて「どうぞ〜して」と許可を表す定番（Prego, entri pure）。「〜もまた」の意味では anche と近い。",,紹介・おわび・ひとこと
L3-0569,3,buon Ferragosto,良いフェラゴストを|楽しい8月15日の祝日を,phrase,,,挨拶・定型表現,Buon Ferragosto a tutti!,みなさん、良いフェラゴストを！,8月15日の祝日（聖母被昇天の日）の挨拶。夏休みの最盛期で、多くの店が休む。Ferragosto は男性名詞で頭文字は大文字。,buon Ferragosto a tutti,紹介・おわび・ひとこと
L3-0059,3,coraggio,がんばって|元気を出して|勇気を出して,interj,,,挨拶・定型表現,"Coraggio, manca poco!",がんばって、もう少しだよ！,励ましの掛け声。名詞 il coraggio（勇気）がそのまま感嘆詞として使われたもので、形は変化しない。,forza,感情がこもるひとこと
L3-0154,3,che gioia,なんて嬉しい|なんという喜び,phrase,,,挨拶・定型表現,Che gioia vederti!,君に会えてなんて嬉しいんだろう！,che＋名詞で「なんて〜だ」という感嘆文。gioia は「喜び」の意味。che bello! も近い感嘆表現。,,感情がこもるひとこと
L3-0410,3,evviva,万歳|やった,interj,,,挨拶・定型表現,"Evviva, abbiamo vinto la partita!",やった、試合に勝ったぞ！,喜びや歓声を表す間投詞。evviva il re のように「〜万歳」と後ろに名詞を置くこともできる。,viva,感情がこもるひとこと
L3-0574,3,che schifo,うえっ、気持ち悪い|ひどい|最悪,phrase,,,挨拶・定型表現,"Che schifo, questo bagno è sporco!",うわ、ひどい。このトイレ汚い！,嫌悪や不快を表す口語の感嘆表現。くだけた場面向きで、目上の人には避ける。schifo は男性名詞。,,感情がこもるひとこと
L3-0358,3,ahi,痛い！|あいたっ,interj,,,挨拶・定型表現,Ahi! Mi sono fatto male alla mano.,いたっ！手をけがした。,痛みを感じた瞬間に出る間投詞。綴りは ahi、感嘆符を伴うことが多い。aio と書かない。,ahia,感情がこもるひとこと
L3-0390,3,boh,さあ|わからない,interj,,,挨拶・定型表現,"Dov'è Marco? Boh, non lo so.",マルコはどこ？さあ、知らないな。,くだけた口語。肩をすくめながら言うことが多い。目上の人や改まった場面では non so を使う。,,感情がこもるひとこと
L3-0199,3,mah,さあ|うーん,interj,,,挨拶・定型表現,"Mah, non so cosa dirti.",うーん、何と言えばいいかわからない。,疑い・ためらい・困惑・無関心を表す間投詞。肩をすくめながら言うことが多い。,,感情がこもるひとこと
L3-0799,3,chissà,さあ、どうだろう|もしかしたら|一体〜だろうか,interj,,,挨拶・定型表現,Chissà se piove domani.,明日は雨が降るかなあ。,自分でも分からない時に使う。chissà se ... で「〜かなあ」という疑問を表す。,,感情がこもるひとこと
L3-0838,3,non ce la faccio,もうだめだ|耐えられない|できない,phrase,,,挨拶・定型表現,"Sono troppo stanco, non ce la faccio più.",疲れすぎて、もう無理です。,farcela（なんとかやり遂げる）の否定形。主語で変化し、non ce la fa（彼/彼女は）、non ce la facciamo（私たちは）となる。,,感情がこもるひとこと
L3-0029,3,oppure,あるいは|それとも,conj,,,副詞・接続詞・前置詞,Vuoi un caffè oppure un tè?,コーヒーにする、それとも紅茶にする？,o より選択を強調する。疑問文で「それとも」の意味でよく使う。文頭でも使える。,,話をつなぐことば
L3-0055,3,cioè,つまり|すなわち,conj,,,副詞・接続詞・前置詞,"Arrivo alle otto, cioè tra un'ora.",8時に着きます、つまり1時間後です。,前の内容を言い換えたり補足したりする時に使う。会話では「というか」と訂正する場面でも頻出。,,話をつなぐことば
L3-0191,3,inoltre,その上|さらに|加えて,adv,,,副詞・接続詞・前置詞,"Inoltre, la camera è molto pulita.",その上、部屋はとても清潔です。,前の内容に情報を付け加える語。文頭で使うことが多く、やや改まった響きがある。,in più,話をつなぐことば
L3-0424,3,invece,それに対して|代わりに|反対に,adv,,,副詞・接続詞・前置詞,"Io bevo il caffè, lei invece beve il tè.",私はコーヒーを飲みますが、彼女は紅茶を飲みます。,対比を表す。invece di + 名詞・不定詞で「〜の代わりに」。文頭・文中どちらにも置ける。,,話をつなぐことば
L3-0519,3,infatti,実際|その通りで|というのも,conj,,,副詞・接続詞・前置詞,Ho fame: infatti non ho mangiato niente.,お腹がすいています。実際、何も食べていないんです。,前の内容を裏付ける「実際、事実」の意味。perché のような単純な理由ではなく、根拠を補足する。単独で「その通り」の相づちにもなる。,,話をつなぐことば
L3-0714,3,insomma,要するに|結局|つまり|まあまあ,adv,,,副詞・接続詞・前置詞,"Insomma, che cosa vuoi fare?",で、結局どうしたいの？,会話では「まあまあ」の意味も。Come stai? — Insomma. は「まあまあ」。まとめの前置きにも使う。,,話をつなぐことば
L3-0697,3,comunque,いずれにせよ|とにかく|それでも,adv,,,副詞・接続詞・前置詞,"Comunque, grazie per l'aiuto.",いずれにせよ、助けてくれてありがとう。,会話のつなぎや話題の切り替えで頻出。「それでも」の意味もあり、接続詞として comunque＋接続法で「どうであれ」の意味にもなる（comunque vada「どうなろうと」）。,,話をつなぐことば
L3-0715,3,intanto,その間に|とりあえず|さしあたり,adv,,,副詞・接続詞・前置詞,"Intanto io preparo la cena, tu apparecchia.",その間に私は夕食を作るから、あなたは食卓の用意をして。,「その間に」「ひとまず」の両義。話の流れをつなぐ語としても使い、nel frattempo もほぼ同義。,nel frattempo,話をつなぐことば
L3-0837,3,nel frattempo,その間に|そうしている間に,phrase,,,副詞・接続詞・前置詞,"Nel frattempo, io preparo la cena.",その間に、私は夕食を準備します。,「それまでの間」「その間」の意味。mentre は節をつなぐが、nel frattempo は単独の副詞句で使う。,intanto,話をつなぐことば
L3-0295,3,infine,最後に|ついに|結局,adv,,,副詞・接続詞・前置詞,Infine siamo arrivati all'hotel.,ついに私たちはホテルに着きました。,順序の最後を示す語。列挙の締めに使う。alla fine も近いが、infine は文頭や列挙の最後に置くことが多い。,,話をつなぐことば
L3-0781,3,altrimenti,さもなければ|そうでなければ,adv,,,副詞・接続詞・前置詞,"Sbrigati, altrimenti perdiamo il treno.",急いで、さもないと電車に乗り遅れるよ。,接続詞的に使われる副詞。「別のやり方で」という意味でも使う（例: Non posso fare altrimenti.「他にやりようがない」）。,,話をつなぐことば
L3-0386,3,anche se,〜であっても|たとえ〜でも|〜だけれど,conj,,,副詞・接続詞・前置詞,Esco anche se piove.,雨が降っていても出かけます。,直説法なら現実の事実、接続法半過去なら仮定（anche se fosse）を表す。anche と se は離して書く。,,話をつなぐことば
L3-0783,3,appunto,まさに|その通り|ちょうど,adv,,,副詞・接続詞・前置詞,Stavo appunto per chiamarti.,ちょうど君に電話するところだったんだ。,相づちの「Appunto!」は「その通り」。副詞としては同じ意味で per l'appunto という形もよく使う。名詞の appunto は「メモ」。,per l'appunto,話をつなぐことば
L3-0506,3,appena,〜したばかり|〜するとすぐ|やっと,adv,,,副詞・接続詞・前置詞,Sono appena arrivato alla stazione.,ちょうど駅に着いたところです。,"副詞では「ちょうど〜した」（sono appena arrivato：助動詞と過去分詞の間に置く）、「かろうじて」（Ho appena il tempo di mangiare）の意。接続詞では「〜するとすぐ」（Appena arrivo, ti chiamo.）。",,話をつなぐことば
L3-0442,3,ormai,もはや|今では|もう（すでに）,adv,,,副詞・接続詞・前置詞,Ormai è troppo tardi per cenare.,もう夕食には遅すぎます。,状況がすでに変わった・今さら変えられないというニュアンス。già は単に「すでに」。,,話をつなぐことば
L3-0549,3,neanche,〜もない|〜さえない,adv,,,副詞・接続詞・前置詞,Non ho neanche un euro.,1ユーロさえ持っていません。,"動詞の後に置くときは non が必要（Non vengo neanche io）。動詞の前に置くときは non は不要（Neanche io vengo）。nemmeno, neppure もほぼ同義。",nemmeno|neppure,話をつなぐことば
L3-0439,3,nemmeno,〜さえ〜ない|〜もない|〜すらない,adv,,,副詞・接続詞・前置詞,Non ho nemmeno un euro.,1ユーロさえ持っていません。,"動詞の後ろに置くときは non が必要（non… nemmeno）。文頭に置くと non は不要。neanche, neppure も同義。",neanche|neppure,話をつなぐことば
L3-0267,3,soltanto,〜だけ|ただ〜のみ,adv,,,副詞・接続詞・前置詞,Ho soltanto dieci euro con me.,私は10ユーロしか持っていません。,solo や solamente とほぼ同義。solo より少し改まった響きがある。,solo|solamente,話をつなぐことば
L3-0670,3,tranne,〜を除いて|〜以外,prep,,,副詞・接続詞・前置詞,Il museo è aperto tutti i giorni tranne il lunedì.,美術館は月曜日を除いて毎日開いています。,人称代名詞が続くときは tranne me のように強勢形を使う。eccetto や salvo もほぼ同義。,eccetto|salvo,話をつなぐことば
L3-0349,3,durante,〜の間|〜の最中に,prep,,,副詞・接続詞・前置詞,Durante il viaggio ho dormito molto.,旅行中、私はたくさん眠りました。,後ろに名詞を直接置く（durante la cena）。節は続けられず、その場合は mentre を使う。,,話をつなぐことば
L3-0704,3,entro,〜までに|〜以内に,prep,,,副詞・接続詞・前置詞,Devo partire entro le otto.,8時までに出発しなければなりません。,期限を表す。fino a は「〜まで（継続）」で、entro は「期限まで（その時点までに）」。,,話をつなぐことば
L3-0768,3,attraverso,〜を通って|〜を横切って|〜を通じて,prep,,,副詞・接続詞・前置詞,"Per arrivare al centro, passiamo attraverso il parco.",中心部に行くには、公園を通り抜けます。,場所を通り抜ける・横切る意味。「〜を通じて、〜を介して」の意味でも使う（例: attraverso internet）。per も経路を表せるが、attraverso は通り抜けを強調する。,,話をつなぐことば
L3-0776,3,a causa di,〜のせいで|〜が原因で,prep,,,副詞・接続詞・前置詞,Il treno è in ritardo a causa della neve.,雪のせいで列車が遅れています。,後ろに名詞が来る。di は定冠詞と結合（della neve）。原因を比較的中立に述べる表現で、悪い結果の原因に使うのが普通。人に責任を向ける含みが強いのは per colpa di。,per colpa di,話をつなぐことば
L3-0329,3,secondo,〜によれば|〜に従って,prep,,,副詞・接続詞・前置詞,"Secondo me, il museo è molto bello.",私の意見では、その美術館はとても素敵です。,secondo me（私の考えでは）の形でよく使う。名詞・代名詞が続く。形容詞「2番目の」や名詞「第二の料理」の secondo と同形。,,話をつなぐことば
L3-0067,3,entrambi,両方|どちらも,pron,,entrambe,副詞・接続詞・前置詞,Mi piacciono entrambi i vestiti.,どちらの服も気に入っています。,女性形は entrambe。形容詞的には entrambi i libri のように定冠詞を伴う。同義の tutti e due も会話で頻出。,tutti e due,話をつなぐことば
L3-0644,3,qualunque,どんな〜でも|どれでも,adj,,,副詞・接続詞・前置詞,Puoi prendere qualunque libro.,どんな本でも取っていいよ。,不変の形容詞で、名詞の前に置く（qualunque cosa）。人を指して「誰でも」と言うときは chiunque を使う。,qualsiasi,話をつなぐことば
L3-0556,3,vostro,君たちの|あなたたちの|君たちのもの,adj,,"vostra, vostri, vostre",副詞・接続詞・前置詞,Questa è la vostra camera.,こちらが皆さんのお部屋です。,所有形容詞は通常 il vostro libro のように冠詞を伴うが、単数の親族名詞（vostro padre）では冠詞を付けない。代名詞としても使う（il vostro = 君たちのもの）。,,話をつなぐことば
L3-0507,3,assai,とても|非常に|かなり,adv,,,副詞・接続詞・前置詞,Questo ristorante è assai caro.,このレストランはとても高い。,形容詞・副詞を修飾して「とても」。ただし文脈によっては「かなり」程度。molto とほぼ同じだが、やや文語的・地方的な響きがある。,molto,程度と頻度の副詞
L3-0731,3,parecchio,かなり|たくさん,adv,,,副詞・接続詞・前置詞,Oggi ho camminato parecchio.,今日はかなり歩きました。,形容詞・代名詞としても使い、名詞に性数一致する（parecchi turisti）。副詞では不変。,,程度と頻度の副詞
L3-0336,3,soprattutto,特に|とりわけ|何よりも,adv,,,副詞・接続詞・前置詞,"Mi piace la pasta, soprattutto la carbonara.",パスタが好きです、特にカルボナーラが。,一部を取り立てて強調する副詞。「特に〜」と例を挙げる時に使う。主に文中で、強調したい語の前に置く。,,程度と頻度の副詞
L3-0445,3,particolarmente,特に|とりわけ|格別に,adv,,,副詞・接続詞・前置詞,Questo ristorante è particolarmente buono.,このレストランは特においしいです。,形容詞や動詞を強める副詞。「特に〜」と例を挙げるときは soprattutto や in particolare も使う。,,程度と頻度の副詞
L3-0068,3,esattamente,正確に|まさに|その通り,adv,,,副詞・接続詞・前置詞,Il treno parte esattamente alle otto.,列車はちょうど8時に出発します。,返事で単独で「その通り」の意味にもなる。似た語に proprio、precisamente がある。,precisamente,程度と頻度の副詞
L3-0105,3,semplicemente,単に|ただ|簡単に,adv,,,副詞・接続詞・前置詞,Ho semplicemente dimenticato il biglietto a casa.,ただ切符を家に忘れただけです。,形容詞 semplice に -mente を付けた副詞。「単に」と「簡単に」の両方の意味で使う。,,程度と頻度の副詞
L3-0129,3,veramente,本当に|実際には,adv,,,副詞・接続詞・前置詞,Questo ristorante è veramente buono.,このレストランは本当においしい。,形容詞 vero の副詞形。文頭では「実は、本当のところ」と訂正や反論のニュアンスになる。,davvero,程度と頻度の副詞
L3-0241,3,sicuramente,きっと|確実に|間違いなく,adv,,,副詞・接続詞・前置詞,Domani sicuramente piove.,明日はきっと雨が降ります。,形容詞 sicuro から派生した副詞。返事で「もちろん」の意味でも使う。certamente もほぼ同義。,certamente,程度と頻度の副詞
L3-0171,3,facilmente,簡単に|容易に,adv,,,副詞・接続詞・前置詞,Puoi arrivare facilmente in centro con il treno.,電車なら簡単に中心街へ行けます。,形容詞 facile に -mente を付けて作る副詞。-le で終わる形容詞なので語末の e が落ちて facilmente となる。会話では senza difficoltà や con facilità も使う。,con facilità,程度と頻度の副詞
L3-0551,3,rapidamente,速く|すばやく|迅速に,adv,,,副詞・接続詞・前置詞,Il tempo passa rapidamente.,時間はあっという間に過ぎます。,形容詞 rapido から作る -mente 副詞。会話では velocemente や in fretta もよく使う。,velocemente,程度と頻度の副詞
L3-0684,3,improvvisamente,突然|不意に,adv,,,副詞・接続詞・前置詞,Improvvisamente ha iniziato a piovere.,突然雨が降り始めました。,形容詞 improvviso から派生。類義語の all'improvviso、di colpo も頻出。,all'improvviso|di colpo,程度と頻度の副詞
L3-0135,3,all'improvviso,突然|いきなり,adv,,,副詞・接続詞・前置詞,All'improvviso ha cominciato a piovere.,突然雨が降り出した。,副詞句。improvvisamente や di colpo もほぼ同義。improvviso は「突然の」という形容詞。,improvvisamente|di colpo,程度と頻度の副詞
L3-0740,3,raramente,めったに〜ない|まれに,adv,,,副詞・接続詞・前置詞,Raramente mangio la carne la sera.,夜に肉を食べることはめったにありません。,raramente 自体は否定語ではないので、位置に関係なく non は付けない（non ... raramente は「まれではない＝しばしば」の意味になる）。似た意味の non ... quasi mai は non が必要。,di rado,程度と頻度の副詞
L3-0085,3,ogni tanto,ときどき|たまに,phrase,,,副詞・接続詞・前置詞,Ogni tanto vado al cinema con i miei amici.,ときどき友達と映画を見に行きます。,頻度は高くない「たまに」の感じ。ひとかたまりの固定表現で、形は変化しない。,di tanto in tanto,程度と頻度の副詞
L3-0217,3,peggio,より悪く|もっと悪く,adv,,,副詞・接続詞・前置詞,Oggi mi sento peggio di ieri.,今日は昨日より具合が悪いです。,male の比較級（副詞）。形容詞の「より悪い」は peggiore。「Peggio per te!」は「自業自得だ」。,,程度と頻度の副詞
L3-0079,3,in basso,下に|下方に,adv,,,方向・場所,La firma va in basso a destra.,署名は右下にお願いします。,反対は in alto（上に）。giù もほぼ同じ意味で、会話ではよりくだけた表現。,giù,位置と地区
L3-0285,3,di fronte a,〜の正面に|〜の向かいに,prep,,,方向・場所,L'hotel è di fronte alla stazione.,ホテルは駅の向かいにあります。,"後ろに定冠詞つきの名詞が来ると前置詞 a が冠詞と結合する（alla, al, ai など）。「〜に直面して」の意味でも使う。",davanti a,位置と地区
L3-0711,3,in fondo a,〜の突き当たりに|〜の奥に|〜の端に,prep,,,方向・場所,Il bagno è in fondo al corridoio.,トイレは廊下の突き当たりです。,"後ろは前置詞と冠詞が結合する（in fondo al corridoio, in fondo alla strada）。道案内でよく使う。",,位置と地区
L3-0772,3,intorno,周囲に|あたりに|まわりに,adv,,,方向・場所,"Guardo intorno, ma non vedo nessuno.",あたりを見回すが、誰も見えない。,前置詞的に intorno a（〜の周りに）の形でもよく使う。例: intorno al tavolo。,attorno,位置と地区
L3-0685,3,il lato,側|側面|横,noun,m,lati,方向・場所,La farmacia è dall'altro lato della strada.,薬局は道の反対側にあります。,dal lato di ... は「〜の側から」。a lato di は「〜の横に」。di lato は「横に」。,,位置と地区
L3-0229,3,il punto,地点|点|ポイント,noun,m,punti,方向・場所,Qual è il punto di incontro?,集合場所はどこですか？,punto di vista（観点）、punto di partenza（出発点）など複合表現が多い。in punto は「ちょうど」（le tre in punto）。,,位置と地区
L3-0346,3,la zona,地域|ゾーン|エリア,noun,f,zone,方向・場所,Questa zona è molto tranquilla di sera.,この地域は夜はとても静かです。,zona traffico limitato（ZTL）は車両進入制限区域。観光客は罰金に注意。,,位置と地区
L3-0531,3,il quartiere,地区|街区|界隈,noun,m,quartieri,方向・場所,Abito in un quartiere tranquillo vicino al centro.,私は中心部に近い静かな地区に住んでいます。,都市内の区画・住宅地を指す。-e で終わるが男性名詞なので il quartiere。,,位置と地区
L3-0821,3,il fondo,底|奥|終わり（末尾）,noun,m,fondi,方向・場所,Il bagno è in fondo al corridoio.,トイレは廊下の突き当たりにあります。,in fondo a ~ で「~の奥に、突き当たりに」。複数形 i fondi は「資金」の意味にもなる。,,位置と地区
L3-0097,3,quinto,5番目の|第5の,adj,,"quinta, quinti, quinte",数・時間・曜日,Abito al quinto piano.,私は6階に住んでいます。,序数詞は名詞に性数一致する。イタリアの1階は piano terra なので、quinto piano は日本の6階にあたる。,,数・割合・計算
L3-0108,3,settimo,7番目の|第7の,adj,,"settima, settimi, settime",数・時間・曜日,Abito al settimo piano.,私は8階に住んでいます。,序数詞で名詞に性数一致する。イタリアの階数は地上階が piano terra なので settimo piano は日本の8階にあたる。,,数・割合・計算
L3-0088,3,ottavo,8番目の|第8の,adj,,"ottava, ottavi, ottave",数・時間・曜日,Abito all'ottavo piano.,私は（日本式でいう）9階に住んでいます。,序数詞は名詞に性数一致する。日本の1階はイタリアでは pianoterra（piano terra）で、il primo piano は日本の2階にあたる。,,数・割合・計算
L3-0361,3,decimo,10番目の|第10の,adj,,"decima, decimi, decime",数・時間・曜日,Abito al decimo piano.,私は11階（イタリア式では10階）に住んでいます。,序数詞は名詞に性数一致する。略記は 10º / 10ª。日本の1階は piano terra、2階が primo piano なので、decimo piano は日本式の11階。,,数・割合・計算
L3-0495,3,ventesimo,20番目の|20分の1,num,,"ventesima, ventesimi, ventesime",数・時間・曜日,Questo è il ventesimo giorno del nostro viaggio.,今日は私たちの旅行の20日目です。,序数詞は形容詞と同じく性数一致する。世紀は il ventesimo secolo（20世紀）。名詞では「20分の1」も表す。,,数・割合・計算
L3-0724,3,il miliardo,十億|10億,noun,m,miliardi,数・時間・曜日,Nel mondo ci sono più di otto miliardi di persone.,世界には80億人以上の人がいます。,後ろに名詞が来るときは di が必要（due miliardi di euro）。miliardo は10億（10^9）。bilione は10^12（1兆）を表し、英語の billion（10億）とは異なる。,,数・割合・計算
L3-0588,3,la dozzina,ダース|12個,noun,f,dozzine,数・時間・曜日,"Vorrei una dozzina di uova, per favore.",卵を1ダースください。,una dozzina di + 名詞。「約12個」の意味でも使う。mezza dozzina は半ダース。,,数・割合・計算
L3-0209,3,il paio,一対|一組|2、3（の）,noun,m,paia（女性複数、不規則）,数・時間・曜日,Ho comprato un paio di scarpe nuove.,新しい靴を1足買いました。,複数形は le paia と女性形になる不規則名詞。un paio di scarpe（靴1足）のように使う。,,数・割合・計算
L3-0092,3,per cento,〜パーセント,phrase,,,数・時間・曜日,C'è uno sconto del venti per cento.,20パーセントの割引があります。,数字の後ろに置く（il dieci per cento）。記号は %。「〜の○%」は数詞に定冠詞を付けるので、di と結合して del になる（uno sconto del venti per cento）。,percento,数・割合・計算
L3-0277,3,il centesimo,セント|100分の1,noun,m,centesimi,数・時間・曜日,Costa un euro e cinquanta centesimi.,1ユーロ50セントです。,ユーロの補助単位。日常では euro と centesimi で金額を言う。序数「100番目の」も centesimo。,il cent,数・割合・計算
L3-0752,3,la somma,合計|和|金額,noun,f,somme,数・時間・曜日,La somma totale è di cinquanta euro.,合計金額は50ユーロです。,足し算の「和」にも、金額（una somma di denaro）にも使う。「足し算」は addizione。,il totale,数・割合・計算
L3-0699,3,contare,数える|重要である|頼りにする,verb,,"conto, conti, conta, contiamo, contate, contano",数・時間・曜日,Posso contare su di te?,あなたを頼りにしてもいい？,contare su は「〜を頼りにする」。「重要である」は Conta molto. のように自動詞で使う。近過去は avere を助動詞にとる。,,数・割合・計算
L3-0542,3,calcolare,計算する|見積もる,verb,,"calcolo, calcoli, calcola, calcoliamo, calcolate, calcolano",数・時間・曜日,Posso calcolare il prezzo totale?,合計金額を計算してもいいですか？,規則動詞。「費用や時間を見積もる」の意味でも使う。名詞は il calcolo（計算）。,,数・割合・計算
L3-0393,3,la calcolatrice,電卓|計算機,noun,f,calcolatrici,数・時間・曜日,Posso usare la calcolatrice per l'esame?,試験で電卓を使ってもいいですか？,calcolatore は「コンピューター、計算する人」の意味もあり、電卓には calcolatrice を使う。,,数・割合・計算
L3-0016,3,la volta,回|度|〜回目,noun,f,volte,数・時間・曜日,Questa è la prima volta che vengo in Italia.,イタリアに来るのはこれが初めてです。,una volta（1回、昔）、due volte（2回）、a volte（時々）、la prima volta（初めて）、ancora una volta（もう一度）など慣用表現が多い。,,数・割合・計算
L3-0025,3,la mezz'ora,30分|半時間,noun,f,mezz'ore,数・時間・曜日,Il treno parte tra mezz'ora.,電車は30分後に出発します。,mezza ora の省略形で、母音の前で mezz' となる。「tra mezz'ora」で「30分後に」。,la mezza ora,時間と期間
L3-0096,3,il quarto d'ora,15分|4分の1時間,noun,m,i quarti d'ora,数・時間・曜日,Aspetto da un quarto d'ora.,15分前から待っています。,時刻では le tre e un quarto（3時15分）のように quarto だけを使う。「15分」は quindici minuti とも言う。,,時間と期間
L3-0305,3,la mattinata,午前中|朝のうち,noun,f,mattinate,数・時間・曜日,Sono libero per tutta la mattinata.,午前中はずっと空いています。,mattina が時点としての「朝」なのに対し、mattinata は朝の始まりから昼までの時間の長さを強調する。,,時間と期間
L3-0106,3,la serata,晩|夜|夕べ,noun,f,serate,数・時間・曜日,Abbiamo passato una serata bellissima insieme.,私たちは一緒にとても素敵な夜を過ごしました。,sera が時刻としての「夕方・晩」なのに対し、serata は夕方から夜までの「時間の長さ・過ごし方」を表す。,,時間と期間
L3-0030,3,il periodo,期間|時期,noun,m,periodi,数・時間・曜日,In questo periodo fa molto caldo qui.,この時期、ここはとても暑いです。,規則的な -o で終わる男性名詞で、複数形は periodi。in questo periodo（この時期・最近）はよく使う表現。,,時間と期間
L3-0066,3,durare,続く|かかる（時間が）,verb,,"duro, duri, dura, duriamo, durate, durano",数・時間・曜日,Il film dura due ore.,その映画は2時間かかります。,規則動詞。近過去の助動詞は主に essere（è durato）だが avere も使われる。所要時間の「かかる」は durare、人が時間を要するのは metterci。,,時間と期間
L3-0654,3,il secolo,世紀|百年,noun,m,secoli,数・時間・曜日,Questa chiesa è del quindicesimo secolo.,この教会は15世紀のものです。,世紀は序数で表す（il ventunesimo secolo）。歴史的な言い方では il Quattrocento（15世紀）なども使う。,,時間と期間
L3-0318,3,il presente,現在|現在形,noun,m,presenti,数・時間・曜日,Vivo nel presente e non penso al futuro.,私は現在を生きていて、未来のことは考えません。,文法用語では「現在時制」を指す（il presente indicativo＝直説法現在、il presente congiuntivo＝接続法現在）。形容詞 presente は「出席している」の意味もある。,,時間と期間
L3-0215,3,il passato,過去|昔,noun,m,passati,数・時間・曜日,Non voglio parlare del passato.,過去のことは話したくありません。,形容詞「過去の」や、文法用語の「過去時制」としても使う。passato prossimo は近過去。,,時間と期間
L3-0328,3,scorso,この前の|先〜,adj,,"scorsa, scorsi, scorse",数・時間・曜日,Il mese scorso sono stato a Roma.,先月、私はローマに行きました。,時を表す名詞の後ろに置く（la settimana scorsa 先週）。「次の」は prossimo。,,時間と期間
L3-0372,3,recente,最近の|近頃の,adj,,recenti,数・時間・曜日,Hai visto le notizie più recenti?,最新のニュースを見ましたか？,-e 形容詞で男女同形。副詞は recentemente（最近）。,,時間と期間
L3-0757,3,successivo,次の|その後の,adj,,"successiva, successivi, successive",数・時間・曜日,Il giorno successivo siamo partiti per Firenze.,次の日、私たちはフィレンツェへ出発しました。,過去や物語の中での「次の」。話し手から見た次は prossimo（la settimana prossima）。,,時間と期間
L3-0110,3,solito,いつもの|普段の,adj,,"solita, soliti, solite",数・時間・曜日,"Prendo il solito, grazie.",いつものをください、ありがとう。,di solito は「普通は、たいてい」。come al solito は「いつものように」。名詞的に il solito（いつもの物）とも使う。,abituale,時間と期間
L3-0293,3,in anticipo,早めに|前もって,phrase,,,数・時間・曜日,Il treno è arrivato in anticipo.,列車は予定より早く着きました。,予定より早い意味。「前もって」は in anticipo や prima。遅れは in ritardo、時間通りは in orario。,con anticipo,時間と期間
L3-0459,3,puntuale,時間通りの|時間に正確な,adj,,puntuali,数・時間・曜日,Il treno per Roma è sempre puntuale.,ローマ行きの列車はいつも時間通りです。,-e 形容詞なので男女同形で、複数は puntuali。人にも乗り物にも使える。副詞形は puntualmente。,,時間と期間
L3-0103,3,ritardare,遅れる|遅らせる,verb,,"ritardo, ritardi, ritarda, ritardiamo, ritardate, ritardano",数・時間・曜日,Il treno ritarda di dieci minuti.,列車は10分遅れています。,自動詞「遅れる」、他動詞「遅らせる」の両方で使う。近過去の助動詞は avere（Il treno ha ritardato）。「遅れる」は essere in ritardo も頻出。,,時間と期間
L3-0115,3,la sveglia,目覚まし時計|アラーム,noun,f,sveglie,数・時間・曜日,Metto la sveglia alle sei.,6時に目覚ましをセットします。,「目覚ましをセットする」は mettere la sveglia。スマホのアラームにも使う。形容詞 sveglio（目が覚めている）と同語源。,,時間と期間
L3-0045,3,l'adulto,大人|成人,noun,m,複数: gli adulti（女性単数: l'adulta、女性複数: le adulte）,家族・人,Il biglietto costa dieci euro per gli adulti.,切符は大人10ユーロです。,女性は l'adulta。形容詞「成人の、大人の」としても使う。反対語は il bambino（子ども）、il minorenne（未成年者）は法的な「未成年」。,,年齢と人
L3-0033,3,il ragazzino,男の子|少年,noun,m,ragazzini,家族・人,Il ragazzino gioca a pallone in piazza.,男の子が広場でサッカーをしています。,ragazzo の指小形。女の子は la ragazzina。年下の子どもを親しみを込めて呼ぶ語。,,年齢と人
L3-0070,3,la femmina,女の子|雌|女性（性別として）,noun,f,femmine,家族・人,Hanno due figli: un maschio e una femmina.,彼らには子どもが2人います。男の子と女の子です。,子どもの性別を言うとき（un maschio e una femmina）や動物の雌には普通に使う。大人の女性を femmina と呼ぶと軽蔑的・粗野に響くことがあるので、普通は donna を使う。,,年齢と人
L3-0074,3,il/la giovane,若者|青年,noun,mf,"i giovani, le giovani",家族・人,Molti giovani vivono ancora con i genitori.,多くの若者がまだ両親と暮らしています。,語尾は -e だが男女同形。形容詞「若い」（giovane）としても使い、複数は giovani。,,年齢と人
L3-0257,3,il vecchio,老人|お年寄り,noun,m,i vecchi,家族・人,Il vecchio abita in una piccola casa.,その老人は小さな家に住んでいます。,形容詞 vecchio（古い、年老いた）の名詞用法。女性は la vecchia。anziano の方が丁寧で無難。,,年齢と人
L3-0677,3,l'anziano,高齢者|年配の男性,noun,m,"anziani (女性は l'anziana, le anziane)",家族・人,Un anziano mi ha chiesto la strada.,年配の男性が私に道を尋ねました。,形容詞 anziano「年老いた」の名詞用法。女性は l'anziana。vecchio より丁寧で、人に対してよく使う。,,年齢と人
L3-0180,3,il/la genitore,親|保護者,noun,mf,i genitori,家族・人,I miei genitori abitano a Firenze.,私の両親はフィレンツェに住んでいます。,単数は「親（父か母）」、複数 i genitori で「両親」の意味が最も多い。伝統的な女性形は genitrice（文語的）だが、日常では母親にも genitore を使うことが多い。,,年齢と人
L3-0089,3,il/la parente,親戚,noun,mf,"i parenti, le parenti",家族・人,Domenica pranzo con i miei parenti.,日曜日は親戚と昼食をとります。,語尾は -e で男女同形。複数は parenti。genitori（両親）と混同しやすいので注意。,,年齢と人
L3-0598,3,il gemello,双子の兄弟|双子の片割れ,noun,m,gemelli,家族・人,Mio fratello ha un gemello.,私の兄には双子の兄弟がいます。,女性は la gemella（複数 le gemelle）。複数 i gemelli は「双子」全体も指す。,,年齢と人
L3-0172,3,il fidanzato,恋人（男性）|婚約者（男性）|彼氏,noun,m,fidanzati,家族・人,Il mio fidanzato lavora a Milano.,私の恋人はミラノで働いています。,女性は la fidanzata。婚約者だけでなく、交際相手の意味でも日常的に使う。,,年齢と人
L3-0402,3,il compagno,パートナー|仲間|同僚,noun,m,compagni,家族・人,Il mio compagno lavora a Milano.,私のパートナーはミラノで働いています。,女性は la compagna（複数 compagne）。恋人・事実婚の相手のほか、compagno di classe（同級生）のように仲間の意味でも使う。,,年齢と人
L3-0411,3,l'ex,元恋人|元夫・元妻,noun,mf,"gli ex, le ex",家族・人,Ho incontrato il mio ex al supermercato.,スーパーで元彼に会いました。,男女同形。複数は男性 gli ex、女性 le ex（語形は不変）。元彼は il mio ex、元カノは la mia ex。,,年齢と人
L3-0443,3,l'ospite,客人|来客|（宿泊の）客,noun,mf,"gli ospiti, le ospiti",家族・人,Stasera abbiamo degli ospiti a cena.,今夜は夕食に来客があります。,男女同形の名詞。単数は男女とも l'ospite、複数は gli ospiti（男性）/ le ospiti（女性）。「招く側（主人）」も「招かれる側（客）」も指せる。,,年齢と人
L3-0181,3,il giocattolo,おもちゃ,noun,m,giocattoli,家族・人,Vorrei comprare un giocattolo per mio figlio.,息子におもちゃを買いたいのですが。,おもちゃ屋は il negozio di giocattoli。動詞 giocare（遊ぶ）と同じ語源。,il gioco,年齢と人
L3-0541,3,la bambola,人形,noun,f,bambole,家族・人,Vorrei comprare una bambola per mia nipote.,姪っ子に人形を買いたいのですが。,お土産店やおもちゃ屋で使う。ぬいぐるみは il peluche、操り人形は la marionetta。,,年齢と人
L3-0537,3,il tipo,やつ|タイプ|種類,noun,m,tipi,家族・人,Quel tipo è molto simpatico.,あの人はとても感じがいい。,口語では「男、やつ」の意味。女性は una tipa。「種類」の意味では che tipo di〜? と使う。,,年齢と人
L3-0576,3,il cittadino,市民|国民,noun,m,cittadini,家族・人,Ogni cittadino ha dei diritti.,すべての市民には権利があります。,女性形は la cittadina（複数 le cittadine）。cittadino italiano は「イタリア国籍の人」。,,町の人・国の人
L3-0777,3,l'abitante,住民|住人,noun,mf,"gli abitanti, le abitanti",家族・人,Questa città ha centomila abitanti.,この都市には10万人の住民がいます。,語尾は -e で男女同形。複数は男性 abitanti、女性 abitanti。人口を言うときにも使う。,il/la residente,町の人・国の人
L3-0338,3,lo straniero,外国人|よそ者,noun,m,stranieri,家族・人,Molti stranieri visitano Roma in estate.,夏には多くの外国人がローマを訪れます。,女性は la straniera（複数 le straniere）。s＋子音で始まるので単数の冠詞は lo。形容詞「外国の」としても使う。,,町の人・国の人
L3-0689,3,straniero,外国の|外国人の,adj,,"straniera, stranieri, straniere",家族・人,Parlo due lingue straniere.,私は外国語を2つ話します。,名詞としては「外国人」（lo straniero / la straniera）。all'estero は「外国で」。,,町の人・国の人
L3-0688,3,il sindaco,市長|町長,noun,m,sindaci,家族・人,Il sindaco parla alla gente in piazza.,市長は広場で市民に話しかけます。,複数形は -ci。女性市長は la sindaca（または la sindaco）。町村の長も sindaco と呼ぶ。,,町の人・国の人
L3-0098,3,il re,王|国王,noun,m,i re（不変）,家族・人,Il re vive in un grande palazzo.,王は大きな宮殿に住んでいます。,複数形も re のまま不変（i re）。女王は la regina。,il sovrano,町の人・国の人
L3-0322,3,la regina,女王|王妃,noun,f,regine,家族・人,La regina visita la città domani.,女王は明日この街を訪れます。,男性形は il re（複数 i re）。regina は王の妻（王妃）の意味でも使う。,,町の人・国の人
L3-0637,3,il principe,王子|君主,noun,m,principi,家族・人,Il principe vive in un grande castello.,王子は大きな城に住んでいます。,女性形は la principessa。複数形は principi で、-e で終わるが男性名詞。,,町の人・国の人
L3-0617,3,il nemico,敵|敵対者,noun,m,nemici,家族・人,Il fumo è un nemico della salute.,喫煙は健康の敵です。,女性形は la nemica（複数 nemiche）。「〜の敵」は nemico di ... と言う。比喩的にも使う。,,町の人・国の人
L3-0729,3,la padrona,女主人|女性の持ち主|大家（女性）,noun,f,le padrone,家族・人,La padrona di casa è molto gentile.,大家さんはとても親切です。,男性形は il padrone（複数 i padroni）。padrona di casa は「家の女主人」や「女性の大家」を指す。,,町の人・国の人
L3-0365,3,innamorarsi,恋に落ちる|惚れる,verb,,"mi innamoro, ti innamori, si innamora, ci innamoriamo, vi innamorate, si innamorano",家族・人,Mi sono innamorato di questa città.,僕はこの街が大好きになりました。,再帰動詞で、近過去は essere を使う（mi sono innamorato/a）。相手は di で示す。innamorato di 〜 は「〜に恋している」状態。,,恋愛と人生
L3-0296,3,innamorato,恋している|惚れている,adj,,"innamorata, innamorati, innamorate",家族・人,Marco è innamorato di Giulia.,マルコはジュリアに恋をしています。,「〜に恋している」は innamorato di 〜。essere innamorato で状態、innamorarsi で「恋に落ちる」。,,恋愛と人生
L3-0048,3,baciare,キスする,verb,,"bacio, baci, bacia, baciamo, baciate, baciano",家族・人,Marco bacia sua moglie sulla guancia.,マルコは妻の頬にキスをする。,直接目的語をとる他動詞。tu の活用は baci（i が1つ）。挨拶の頬キスは dare un bacio とも言う。,,恋愛と人生
L3-0131,3,abbracciare,抱きしめる|抱擁する,verb,,"abbraccio, abbracci, abbraccia, abbracciamo, abbracciate, abbracciano",家族・人,Voglio abbracciare mia madre.,私は母を抱きしめたい。,規則動詞(-ciare)。tu の活用では語幹の i と語尾の -i が重ならず abbracci となる(abbraccii とは書かない)。再帰形 abbracciarsi は「抱き合う」。手紙の結びには Ti abbraccio や名詞を使った Un abbraccio を使う。,,恋愛と人生
L3-0113,3,sposarsi,結婚する,verb,,"mi sposo, ti sposi, si sposa, ci sposiamo, vi sposate, si sposano",家族・人,Mia sorella si sposa a giugno.,姉は6月に結婚します。,再帰動詞。「〜と結婚する」は sposarsi con ...。近過去は essere を使う（si è sposata）。,,恋愛と人生
L3-0304,3,il matrimonio,結婚|結婚式,noun,m,matrimoni,家族・人,Domani andiamo al matrimonio di mia cugina.,明日、私たちはいとこの結婚式に行きます。,結婚式そのものは matrimonio か nozze（複数形）。「結婚する」は sposarsi。,le nozze,恋愛と人生
L3-0331,3,separarsi,別れる|離れる,verb,,"mi separo, ti separi, si separa, ci separiamo, vi separate, si separano",家族・人,Si sono separati l'anno scorso.,彼らは去年別れました。,再帰動詞。近過去は essere を使う（mi sono separato/a）。「〜と別れる」は separarsi da。,,恋愛と人生
L3-0782,3,l'anniversario,記念日|周年,noun,m,anniversari,家族・人,Domani è il nostro anniversario di matrimonio.,明日は私たちの結婚記念日です。,結婚記念日は anniversario di matrimonio。誕生日は普通 compleanno と言う（anniversario della nascita は故人や歴史上の人物の生誕記念に使う）。,,恋愛と人生
L3-0289,3,festeggiare,祝う|祝賀する,verb,,"festeggio, festeggi, festeggia, festeggiamo, festeggiate, festeggiano",家族・人,Domani festeggiamo il mio compleanno.,明日は私の誕生日をお祝いします。,直接目的語をとる他動詞。-giare 動詞なので、tu の活用では語幹の i と語尾 -i が重なって festeggi となる（festeggii とは書かない）。noi も festeggiamo。,,恋愛と人生
L3-0263,3,incinta,妊娠している|妊娠中の,adj,,incinte,家族・人,Mia sorella è incinta di cinque mesi.,姉は妊娠5か月です。,女性にだけ使う形容詞で、-a の形が基本。男性形はない。複数は incinte。essere incinta で「妊娠している」。,gravida,恋愛と人生
L3-0164,3,crescere,成長する|育つ|育てる,verb,,"cresco, cresci, cresce, cresciamo, crescete, crescono（過去分詞 cresciuto）",家族・人,I bambini crescono in fretta.,子どもたちはあっという間に育ちます。,自動詞では近過去の助動詞は essere（è cresciuto）。他動詞（育てる）では avere を使う。過去分詞は sc の音 [ʃ] を保つために i が入り、cresciuto と綴る。,,恋愛と人生
L3-0385,3,l'amicizia,友情|友好,noun,f,amicizie,家族・人,L'amicizia è molto importante per me.,友情は私にとってとても大切です。,amico（友人）から派生した名詞。複数形 amicizie は i が残る点に注意。stringere amicizia で「親交を結ぶ」。,,恋愛と人生
L3-0460,3,la relazione,関係|報告書|関連,noun,f,relazioni,家族・人,Domani devo preparare una relazione per il capo.,明日、上司のために報告書を準備しなければなりません。,「関係」は恋愛関係にも使う（una relazione seria）。報告書・レポートの意味もあり、文脈で判断する。,,恋愛と人生
L3-0532,3,il rapporto,関係|報告書|割合,noun,m,rapporti,家族・人,Ho un buon rapporto con i miei colleghi.,私は同僚たちと良い関係を築いています。,人間関係は rapporto、恋愛関係は relazione が多い。in rapporto a は「〜に比べて」。,,恋愛と人生
L3-0101,3,il ricordo,思い出|記念品,noun,m,ricordi,家族・人,Questo è un bel ricordo della nostra vacanza.,これは私たちの休暇のすてきな思い出です。,「お土産」には souvenir や regalo も使う。ricordo は記憶そのものも指す。動詞 ricordare（思い出す）と同語源。,,恋愛と人生
L3-0104,3,il segreto,秘密|秘訣,noun,m,segreti,家族・人,"Non dirlo a nessuno, è un segreto.",誰にも言わないで、これは秘密だよ。,形容詞としても使う（segreto/a「秘密の」）。in segreto は「こっそり、秘密裏に」。,,恋愛と人生
L3-0052,3,la bugia,嘘,noun,f,bugie,家族・人,"Non dire bugie, per favore.",嘘をつかないでください。,「嘘をつく」は dire una bugia。bugiardo/a は「嘘つき」。,,恋愛と人生
L3-0722,3,mentire,嘘をつく,verb,,"mento, menti, mente, mentiamo, mentite, mentono",家族・人,"Non mentire, dimmi la verità.",嘘をつかないで、本当のことを言って。,規則動詞（-ire で -isc- を挿入しない）。過去分詞は mentito。「嘘」は la bugia、dire una bugia とも言う。,,恋愛と人生
L3-0259,3,la verità,真実|本当のこと,noun,f,verità（不変）,家族・人,"Dimmi la verità, per favore.",本当のことを言ってください。,-à で終わる名詞は複数形も同形（複数形はまれ）。a dire la verità は「実を言うと」。,,恋愛と人生
L3-0126,3,la sorpresa,驚き|サプライズ,noun,f,sorprese,家族・人,Che bella sorpresa! Non ti aspettavo.,なんて嬉しい驚きでしょう！来るとは思わなかった。,「サプライズ（贈り物など）」の意味でも使う。形容詞 sorpreso は「驚いた」。,,恋愛と人生
L3-0216,3,la pasticceria,ケーキ店|菓子店|洋菓子,noun,f,pasticcerie,店・買い物,C'è una buona pasticceria vicino alla stazione.,駅の近くにおいしいケーキ店があります。,焼き菓子や生菓子を売る店。ケーキなどの菓子類そのものを指すこともある。パン屋は panetteria、ジェラート店は gelateria。,,お店とお店の人
L3-0210,3,il panettiere,パン屋（人）|パン職人,noun,m,panettieri,店・買い物,Il panettiere apre il negozio alle sette.,パン屋は7時に店を開けます。,人を指す語。店は la panetteria や il forno。女性は la panettiera。,,お店とお店の人
L3-0608,3,il macellaio,肉屋|精肉店の人,noun,m,macellai,店・買い物,Il macellaio vende carne fresca ogni mattina.,肉屋は毎朝新鮮な肉を売っています。,店は la macelleria。女性形は la macellaia（複数 le macellaie）。複数形は -io で終わるがアクセントのない -io なので macellai（-i が1つ）になる。,,お店とお店の人
L3-0597,3,il fruttivendolo,八百屋|青果店,noun,m,fruttivendoli,店・買い物,Compro le mele dal fruttivendolo vicino a casa.,家の近くの八百屋でりんごを買います。,人（八百屋の店主）も店も指す。店の意味では dal fruttivendolo「八百屋で」とよく言う。,l'ortofrutta,お店とお店の人
L3-0630,3,la pescheria,魚屋|鮮魚店,noun,f,pescherie,店・買い物,La pescheria vicino al mercato apre alle sette.,市場の近くの魚屋は7時に開きます。,"-ia で終わる名詞で、複数形は pescherie。店名を表す -eria 型の語（panetteria, macelleria など）の仲間。",,お店とお店の人
L3-0251,3,la tabaccheria,たばこ店|タバッキ,noun,f,tabaccherie,店・買い物,Dove posso comprare un biglietto dell'autobus? In tabaccheria?,バスの切符はどこで買えますか？たばこ店ですか？,たばこのほか、バス・地下鉄の切符、切手、公共料金の支払いなども扱う。看板は青または黒地に白のTが目印。,il tabaccaio,お店とお店の人
L3-0168,3,l'edicola,新聞売り場|キオスク,noun,f,edicole,店・買い物,Dov'è l'edicola più vicina?,一番近い新聞スタンドはどこですか?,新聞・雑誌のほか、バスの切符や絵はがきを売る店もある。アクセントは edìcola で、複数形は edicole。,il giornalaio,お店とお店の人
L3-0544,3,la cartoleria,文房具店,noun,f,cartolerie,店・買い物,Dov'è la cartoleria più vicina?,一番近い文房具店はどこですか？,文房具のほか、はがきや切手、コピーを扱う店もある。,,お店とお店の人
L3-0600,3,la gioielleria,宝飾店|ジュエリーショップ,noun,f,gioiellerie,店・買い物,C'è una gioielleria vicino alla piazza.,広場の近くに宝飾店があります。,店を指す語。商品の「宝石・宝飾品」は il gioiello（複数 i gioielli）。店主は il gioielliere。,,お店とお店の人
L3-0737,3,la profumeria,香水店|化粧品店,noun,f,profumerie,店・買い物,C'è una profumeria vicino alla stazione?,駅の近くに香水店はありますか？,香水だけでなく化粧品や日用美容品も扱う店。薬局は farmacia。,,お店とお店の人
L3-0195,3,la lavanderia,クリーニング店|コインランドリー,noun,f,lavanderie,店・買い物,C'è una lavanderia vicino all'albergo?,ホテルの近くにクリーニング店はありますか？,コインランドリーは lavanderia a gettoni や self-service とも言う。ドライクリーニングは lavaggio a secco。,,お店とお店の人
L3-0212,3,il parrucchiere,美容師|理髪師,noun,m,i parrucchieri,店・買い物,Domani vado dal parrucchiere per tagliare i capelli.,明日は髪を切りに美容院へ行きます。,女性の美容師は la parrucchiera（複数 le parrucchiere）。andare dal parrucchiere は「美容院（理髪店）へ行く」の意味で、人を表す語で店を指す言い方。,,お店とお店の人
L3-0692,3,il barbiere,床屋|理容師,noun,m,barbieri,店・買い物,Vado dal barbiere per tagliarmi i capelli.,髪を切りに床屋へ行きます。,男性客向けの理髪店・理容師。店は barberia や negozio del barbiere とも言う。美容師は parrucchiere/a（女性客が中心だが男性客も扱う）。,,お店とお店の人
L3-0401,3,il commesso,店員（男性）|販売員,noun,m,i commessi,店・買い物,Il commesso mi mostra una giacca blu.,店員が青いジャケットを見せてくれます。,"女性は la commessa（複数 le commesse）。店で呼びかける時は Scusi, ... と声をかける。",,お店とお店の人
L3-0121,3,la commessa,店員（女性）|販売員（女性）,noun,f,commesse,店・買い物,La commessa mi aiuta a scegliere una giacca.,店員さんが上着選びを手伝ってくれます。,"男性は il commesso（複数 i commessi）。店で呼びかけるときは Scusi, signora などを使う。",,お店とお店の人
L3-0801,3,il/la commerciante,商人|商店主,noun,mf,"i commercianti, le commercianti",店・買い物,Il commerciante apre il negozio alle nove.,その店主は9時に店を開けます。,-e で終わり男女同形。複数は男女とも commercianti。冠詞で性を区別する。,,お店とお店の人
L3-0069,3,il/la farmacista,薬剤師,noun,mf,"i farmacisti, le farmaciste",店・買い物,Il farmacista mi ha dato una medicina per la tosse.,薬剤師は私に咳止めの薬をくれました。,語尾は -a だが男女同形。複数は男性 farmacisti、女性 farmaciste。薬局は la farmacia。,,お店とお店の人
L3-0010,3,lo scontrino,レシート|領収書（簡易の）,noun,m,scontrini,店・買い物,"Posso avere lo scontrino, per favore?",レシートをいただけますか？,s＋子音で始まるので冠詞は lo。店で出るレシートを指す。正式な領収書は ricevuta や fattura。,,会計とレシート
L3-0034,3,la ricevuta,領収書|受領証|レシート,noun,f,ricevute,店・買い物,"Mi può dare la ricevuta, per favore?",領収書をいただけますか？,店のレシートは scontrino、領収書・受領証は ricevuta。fattura は請求書・インボイスで別物なので使い分ける。,,会計とレシート
L3-0026,3,la moneta,硬貨|小銭,noun,f,monete,店・買い物,Hai qualche moneta per il parcheggio?,駐車場用の小銭を持っていますか？,「小銭」の意味でもよく使う。「通貨」は valuta、「お釣り」は resto。,,会計とレシート
L3-0158,3,il contante,現金,noun,m,contanti,店・買い物,"Pago in contanti, non ho la carta.",現金で払います。カードを持っていません。,日常では複数形 contanti が普通。in contanti（現金で）の形でよく使う。,i contanti,会計とレシート
L3-0056,3,il codice,暗証番号|コード|符号|法典,noun,m,codici,店・買い物,Qual è il codice del wifi?,Wi-Fiのパスワードは何ですか？,ホテルでは wifi や金庫の番号を指す。暗証番号は codice PIN とも言う。複数形は -ci で、発音は「コーディチ」。,,会計とレシート
L3-0128,3,la tessera,カード（会員証）|会員証|〜証（保険証など）,noun,f,tessere,店・買い物,Ha la tessera del supermercato?,スーパーのカードはお持ちですか？,会員証・ポイントカードなどに使う。クレジットカードは carta di credito、交通系の定期券は abbonamento。,,会計とレシート
L3-0120,3,il carrello,カート|ショッピングカート,noun,m,carrelli,店・買い物,Prendo un carrello per la spesa.,買い物用のカートを取ります。,スーパーのカートのほか、空港の荷物カートにも使う。,,会計とレシート
L3-0278,3,la coda,列|渋滞|しっぽ,noun,f,code,店・買い物,C'è una lunga coda alla biglietteria.,切符売り場に長い列ができています。,fare la coda で「列に並ぶ」。本来は「しっぽ」の意味。高速の渋滞は coda in autostrada とも言う。,,会計とレシート
L3-0160,3,il costo,費用|コスト|値段,noun,m,costi,店・買い物,Il costo della vita è alto in questa città.,この街は生活費が高いです。,動詞 costare（値段がする）と同語源。il prezzo は店での「値段」、costo は原価や費用全般を指す。,,会計とレシート
L3-0482,3,la tariffa,料金|運賃,noun,f,tariffe,店・買い物,Qual è la tariffa per una notte?,1泊の料金はいくらですか？,ホテルの宿泊料金や公共料金、運賃など、定められた料金表の額を指す。prezzo は一般的な値段。,,会計とレシート
L3-0360,3,costoso,高価な|値段が高い,adj,,"costosa, costosi, costose",店・買い物,Questo ristorante è troppo costoso per noi.,このレストランは私たちには高すぎます。,値段が高いという意味。物・サービス・店などに使い、人には使わない。caro も同じ意味で会話ではよく使われるが、「親愛な」の意味もある。,caro,会計とレシート
L3-0076,3,gratuito,無料の|ただの,adj,,"gratuita, gratuiti, gratuite",店・買い物,L'ingresso al museo è gratuito la domenica.,美術館の入場は日曜日は無料です。,gratis は不変の形容詞・副詞で「ただで・無料の」。口語ではこちらもよく使う。,,会計とレシート
L3-0518,3,incluso,含まれた|込みの,adj,,"inclusa, inclusi, incluse",店・買い物,La colazione è inclusa nel prezzo.,朝食は料金に含まれています。,過去分詞 incluso（includere）から。性数一致する。「朝食付き」は colazione inclusa。compreso もほぼ同義。,compreso,会計とレシート
L3-0558,3,acquistare,購入する|買う,verb,,"acquisto, acquisti, acquista, acquistiamo, acquistate, acquistano",店・買い物,Vorrei acquistare due biglietti per il museo.,美術館のチケットを2枚購入したいのですが。,comprare より改まった語で、書き言葉や店・ネット通販でよく使う。規則動詞で、近過去は avere を使う。,comprare,会計とレシート
L3-0465,3,risparmiare,節約する|貯める,verb,,"risparmio, risparmi, risparmia, risparmiamo, risparmiate, risparmiano",店・買い物,Vorrei risparmiare un po' di soldi per il viaggio.,旅行のために少しお金を貯めたいです。,他動詞で、近過去は avere を使う（ho risparmiato）。risparmiare su ... は「〜を節約する」。,,会計とレシート
L3-0381,3,la vetrina,ショーウィンドウ|陳列棚,noun,f,vetrine,店・買い物,Mi piace quella borsa in vetrina.,ショーウィンドウにあるあのバッグが気に入りました。,in vetrina は「店先に飾られた」。guardare le vetrine は買わずに店先を見て歩くこと。,,セールと品物選び
L3-0593,3,l'etichetta,値札|ラベル|エチケット,noun,f,etichette,店・買い物,Dov'è l'etichetta con il prezzo?,値段の書いてある札はどこですか？,商品に付く札やラベル全般を指す。「礼儀作法」の意味もあるが、買い物では値札や表示タグの意味で使う。,,セールと品物選び
L3-0619,3,l'offerta,特売|申し出|提供,noun,f,offerte,店・買い物,Questa settimana c'è un'offerta speciale sulle scarpe.,今週は靴の特別セールがあります。,店では in offerta で「特売中」。「申し出」の意味でも使う。,,セールと品物選び
L3-0517,3,in saldo,セール中で|割引価格で,phrase,,,店・買い物,Questa giacca è in saldo.,このジャケットはセール中です。,saldi は「バーゲンセール」（複数形）。冬と夏のセール期間は saldi と呼ばれる。in offerta は特価品・キャンペーン価格。,,セールと品物選び
L3-0511,3,esaurito,売り切れの|品切れの|疲れ果てた,adj,,"esaurita, esauriti, esaurite",店・買い物,"Mi dispiace, questa taglia è esaurita.",申し訳ありません、このサイズは売り切れです。,esaurire の過去分詞から派生した形容詞。チケットや商品に使い、劇場の「sold out」は tutto esaurito。,,セールと品物選び
L3-0274,3,il camerino,試着室|楽屋,noun,m,camerini,店・買い物,Posso provare questo vestito nel camerino?,この服を試着室で試してもいいですか？,店では camerino di prova とも言う。劇場の楽屋も camerino。camera（部屋）の指小形だが別の語として覚える。,il camerino di prova,セールと品物選び
L3-0308,3,la misura,サイズ|寸法|措置,noun,f,misure,店・買い物,Il sarto prende le misure per il vestito.,仕立屋は服のために採寸をします。,服や靴のサイズは taglia（服）、numero（靴）が普通。misura は寸法・採寸（prendere le misure「採寸する」）や「措置」（adottare misure）の意味でよく使う。su misura は「オーダーメイドの」。,,セールと品物選び
L3-0309,3,misurare,測る|試着する,verb,,"misuro, misuri, misura, misuriamo, misurate, misurano",店・買い物,La sarta misura la lunghezza dei pantaloni.,仕立屋はズボンの丈を測る。,体温を測るは misurare la febbre。服の試着は provare（provarsi un abito）が一般的。,,セールと品物選び
L3-0520,3,il modello,モデル（型）|型|見本,noun,m,modelli,店・買い物,Questo modello è disponibile in altri colori?,このモデルは他の色もありますか？,店では商品の型・機種を指す。ファッションモデルなど人の意味では、男性は il modello、女性は la modella。,,セールと品物選び
L3-0320,3,la qualità,品質|質,noun,f,qualità（不変）,店・買い物,Questo formaggio è di ottima qualità.,このチーズはとても質が良いです。,-à で終わる名詞は複数形も同形。di buona qualità（質の良い）の形でよく使う。,,セールと品物選び
L3-0321,3,la quantità,量|数量,noun,f,quantità（不変）,店・買い物,Non mangio una grande quantità di carne.,私は大量の肉は食べません。,-à で終わる名詞は複数形も同形。una quantità di ... で「たくさんの〜」の意味にもなる。,,セールと品物選び
L3-0494,3,il valore,価値|値打ち,noun,m,valori,店・買い物,Questo quadro ha un grande valore per me.,この絵は私にとって大きな価値があります。,「値打ち」だけでなく「価値観」(i valori)や「数値」の意味でも使う。「価格」は prezzo が一般的。,,セールと品物選び
L3-0492,3,usato,中古の|使用済みの,adj,,"usata, usati, usate",店・買い物,"Cerco una bicicletta usata, non troppo cara.",あまり高くない中古の自転車を探しています。,名詞化して l'usato（中古品）とも使う。mercato dell'usato は中古市場。新品は nuovo。,di seconda mano,セールと品物選び
L3-0823,3,la garanzia,保証|保証書,noun,f,garanzie,店・買い物,Questo orologio ha due anni di garanzia.,この時計には2年の保証が付いています。,買い物では「保証期間内」を in garanzia、「保証が切れた」を fuori garanzia と言う。,,セールと品物選び
L3-0132,3,l'abito,服|スーツ|ドレス,noun,m,abiti,店・買い物,Cerco un abito elegante per la cena di domani.,明日の夕食に着ていくおしゃれな服を探しています。,abito は改まった場の服やスーツ・ドレスを指すことが多い。単数の vestito もほぼ同じ意味で、日常の服一般は複数形の i vestiti ということが多い。母音始まりなので冠詞は l'。,il vestito,服とアクセサリー
L3-0150,3,la camicetta,ブラウス,noun,f,camicette,店・買い物,Vorrei provare questa camicetta bianca.,この白いブラウスを試着したいのですが。,camicia（シャツ）の指小形で、主に女性用の軽いシャツ・ブラウスを指す。,,服とアクセサリー
L3-0162,3,la cravatta,ネクタイ,noun,f,cravatte,店・買い物,Vorrei comprare una cravatta per mio padre.,父にネクタイを買いたいのですが。,語尾は -a で女性名詞。複数形は cravatte。蝶ネクタイは papillon または farfallino。,,服とアクセサリー
L3-0156,3,la cintura,ベルト|シートベルト,noun,f,cinture,店・買い物,Vorrei una cintura di pelle nera.,黒い革のベルトがほしいのですが。,ズボンのベルトも車のシートベルト（cintura di sicurezza）も cintura。,,服とアクセサリー
L3-0183,3,il giubbotto,ジャケット|ブルゾン,noun,m,giubbotti,店・買い物,Cerco un giubbotto leggero per la primavera.,春用の軽いジャケットを探しています。,丈の短いカジュアルな上着。スーツのジャケットは giacca。ダウンジャケットは piumino と言う。,il giubbino,服とアクセサリー
L3-0820,3,la felpa,トレーナー|スウェットシャツ|パーカー,noun,f,felpe,店・買い物,"Cerco una felpa blu, taglia media.",青いトレーナーを探しています、Mサイズです。,フード付きは felpa con il cappuccio。パーカーに当たる語として使うことも多い。,,服とアクセサリー
L3-0161,3,il costume,水着|衣装|風習,noun,m,costumi,店・買い物,"Vorrei un costume da bagno, per favore.",水着をお願いします。,水着は costume da bagno が正式で、単に costume とも言う。「習慣、風習」の意味もある。,il costume da bagno,服とアクセサリー
L3-0220,3,il pigiama,パジャマ,noun,m,pigiami,店・買い物,"Vorrei un pigiama di cotone, taglia media.",綿のパジャマをください、Mサイズです。,語尾は -a だが男性名詞なので il pigiama。複数形は i pigiami。,,服とアクセサリー
L3-0238,3,il sandalo,サンダル,noun,m,sandali,店・買い物,Cerco un paio di sandali per il mare.,海用のサンダルを探しています。,靴は普通 un paio di sandali（1足）と数える。単数 sandalo は片方を指す。,,服とアクセサリー
L3-0756,3,lo stivale,ブーツ|長靴,noun,m,stivali,店・買い物,Cerco un paio di stivali neri.,黒いブーツを探しています。,s＋子音で始まるので冠詞は lo、複数は gli stivali。イタリア半島の形が長靴に似ていることから、イタリアを lo Stivale と呼ぶこともある。,,服とアクセサリー
L3-0602,3,il guanto,手袋,noun,m,guanti,店・買い物,Cerco un paio di guanti di pelle.,革の手袋を探しています。,普通は un paio di guanti（1組の手袋）と言う。複数形は guanti。,,服とアクセサリー
L3-0050,3,la borsetta,ハンドバッグ|小さなかばん,noun,f,borsette,店・買い物,Ho dimenticato la borsetta sul tavolo.,テーブルの上にハンドバッグを忘れました。,borsa（かばん）の指小形だが、女性用ハンドバッグを指す語として定着している。,,服とアクセサリー
L3-0483,3,la tasca,ポケット,noun,f,tasche,店・買い物,Ho le chiavi nella tasca della giacca.,鍵は上着のポケットに入っています。,服のポケット。複数形は tasche（発音 /k/ を保つため c が ch になる）。tascabile は「ポケットサイズの、携帯用の」という形容詞。,,服とアクセサリー
L3-0504,3,l'anello,指輪|輪,noun,m,anelli,店・買い物,Vorrei vedere questo anello in vetrina.,ショーウィンドウにあるこの指輪を見たいのですが。,複数形は anelli（男性）。結婚指輪は la fede、婚約指輪は anello di fidanzamento。,,服とアクセサリー
L3-0839,3,l'orecchino,イヤリング|ピアス,noun,m,orecchini,店・買い物,Cerco un paio di orecchini d'argento.,銀のイヤリングを探しています。,1組は un paio di orecchini で、複数形 gli orecchini でよく使う。イヤリングとピアスは区別せず同じ語で言う。,,服とアクセサリー
L3-0568,3,il braccialetto,ブレスレット|腕輪,noun,m,braccialetti,店・買い物,"Vorrei vedere questo braccialetto d'argento, per favore.",この銀のブレスレットを見せていただけますか。,braccio（腕）に指小辞がついた語。複数形は braccialetti。時計のバンドは cinturino。,,服とアクセサリー
L3-0824,3,il gioiello,宝飾品|ジュエリー,noun,m,gioielli,店・買い物,Cerco un gioiello per il compleanno di mia madre.,母の誕生日に贈る宝飾品を探しています。,複数形は gioielli。宝石（石そのもの）は pietra preziosa や gemma、宝石店は la gioielleria。,,服とアクセサリー
L3-0686,3,il portachiavi,キーホルダー|キーケース,noun,m,portachiavi（不変）,店・買い物,Vorrei comprare un portachiavi come souvenir.,お土産にキーホルダーを買いたいです。,複合名詞で単数も複数も同形。複数は i portachiavi。お土産の定番。,,服とアクセサリー
L3-0008,3,il profumo,香水|香り,noun,m,profumi,店・買い物,Cerco un profumo per mia madre.,母に贈る香水を探しています。,「香水」と「香り」の両方に使う。香水店は profumeria。,,服とアクセサリー
L3-0353,3,la moda,流行|ファッション,noun,f,mode,店・買い物,Questa giacca è molto di moda.,このジャケットはとても流行しています。,di moda は「流行している」、passato di moda は「時代遅れの」。Milano は moda の街として有名。,,服とアクセサリー
L3-0712,3,indossare,身につける|着る,verb,,"indosso, indossi, indossa, indossiamo, indossate, indossano",店・買い物,Oggi indosso il vestito nuovo.,今日は新しいワンピースを着ています。,服・靴・帽子・アクセサリーなど身につけるもの全般に使える。口語では mettersi（着る動作）や portare もよく使う。,,服とアクセサリー
L3-0196,3,il legno,木材|木（素材）,noun,m,legni,住まい・日用品,Questo tavolo è di legno.,このテーブルは木でできています。,素材としての「木」。生えている木は albero。di legno で「木製の」。,,素材
L3-0118,3,il vetro,ガラス|窓ガラス,noun,m,vetri,住まい・日用品,Il bicchiere è di vetro.,そのグラスはガラス製です。,素材としてのガラス。ガラス製品は di vetro。窓ガラスは vetro、板ガラスは lastra とも言う。,,素材
L3-0223,3,la plastica,プラスチック|プラスチック製品,noun,f,plastiche,住まい・日用品,"Questa borsa è di plastica, non di pelle.",このバッグはプラスチック製で、革ではありません。,「プラスチック製の」は di plastica。ごみ分別では la plastica が回収品目名として使われる。,,素材
L3-0797,3,la ceramica,陶磁器|陶芸|焼き物,noun,f,ceramiche,住まい・日用品,Vorrei comprare una ceramica fatta a mano.,手作りの陶器を買いたいのですが。,素材・工芸を指す不可算的用法のほか、個々の作品（複数 ceramiche）も指す。イタリアでは地方ごとの陶器が土産の定番。,,素材
L3-0547,3,la lana,ウール|羊毛,noun,f,lane,住まい・日用品,Questo maglione è di pura lana.,このセーターは純毛です。,素材は di lana（ウール製の）と言う。「純毛」は pura lana または 100% lana。複数形 lane は種類を指す時に使う。,,素材
L3-0583,3,il cotone,綿|コットン,noun,m,cotoni,住まい・日用品,Questa maglietta è di puro cotone.,このTシャツは綿100%です。,素材は di cotone で表す。買い物では 100% cotone（綿100%）の表示をよく見る。,,素材
L3-0091,3,la pelle,革|皮膚|肌,noun,f,pelli,住まい・日用品,Questa borsa è di vera pelle?,このバッグは本革ですか？,買い物では革製品を指すことが多い。「本革」は vera pelle。cuoio は加工した硬めの革を指す。,,素材
L3-0024,3,la melanzana,ナス,noun,f,melanzane,食事・飲み物,"Prendo la parmigiana di melanzane, per favore.",ナスのパルミジャーナをください。,parmigiana di melanzane はナスとチーズのオーブン焼きで、南イタリアの定番料理。,,野菜・果物・ハーブ
L3-0153,3,il cetriolo,きゅうり,noun,m,cetrioli,食事・飲み物,Vorrei un'insalata con pomodori e cetrioli.,トマトときゅうりのサラダをください。,サラダの定番野菜。小型の酢漬けは cetriolino。,,野菜・果物・ハーブ
L3-0194,3,la lattuga,レタス,noun,f,lattughe,食事・飲み物,Vorrei un panino con la lattuga e il pomodoro.,レタスとトマトのサンドイッチをください。,複数形は -ghe と h が入り、発音は「ガ」の音のまま。サラダ用の葉野菜は insalata とも言う。,,野菜・果物・ハーブ
L3-0177,3,il fungo,きのこ,noun,m,funghi,食事・飲み物,"Vorrei la pizza ai funghi, per favore.",きのこのピザをお願いします。,複数形は funghi（-go → -ghi で発音を保つ）。funghi porcini はポルチーニ茸。,,野菜・果物・ハーブ
L3-0222,3,il pisello,グリーンピース|エンドウ豆,noun,m,piselli,食事・飲み物,Vorrei la pasta con i piselli.,グリーンピース入りのパスタをください。,食材としては複数形 piselli で使うことが多い。俗語では男性器の意味もあるので、使う場面に注意。,,野菜・果物・ハーブ
L3-0413,3,il fagiolo,いんげん豆|豆,noun,m,fagioli,食事・飲み物,"Per contorno prendo i fagioli, per favore.",付け合わせにいんげん豆をください。,複数形 fagioli で使うことが多い。fagiolini は「さやいんげん」で別物。,,野菜・果物・ハーブ
L3-0477,3,lo spinacio,ほうれん草,noun,m,spinaci,食事・飲み物,Mangio spesso gli spinaci con il limone.,私はよくほうれん草をレモンで食べます。,料理では複数形 gli spinaci で使うのが普通。s＋子音で始まるので単数の冠詞は lo、複数は gli。,,野菜・果物・ハーブ
L3-0676,3,lo zucchino,ズッキーニ,noun,m,zucchini,食事・飲み物,Vorrei una pizza con gli zucchini.,ズッキーニのピザをください。,z で始まる男性名詞なので単数の冠詞は lo（s+子音で始まる語も同様）。複数は gli zucchini。女性形 la zucchina（複数 le zucchine）も同じ意味で広く使われる。,la zucchina,野菜・果物・ハーブ
L3-0448,3,il peperone,パプリカ|ピーマン,noun,m,peperoni,食事・飲み物,Vorrei una pizza con i peperoni.,パプリカのピザをください。,イタリアのピーマンは肉厚で大きく、赤・黄・緑がある。peperoncino は唐辛子で別の語。,,野菜・果物・ハーブ
L3-0795,3,il carciofo,アーティチョーク,noun,m,carciofi,食事・飲み物,Come antipasto prendo i carciofi alla romana.,前菜にローマ風アーティチョークをいただきます。,ローマ料理の carciofi alla romana や、ユダヤ風の alla giudia が有名。春が旬。,,野菜・果物・ハーブ
L3-0796,3,il cavolo,キャベツ|アブラナ科の野菜（カリフラワーなど）,noun,m,cavoli,食事・飲み物,Per la zuppa uso un cavolo e due patate.,スープにはキャベツ1玉とじゃがいも2個を使います。,cavolfiore（カリフラワー）や cavolo nero（黒キャベツ）など、cavolo を含む野菜名がある。Che cavolo! は Che cazzo! を和らげた口語の間投句で、驚きや苛立ちを表す。,,野菜・果物・ハーブ
L3-0791,3,il broccolo,ブロッコリー,noun,m,broccoli,食事・飲み物,Mangio i broccoli con un po' d'olio e limone.,ブロッコリーをオリーブオイルとレモンで食べます。,料理では複数形 i broccoli が普通。単数 il broccolo は1株を指す。,,野菜・果物・ハーブ
L3-0764,3,la zucca,カボチャ,noun,f,zucche,食事・飲み物,Mi piace la zuppa di zucca.,私はカボチャのスープが好きです。,秋の定番食材。ravioli di zucca（カボチャのラビオリ）も有名。口語で「頭」の意味にもなる。,,野菜・果物・ハーブ
L3-0705,3,il finocchio,フェンネル|ウイキョウ,noun,m,finocchi,食事・飲み物,Mi piace l'insalata di finocchi e arance.,フェンネルとオレンジのサラダが好きです。,生でサラダにしたり、焼いたり煮たりして食べる。俗語で男性同性愛者への蔑称になるので、人には使わない。,,野菜・果物・ハーブ
L3-0610,3,il mais,とうもろこし,noun,m,mais（不変）,食事・飲み物,Mi piace l'insalata con il mais.,私はコーン入りのサラダが好きです。,語末が子音の外来語系名詞で複数形は不変。同義の granturco も使われるが、日常では mais が一般的。サラダ用の缶詰コーンもこの語。,il granturco,野菜・果物・ハーブ
L3-0456,3,il prezzemolo,パセリ,noun,m,,食事・飲み物,Aggiungi un po' di prezzemolo alla pasta.,パスタに少しパセリを加えてね。,イタリア料理で多用するハーブ。複数形はほとんど使わず、通常は単数で不可算的に扱う。,,野菜・果物・ハーブ
L3-0264,3,la menta,ミント|はっか,noun,f,mente,食事・飲み物,"Vorrei un tè alla menta, per favore.",ミントティーをお願いします。,食材・ハーブ・シロップ（sciroppo di menta）などで使う。複数形 mente は la mente（心）と同形だが別語で、こちらの複数形は menti。,,野菜・果物・ハーブ
L3-0054,3,la ciliegia,サクランボ,noun,f,ciliegie,食事・飲み物,Mi piacciono molto le ciliegie fresche.,私は新鮮なサクランボが大好きです。,複数形は ciliegie（-gia の i は保持）。木は il ciliegio、色の「チェリー色」は ciliegia（不変）。,,野菜・果物・ハーブ
L3-0505,3,l'anguria,すいか,noun,f,angurie,食事・飲み物,In estate mangio spesso l'anguria.,夏はよくすいかを食べます。,北イタリアでは anguria、中南部では cocomero と言うことが多い。,il cocomero,野菜・果物・ハーブ
L3-0717,3,il lampone,ラズベリー|木苺,noun,m,lamponi,食事・飲み物,"Vorrei un gelato al lampone, per favore.",ラズベリーのジェラートをください。,ジェラートやジャムの味でよく見かける。果樹は il lampone、実も同じ語を使う。,,野菜・果物・ハーブ
L3-0612,3,la mandorla,アーモンド,noun,f,mandorle,食事・飲み物,Mi piace il gelato alla mandorla.,私はアーモンドのジェラートが好きです。,木は il mandorlo。シチリアのアーモンド菓子やジェラートが有名。,,野菜・果物・ハーブ
L3-0728,3,la nocciola,ヘーゼルナッツ,noun,f,nocciole,食事・飲み物,"Vorrei un gelato alla nocciola, per favore.",ヘーゼルナッツのジェラートをください。,ジェラートの定番フレーバー。色を表すときは不変の形容詞（nocciola）で「薄茶色の」。,,野菜・果物・ハーブ
L3-0548,3,maturo,熟した|成熟した,adj,,"matura, maturi, mature",食事・飲み物,Queste pesche sono mature e dolci.,この桃は熟していて甘いです。,果物が熟している意味でよく使う。人にも「大人びた、成熟した」の意味で使える。反対は acerbo や verde。,,野菜・果物・ハーブ
L3-0201,3,il manzo,牛肉,noun,m,manzi,食事・飲み物,Per secondo prendo il manzo alla griglia.,メインは牛肉のグリルにします。,食材としての牛肉。動物の牛は普通 il bue や la mucca。メニューでは carne di manzo とも書く。,,肉・魚介・チーズ
L3-0690,3,l'agnello,子羊|ラム肉,noun,m,agnelli,食事・飲み物,Per secondo prendo l'agnello al forno.,メインは子羊のオーブン焼きにします。,動物にも料理にも使う。ローマ料理の abbacchio は乳飲み子羊を指す。母音で始まるので冠詞は l'。,,肉・魚介・チーズ
L3-0237,3,la salsiccia,ソーセージ|腸詰め,noun,f,salsicce,食事・飲み物,"Vorrei due salsicce alla griglia, per favore.",グリルしたソーセージを2本お願いします。,複数形は salsicce（-cia の前が子音なので i が落ちて -ce になる）。生の豚肉ソーセージを指すことが多いが、熟成させた salsiccia secca もある。,,肉・魚介・チーズ
L3-0725,3,la mortadella,モルタデッラ|ボローニャソーセージ,noun,f,mortadelle,食事・飲み物,Vorrei un panino con la mortadella.,モルタデッラのパニーノをください。,ボローニャ名物の大きな加熱ソーセージ。薄切りにして panino や前菜に使う。,,肉・魚介・チーズ
L3-0273,3,il calamaro,イカ|ヤリイカ,noun,m,calamari,食事・飲み物,Per primo prendo gli spaghetti ai calamari.,第一皿はイカのスパゲッティにします。,料理では複数形 calamari がよく使われる。フリットは calamari fritti。seppia（コウイカ）や totano（スルメイカの仲間）は別種のイカで、calamaro とは区別される。,,肉・魚介・チーズ
L3-0498,3,la vongola,アサリ|ハマグリ,noun,f,vongole,食事・飲み物,Per primo prendo gli spaghetti alle vongole.,プリモ・ピアットはアサリのスパゲッティにします。,spaghetti alle vongole は定番料理。vongola は主にアサリ類を指し、日本のハマグリとは厳密には異なる。,,肉・魚介・チーズ
L3-0546,3,la cozza,ムール貝,noun,f,cozze,食事・飲み物,Per primo prendo gli spaghetti alle cozze.,プリモにムール貝のスパゲッティをいただきます。,地域によっては別名もある（ヴェネツィアでは peoci、リグーリアやトスカーナでは muscoli）。レストランでは複数形 cozze で注文することが多い。,il mitilo,肉・魚介・チーズ
L3-0075,3,il gorgonzola,ゴルゴンゾーラ|青カビチーズ,noun,m,gorgonzola（不変）,食事・飲み物,Vorrei una pizza al gorgonzola.,ゴルゴンゾーラのピザをお願いしたいのですが。,ロンバルディア地方原産。甘口の dolce と辛口の piccante がある。複数形はほとんど使わない。,,肉・魚介・チーズ
L3-0429,3,il mascarpone,マスカルポーネ|クリームチーズ,noun,m,mascarponi (ほとんど使われない),食事・飲み物,Il tiramisù si fa con il mascarpone.,ティラミスはマスカルポーネで作ります。,ティラミスなどのデザートに使う、クリーム状でやわらかく甘みのあるフレッシュチーズ。複数形はほとんど使われない。,,肉・魚介・チーズ
L3-0628,3,il pecorino,ペコリーノ|羊乳チーズ,noun,m,pecorini,食事・飲み物,Vorrei un po' di pecorino con il pane.,パンと一緒にペコリーノを少しください。,羊乳から作るチーズの総称。ローマ風パスタなどに使うペコリーノ・ロマーノが有名。,,肉・魚介・チーズ
L3-0002,3,la panna,生クリーム|クリーム,noun,f,panne,食事・飲み物,"Vorrei un caffè con la panna, per favore.",ホイップクリーム入りのコーヒーをお願いします。,caffè con panna はホイップクリーム入りコーヒー。料理用は panna da cucina、泡立てたものは panna montata。,,肉・魚介・チーズ
L3-0499,3,l'aceto,酢|ビネガー,noun,m,aceti,食事・飲み物,Vorrei olio e aceto per l'insalata.,サラダ用にオイルと酢をお願いします。,母音で始まる男性名詞なので冠詞は l'。aceto balsamico はバルサミコ酢。複数形はほぼ使わない。,,肉・魚介・チーズ
L3-0062,3,la cotoletta,カツレツ|薄切り肉のフライ,noun,f,cotolette,食事・飲み物,"Per me una cotoletta con patatine, per favore.",私はフライドポテト付きのカツレツをお願いします。,仔牛などの肉にパン粉をつけて焼く料理。cotoletta alla milanese（ミラノ風カツレツ）が有名。,,イタリアの料理
L3-0230,3,il ragù,ラグー|ミートソース,noun,m,ragù（不変）,食事・飲み物,"Vorrei le tagliatelle al ragù, per favore.",タリアテッレのラグーソースをお願いします。,アクセント付きの -ù で終わる名詞は複数形も同形。ボローニャ風は ragù alla bolognese。,,イタリアの料理
L3-0421,3,lo gnocco,ニョッキ,noun,m,gnocchi,食事・飲み物,"Vorrei gli gnocchi al pesto, per favore.",ペスト・ソースのニョッキをお願いします。,普通は複数形 gli gnocchi で使う。gn で始まるので単数の冠詞は lo、複数は gli。,,イタリアの料理
L3-0290,3,la frittata,フリッタータ|イタリア風オムレツ,noun,f,frittate,食事・飲み物,Per pranzo mangio una frittata con le zucchine.,昼食にズッキーニ入りのフリッタータを食べます。,溶き卵に具材を混ぜてフライパンで両面を焼く料理。フランス式オムレツのように折りたたまない。,,イタリアの料理
L3-0632,3,la piadina,ピアディーナ|平焼きパン,noun,f,piadine,食事・飲み物,Per pranzo prendo una piadina con prosciutto e formaggio.,昼食にハムとチーズのピアディーナを食べます。,エミリア＝ロマーニャ地方（特にロマーニャ）の名物。生地を焼いて具を挟み、二つ折りにして食べる。,,イタリアの料理
L3-0669,3,il tramezzino,トラメッツィーノ|サンドイッチ（三角形の）,noun,m,tramezzini,食事・飲み物,Prendo un tramezzino al tonno e un caffè.,ツナのトラメッツィーノとコーヒーをください。,耳を落とした白い食パンの三角サンド。バールの定番軽食。panino は丸いパンなどに挟んだもの。,,イタリアの料理
L3-0615,3,la minestra,スープ|汁物,noun,f,minestre,食事・飲み物,Come primo prendo la minestra di verdure.,第一皿には野菜スープをいただきます。,野菜やパスタ・米入りの具だくさんスープ。minestrone は具が特に多い大盛りのもの。,,イタリアの料理
L3-0835,3,il minestrone,ミネストローネ|野菜スープ,noun,m,minestroni,食事・飲み物,"Per primo prendo il minestrone, grazie.",最初の一皿はミネストローネをいただきます。,野菜や豆、パスタや米を入れた具だくさんのスープ。メニューでは primo piatto の欄に載ることが多い。,,イタリアの料理
L3-0792,3,il brodo,ブロス|だし汁|スープ（澄んだ）,noun,m,brodi,食事・飲み物,"Per favore, vorrei un brodo caldo di pollo.",すみません、温かいチキンブロスをお願いします。,肉や野菜を煮出した澄んだスープ。tortellini in brodo のようにパスタを入れて出すことも多い。複数形は brodi。,,イタリアの料理
L3-0159,3,il contorno,付け合わせ|サイドディッシュ,noun,m,contorni,食事・飲み物,Come contorno prendo le patate arrosto.,付け合わせはローストポテトにします。,メイン料理（secondo）に添える野菜などの料理。メニューでは別項目で、別に注文する。,,イタリアの料理
L3-0315,3,la porzione,一人前|分量,noun,f,porzioni,食事・飲み物,Questa porzione è troppo grande per me.,この一人前の量は私には多すぎます。,料理の1人分・盛り分を表す。mezza porzione は「半人前」。,,イタリアの料理
L3-0595,3,la fetta,一切れ|薄切り,noun,f,fette,食事・飲み物,"Vorrei una fetta di torta, per favore.",ケーキを一切れください。,パン・ケーキ・ハムなど薄く切ったものに使う。una fetta di ～ の形で頻出。,,イタリアの料理
L3-0248,3,lo spuntino,軽食|おやつ,noun,m,spuntini,食事・飲み物,Facciamo uno spuntino prima di andare al museo?,美術館に行く前に軽く食べませんか？,食事の合間にとる軽い食べ物。s＋子音で始まるので冠詞は lo、不定冠詞は uno。fare uno spuntino で「軽く食べる」。,,イタリアの料理
L3-0058,3,il coperto,席料|カバーチャージ|（1人分の）食器一式,noun,m,coperti,食事・飲み物,Il coperto costa due euro a persona.,席料は1人2ユーロです。,レストランで席に着くとかかる料金で、パンやテーブルセットの代金。メニューや会計に coperto と記載される。,,イタリアの料理
L3-0352,3,la mancia,チップ,noun,f,mance,食事・飲み物,Lasciamo una mancia al cameriere?,ウェイターにチップを置きましょうか？,イタリアではチップは義務ではなく、coperto（席料）が別に請求されることが多い。複数形は -cia の前が子音なので i が落ちて mance となる。,,イタリアの料理
L3-0147,3,la bibita,清涼飲料水|飲み物,noun,f,bibite,食事・飲み物,Che bibita vuoi? Io prendo un'aranciata.,どんな飲み物にする？私はオレンジ味の炭酸飲料にするよ。,主に清涼飲料水など、ソフトドリンクを指す。bevanda は水・ワイン・ビールなどを含む飲み物全般を指す、より広い語。,,飲み物とデザート
L3-0384,3,alcolico,アルコールの入った|アルコール性の,adj,,"alcolica, alcolici, alcoliche",食事・飲み物,Non bevo bevande alcoliche.,私はアルコール飲料は飲みません。,名詞 l'alcolico（酒）としても使う。「ノンアルコールの」は analcolico。,,飲み物とデザート
L3-0478,3,lo spumante,スパークリングワイン|スプマンテ,noun,m,spumanti,食事・飲み物,Per il brindisi prendiamo uno spumante.,乾杯にはスプマンテを頼みましょう。,発泡ワインの総称で、イタリアでは主に国産のものを指す。s＋子音で始まるので冠詞は lo。フランスのシャンパンは champagne。,,飲み物とデザート
L3-0426,3,il liquore,リキュール|蒸留酒,noun,m,liquori,食事・飲み物,Dopo cena prendiamo un liquore alle erbe.,夕食のあとにハーブのリキュールを飲みましょう。,食後酒として出されることが多い。limoncello や amaro も liquore の一種。,,飲み物とデザート
L3-0197,3,il limoncello,リモンチェッロ|レモンリキュール,noun,m,limoncelli,食事・飲み物,Dopo cena beviamo un limoncello ghiacciato.,夕食のあとに、冷えたリモンチェッロを飲みます。,南イタリア発祥のレモンのリキュール。食後酒（digestivo）として、よく冷やして小さなグラスで出される。,,飲み物とデザート
L3-0419,3,il frullato,スムージー|ミキサーで作ったジュース|シェイク,noun,m,frullati,食事・飲み物,"Vorrei un frullato alla fragola, per favore.",イチゴのスムージーをお願いします。,果物などをミキサーにかけた飲み物。牛乳やヨーグルトを加えることも多い。frappè は牛乳とアイスで作るシェイクに近い飲み物を指すことが多い。,,飲み物とデザート
L3-0695,3,la camomilla,カモミールティー|カモミール,noun,f,camomille,食事・飲み物,Prendo una camomilla prima di dormire.,寝る前にカモミールティーを飲みます。,イタリアでは就寝前や食後に飲む定番のハーブティー。「飲み物」としては tisana alla camomilla とも言う。,,飲み物とデザート
L3-0185,3,la granita,グラニータ|シャーベット状の氷菓,noun,f,granite,食事・飲み物,"Vorrei una granita al limone, per favore.",レモンのグラニータをお願いします。,シチリア発祥。朝食にブリオッシュと一緒に食べる習慣がある。sorbetto より粒が粗く氷っぽい。,,飲み物とデザート
L3-0391,3,il budino,プリン|プディング,noun,m,budini,食事・飲み物,Per dolce prendo un budino al cioccolato.,デザートにチョコレートプリンをいただきます。,カラメルのプリンは crème caramel や budino al caramello と言うことが多い。,,飲み物とデザート
L3-0809,3,la crostata,タルト|クロスタータ,noun,f,crostate,食事・飲み物,Vorrei una fetta di crostata alla marmellata.,ジャムのクロスタータを1切れください。,ジャムなどを詰めて焼く伝統的な焼き菓子。フルーツをのせたタルトも crostata と呼ぶ。,,飲み物とデザート
L3-0545,3,il cioccolatino,チョコレート菓子|一口チョコ,noun,m,cioccolatini,食事・飲み物,Vorrei una scatola di cioccolatini per un regalo.,贈り物用にチョコレートの箱詰めをください。,cioccolato（チョコレート）の指小形で、ひと粒の菓子を指す。板チョコは tavoletta di cioccolato。,,飲み物とデザート
L3-0148,3,brindare,乾杯する,verb,,"brindo, brindi, brinda, brindiamo, brindate, brindano",食事・飲み物,Brindiamo al nostro viaggio!,私たちの旅行に乾杯しよう！,「〜に乾杯」は brindare a 〜。助動詞は avere（ho brindato）。名詞は il brindisi。乾杯の掛け声は Cin cin! や Salute!,,飲み物とデザート
L3-0461,3,la ricetta,レシピ|処方箋,noun,f,ricette,食事・飲み物,Mi dai la ricetta della pasta al pomodoro?,トマトパスタのレシピを教えてくれる？,料理のレシピにも薬の処方箋にも使う。薬局では ricetta medica（医師の処方箋）を求められる。,,料理をする
L3-0190,3,l'ingrediente,材料|食材|成分,noun,m,ingredienti,食事・飲み物,Quali sono gli ingredienti di questo piatto?,この料理の材料は何ですか？,料理の材料や食品の成分に使う。母音で始まるので単数の冠詞は l'、複数は gli。,,料理をする
L3-0123,3,cuocere,加熱調理する|焼く|煮る|ゆでる,verb,,"cuocio, cuoci, cuoce, cuociamo, cuocete, cuociono（過去分詞 cotto）",食事・飲み物,Quanto tempo bisogna cuocere la pasta?,パスタはどれくらいゆでる必要がありますか？,不規則動詞で過去分詞は cotto。ゆでる・焼く・煮るなど火を通す全般に使う。形容詞 cotto は「火が通った」。,,料理をする
L3-0049,3,bollire,沸騰する|ゆでる|沸かす,verb,,"bollo, bolli, bolle, bolliamo, bollite, bollono",食事・飲み物,Faccio bollire l'acqua per la pasta.,パスタのためにお湯を沸かします。,自動詞では「沸騰する」(L'acqua bolle)。fare bollire l'acqua で「お湯を沸かす」。他動詞としても使え、bollire le patate で「じゃがいもをゆでる」。,,料理をする
L3-0708,3,friggere,揚げる|炒める,verb,,"friggo, friggi, frigge, friggiamo, friggete, friggono（過去分詞 fritto）",食事・飲み物,Io friggo le patatine con olio d'oliva.,私はオリーブオイルでポテトを揚げます。,過去分詞は fritto で不規則。fritto misto は魚介や野菜の盛り合わせフライ。,,料理をする
L3-0071,3,fritto,揚げた|フライの,adj,,"fritta, fritti, fritte",食事・飲み物,Prendo il pesce fritto con le patate.,魚のフライとポテトをいただきます。,friggere の過去分詞でもある。fritto misto は魚介や野菜の盛り合わせフライ。,,料理をする
L3-0266,3,scaldare,温める|熱する,verb,,"scaldo, scaldi, scalda, scaldiamo, scaldate, scaldano",食事・飲み物,"Può scaldare il latte, per favore?",牛乳を温めていただけますか？,料理や飲み物を温めるときに使う。再帰形 scaldarsi は「温まる」。電子レンジで温めるなら scaldare al microonde。,riscaldare,料理をする
L3-0324,3,riscaldare,温める|暖房する,verb,,"riscaldo, riscaldi, riscalda, riscaldiamo, riscaldate, riscaldano",食事・飲み物,Posso riscaldare questo piatto nel microonde?,このお皿を電子レンジで温めてもいいですか？,料理を温め直す意味でも使う。再帰形 riscaldarsi は「温まる」。名詞は riscaldamento（暖房）。,,料理をする
L3-0404,3,congelare,冷凍する|凍らせる,verb,,"congelo, congeli, congela, congeliamo, congelate, congelano",食事・飲み物,Posso congelare questa carne?,この肉は冷凍してもいいですか？,規則動詞。近過去は他動詞なら avere（ho congelato）。「解凍する」は scongelare。,,料理をする
L3-0431,3,mescolare,混ぜる|かき混ぜる,verb,,"mescolo, mescoli, mescola, mescoliamo, mescolate, mescolano",食事・飲み物,Mescola bene la salsa prima di servire.,出す前にソースをよく混ぜてください。,料理でかき混ぜる時の定番。トランプを切る意味でも使う。再帰形 mescolarsi は「入り混じる」。,,料理をする

L3-0078,3,il gusto,味|好み|センス,noun,m,gusti,食事・飲み物,Che gusto di gelato preferisci?,どの味のジェラートが好き？,ジェラートの「フレーバー」も gusto。sapore は食べ物そのものの味。味覚や美的センスの意味もある。,,料理をする

L3-0666,3,tenero,柔らかい（肉など）|優しい,adj,,"tenera, teneri, tenere",食事・飲み物,La carne è molto tenera.,この肉はとても柔らかい。,肉・野菜・パンなどの柔らかさに使う。人柄が優しい、愛情深いの意味もある。固い肉は duro。,,料理をする

L3-0444,3,la padella,フライパン,noun,f,padelle,食事・飲み物,"Metti l'olio nella padella, per favore.",フライパンにオイルを入れてください。,取っ手付きの浅い鍋・フライパン。深い鍋は la pentola。cadere dalla padella nella brace は「一難去ってまた一難」。,,台所の道具
L3-0417,3,il forno,オーブン|パン屋|窯,noun,m,forni,食事・飲み物,"Il pane è ancora caldo, esce dal forno.",パンはまだ温かい。オーブンから出たばかりだ。,パン屋の意味では panetteria や panificio も使う。forno a microonde は電子レンジ。,,台所の道具
L3-0596,3,il fornello,コンロ|（コンロの）火口|バーナー,noun,m,fornelli,食事・飲み物,Ho dimenticato il fornello acceso in cucina.,台所のコンロをつけっぱなしにしてしまった。,コンロの火口一つや携帯用のコンロ（キャンプ用など）を指す。キッチンのコンロ全体は複数形 i fornelli で言うことが多い。オーブンは forno。,,台所の道具
L3-0307,3,il microonde,電子レンジ,noun,m,microonde（不変）,食事・飲み物,Puoi scaldare il piatto nel microonde?,料理を電子レンジで温めてもらえますか？,複数形も同形。forno a microonde の短縮形で、forno を省いて男性名詞として使う。,il forno a microonde,台所の道具

L3-0790,3,la brocca,水差し|ピッチャー,noun,f,brocche,食事・飲み物,"Una brocca d'acqua, per favore.",水差しに入れた水をください。,レストランでは una brocca d'acqua で水を水差しで頼める。複数形は c の音を保つため -che になる。,,台所の道具
L3-0575,3,la ciotola,ボウル|鉢,noun,f,ciotole,食事・飲み物,Metti la frutta nella ciotola.,果物をボウルに入れて。,取っ手のない深めの小さな器。ペットの餌入れにも使う（la ciotola del cane）。,,台所の道具
L3-0342,3,la tovaglia,テーブルクロス,noun,f,tovaglie,食事・飲み物,Mettiamo la tovaglia bianca sul tavolo.,白いテーブルクロスをテーブルにかけましょう。,tovagliolo は「ナプキン」で別の語。混同しやすいので注意。,,台所の道具
L3-0735,3,la posata,カトラリー|食器（ナイフ・フォーク類）,noun,f,posate,食事・飲み物,"Scusi, può portarmi le posate?",すみません、カトラリーを持ってきてもらえますか？,ナイフ・フォーク・スプーンを指し、複数形 le posate で使うのが普通。皿類は piatti、食器全般は stoviglie。,,台所の道具
L3-0580,3,il coperchio,ふた|蓋,noun,m,coperchi,食事・飲み物,"Metti il coperchio sulla pentola, per favore.",鍋にふたをしてください。,鍋・箱・容器などのふた。瓶やペットボトルのキャップは tappo。単数は -io で終わり複数は coperchi。,,台所の道具
L3-0758,3,il tappo,栓|キャップ|コルク栓,noun,m,tappi,食事・飲み物,Il tappo della bottiglia è rotto.,瓶の栓が壊れています。,瓶やバスタブなどの栓・蓋全般。ワインのコルクは tappo di sughero とも言う。,,台所の道具

L3-0236,3,il salotto,居間|応接間,noun,m,salotti,住まい・日用品,Il salotto è grande e molto luminoso.,居間は広くてとても明るい。,家の居間・リビング。soggiorno もほぼ同義で、現代の住宅ではよく使われる。,il soggiorno,家の中

L3-0663,3,lo studio,書斎|事務所|勉強,noun,m,studi,住まい・日用品,Mio padre lavora nello studio del dottore.,父は医者の診療所で働いています。,「勉強・研究」の意味もある。医師や弁護士の仕事場も studio と呼ぶ。s＋子音なので冠詞は lo。,,家の中
L3-0793,3,la cantina,地下室|ワインセラー|（ワインの）醸造所,noun,f,cantine,住まい・日用品,Il vino è in cantina.,ワインは地下室にあります。,ワインなどを貯蔵する地下室や、ワイナリー（cantina vinicola）も指す。集合住宅では地下の物置を指すこともある。,,家の中
