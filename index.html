L2-0129,2,la gente,人々|世間の人,noun,f,（通常は単数のみ）,家族・人,C'è molta gente in piazza.,広場にはたくさんの人がいます。,単数形で集合的に「人々」を表し、動詞は単数扱い（la gente dice…）。molta gente のように使う。複数形 genti は文語的で「諸民族」の意になることがあり、日常ではほぼ使わない。,,家族と人々
L2-0488,2,il gruppo,グループ|集団,noun,m,gruppi,家族・人,Siamo un gruppo di amici giapponesi.,私たちは日本人の友達のグループです。,複数形は -i（gruppi）。ツアーの団体は gruppo、少人数の仲間にも使える。,,家族と人々
L2-0429,2,qualcuno,誰か|何人か,pron,,,家族・人,C'è qualcuno qui?,ここに誰かいますか？,代名詞は単数扱いで男性形。女性を指すと明示するなら qualcuna。否定文では nessuno を使う。,,家族と人々
L2-0304,2,nessuno,誰も（〜ない）|誰一人,pron,,,家族・人,Non c'è nessuno qui.,ここには誰もいません。,動詞の後ろでは non と併用（Non vedo nessuno）。文頭では non 不要（Nessuno parla）。,,家族と人々
L2-0476,2,il/la collega,同僚,noun,mf,"i colleghi, le colleghe",家族・人,La mia collega parla molto bene l'inglese.,私の同僚(女性)は英語がとても上手です。,単数は -a で終わるが、男女同形(il collega / la collega)。複数は男性 colleghi、女性 colleghe。硬い g の音を保つため、複数では h が入る。,,家族と人々
L2-0280,2,il cognome,姓|名字,noun,m,cognomi,家族・人,Come si scrive il suo cognome?,あなたの姓はどう綴りますか？,名は il nome。書類では cognome が姓、nome が名の欄。,,家族と人々
L2-0402,2,l'età,年齢|時代,noun,f,età（不変）,家族・人,Che età hai?,何歳ですか？,-à で終わる名詞は複数形も同形。年齢を聞くときは Quanti anni hai? のほうが一般的。,,家族と人々
L2-0664,2,nascere,生まれる|誕生する,verb,,"nasco, nasci, nasce, nasciamo, nascete, nascono（過去分詞 nato）",家族・人,Sono nato a Roma.,私はローマで生まれました。,近過去は essere を助動詞にとる（sono nato/a）。過去分詞が不規則。「生まれた」は多くの場合近過去で言う。,,家族と人々
L2-0332,2,la vita,人生|生活|命,noun,f,vite,家族・人,La vita in Italia è bella.,イタリアでの生活は素晴らしい。,「人生」「命」「生活」と幅広く使う。La vita è bella は「人生は美しい」。体の「ウエスト（腰のくびれ）」の意味もある。,,家族と人々
L2-0418,2,morire,死ぬ|亡くなる,verb,,"muoio, muori, muore, moriamo, morite, muoiono（過去分詞 morto）",家族・人,"Ho molta sete, sto morendo!",すごくのどが渇いた、死にそう！,過去分詞が不規則で、近過去は essere を使う（è morto/a）。Muoio di fame などの誇張表現も頻出。,,家族と人々
L2-0699,2,la morte,死|死亡,noun,f,morti,家族・人,Ho paura della morte.,私は死が怖いです。,反対語は la vita（生）。形容詞・過去分詞は morto（死んだ）で、名詞 il morto は「死者」。,,家族と人々
L2-0550,2,biondo,金髪の|ブロンドの,adj,,"bionda, biondi, bionde",家族・人,Mia sorella ha i capelli biondi.,私の姉は金髪です。,"髪の色に使う。名詞で「金髪の人」も表せる（un biondo, una bionda）。ビールの biondo は「淡色の」の意味。",,家族と人々
L2-0011,2,il/la medico,医者|医師,noun,mf,medici,仕事・学校,Devo chiamare il medico.,医者を呼ばなければなりません。,女性の医師は la dottoressa、または la medica とも言う。呼びかけには dottore / dottoressa をよく使う。,il dottore,仕事をする人
L2-0123,2,il dottore,医者|博士,noun,m,dottori,仕事・学校,Il dottore arriva tra dieci minuti.,先生は10分後に到着します。,女性は la dottoressa。大学卒業者への敬称（学士号保持者）としても使い、呼びかけは Dottore。,il medico,仕事をする人
L2-0562,2,il/la dentista,歯科医|歯医者,noun,mf,"i dentisti, le dentiste",仕事・学校,Devo andare dal dentista domani.,明日歯医者に行かなければなりません。,語尾は -a だが男女同形。複数は男性 dentisti、女性 dentiste。「歯医者に行く」は andare dal dentista。,l'odontoiatra,仕事をする人
L2-0658,2,l'infermiera,看護師（女性）|看護婦,noun,f,複数 le infermiere（男性形 l'infermiere / gli infermieri）,仕事・学校,L'infermiera mi misura la febbre.,看護師が私の熱を測ります。,男性は l'infermiere（複数 gli infermieri）。複数形は女性 le infermiere。母音で始まるので冠詞は l'。,,仕事をする人
L2-0196,2,l'insegnante,先生|教師,noun,mf,"gli insegnanti, le insegnanti",仕事・学校,L'insegnante è molto gentile.,その先生はとても親切です。,語尾は -e で男女同形。複数は男性 insegnanti、女性 insegnanti（冠詞で区別）。,,仕事をする人
L2-0312,2,la professoressa,先生（女性）|女性教師|教授（女性）,noun,f,professoresse,仕事・学校,La professoressa parla molto piano.,先生はとてもゆっくり話します。,男性は il professore（複数 i professori）。呼びかけは Professoressa! と言い、冠詞は付けない。,l'insegnante,仕事をする人
L2-0555,2,il/la cantante,歌手,noun,mf,"i cantanti, le cantanti",仕事・学校,Questa cantante è molto famosa.,この歌手はとても有名です。,男女同形。複数も男女とも cantanti。性は冠詞や形容詞で示す。,,仕事をする人
L2-0680,2,l'attore,俳優|男優,noun,m,attori,仕事・学校,Mio padre è un attore famoso.,私の父は有名な俳優です。,女性形は l'attrice（複数 le attrici）。単数は母音で始まるので l'、複数は gli attori。,,仕事をする人
L2-0465,2,l'autista,運転手,noun,mf,"gli autisti, le autiste",仕事・学校,L'autista dell'autobus è molto gentile.,バスの運転手はとても親切です。,語尾は -a だが男性にも女性にも使う。単数は男女同形（l'autista）で、複数は男性 autisti、女性 autiste。母音で始まるので単数の冠詞は l'。,,仕事をする人
L2-0510,2,il poliziotto,警察官|警官,noun,m,poliziotti,仕事・学校,Il poliziotto è davanti alla stazione.,警察官は駅の前にいます。,女性は la poliziotta。「警察」は la polizia。,l'agente di polizia,仕事をする人
L2-0648,2,il/la carabiniere,カラビニエーリ（警察官）|警察官,noun,mf,i carabinieri（女性: la carabiniera / le carabiniere）,仕事・学校,"Chiamo i carabinieri, ho perso il passaporto.",カラビニエーリを呼びます。パスポートをなくしました。,イタリアの軍隊組織（Arma dei Carabinieri）に属し、警察業務も担う。国家警察（polizia di Stato）とは別組織。緊急時は統一緊急番号112で通報できる（113は国家警察の番号）。,,仕事をする人
L2-0162,2,il/la turista,観光客,noun,mf,"i turisti, le turiste",仕事・学校,Ci sono molti turisti in centro.,中心街には観光客がたくさんいます。,語尾は -a だが男女同形。複数は男性 turisti、女性 turiste。,,仕事をする人
L2-0346,2,il/la guida,ガイド|案内人|ガイドブック,noun,mf,le guide,仕事・学校,La guida parla inglese e giapponese.,ガイドは英語と日本語を話します。,人を指す場合、男性ガイドでも女性名詞 la guida を使うのが普通（il guida はまれ）。複数は le guide。「ガイドブック」も la guida で、複数形は le guide。,,仕事をする人
L2-0168,2,il/la cliente,客|顧客,noun,mf,"i clienti, le clienti",仕事・学校,Il cliente aspetta al bar.,お客さんはバーで待っています。,語尾は -e で男女同形。複数形は男女とも clienti で、冠詞（i clienti / le clienti）で性を区別する。店や会社の客に使う。,,仕事をする人
L2-0036,2,ci,私たちを・私たちに|そこに|それに・そのことに,pron,,,疑問詞・代名詞,Ci vediamo domani.,また明日会いましょう。,"代名詞（noi の目的語・再帰・相互）と場所の副詞的用法、「それに」（a ciò）の用法がある。c'è / ci sono や ci vuole など慣用表現に頻出。e・i の前では c' になる（c'è, c'era）。",,代名詞と「どの・同じ」
L2-0081,2,te,君（前置詞のあとで）|君を（強調）,pron,,,疑問詞・代名詞,Questo regalo è per te.,このプレゼントは君のためだよ。,"tu の強勢形。前置詞のあと（per te, con te, da te）や強調で使う。直接・間接目的語の弱形は ti。",,代名詞と「どの・同じ」
L2-0292,2,gli,彼に|彼らに,pron,,,疑問詞・代名詞,Gli telefono domani.,明日彼に電話します。,間接目的語の代名詞（男性単数）。話し言葉では「彼らに」にも使う（正式には loro）。女性単数は le。,,代名詞と「どの・同じ」
L2-0490,2,le,彼女に|あなたに（Lei への敬称）,pron,,,疑問詞・代名詞,Le telefono domani.,明日彼女に電話します。,間接目的語の代名詞（3人称単数女性）。敬称の Lei にも使う。複数の「彼らに」は gli。冠詞 le（女性複数）とは別。,,代名詞と「どの・同じ」
L2-0733,2,lo,彼を|それを,pron,,"la, li, le",疑問詞・代名詞,Lo conosci?,彼を知っていますか？,"直接目的語代名詞で活用した動詞の前に置く。母音の前では l' になる。女性は la、複数は li, le。",,代名詞と「どの・同じ」
L2-0676,2,vi,君たちを|君たちに|そこに,pron,,,疑問詞・代名詞,Vi chiamo domani.,明日君たちに電話します。,2人称複数の直接・間接目的語代名詞で、voi に対応する再帰代名詞（vi alzate など）としても使う。「そこに」の意味では ci の方が一般的で、vi はやや改まった表現。,,代名詞と「どの・同じ」
L2-0352,2,nostro,私たちのもの|私たちの,pron,,"nostra, nostri, nostre",疑問詞・代名詞,Questa camera è la nostra.,この部屋は私たちのものです。,"所有代名詞は定冠詞とともに用いるのが基本（il nostro, la nostra）。指すものの性数に一致し、所有者の性には左右されない。形容詞としても使う（la nostra casa）。",,代名詞と「どの・同じ」
L2-0070,2,quale,どの|どれ,pron,,quali,疑問詞・代名詞,"Quale preferisci, il rosso o il blu?",赤と青、どちらが好き？,複数形は quali。男女同形。essere の前では qual è...? と語尾が落ちるが、アポストロフィは付けない。,,代名詞と「どの・同じ」
L2-0148,2,qualche,いくつかの|何らかの,adj,,,疑問詞・代名詞,Ho qualche domanda.,いくつか質問があります。,後ろには必ず単数名詞が来る（qualche amico）。意味は複数だが、動詞も単数で受ける。不変。,,代名詞と「どの・同じ」
L2-0608,2,quello che,〜するもの|〜すること,pron,,,疑問詞・代名詞,Non capisco quello che dici.,あなたの言うことが分かりません。,関係代名詞的に使う。ciò che もほぼ同義でやや硬い。話し言葉では quello che が自然。,ciò che,代名詞と「どの・同じ」
L2-0452,2,altro,ほかのもの|ほかの人|別のもの,pron,,"altra, altri, altre",疑問詞・代名詞,"Questo non mi piace, ne voglio un altro.",これは好きじゃない。別のがほしい。,形容詞（別の、もう一つの）としても頻出。Altro? は「ほかには？」、Nient'altro は「ほかには何も（ない）」。,,代名詞と「どの・同じ」
L2-0531,2,stesso,同じ|自身|同一の,adj,,"stessa, stessi, stesse",疑問詞・代名詞,Io prendo la stessa cosa.,私も同じものをいただきます。,冠詞と名詞の間では「同じ」（la stessa cosa）、名詞・代名詞の後ろでは「～自身」（io stesso）。名詞の性数に一致する。代名詞としても使う（lo stesso＝同じこと）。,,代名詞と「どの・同じ」
L2-0329,2,uguale,同じ|等しい,adj,,uguali,疑問詞・代名詞,Questi due biglietti sono uguali.,この2枚の切符は同じです。,-e 形容詞なので男女同形。「Per me è uguale.」は「私はどちらでもいい」の意味でも使う。,,代名詞と「どの・同じ」
L2-0690,2,la differenza,違い|差,noun,f,differenze,疑問詞・代名詞,Qual è la differenza tra questi due treni?,この2本の電車の違いは何ですか？,「AとBの違い」は la differenza tra A e B。「違いはない」は non fa differenza（どちらでもいい）という言い方もある。,,代名詞と「どの・同じ」
L2-0477,2,come mai,どうして|なぜ,phrase,,,疑問詞・代名詞,Come mai sei in ritardo?,どうして遅れたの？,驚きや意外さを含む「なぜ」。perché より口語的で、直後は直説法。答えは perché で始める。,perché,代名詞と「どの・同じ」
L2-0516,2,proprio,まさに|本当に|ちょうど,adv,,,疑問詞・代名詞,È proprio buono!,これは本当においしい！,形容詞 proprio（自分の）は変化する。副詞は不変で、強調に使う。例: proprio qui（まさにここ）。,,代名詞と「どの・同じ」
L2-0059,2,molto,たくさん|多くのもの,pron,,"molta, molti, molte",副詞・接続詞・前置詞,Ho molto da fare oggi.,今日はやることがたくさんあります。,代名詞では molti は「多くの人」、molto は「多くのもの」。形容詞・副詞でも使い、副詞は不変。,,程度とつなぐことば
L2-0079,2,tanto,とても|そんなに,adv,,,副詞・接続詞・前置詞,Grazie tanto!,本当にありがとう！,副詞としては不変。形容詞・代名詞としては性数変化する（tanti turisti「たくさんの観光客」）。Grazie tanto! の形で頻出。,,程度とつなぐことば
L2-0322,2,tanto,たくさん|それほど|そんなに多く,pron,,"tanta, tanti, tante",副詞・接続詞・前置詞,"Hai molti libri? — Sì, ne ho tanti.",本をたくさん持っていますか？——はい、たくさん持っています。,代名詞・形容詞では性数変化する。「〜を（数量として）たくさん持つ」では ne と一緒に使い、ne ho tanti のように指すものの性数に一致させる。副詞の tanto は不変で「とても、そんなに」の意味。,,程度とつなぐことば
L2-0161,2,troppo,多すぎるもの|多すぎる人たち,pron,,"troppa, troppi, troppe",副詞・接続詞・前置詞,Siamo in troppi.,私たちは人数が多すぎます。,形容詞・副詞でも使う。形容詞では名詞に性数一致（troppa gente）、副詞は不変（troppo caro）。,,程度とつなぐことば
L2-0115,2,così,そのように|こんなに|とても,adv,,,副詞・接続詞・前置詞,"Non parlare così forte, per favore.",そんなに大きな声で話さないでください。,così ... come ... で「〜と同じくらい」。「così così」は「まあまあ」。così ... che ... で「とても〜なので…」。,,程度とつなぐことば
L2-0542,2,meglio,より良く|もっと良く,adv,,,副詞・接続詞・前置詞,Oggi mi sento meglio.,今日は前より気分がいいです。,bene の比較級で不変。形容詞 migliore と区別。È meglio che＋接続法「〜のほうがよい」の形でも頻出。,,程度とつなぐことば
L2-0605,2,probabilmente,たぶん|おそらく,adv,,,副詞・接続詞・前置詞,Domani probabilmente piove.,明日はたぶん雨が降ります。,確信度は高め。確信が低いときは forse（もしかすると）を使う。,,程度とつなぐことば
L2-0063,2,però,しかし|でも,conj,,,副詞・接続詞・前置詞,"Mi piace, però è troppo caro.",気に入ったけど、高すぎます。,ma よりやわらかい逆接で、文頭だけでなく文中・文末にも置ける。語末の o にアクセント記号がつく（però）。,,程度とつなぐことば
L2-0400,2,dunque,だから|では|それで,conj,,,副詞・接続詞・前置詞,"Dunque, che cosa facciamo oggi?",それで、今日は何をしましょうか？,話を進めたり結論を述べたりするときに使う。会話では「えーと」のように考えをまとめる間つなぎにも使う。,,程度とつなぐことば
L2-0609,2,quindi,だから|したがって,conj,,,副詞・接続詞・前置詞,"Piove, quindi prendo l'ombrello.",雨が降っているので、傘を持っていきます。,前の内容を受けて結論を導く。話し言葉では「それで」「で」の意味でも使う。,perciò|dunque,程度とつなぐことば
L2-0493,2,mentre,〜している間に|〜の間|一方で,conj,,,副詞・接続詞・前置詞,"Mentre aspetto il treno, leggo un libro.",電車を待つ間、本を読みます。,同時に進行する2つの動作をつなぐ。直説法の現在や半過去と一緒に使うことが多い。対比（一方で）の意味にもなる。,,程度とつなぐことば
L2-0450,2,verso,〜の方へ|〜頃（時刻）,prep,,,副詞・接続詞・前置詞,Vado verso la stazione.,駅の方へ向かっています。,方向のほか、verso le otto（8時頃）のように時刻のおおよそも表す。目的地まで行く意味の a とは区別する。,,程度とつなぐことば
L2-0190,2,fino a,〜まで,phrase,,,副詞・接続詞・前置詞,Il museo è aperto fino alle sei.,美術館は6時まで開いています。,"時刻は fino alle sei、場所・日付は fino a Roma, fino a lunedì。定冠詞と結合して fino al, fino alla などになる。",,程度とつなぐことば
L2-0684,2,contro,〜に対して|〜に反対して|〜にぶつかって,prep,,,副詞・接続詞・前置詞,Sono contro questa idea.,私はこの考えに反対です。,「〜に反対」「〜に対抗して」が基本。「〜に向かって」は verso や a を使う。代名詞では contro di me のように di が入る。,,程度とつなぐことば
L2-0575,2,grazie a,〜のおかげで,prep,,,副詞・接続詞・前置詞,"Grazie a te, ho trovato l'hotel.",あなたのおかげで、ホテルが見つかりました。,"後ろに名詞や人称代名詞（te, lui など）を置く。悪い結果の原因には使わず、その場合は a causa di を使う。",,程度とつなぐことば
L2-0006,2,davanti a,〜の前に|〜の前で,prep,,,方向・場所,Ci vediamo davanti alla stazione.,駅の前で会いましょう。,代名詞が続くときは davanti a me のように a が必要。反対は dietro (a)。,di fronte a,位置のことば

L2-0071,2,il riso,米|ご飯,noun,m,risi（「米」の種類を言うときなど稀）／「笑い」の意味では le risa,食事・飲み物,"Per me un risotto, per lei del riso in bianco.",私はリゾットを、彼女にはシンプルに茹でただけのお米をお願いします。,il riso には「笑い」の意味もあり同形。「笑い」の意味では複数が不規則な le risa（女性複数）になる。「米」の意味では通常複数形はほとんど使わない。料理の米は riso、米料理のリゾットは risotto。riso in bianco はバターやオイルだけで味付けした茹で米。,,イタリアの料理
L2-0072,2,il risotto,リゾット,noun,m,risotti,食事・飲み物,Per primo prendo il risotto ai funghi.,最初の一皿はきのこのリゾットにします。,米を出汁で煮込む北イタリアの代表的な料理。primo piatto（第一の皿）として頼むのが一般的。,,イタリアの料理
L2-0275,2,la carbonara,カルボナーラ,noun,f,carbonare,食事・飲み物,"Per me una carbonara, per favore.",私はカルボナーラをお願いします。,卵・ペコリーノ・ロマーノ（パルミジャーノを加えることもある）・グアンチャーレ・黒胡椒で作るローマのパスタ。本場では生クリームを使わない。pasta alla carbonara の略。,,イタリアの料理
L2-0025,2,la bistecca,ステーキ|ビフテキ,noun,f,bistecche,食事・飲み物,"Vorrei una bistecca al sangue, per favore.",レアのステーキをお願いします。,焼き加減は al sangue（レア）、media（ミディアム）、ben cotta（ウェルダン）。有名な bistecca alla fiorentina はフィレンツェ名物。,,イタリアの料理
L2-0392,2,la bruschetta,ブルスケッタ,noun,f,bruschette,食事・飲み物,Per antipasto prendo una bruschetta al pomodoro.,前菜にトマトのブルスケッタをいただきます。,焼いたパンにニンニクとオイルを塗った前菜。sch は「スク」と発音し、bruschetta は「ブルスケッタ」。,,イタリアの料理
L2-0369,2,la focaccia,フォカッチャ,noun,f,focacce,食事・飲み物,"Vorrei una fetta di focaccia, per favore.",フォカッチャを1切れください。,複数形は -ce で、c の音を保つため h は入らない（focacce）。リグーリア地方のものが有名。,,イタリアの料理
L2-0657,2,il grissino,グリッシーニ|細長いスティックパン,noun,m,grissini,食事・飲み物,"Ci porta dei grissini, per favore?",グリッシーニを持ってきていただけますか？,トリノ発祥の細長い乾パン。レストランでパンと一緒に出ることが多い。通常は複数形で使う。,,イタリアの料理
L2-0601,2,il pesto,ペスト（バジルソース）|ジェノヴァ風ソース,noun,m,pesti,食事・飲み物,"Vorrei le trofie al pesto, per favore.",トロフィエのペストソースをお願いします。,リグーリア地方の名物。バジル、松の実、チーズ、ニンニク、オリーブオイルで作る。pesto alla genovese とも言う。,,イタリアの料理
L2-0621,2,il sugo,ソース|パスタソース,noun,m,sughi,食事・飲み物,Il sugo di pomodoro è buonissimo.,トマトソースはとてもおいしい。,パスタにかける煮込み系のソース。ragù は肉入りの煮込みソース。,,イタリアの料理
L2-0358,2,la salsa,ソース|たれ,noun,f,salse,食事・飲み物,"Vorrei la salsa di pomodoro, per favore.",トマトソースをお願いします。,パスタのソースは salsa か sugo。sugo は汁気のある煮込み系ソースによく使う。,,イタリアの料理
L2-0451,2,la zuppa,スープ,noun,f,zuppe,食事・飲み物,Per primo prendo la zuppa di verdure.,プリモには野菜スープをいただきます。,具だくさんで濃いスープを指すことが多い。zuppa di pesce は魚介のスープ。minestra は野菜やパスタ・米入りのスープ、brodo は出汁・ブイヨン。,la minestra,イタリアの料理
L2-0436,2,il salame,サラミ,noun,m,salami,食事・飲み物,Vorrei un panino con il salame.,サラミのパニーノをください。,複数形は salami。単数は salame で、-e で終わる男性名詞。,,イタリアの料理
L2-0639,2,la pancetta,パンチェッタ|豚バラ肉の塩漬け,noun,f,pancette,食事・飲み物,La carbonara si fa con la pancetta.,カルボナーラはパンチェッタで作ります。,豚バラの塩漬け。カルボナーラは本来 guanciale（豚ほほ肉）を使うが、pancetta も広く使われる。,,イタリアの料理
L2-0640,2,il parmigiano,パルミジャーノ|パルメザンチーズ,noun,m,parmigiani,食事・飲み物,Vorrei del parmigiano sulla pasta.,パスタにパルミジャーノをかけてください。,正式名は Parmigiano Reggiano。粉にして料理にかけることが多い。grana も似たチーズ。,il parmigiano reggiano,イタリアの料理
L2-0083,2,la torta,ケーキ|タルト,noun,f,torte,食事・飲み物,"Vorrei una fetta di torta, per favore.",ケーキを1切れください。,torta は大きな丸いケーキやパイ全般。小さなケーキやペストリーは pasticcino、ケーキ類の総称的な菓子は dolce。,,イタリアの料理
L2-0687,2,la crema,クリーム|カスタードクリーム,noun,f,creme,食事・飲み物,Vorrei un cornetto con la crema.,クリーム入りのコルネット（クロワッサン）をください。,食べ物ではカスタード（crema pasticcera）を指すことが多い。日焼け止めなど化粧品のクリームも crema。,,イタリアの料理
L2-0556,2,la caramella,飴|キャンディー,noun,f,caramelle,食事・飲み物,I bambini vogliono una caramella.,子どもたちは飴を欲しがっています。,caramella は飴やキャンディー全般。複数形は caramelle。,,イタリアの料理
L2-0492,2,la marmellata,ジャム,noun,f,marmellate,食事・飲み物,Vorrei pane e marmellata per colazione.,朝食にパンとジャムをお願いしたいです。,日常会話では果物のジャム全般を marmellata と言う。EU の規格上は柑橘類のジャム（マーマレード）が marmellata、それ以外の果物のジャムは confettura。,,イタリアの料理
L2-0496,2,il miele,はちみつ,noun,m,mieli,食事・飲み物,"Vorrei del miele nel tè, per favore.",紅茶にはちみつを入れたいのですが。,複数形 mieli は種類の違うはちみつを指すときに使う。普段は不可算的に使い、部分冠詞 del miele とも言う。,,イタリアの料理
L2-0085,2,la verdura,野菜,noun,f,verdure,食事・飲み物,Mangio molta verdura ogni giorno.,私は毎日たくさん野菜を食べます。,料理では単数 la verdura が総称的に使われることが多い。個々の野菜は un ortaggio とも言う。,,野菜・果物・肉と魚
L2-0062,2,la patata,じゃがいも,noun,f,patate,食事・飲み物,Vorrei un piatto di patate fritte.,フライドポテトを1皿ください。,patate fritte はフライドポテト。patatine も同じ意味で使うが、袋入りのポテトチップスも指す。,,野菜・果物・肉と魚
L2-0184,2,la cipolla,玉ねぎ,noun,f,cipolle,食事・飲み物,Non mangio la cipolla cruda.,私は生の玉ねぎは食べません。,発音は「チポッラ」で、ll は二重子音。ピザやパスタの具材名にもよく出てくる。,,野菜・果物・肉と魚
L2-0276,2,la carota,にんじん,noun,f,carote,食事・飲み物,"Vorrei un chilo di carote, per favore.",にんじんを1キロください。,料理では複数形で使うことが多い（carote grattugiate＝すりおろしたにんじん）。,,野菜・果物・肉と魚
L2-0379,2,l'aglio,ニンニク,noun,m,agli,食事・飲み物,Mi piace la pasta con aglio e olio.,ニンニクとオイルのパスタが好きです。,複数形は agli だが、料理では単数で使うことが多い。「1片」は uno spicchio d'aglio。,,野菜・果物・肉と魚
L2-0388,2,il basilico,バジル|バジリコ,noun,m,basilici,食事・飲み物,Mi piace la pizza con il basilico fresco.,私は新鮮なバジルをのせたピザが好きです。,トマトやモッツァレラと合わせる定番のハーブ。バジルを使ったジェノヴァのソースは pesto (alla genovese)。複数形はほとんど使わない。,,野菜・果物・肉と魚
L2-0521,2,la rucola,ルッコラ,noun,f,rucole,食事・飲み物,Vorrei una pizza con la rucola.,ルッコラのピザをお願いしたいのですが。,生で食べる葉野菜。生ハムやパルメザンと合わせた pizza や insalata によく使う。別名 rughetta。,la rughetta,野菜・果物・肉と魚
L2-0707,2,il peperoncino,唐辛子|チリペッパー,noun,m,peperoncini,食事・飲み物,Vorrei un po' di peperoncino sulla pizza.,ピザに唐辛子を少しかけたいです。,南イタリア料理でよく使う。オイルに漬けた olio piccante や、パスタ all'arrabbiata の辛味にも使われる。,,野菜・果物・肉と魚
L2-0636,2,il frutto,果実|果物|成果,noun,m,frutti,食事・飲み物,Questo frutto è molto dolce.,この果物はとても甘いです。,複数形は i frutti だが、集合的な「果物」は la frutta（単数）。le frutta とは言わない。frutti di mare は「海の幸」。,,野菜・果物・肉と魚
L2-0135,2,il limone,レモン,noun,m,limoni,食事・飲み物,"Vorrei un tè con limone, per favore.",レモン入りの紅茶をお願いします。,イタリアでは limoncello（レモンのリキュール）が名物。色の「黄色」は giallo で、limone は果物名。,,野菜・果物・肉と魚
L2-0199,2,il melone,メロン,noun,m,meloni,食事・飲み物,Prendo il prosciutto con il melone.,メロン添え生ハムをいただきます。,前菜の prosciutto e melone（生ハムメロン）が定番。,,野菜・果物・肉と魚
L2-0218,2,l'uva,ぶどう,noun,f,uve,食事・飲み物,"Vorrei un chilo di uva, per favore.",ぶどうを1キロください。,集合的に単数で使うのが普通（l'uva）。一粒は un acino d'uva。ワインは vino で別語。,,野菜・果物・肉と魚
L2-0405,2,la fragola,いちご,noun,f,fragole,食事・飲み物,Vorrei un gelato alla fragola.,いちごのジェラートをください。,ジェラートの味は gusto。alla fragola（いちご味の）の形でよく使う。,,野菜・果物・肉と魚
L2-0598,2,la pera,洋梨|梨,noun,f,pere,食事・飲み物,"Mi può dare due pere, per favore?",洋梨を2個いただけますか？,果物の木は男性名詞になることが多い（la pera「洋梨」— il pero「洋梨の木」、la mela — il melo）。,,野菜・果物・肉と魚
L2-0600,2,la pesca,桃|釣り,noun,f,pesche,食事・飲み物,"Vorrei una pesca, per favore.",桃を1個ください。,複数形は pesche（hが入り発音は「ケ」）。同形で「釣り」の意味もあるが、そちらはふつう複数形では使わない。木は il pesco。,,野菜・果物・肉と魚
L2-0447,2,il tonno,マグロ|ツナ,noun,m,tonni,食事・飲み物,"Vorrei una pizza al tonno, per favore.",ツナのピザをお願いします。,缶詰のツナも生のマグロも tonno。ピザやパスタの具材として頻出。,,野菜・果物・肉と魚
L2-0523,2,il salmone,サーモン|鮭,noun,m,salmoni,食事・飲み物,"Per me il salmone alla griglia, grazie.",私はサーモンのグリルをお願いします。,魚としても料理名としても使う。燻製は salmone affumicato で、前菜でよく出る。,,野菜・果物・肉と魚
L2-0486,2,il gambero,エビ,noun,m,gamberi,食事・飲み物,Vorrei gli spaghetti con i gamberi.,エビのスパゲッティをお願いします。,gambero はエビ一般を指す。小さめのエビは gamberetto、大きめのエビは gamberone。伊勢エビ類は aragosta。,,野菜・果物・肉と魚
L2-0415,2,il maiale,豚|豚肉,noun,m,maiali,食事・飲み物,Non mangio carne di maiale.,私は豚肉を食べません。,動物も肉も指す。肉は carne di maiale とも言う。宗教上の食事制限を伝える際にも使える。,,野菜・果物・肉と魚
L2-0061,2,l'olio,油|オリーブオイル,noun,m,oli,食事・飲み物,"Vorrei un po' d'olio e aceto, per favore.",オイルとお酢を少しください。,単に olio と言うと通常はオリーブオイル。olio d'oliva と言うこともある。複数形 oli は種類の違う油を指す。,,台所と味
L2-0028,2,il burro,バター,noun,m,burri,食事・飲み物,Vorrei del pane con il burro.,バター付きのパンをいただきたいのですが。,複数形はほとんど使わない。料理では al burro（バターで作った）の形もよく出る。,,台所と味
L2-0692,2,la farina,小麦粉|粉,noun,f,farine,食事・飲み物,Per la pasta servono farina e uova.,パスタには小麦粉と卵が必要です。,普通は farina di grano tenero（軟質小麦の粉）を指し、00・0 などの等級で区別される。複数形 farine は種類の違う粉を言うときに使う。,,台所と味
L2-0507,2,il pepe,こしょう,noun,m,複数形は通常使わない（不可算）,食事・飲み物,Può passarmi il sale e il pepe?,塩とこしょうを取っていただけますか？,普通は単数で使う。peperone（ピーマン、パプリカ）とは別の語で、その複数形 peperoni と混同しない。,,台所と味
L2-0697,2,la maionese,マヨネーズ,noun,f,maionesi,食事・飲み物,Vorrei le patatine con la maionese.,マヨネーズ付きのフライドポテトをください。,フランス語 mayonnaise 由来だが、つづりは maionese。ふつう単数で使う。,,台所と味
L2-0706,2,la pentola,鍋|両手鍋,noun,f,pentole,食事・飲み物,Metti l'acqua nella pentola.,鍋に水を入れてください。,深めの調理鍋全般を指す。小さな片手鍋は pentolino、フライパンは padella。,,台所と味
L2-0344,2,il frigorifero,冷蔵庫,noun,m,frigoriferi,食事・飲み物,Il latte è nel frigorifero.,牛乳は冷蔵庫の中にあります。,口語では短縮形の frigo もよく使う。,il frigo,台所と味
L2-0067,2,preparare,準備する|用意する|作る（料理を）,verb,,"preparo, prepari, prepara, prepariamo, preparate, preparano",食事・飲み物,Stasera preparo la cena per tutti.,今夜はみんなの夕食を作ります。,料理を作る意味でも使う。再帰形 prepararsi は「身支度する、心の準備をする」。,,台所と味
L2-0078,2,tagliare,切る|カットする,verb,,"taglio, tagli, taglia, tagliamo, tagliate, tagliano",食事・飲み物,"Può tagliare il pane, per favore?",パンを切っていただけますか？,規則動詞。髪を切るときは tagliarsi i capelli（再帰）、美容院では un taglio も頻出。,,台所と味
L2-0378,2,aggiungere,加える|付け加える,verb,,"aggiungo, aggiungi, aggiunge, aggiungiamo, aggiungete, aggiungono（過去分詞 aggiunto）",食事・飲み物,Posso aggiungere un po' di sale?,塩を少し加えてもいいですか？,過去分詞が不規則。料理で「加える」、会話で「付け加える」の両方に使う。,,台所と味
L2-0383,2,assaggiare,味見する|試食する|試飲する,verb,,"assaggio, assaggi, assaggia, assaggiamo, assaggiate, assaggiano",食事・飲み物,Vuoi assaggiare il mio dolce?,私のデザートを味見してみる？,"料理にもワインにも使う。-ggiare 動詞は tu・noi の語尾で i が重ならない（assaggi, assaggiamo）。",provare,台所と味
L2-0286,2,dividere,分ける|割る|分かち合う,verb,,"divido, dividi, divide, dividiamo, dividete, dividono（過去分詞 diviso）",食事・飲み物,Dividiamo il conto?,割り勘にしましょうか？,過去分詞が不規則（diviso）。「割り勘にする」は dividere il conto または fare alla romana。,,台所と味
L2-0725,2,cotto,火を通した|加熱した|茹でた,adj,,"cotta, cotti, cotte",食事・飲み物,Preferisco la carne ben cotta.,私は肉はよく焼いたのが好きです。,cuocere の過去分詞が形容詞化。prosciutto cotto は「ハム」、crudo（生）の反意語。,,台所と味
L2-0651,2,crudo,生の|火を通していない,adj,,"cruda, crudi, crude",食事・飲み物,Mi piace il prosciutto crudo.,私は生ハムが好きです。,prosciutto crudo は生ハム。反対は cotto（加熱した）。名詞では「生ハム」の意味でも使う。,,台所と味
L2-0370,2,fresco,新鮮な|涼しい|冷たい,adj,,"fresca, freschi, fresche",食事・飲み物,Il pesce è molto fresco oggi.,今日は魚がとても新鮮です。,天気は fare fresco（涼しい）。飲み物の冷たさは freddo が基本で、fresco は「ひんやり心地よい」感じ。,,台所と味
L2-0522,2,salato,塩辛い|しょっぱい|塩味の,adj,,"salata, salati, salate",食事・飲み物,La zuppa è troppo salata.,このスープは塩辛すぎます。,反対は dolce（甘い）。「値段が高い」の意味で il conto è salato とも言う。,,台所と味
L2-0602,2,piccante,辛い|ピリ辛の,adj,,piccanti,食事・飲み物,Questa salsa è troppo piccante per me.,このソースは私には辛すぎます。,-e 形容詞で男女同形。唐辛子の辛さに使う。わさびや胡椒の刺激には forte も使う。,,台所と味
L2-0246,2,delizioso,とてもおいしい|美味な,adj,,"deliziosa, deliziosi, deliziose",食事・飲み物,Questa pasta è deliziosa!,このパスタはとてもおいしい！,buono より強い褒め言葉。料理だけでなくケーキや香りにも使う。,,台所と味
L2-0180,2,buonissimo,とても美味しい|最高に良い,adj,,"buonissima, buonissimi, buonissime",食事・飲み物,Questa pizza è buonissima!,このピザはとても美味しい！,buono の絶対最上級。「とても良い」の意味で、料理を褒めるときの定番。名詞に性数一致する。,,台所と味
L2-0202,2,ottimo,非常に良い|最高の,adj,,"ottima, ottimi, ottime",食事・飲み物,Questo ristorante è ottimo.,このレストランは最高です。,buono の絶対最上級にあたる語で、molto ottimo とは言わない。食事や評価を褒めるときに便利。,,台所と味
L2-0377,2,affamato,空腹な|おなかがすいた,adj,,"affamata, affamati, affamate",食事・飲み物,"Sono molto affamato, andiamo a mangiare.",とてもおなかがすいた、食べに行こう。,日常では Ho fame（おなかがすいた）の方がよく使われる。affamato は「飢えた」というやや強い響きもある。,,台所と味
L2-0384,2,assetato,のどが渇いた,adj,,"assetata, assetati, assetate",食事・飲み物,Dopo la passeggiata sono molto assetato.,散歩のあと、とてものどが渇いています。,「のどが渇いた」は avere sete とも言う。assetato は形容詞なので性数一致する。,,台所と味

L2-0213,2,spendere,（お金を）使う|費やす,verb,,"spendo, spendi, spende, spendiamo, spendete, spendono（過去分詞 speso）",店・買い物,Non voglio spendere troppo.,あまりお金を使いたくありません。,過去分詞が不規則（speso）。「支払う」は pagare で、spendere は金額や時間を費やす意味。,,値段と支払い

L2-0044,2,dritto,まっすぐ,adv,,,方向・場所,Vada sempre dritto fino al semaforo.,信号までずっとまっすぐ行ってください。,道案内の定番。sempre dritto で「ずっとまっすぐ」。diritto とも綴り、形容詞「まっすぐな」としても使う。direttamente は「直接に」で別の語。,diritto,道をたずねる
L2-0227,2,dritto,まっすぐな|直進の,adj,,"dritta, dritti, dritte",方向・場所,La strada è dritta fino alla piazza.,道は広場までまっすぐです。,道案内では副詞で sempre dritto（まっすぐ行く）とよく使う。副詞の場合は変化しない。,diritto,道をたずねる
L2-0409,2,girare,曲がる|回る|回す,verb,,"giro, giri, gira, giriamo, girate, girano",方向・場所,Gira a destra al semaforo.,信号を右に曲がってください。,道案内では girare a destra/sinistra（右/左に曲がる）。近過去の助動詞は、自動詞なら essere、他動詞なら avere。,,道をたずねる
L2-0645,2,svoltare,曲がる|方向転換する,verb,,"svolto, svolti, svolta, svoltiamo, svoltate, svoltano",方向・場所,Svolti a destra al semaforo.,信号を右に曲がってください。,道案内で頻出。右折は svoltare a destra、左折は a sinistra。近過去は avere を助動詞にとる（ho svoltato）。,girare,道をたずねる
L2-0718,2,attraversare,横切る|渡る,verb,,"attraverso, attraversi, attraversa, attraversiamo, attraversate, attraversano",方向・場所,"Attraversi la strada qui, per favore.",ここで道を渡ってください。,他動詞なので前置詞は不要（attraversare la strada）。近過去は avere を使う。,,道をたずねる
L2-0455,2,la direzione,方向|方面・行き先|経営陣・管理部門,noun,f,direzioni,方向・場所,"Scusi, in che direzione è la stazione?",すみません、駅はどちらの方向ですか？,道案内では「方向」、会社では「経営陣・管理部門」の意味もある。-zione の名詞は女性名詞。,,道をたずねる
L2-0256,2,la mappa,地図,noun,f,mappe,方向・場所,Hai una mappa della città?,街の地図を持っていますか？,観光用の街の地図は pianta、道路地図は carta stradale とも言う。mappa は一般的な地図。,la cartina,道をたずねる
L2-0277,2,la cartina,地図|略地図,noun,f,cartine,方向・場所,Posso avere una cartina della città?,この街の地図をもらえますか？,観光用の小さな地図。本や壁の大きな地図は carta geografica、地図帳は atlante。,la mappa,道をたずねる
L2-0013,2,il nord,北,noun,m,単数のみ（複数形はほとんど使わない）,方向・場所,Milano è nel nord dell'Italia.,ミラノはイタリアの北部にあります。,「北へ」は verso nord、「北部」も il nord で表す。,il settentrione,道をたずねる
L2-0288,2,l'est,東,noun,m,est（不変）,方向・場所,Il sole sorge a est.,太陽は東から昇ります。,方角は小文字で使う。「東の」は形容詞 orientale、「〜の東に」は a est di ... で表す。反対は l'ovest（西）。複数形はほぼ使わない。,l'oriente,道をたずねる
L2-0638,2,l'ovest,西,noun,m,ovest（不変）,方向・場所,Il mare è a ovest della città.,海は街の西にあります。,"方角は nord, sud, est, ovest。「西の」は occidentale。ovest は通常複数形にしない。",l'occidente,道をたずねる
L2-0058,2,mi sono perso,道に迷いました|迷子になりました,phrase,,mi sono perso/a（女性は persa）,方向・場所,"Mi sono perso, può aiutarmi?",道に迷いました、助けてもらえますか？,女性が言うときは mi sono persa。複数は ci siamo persi（男性・混合）/ ci siamo perse（女性のみ）。,,道をたずねる
L2-0599,2,perdersi,道に迷う|迷子になる,verb,,"mi perdo, ti perdi, si perde, ci perdiamo, vi perdete, si perdono（過去分詞 perso）",方向・場所,"Scusi, mi sono perso. Dov'è la stazione?",すみません、道に迷いました。駅はどこですか？,再帰動詞で、近過去は essere を使う（mi sono perso/a）。perdere は「失う、逃す」。過去分詞は perso か perduto。,smarrirsi,道をたずねる
L2-0045,2,l'entrata,入口|入場,noun,f,entrate,方向・場所,Dov'è l'entrata della stazione?,駅の入口はどこですか？,反対語は l'uscita（出口）。複数形 entrate は「収入」の意味でも使う。入口は l'ingresso とも言う。,l'ingresso,道をたずねる
L2-0251,2,l'ingresso,入口|入場,noun,m,ingressi,方向・場所,Dov'è l'ingresso del museo?,美術館の入口はどこですか？,入口の掲示は INGRESSO。「入場（料）」の意味もある。反対は l'uscita（出口）。,l'entrata,道をたずねる
L2-0002,2,l'uscita,出口|出ること,noun,f,uscite,方向・場所,"Scusi, dov'è l'uscita?",すみません、出口はどこですか？,駅・空港・店などの出口。反対は l'entrata / l'ingresso。uscita di sicurezza は非常口。,,道をたずねる
L2-0570,2,la fila,列|行列,noun,f,file,方向・場所,C'è una lunga fila alla cassa.,レジに長い行列ができています。,「列に並ぶ」は fare la fila。「列の先頭・最後尾」などにも使う。,la coda,道をたずねる
L2-0157,2,la stazione,駅,noun,f,stazioni,交通・移動,Dov'è la stazione dei treni?,電車の駅はどこですか？,stazione degli autobus（バスターミナル）、stazione centrale（中央駅）なども頻出。-zione で終わる名詞は女性名詞。,,駅と電車
L2-0160,2,il treno,列車|電車,noun,m,treni,交通・移動,A che ora parte il treno per Roma?,ローマ行きの列車は何時に出発しますか？,乗車前に切符の刻印が必要な路線がある。「電車で」は in treno と in を使う。,,駅と電車
L2-0200,2,la metropolitana,地下鉄,noun,f,metropolitane,交通・移動,Dov'è la fermata della metropolitana?,地下鉄の駅はどこですか？,略して metro とも言う。「地下鉄の駅」は fermata della metro、乗る場合は prendere la metro。,la metro,駅と電車
L2-0216,2,il tram,路面電車|トラム,noun,m,tram（不変）,交通・移動,Prendo il tram per andare in centro.,市の中心部へ行くのに路面電車に乗ります。,外来語由来の語で複数形も同形（i tram）。乗るときは prendere il tram。,,駅と電車
L2-0248,2,la fermata,停留所|（地下鉄などの）駅,noun,f,fermate,交通・移動,Dov'è la fermata dell'autobus?,バス停はどこですか？,バスやトラムの停留所。鉄道の駅は stazione、地下鉄の駅は fermata または stazione。,,駅と電車
L2-0681,2,il binario,番線|線路|ホーム（番号）,noun,m,binari,交通・移動,Da quale binario parte il treno per Roma?,ローマ行きの列車は何番線から出ますか？,駅では「◯番線」の意味で使う。「ホーム」そのものは banchina。Binario 3 のように番号を添える。,,駅と電車
L2-0298,2,la linea,路線|線,noun,f,linee,交通・移動,Quale linea va al centro?,どの路線が中心街に行きますか？,地下鉄やバスの「系統」も linea。電話の回線や体型（mantenere la linea「体型を保つ」）の意味でも使う。,,駅と電車
L2-0538,2,la biglietteria,切符売り場|窓口,noun,f,biglietterie,交通・移動,"Dov'è la biglietteria, per favore?",すみません、切符売り場はどこですか？,駅・劇場・美術館などのチケット売り場。自動券売機は biglietteria automatica。,,駅と電車
L2-0316,2,salire,乗る|登る|上がる,verb,,"salgo, sali, sale, saliamo, salite, salgono",交通・移動,Saliamo sul treno delle nove.,9時の電車に乗りましょう。,近過去は essere を使う（sono salito/a）。乗り物には salire su または a。反対は scendere。,,駅と電車
L2-0155,2,scendere,降りる|下りる,verb,,"scendo, scendi, scende, scendiamo, scendete, scendono（過去分詞 sceso）",交通・移動,Scendo alla prossima fermata.,次の停留所で降ります。,近過去は自動詞では essere を助動詞にとる（sono sceso/a）が、「階段を降りる」など他動詞では avere（ho sceso le scale）。バスや電車から降りるときは scendere da を使う。,,駅と電車
L2-0563,2,diretto,直行の|直通の|直接の,adj,,"diretta, diretti, dirette",交通・移動,C'è un treno diretto per Firenze?,フィレンツェ行きの直通列車はありますか？,un treno diretto は乗り換えなしで目的地まで行ける直通列車。diretto a / per + 地名で「〜行きの」。,,駅と電車
L2-0354,2,la partenza,出発|発車,noun,f,partenze,交通・移動,La partenza del treno è alle otto.,列車の出発は8時です。,反対語は l'arrivo。空港の出発ロビーや掲示の PARTENZE（出発便）でよく見る。,,駅と電車
L2-0022,2,l'arrivo,到着|着くこと,noun,m,arrivi,交通・移動,L'arrivo del treno è alle otto.,列車の到着は8時です。,反対語は la partenza（出発）。空港の掲示では Arrivi（到着）と Partenze（出発）が並ぶ。,,駅と電車
L2-0315,2,il ritorno,帰り|帰路|復路|戻ること|帰還,noun,m,ritorni,交通・移動,Il biglietto di ritorno è per domenica.,帰りの切符は日曜日です。,andata e ritorno は「往復」。対義語は l'andata（行き）。「戻ること」の意味でも使う。,,駅と電車
L2-0240,2,il volo,フライト|（飛行機の）便|飛行,noun,m,voli,交通・移動,Il volo per Roma parte alle dieci.,ローマ行きの便は10時に出ます。,航空便は volo、飛行機そのものは aereo。「便が遅れている」は il volo è in ritardo。,,空港と船
L2-0269,2,volare,飛ぶ|飛行機で行く,verb,,"volo, voli, vola, voliamo, volate, volano",交通・移動,Domani voliamo a Roma.,明日、私たちは飛行機でローマへ行きます。,規則動詞。近過去の助動詞は essere も avere も使われる（è volato / ha volato）。,,空港と船
L2-0244,2,la carta d'imbarco,搭乗券,noun,f,carte d'imbarco,交通・移動,Posso vedere la sua carta d'imbarco?,搭乗券を拝見できますか？,空港で必須の語。carta は複数形で carte になる。口語では il boarding pass も通じる。,il biglietto d'imbarco,空港と船
L2-0635,2,la dogana,税関,noun,f,dogane,交通・移動,Dov'è la dogana?,税関はどこですか？,空港や国境の税関。申告するものがあるかは Ha qualcosa da dichiarare? と聞かれる。,,空港と船
L2-0176,2,il bagaglio,荷物|手荷物,noun,m,bagagli,交通・移動,Dov'è il mio bagaglio?,私の荷物はどこですか？,旅行の荷物を指す。bagaglio a mano は機内持ち込みの手荷物。単数で集合的に使うことが多い。,,空港と船
L2-0084,2,la valigia,スーツケース|旅行かばん,noun,f,valigie,交通・移動,La mia valigia è molto pesante.,私のスーツケースはとても重いです。,複数形は -gie（valigie）。「荷造りする」は fare la valigia でも fare le valigie でもよく、どちらも自然。,,空港と船
L2-0410,2,ho perso il passaporto,パスポートをなくしました,phrase,,,交通・移動,"Ho perso il passaporto, mi può aiutare?",パスポートをなくしました。助けてもらえますか？,perso は perdere の過去分詞（不規則）。盗まれた場合は Mi hanno rubato il passaporto。,ho smarrito il passaporto,空港と船
L2-0470,2,la carta d'identità,身分証明書|IDカード,noun,f,carte d'identità,交通・移動,Ha la carta d'identità con sé?,身分証明書をお持ちですか？,複数形は carta の方が変化する。外国人旅行者は通常 passaporto を提示する。身分証全般を口語で単に documento とも言う。,il documento d'identità,空港と船
L2-0372,2,la nave,船|大型船,noun,f,navi,交通・移動,La nave parte alle otto di sera.,船は夜8時に出ます。,大きな船を指す。小型の船は barca、フェリーは traghetto。複数形は navi。,,空港と船
L2-0626,2,il traghetto,フェリー|連絡船,noun,m,traghetti,交通・移動,Il traghetto per la Sicilia parte alle otto.,シチリア行きのフェリーは8時に出ます。,島や対岸へ渡る船、車ごと乗れる船に使う。nave は船一般を指す語。発着するのは porto（港）。,il ferry,空港と船
L2-0534,2,il vaporetto,水上バス,noun,m,vaporetti,交通・移動,Prendiamo il vaporetto per il Lido.,リドまで水上バスに乗りましょう。,特にヴェネツィアの公共水上交通。乗るは prendere、切符は biglietto del vaporetto。,,空港と船
L2-0454,2,la barca,ボート|船,noun,f,barche,交通・移動,Prendiamo una barca per l'isola.,島へはボートで行きましょう。,複数形は -che（c の音を保つ）。大型の船は nave、フェリーは traghetto。,,空港と船
L2-0425,2,il porto,港,noun,m,porti,交通・移動,Il traghetto parte dal porto alle nove.,フェリーは9時に港から出ます。,同形の porto は「ポルト酒」や「運賃」の意味もあるが、まずは「港」。空港は aeroporto。,,空港と船
L2-0003,2,a piedi,徒歩で|歩いて,phrase,,,交通・移動,Vado al lavoro a piedi.,私は歩いて仕事に行きます。,「徒歩で」は a piedi と言い、in は使わない。乗り物では in macchina（車で）、in treno（電車で）のように in を使うのが普通なので、対比して覚える。,,車・自転車とスピード
L2-0024,2,la bicicletta,自転車,noun,f,biciclette,交通・移動,Posso noleggiare una bicicletta qui?,ここで自転車を借りられますか？,口語では bici（不変）と略すことが多い。「自転車で」は in bicicletta。,la bici,車・自転車とスピード
L2-0195,2,in bicicletta,自転車で,phrase,,,交通・移動,Vado al lavoro in bicicletta.,私は自転車で仕事に行きます。,"乗り物の手段は in を使う（in treno, in macchina）。冠詞は付けない。a piedi は「徒歩で」。",in bici,車・自転車とスピード
L2-0229,2,in macchina,車で,phrase,,,交通・移動,Andiamo al mare in macchina.,車で海に行きましょう。,"交通手段は前置詞 in を使う（in treno, in autobus）。in auto もほぼ同義。特定の車なら con la macchina も可。",in auto,車・自転車とスピード
L2-0419,2,la moto,バイク|オートバイ,noun,f,moto（不変）,交通・移動,Mio fratello ha una moto rossa.,兄は赤いバイクを持っています。,motocicletta の短縮形で、短縮語のため複数形も同形。女性名詞なので冠詞は la。,la motocicletta,車・自転車とスピード
L2-0647,2,il camion,トラック,noun,m,camion（不変）,交通・移動,Il camion è fermo davanti al negozio.,トラックは店の前に止まっています。,外来語由来で複数形も同形。複数は i camion。,l'autocarro,車・自転車とスピード
L2-0293,2,guidare,運転する|案内する|導く,verb,,"guido, guidi, guida, guidiamo, guidate, guidano",交通・移動,Mio padre guida con molta attenzione.,父はとても注意して運転します。,規則動詞。車は guidare la macchina、patente di guida は運転免許証。「案内する」の意味でも使う。,,車・自転車とスピード
L2-0203,2,parcheggiare,駐車する,verb,,"parcheggio, parcheggi, parcheggia, parcheggiamo, parcheggiate, parcheggiano",交通・移動,Posso parcheggiare qui?,ここに駐車してもいいですか？,"-iare 動詞で、tu と noi の語尾では i が重ならない（parcheggi, parcheggiamo）。名詞は il parcheggio（駐車場）。",,車・自転車とスピード
L2-0310,2,il parcheggio,駐車場|駐車,noun,m,parcheggi,交通・移動,C'è un parcheggio vicino all'hotel?,ホテルの近くに駐車場はありますか？,「駐車場」と「駐車すること」の両方を指す。動詞は parcheggiare。,il posteggio,車・自転車とスピード
L2-0512,2,il posteggio,駐車場|駐車スペース,noun,m,posteggi,交通・移動,Dov'è il posteggio più vicino?,一番近い駐車場はどこですか？,parcheggio とほぼ同義で、parcheggio のほうが一般的。タクシー乗り場（posteggio taxi）の意味でも使う。,il parcheggio,車・自転車とスピード
L2-0391,2,la benzina,ガソリン,noun,f,benzine,交通・移動,Devo fare benzina prima di partire.,出発する前にガソリンを入れなければなりません。,「給油する」は fare benzina または fare il pieno（満タンにする）。ディーゼルは gasolio。,,車・自転車とスピード
L2-0385,2,l'autostrada,高速道路,noun,f,autostrade,交通・移動,Prendiamo l'autostrada per Firenze.,フィレンツェ行きの高速道路に乗りましょう。,イタリアの高速は多くが有料で、料金所（casello）で支払う。標識は緑色。,,車・自転車とスピード
L2-0327,2,il traffico,交通量|渋滞|交通,noun,m,traffici,交通・移動,C'è molto traffico in centro oggi.,今日は中心街の交通量が多いです。,「渋滞」は traffico のほか coda（車の列。複数形 code）でも表せる。複数形 traffici は「（しばしば不正な）取引」の意味で使うことが多い。,,車・自転車とスピード
L2-0719,2,il bagagliaio,トランク（車の）|荷物室,noun,m,bagagliai,交通・移動,Metto la valigia nel bagagliaio.,スーツケースをトランクに入れます。,車のトランクを指す。バスなどの荷物室も言う。複数形は -ai。,,車・自転車とスピード
L2-0127,2,fermare,止める|停止させる,verb,,"fermo, fermi, ferma, fermiamo, fermate, fermano",交通・移動,"Può fermare il taxi, per favore?",タクシーを止めてもらえますか？,再帰形 fermarsi は「止まる、立ち止まる」。バスの停留所は fermata。近過去の助動詞は avere。,,車・自転車とスピード
L2-0128,2,fermarsi,止まる|立ち止まる|とどまる,verb,,"mi fermo, ti fermi, si ferma, ci fermiamo, vi fermate, si fermano",交通・移動,Il treno si ferma a Firenze?,この電車はフィレンツェに停まりますか？,再帰動詞。近過去は essere を使う（mi sono fermato/a）。他動詞 fermare は「止める」。,,車・自転車とスピード
L2-0610,2,rallentare,減速する|速度を落とす|〜を遅らせる,verb,,"rallento, rallenti, rallenta, rallentiamo, rallentate, rallentano",交通・移動,"Rallenta, c'è un autovelox.",スピードを落として、速度違反取締り機があるよ。,自動詞（減速する）にも他動詞（〜を遅らせる）にも使う。近過去は運転者が主語なら avere が普通（Ho rallentato）。,,車・自転車とスピード
L2-0094,2,veloce,速い|素早い,adj,,veloci,交通・移動,Il treno è molto veloce.,その電車はとても速いです。,-e 形容詞なので男女同形、複数は veloci。副詞は velocemente、会話では veloce もよく使う。,rapido,車・自転車とスピード

L2-0535,2,velocemente,速く|素早く,adv,,,交通・移動,"Non parlare così velocemente, per favore.",そんなに速く話さないでください。,形容詞 veloce に -mente を付けた副詞。会話では veloce をそのまま副詞的に使うことも多い（parlare veloce）。presto は主に「（時間的に）早く・すぐに」の意味で別物。,rapidamente,車・自転車とスピード
L2-0253,2,lento,遅い|ゆっくりした,adj,,"lenta, lenti, lente",交通・移動,Il treno è molto lento.,その列車はとても遅いです。,速度が遅いことを表す。時刻に遅れる「遅い」は tardi や in ritardo を使う。,,車・自転車とスピード

L2-0005,2,l'albergo,ホテル|宿泊施設,noun,m,alberghi,宿泊,Il nostro albergo è vicino alla stazione.,私たちのホテルは駅の近くです。,複数形は -ghi で h を入れて硬い g の音を保つ。hotel も同じ意味でよく使われる。,l'hotel,ホテルに泊まる
L2-0590,2,l'ostello,ユースホステル|ホステル,noun,m,ostelli,宿泊,Dormo in un ostello vicino alla stazione.,私は駅の近くのユースホステルに泊まります。,l'ostello は母音で始まるので冠詞は l'。正式には ostello della gioventù（ユースホステル）。,l'ostello della gioventù,ホテルに泊まる
L2-0597,2,la pensione,ペンション|民宿|年金|退職,noun,f,pensioni,宿泊,Abbiamo prenotato una pensione vicino alla stazione.,私たちは駅の近くのペンションを予約しました。,小さな家族経営の宿。「年金」「退職」の意味もあり、andare in pensione は「退職する」。,,ホテルに泊まる

L2-0709,2,la prenotazione,予約,noun,f,prenotazioni,宿泊,Ho una prenotazione per due persone.,2名で予約しています。,動詞は prenotare。レストランやホテルの予約に使う。「予約する」は fare una prenotazione とも言う。,,ホテルに泊まる
L2-0056,2,libero,空いている|自由な,adj,,"libera, liberi, libere",宿泊,"Scusi, questo posto è libero?",すみません、この席は空いていますか？,席やトイレが空いているときは libero、使用中は occupato。「自由な」の意味でも使う。,,ホテルに泊まる
L2-0421,2,occupato,使用中の|(席などが)ふさがっている|忙しい,adj,,"occupata, occupati, occupate",宿泊,"Scusi, questo posto è occupato?",すみません、この席はふさがっていますか？,トイレの表示 OCCUPATO は「使用中」、反対は libero（空き）。人が「忙しい」の意味でも使う。,,ホテルに泊まる
L2-0242,2,l'ascensore,エレベーター,noun,m,ascensori,宿泊,"Scusi, dov'è l'ascensore?",すみません、エレベーターはどこですか？,母音で始まるので冠詞は l'。階段は le scale。「上がる」は salire、「降りる」は scendere。,,ホテルに泊まる

L2-0561,2,il corridoio,廊下|通路,noun,m,corridoi,宿泊,La mia camera è in fondo al corridoio.,私の部屋は廊下の突き当たりです。,飛行機や列車の通路側の席は posto corridoio と言う。複数形は -oi で終わる。,,ホテルに泊まる
L2-0675,2,la terrazza,テラス|屋上,noun,f,terrazze,宿泊,La camera ha una terrazza con vista sul mare.,その部屋には海が見えるテラスがあります。,カフェやレストランの屋外席も terrazza と言う。ベランダは balcone が近い。,,ホテルに泊まる

L2-0007,2,la doccia,シャワー,noun,f,docce,宿泊,La camera ha una doccia grande.,その部屋には大きなシャワーがあります。,fare la doccia で「シャワーを浴びる」。浴槽は la vasca (da bagno)。,,バスルーム

L2-0152,2,ritornare,戻る|帰る,verb,,"ritorno, ritorni, ritorna, ritorniamo, ritornate, ritornano",基本動詞,Ritorno a casa alle sei.,6時に家に帰ります。,近過去は essere を助動詞にとる（sono ritornato/a）。tornare とほぼ同義で、会話では tornare のほうが普通。,tornare,一日の動き
L2-0239,2,trovarsi,（場所に）いる|（場所に）ある|自分が〜だと気づく,verb,,"mi trovo, ti trovi, si trova, ci troviamo, vi trovate, si trovano",基本動詞,Dove si trova la stazione?,駅はどこにありますか？,再帰動詞。場所を尋ねる定番表現 Dove si trova ...? で使う。近過去は essere を助動詞にとる（mi sono trovato/a）。,,一日の動き
L2-0232,2,passare,通る|過ぎる|立ち寄る,verb,,"passo, passi, passa, passiamo, passate, passano",基本動詞,Il bus passa ogni dieci minuti.,バスは10分おきに来ます。,自動詞では essere、他動詞（時間を過ごす、手渡す）では avere を使う。passare da で「〜に立ち寄る」。,,一日の動き
L2-0087,2,aspettare,待つ|期待する,verb,,"aspetto, aspetti, aspetta, aspettiamo, aspettate, aspettano",基本動詞,Aspetto l'autobus da dieci minuti.,10分前からバスを待っています。,他動詞なので「〜を待つ」に前置詞は不要（aspettare il treno）。「Aspetta un attimo」で「ちょっと待って」。,,一日の動き
L2-0464,2,attendere,待つ|待機する,verb,,"attendo, attendi, attende, attendiamo, attendete, attendono（過去分詞 atteso）",基本動詞,"Attenda un momento, per favore.",少々お待ちください。,aspettare より改まった語で、アナウンスや掲示に多い。過去分詞は atteso。,aspettare,一日の動き
L2-0055,2,incontrare,会う|出会う,verb,,"incontro, incontri, incontra, incontriamo, incontrate, incontrano",基本動詞,Incontro un amico in centro.,街の中心で友達に会います。,他動詞なので前置詞なしで人を直接目的語にとる。約束して会うときは vedersi も使う。,,一日の動き
L2-0153,2,salutare,挨拶する|よろしく言う,verb,,"saluto, saluti, saluta, salutiamo, salutate, salutano",基本動詞,Saluto sempre i vicini la mattina.,私は朝いつも近所の人に挨拶します。,規則動詞で直接目的語をとる（salutare qualcuno）。「よろしく伝える」は salutare da parte mia のように言う。,,一日の動き
L2-0457,2,invitare,招待する|誘う,verb,,"invito, inviti, invita, invitiamo, invitate, invitano",基本動詞,Ti invito a cena domani sera.,明日の夜、夕食に招待するよ。,「〜に招待する」は invitare a ＋名詞・不定詞。例: invitare a cena。,,一日の動き
L2-0660,2,lasciare,置いていく|残す|やめる,verb,,"lascio, lasci, lascia, lasciamo, lasciate, lasciano",基本動詞,Lascio le valigie in albergo.,スーツケースをホテルに置いていきます。,lasciare＋不定詞で「〜させておく」。lasciami stare は「放っておいて」。規則動詞で、過去分詞は lasciato。,,一日の動き
L2-0532,2,tenere,持つ|保つ|取っておく,verb,,"tengo, tieni, tiene, teniamo, tenete, tengono（過去分詞 tenuto）",基本動詞,Tenga pure il resto.,お釣りは取っておいてください。,不規則動詞。Tieni! は「はい、どうぞ」。tenere a は「〜を大切に思う」。「持っている」の意味では avere と使い分ける。,,一日の動き
L2-0646,2,cadere,落ちる|転ぶ,verb,,"cado, cadi, cade, cadiamo, cadete, cadono（過去分詞 caduto）",基本動詞,Sono caduto sulle scale.,階段で転んでしまいました。,近過去は essere を使う（sono caduto/a）。不規則な語幹で、未来形は cadrò。,,一日の動き
L2-0435,2,rompere,壊す|割る|折る,verb,,"rompo, rompi, rompe, rompiamo, rompete, rompono（過去分詞 rotto）",基本動詞,Ho rotto il bicchiere.,グラスを割ってしまいました。,過去分詞が不規則。rotto は「壊れた」の意味で形容詞的にも使う（È rotto）。再帰形 rompersi は「壊れる、割れる」。rompersi il braccio のように体の部位とともに使うと「骨折する」の意味になる。,,一日の動き
L2-0520,2,rotto,壊れた|故障した,adj,,"rotta, rotti, rotte",基本動詞,La mia valigia è rotta.,私のスーツケースが壊れています。,rompere の過去分詞でもある。形容詞として名詞に性数一致する。機械の故障は guasto も使う。,,一日の動き
L2-0088,2,dovere,〜しなければならない|〜すべきだ|借りがある,verb,,"devo, devi, deve, dobbiamo, dovete, devono",基本動詞,Devo partire domani mattina.,明日の朝出発しなければなりません。,"後ろに不定詞を置く法助動詞。近過去の助動詞は後ろの動詞に合わせる（ho dovuto lavorare, sono dovuto/a partire）。",,よく使う動詞
L2-0004,2,aiutare,助ける|手伝う,verb,,"aiuto, aiuti, aiuta, aiutiamo, aiutate, aiutano",基本動詞,"Mi può aiutare, per favore?",手伝っていただけますか？,直接目的語を取る他動詞。近過去は avere（ho aiutato）。名詞 aiuto は「助けて！」の叫びにも使う。,,よく使う動詞
L2-0020,2,aprire,開ける|開店する|開く,verb,,"apro, apri, apre, apriamo, aprite, aprono（過去分詞 aperto）",基本動詞,Il negozio apre alle nove.,その店は9時に開きます。,過去分詞が不規則。店が開くときは自動詞的にも使う。反対語は chiudere。,,よく使う動詞
L2-0265,2,sentire,聞こえる|感じる|聞く,verb,,"sento, senti, sente, sentiamo, sentite, sentono",基本動詞,"Non sento niente, parli più forte.",何も聞こえません、もっと大きな声で話してください。,ascoltare は意識して「聴く」、sentire は自然に「聞こえる」。再帰形 sentirsi は「気分が〜だ」。,,よく使う動詞
L2-0120,2,decidere,決める|決心する,verb,,"decido, decidi, decide, decidiamo, decidete, decidono（過去分詞 deciso）",基本動詞,"Non so cosa scegliere, decidi tu.",何を選ぶかわからないから、君が決めて。,過去分詞が不規則。decidere di + 不定詞「〜することにする」。近過去は avere を使う。,,よく使う動詞
L2-0223,2,cambiare,変える|変わる|交換する|両替する,verb,,"cambio, cambi, cambia, cambiamo, cambiate, cambiano",基本動詞,Posso cambiare questa camicia?,このシャツを交換できますか？,自動詞では「変わる」の意味もある。電車の乗り換えも cambiare treno。tu の形は cambi で、語幹の i と語尾の -i が一つになる（cambii とは書かない）。,,よく使う動詞
L2-0339,2,continuare,続ける|続く,verb,,"continuo, continui, continua, continuiamo, continuate, continuano",基本動詞,Continua dritto fino al semaforo.,信号までまっすぐ進んでください。,continuare a＋不定詞で「〜し続ける」。近過去は他動なら avere、自動（続く）なら essere も使われる。,,よく使う動詞
L2-0282,2,controllare,確認する|チェックする|検査する|制御する,verb,,"controllo, controlli, controlla, controlliamo, controllate, controllano",基本動詞,Posso controllare il mio biglietto?,切符を確認してもいいですか？,規則動詞。英語の control と違い「確認・検査する」が基本だが、「制御する・抑える」の意味もある。近過去は avere を使う。,verificare,よく使う動詞
L2-0479,2,credere,信じる|思う,verb,,"credo, credi, crede, crediamo, credete, credono",基本動詞,Credo di sì.,そうだと思います。,「〜と思う」は credere di＋不定詞、または che＋接続法。「〜の存在を信じる」は credere in。,,よく使う動詞
L2-0480,2,domandare,尋ねる|質問する,verb,,"domando, domandi, domanda, domandiamo, domandate, domandano",基本動詞,Domando l'ora a un signore.,男の人に時間を尋ねます。,尋ねる相手には a を使う（domandare a qualcuno）。chiedere とほぼ同義だが、依頼の「頼む」は chiedere が普通。,chiedere,よく使う動詞
L2-0528,2,sperare,望む|期待する|〜だといいと思う,verb,,"spero, speri, spera, speriamo, sperate, sperano",基本動詞,Spero di vedere il mare domani.,明日は海が見られるといいな。,sperare di＋不定詞、sperare che＋接続法も可。会話では Spero di sì. / Spero di no. がよく使われる。,,よく使う動詞
L2-0426,2,preferire,好む|〜の方を選ぶ,verb,,"preferisco, preferisci, preferisce, preferiamo, preferite, preferiscono",基本動詞,Preferisco il caffè al tè.,私は紅茶よりコーヒーが好きです。,-isco型の動詞。比べる相手は a で示す（preferire A a B）。過去分詞は規則形 preferito。,,よく使う動詞
L2-0613,2,ricordare,思い出す|覚えている|思い出させる,verb,,"ricordo, ricordi, ricorda, ricordiamo, ricordate, ricordano",基本動詞,Non ricordo il nome dell'hotel.,ホテルの名前を思い出せません。,再帰形 ricordarsi di ～ も同義。ricordare は直接目的語を取り、ricordarsi は di や前置詞を伴うことが多い。,ricordarsi,よく使う動詞
L2-0670,2,riuscire,できる|成功する,verb,,"riesco, riesci, riesce, riusciamo, riuscite, riescono",基本動詞,Non riesco a dormire.,眠れません。,riuscire a + 不定詞で「〜できる」。助動詞は essere（sono riuscito/a）。uscire と同じ活用。,,よく使う動詞
L2-0655,2,funzionare,動く|機能する,verb,,"funziono, funzioni, funziona, funzioniamo, funzionate, funzionano",基本動詞,L'aria condizionata non funziona.,エアコンが動きません。,近過去の助動詞は avere（ha funzionato）。機械や設備の故障を伝える時に Non funziona. とよく言う。,,よく使う動詞
L2-0663,2,mostrare,見せる|示す,verb,,"mostro, mostri, mostra, mostriamo, mostrate, mostrano",基本動詞,"Può mostrarmi quella borsa, per favore?",そのバッグを見せていただけますか？,規則動詞。mostrare A a B（BにAを見せる）。人には間接目的語代名詞を使う（mi mostra）。,,よく使う動詞
L2-0326,2,toccare,触る|触れる|（順番が）回ってくる,verb,,"tocco, tocchi, tocca, tocchiamo, toccate, toccano",基本動詞,"Non toccare, è molto caldo!",触らないで、とても熱いよ！,"-care 動詞なので tocchi, tocchiamo のように h が入る。「Tocca a te.」は「君の番だ」。",,よく使う動詞
L2-0325,2,tirare,引く|投げる,verb,,"tiro, tiri, tira, tiriamo, tirate, tirano",基本動詞,"Per aprire la porta, devi tirare.",ドアを開けるには、引かなければなりません。,ドアの表示 TIRARE は「引く」、SPINGERE は「押す」。tira vento は「風が吹く」。,,よく使う動詞
L2-0619,2,spingere,押す|押し進める,verb,,"spingo, spingi, spinge, spingiamo, spingete, spingono（過去分詞 spinto）",基本動詞,"Per aprire la porta, spingi qui.",ドアを開けるには、ここを押してください。,ドアの掲示 SPINGERE は「押す」、TIRARE は「引く」。過去分詞が不規則。,,よく使う動詞
L2-0614,2,riempire,満たす|いっぱいにする|記入する,verb,,"riempio, riempi, riempie, riempiamo, riempite, riempiono（過去分詞 riempito）",基本動詞,Puoi riempire la bottiglia d'acqua?,ボトルを水でいっぱいにしてくれる？,-ire 動詞だが -isc- 型ではなく不規則。書類に「記入する」の意味でも使う。,colmare,よく使う動詞
L2-0526,2,servire,給仕する|出す|役に立つ,verb,,"servo, servi, serve, serviamo, servite, servono",基本動詞,Il cameriere serve il vino.,ウェイターがワインを出します。,servire a ... で「〜の役に立つ」、Mi serve ... で「私は〜が必要だ」。後者は日常で頻出。,,よく使う動詞
L2-0311,2,perdere,失う|なくす|乗り遅れる,verb,,"perdo, perdi, perde, perdiamo, perdete, perdono（過去分詞 perso）",基本動詞,Ho perso il treno delle otto.,8時の電車に乗り遅れました。,過去分詞は perso（perduto も可）。「乗り遅れる」は perdere il treno。授業やチャンスを逃す意味もある。,,よく使う動詞
L2-0331,2,vincere,勝つ|勝ち取る,verb,,"vinco, vinci, vince, vinciamo, vincete, vincono（過去分詞 vinto）",基本動詞,Oggi vince la nostra squadra.,今日は私たちのチームが勝ちます。,過去分詞 vinto が不規則。近過去は avere を使う（ho vinto）。反対語は perdere。,,よく使う動詞
L2-0221,2,vivere,暮らす|生きる|住む,verb,,"vivo, vivi, vive, viviamo, vivete, vivono（過去分詞 vissuto）",基本動詞,Vivo a Roma da due anni.,私は2年前からローマに住んでいます。,過去分詞は不規則で vissuto。近過去は自動詞なら essere も avere も使える（他動詞 vivere una vita などは avere）。abitare は「住む」の意味だけだが、vivere は「生きる・暮らす」も表す。,,よく使う動詞
L2-0539,2,diventare,〜になる|〜に変わる,verb,,"divento, diventi, diventa, diventiamo, diventate, diventano",基本動詞,Mio figlio vuole diventare medico.,息子は医者になりたがっています。,近過去は essere を助動詞にとる（è diventato/a）。補語は主語に性数一致。,,よく使う動詞
L2-0588,2,odiare,憎む|大嫌いである,verb,,"odio, odi, odia, odiamo, odiate, odiano",基本動詞,Odio aspettare il treno in ritardo.,遅れている電車を待つのは大嫌いです。,日常会話では「大嫌い」程度の強さでも使う。io odio は名詞 odio（憎しみ）と同形で、どちらも第1音節にアクセント（Ò-dio）。,,よく使う動詞
L2-0615,2,rubare,盗む,verb,,"rubo, rubi, ruba, rubiamo, rubate, rubano",基本動詞,Mi hanno rubato il portafoglio.,財布を盗まれました。,被害を伝えるときは「Mi hanno rubato＋物」（間接目的語を使う）が定番。「Mi hanno derubato」は人が被害者。,,よく使う動詞
L2-0617,2,scusare,許す|大目に見る,verb,,"scuso, scusi, scusa, scusiamo, scusate, scusano",基本動詞,"Mi scusi, dov'è la stazione?",すみません、駅はどこですか？,scusare は「許す・大目に見る」。呼びかけの「すみません」は命令形の scusi（丁寧）、scusa（親しい相手）を使う。再帰形 scusarsi は「謝る」。,perdonare,よく使う動詞
L2-0016,2,lo sport,スポーツ|運動,noun,m,sport（不変）,観光・文化,Faccio sport due volte alla settimana.,私は週に2回スポーツをします。,外来語なので複数形も sport のまま。s＋子音で始まるので冠詞は lo、複数は gli sport。「スポーツをする」は fare sport。,,趣味とスポーツ
L2-0126,2,fare sport,スポーツをする|運動する,phrase,,"faccio sport, fai sport, fa sport, facciamo sport, fate sport, fanno sport",観光・文化,Faccio sport due volte a settimana.,私は週に2回スポーツをします。,sport に冠詞は付けない。特定の競技は giocare a calcio や praticare nuoto などを使う。,praticare sport,趣味とスポーツ
L2-0113,2,correre,走る|急ぐ,verb,,"corro, corri, corre, corriamo, correte, corrono（過去分詞 corso）",観光・文化,Devo correre alla stazione.,駅まで走らなければなりません。,過去分詞が不規則。近過去は、助動詞に avere をとるのが基本（ho corso）。目的地を示すときは essere も使う。,,趣味とスポーツ
L2-0231,2,nuotare,泳ぐ,verb,,"nuoto, nuoti, nuota, nuotiamo, nuotate, nuotano",観光・文化,Mi piace nuotare in mare.,海で泳ぐのが好きです。,規則動詞。近過去は avere を助動詞にとる（ho nuotato）。「泳ぎ」は il nuoto。,,趣味とスポーツ
L2-0359,2,sciare,スキーをする|滑る（スキーで）,verb,,"scio, scii, scia, sciamo, sciate, sciano",観光・文化,D'inverno vado a sciare in montagna.,冬には山へスキーをしに行きます。,tu の活用は scii（語幹の sci- に語尾 -i が付き、i が2つ並ぶ）。「スキーに行く」は andare a sciare。,,趣味とスポーツ
L2-0721,2,il campeggio,キャンプ場|キャンプ,noun,m,campeggi,観光・文化,C'è un campeggio vicino al lago.,湖の近くにキャンプ場があります。,fare campeggio で「キャンプをする」。キャンプ場の意味では camping（男性・不変）もよく使われる。,il camping,趣味とスポーツ
L2-0505,2,passeggiare,散歩する|ぶらぶら歩く,verb,,"passeggio, passeggi, passeggia, passeggiamo, passeggiate, passeggiano",観光・文化,Mi piace passeggiare in centro la sera.,夕方に町の中心を散歩するのが好きです。,規則動詞。近過去の助動詞は avere（ho passeggiato）。「散歩」の名詞は la passeggiata。fare una passeggiata とも言う。,,趣味とスポーツ
L2-0506,2,la passeggiata,散歩|そぞろ歩き,noun,f,passeggiate,観光・文化,Facciamo una passeggiata in centro?,中心街を散歩しませんか？,fare una passeggiata で「散歩する」。夕方に街を歩く習慣は伝統的で、特に週末に親しまれている。,,趣味とスポーツ
L2-0285,2,divertirsi,楽しむ|楽しく過ごす,verb,,"mi diverto, ti diverti, si diverte, ci divertiamo, vi divertite, si divertono",観光・文化,Ci divertiamo molto qui.,私たちはここでとても楽しんでいます。,再帰動詞。近過去は essere を使う（mi sono divertito/a）。別れ際の Buon divertimento! は「楽しんで」。,,趣味とスポーツ
L2-0567,2,divertente,楽しい|おもしろい,adj,,divertenti,観光・文化,Il film è molto divertente.,その映画はとてもおもしろい。,-e 形容詞で男女同形、複数は divertenti。人を主語にすると「面白い人」、divertirsi は「楽しむ」。,,趣味とスポーツ
L2-0701,2,noioso,退屈な|つまらない,adj,,"noiosa, noiosi, noiose",観光・文化,Il film era molto noioso.,その映画はとても退屈だった。,人にも物事にも使える。「退屈している」は annoiato、混同しやすい。,,趣味とスポーツ
L2-0104,2,cantare,歌う,verb,,"canto, canti, canta, cantiamo, cantate, cantano",観光・文化,Mi piace cantare sotto la doccia.,私はシャワーを浴びながら歌うのが好きです。,規則的な -are 動詞。他動詞にも自動詞にも使える（cantare una canzone）。,,音楽・芸術・写真
L2-0722,2,la canzone,歌|歌曲,noun,f,canzoni,観光・文化,Questa canzone è molto bella.,この歌はとても素敵です。,-one で終わるが女性名詞。複数形は canzoni。「歌う」は cantare。,,音楽・芸術・写真
L2-0100,2,ballare,踊る,verb,,"ballo, balli, balla, balliamo, ballate, ballano",観光・文化,Ti piace ballare?,踊るのは好きですか？,規則動詞。近過去は avere を使う（ho ballato）。danzare はやや改まった語。,danzare,音楽・芸術・写真
L2-0112,2,il concerto,コンサート|演奏会,noun,m,concerti,観光・文化,Stasera andiamo a un concerto in piazza.,今夜は広場のコンサートに行きます。,「コンサートに行く」は andare a un concerto。複数形は concerti。協奏曲の意味もある。,,音楽・芸術・写真
L2-0714,2,lo spettacolo,公演|ショー|見世物,noun,m,spettacoli,観光・文化,A che ora inizia lo spettacolo?,公演は何時に始まりますか？,劇・コンサート・映画など上演物全般に使う。s＋子音で始まるので冠詞は lo、複数は gli spettacoli。,,音楽・芸術・写真
L2-0396,2,la chitarra,ギター,noun,f,chitarre,観光・文化,Mio fratello suona la chitarra.,兄はギターを弾きます。,楽器を演奏するときは suonare を使い、定冠詞をつける（suonare la chitarra）。複数形は -a を -e に変えて chitarre となる。,,音楽・芸術・写真
L2-0356,2,il pianoforte,ピアノ,noun,m,pianoforti,観光・文化,Mia sorella suona il pianoforte.,姉はピアノを弾きます。,楽器を弾くは suonare。短縮形 piano もあるが「ゆっくり」「階」の意味もある。,,音楽・芸術・写真
L2-0564,2,disegnare,描く|デザインする,verb,,"disegno, disegni, disegna, disegniamo, disegnate, disegnano",観光・文化,Mi piace disegnare al parco.,公園で絵を描くのが好きです。,鉛筆やペンで線画を描くのが disegnare。絵の具で描くのは dipingere。disegniamo の gn の後の i は綴り上だけで、発音しない。,,音楽・芸術・写真
L2-0098,2,l'arte,芸術|美術,noun,f,arti,観光・文化,Mi piace molto l'arte moderna.,私は現代美術がとても好きです。,単数は l'arte（女性）だが、複数形は le arti。museo d'arte は「美術館」。,,音楽・芸術・写真
L2-0174,2,la storia,歴史|物語|話,noun,f,storie,観光・文化,Mi piace molto la storia dell'arte.,私は美術史がとても好きです。,「歴史」と「物語・話」の両方の意味がある。storia d'amore は恋愛物語、「作り話」の意味でも使う。,,音楽・芸術・写真
L2-0191,2,la fotografia,写真|写真撮影,noun,f,fotografie,観光・文化,Posso fare una fotografia qui?,ここで写真を撮ってもいいですか？,会話では短縮形の foto（不変・女性）がよく使われる。「写真を撮る」は fare una foto。,la foto,音楽・芸術・写真
L2-0571,2,fotografare,写真を撮る|撮影する,verb,,"fotografo, fotografi, fotografa, fotografiamo, fotografate, fotografano",観光・文化,Posso fotografare qui?,ここで写真を撮ってもいいですか？,規則動詞。「写真を撮る」は fare una foto とも言う。美術館などでは撮影可否を尋ねるとよい。,fare una foto,音楽・芸術・写真
L2-0300,2,la macchina fotografica,カメラ,noun,f,macchine fotografiche,観光・文化,Posso usare la macchina fotografica qui?,ここでカメラを使ってもいいですか?,単に la fotocamera とも言う。美術館などでは撮影可否を確認するとよい。,la fotocamera,音楽・芸術・写真
L2-0188,2,la faccia,顔|表情,noun,f,facce,体・健康,Hai una faccia stanca oggi.,今日は疲れた顔をしているね。,viso とほぼ同義だが、より口語的な「顔」。viso は中立的・標準的な語で、volto は文語的。,il viso,顔と体
L2-0102,2,la bocca,口,noun,f,bocche,体・健康,"Apra la bocca, per favore.",口を開けてください。,複数形は h を入れて bocche（発音 /k/ を保つため）。in bocca al lupo は「頑張って」の定番表現。,,顔と体
L2-0201,2,il naso,鼻,noun,m,nasi,体・健康,Ho il naso chiuso.,鼻が詰まっています。,体の部位は所有形容詞でなく定冠詞を使う。「鼻水が出る」は avere il naso che cola。,,顔と体
L2-0142,2,l'orecchio,耳,noun,m,gli orecchi / le orecchie（le orecchie が一般的）,体・健康,Ho mal d'orecchio.,耳が痛いです。,複数形は gli orecchi と le orecchie の両方があり、人の耳には le orecchie がふつう。耳の痛みは mal d'orecchio。聴覚は udito。,,顔と体
L2-0723,2,il capello,髪の毛|髪,noun,m,capelli,体・健康,Ho i capelli lunghi.,私は髪が長いです。,髪全体を指すときは普通 i capelli と複数形で使う。「髪が長い」は avere i capelli lunghi。,,顔と体
L2-0284,2,il dente,歯,noun,m,denti,体・健康,Mi fa male un dente.,歯が1本痛いです。,「歯が痛い」は avere mal di denti または mi fa male un dente。歯医者は il dentista。,,顔と体
L2-0224,2,il collo,首,noun,m,colli,体・健康,Mi fa male il collo.,首が痛いです。,「荷物・小包」の意味でも複数形は colli。頭と胴の間の部分を指し、喉（のど）は gola。,,顔と体
L2-0179,2,il braccio,腕,noun,m,"le braccia, i bracci",体・健康,Mi fa male il braccio destro.,右腕が痛いです。,複数形は不規則で、体の腕は女性複数 le braccia。i bracci は「(川・十字架などの)腕状の部分」。,,顔と体
L2-0122,2,il dito,指,noun,m,"le dita, i diti",体・健康,Mi fa male un dito.,指が1本痛いです。,複数形は通常 le dita（女性複数・不規則）。i diti は個々の指を別々に扱う場合などに使われることもあるが、まれ。le dita は手・足どちらの指にも使い、足の指を明示するときは le dita dei piedi と言う。,,顔と体
L2-0233,2,il piede,足,noun,m,piedi,体・健康,Mi fa male il piede destro.,右足が痛いです。,足首から先を指す。脚全体は la gamba。andare a piedi は「歩いて行く」。,,顔と体
L2-0408,2,il ginocchio,膝,noun,m,"i ginocchi, le ginocchia",体・健康,Mi fa male il ginocchio.,膝が痛いです。,複数形は男性 i ginocchi も女性 le ginocchia も使われる。体の部位を痛む時は fare male を使う。,,顔と体
L2-0671,2,la schiena,背中,noun,f,schiene,体・健康,Ho mal di schiena da due giorni.,2日前から背中が痛いです。,「腰痛・背中の痛み」は mal di schiena と言う。複数形 schiene は -ie ではなく -e。,,顔と体
L2-0259,2,la pancia,お腹|腹部,noun,f,pance,体・健康,Ho mal di pancia.,お腹が痛いです。,avere mal di pancia は「お腹が痛い」。複数形は子音のあとの -cia が -ce になり pance（pancie は一般的ではない）。,,顔と体
L2-0644,2,lo stomaco,胃|おなか,noun,m,stomachi / stomaci,体・健康,Ho mal di stomaco.,胃が痛いです。,複数形は stomachi と stomaci の両方が使われる。s＋子音で始まるので冠詞は lo。mal di stomaco は「胃痛」。,,顔と体
L2-0656,2,la gola,喉,noun,f,gole,体・健康,Ho mal di gola da due giorni.,2日前から喉が痛いです。,喉が痛いは avere mal di gola。「食い意地、暴食」の意味もある（peccato di gola＝暴食の罪）。,,顔と体
L2-0340,2,il cuore,心臓|心,noun,m,cuori,体・健康,Mi fa male il cuore.,心臓が痛いです。,「心臓」と「心・気持ち」の両方の意味を持つ。複数形 cuori は規則的。mi sta a cuore は「(それが)私にとって大切だ・気がかりだ」の意で、主語は大切に思う対象。,,顔と体
L2-0524,2,il sangue,血|血液,noun,m,（複数形はほとんど使わない）,体・健康,Mi esce sangue dal naso.,鼻から血が出ます。,通常は単数形のみで使う不可算名詞。「血液検査」は esame del sangue、「血液型」は gruppo sanguigno。,,顔と体
L2-0589,2,l'osso,骨,noun,m,"ossa（女性複数）, ossi",体・健康,Mi fa male un osso del piede.,足の骨が痛いです。,複数形は不規則。体の骨全体は le ossa（女性複数）、動物の骨などは gli ossi。,,顔と体
L2-0611,2,respirare,呼吸する|息をする,verb,,"respiro, respiri, respira, respiriamo, respirate, respirano",体・健康,"Respiri profondamente, per favore.",深く呼吸してください。,規則動詞。丁寧な命令（Lei に対して）は接続法現在の形 respiri を使い、tu に対しては respira。,,顔と体
L2-0245,2,come ti senti,気分はどう？|調子はどう？,phrase,,,体・健康,Come ti senti oggi? Hai ancora la febbre?,今日は気分どう？まだ熱がある？,親しい相手（tu）への表現。丁寧形は Come si sente? 返事は Mi sento bene / Mi sento male。,come stai,体調と病院
L2-0266,2,sentirsi,（気分・体調が）〜と感じる|気分がする,verb,,"mi sento, ti senti, si sente, ci sentiamo, vi sentite, si sentono",体・健康,Oggi non mi sento bene.,今日は気分がよくありません。,再帰動詞。sentirsi＋形容詞・副詞で体調や気持ちを言う。sentire（聞く、感じる）とは別用法。,,体調と病院
L2-0012,2,non mi sento bene,気分が良くありません|具合が悪いです,phrase,,,体・健康,"Scusi, non mi sento bene.",すみません、気分がよくありません。,sentirsi の否定形。体調不良を伝える定番表現。sto male も近い意味で使える。,mi sento male,体調と病院
L2-0530,2,stare male,具合が悪い|気分が悪い,phrase,,"sto male, stai male, sta male, stiamo male, state male, stanno male（過去分詞 stato）",体・健康,"Oggi sto male, vado dal medico.",今日は具合が悪いので、医者に行きます。,反対は stare bene。sentirsi male も近い意味。近過去の助動詞は essere（sono stato/a male）。,,体調と病院
L2-0198,2,malato,病気の|具合が悪い,adj,,"malata, malati, malate",体・健康,Mio figlio è malato oggi.,息子は今日病気です。,名詞としても使う（un malato＝病人）。軽い不調は sentirsi male や avere mal di ～ で言う。,ammalato,体調と病院
L2-0582,2,malissimo,ひどく悪く|最悪に,adv,,,体・健康,Oggi sto malissimo.,今日はひどく体調が悪いです。,male の絶対最上級（molto male と同義）。体調や出来を聞かれた返事で頻出。形容詞 pessimo も「最悪の」。,molto male,体調と病院
L2-0711,2,raffreddato,風邪をひいた|風邪気味の,adj,,"raffreddata, raffreddati, raffreddate",体・健康,Oggi sono raffreddato.,今日は風邪をひいています。,essere raffreddato で「風邪をひいている」。名詞 il raffreddore（鼻風邪）や prendere un raffreddore も覚えたい。,,体調と病院
L2-0289,2,la febbre,熱|発熱,noun,f,febbri,体・健康,Ho la febbre da ieri.,昨日から熱があります。,「熱がある」は avere la febbre。「熱を測る」は misurare la febbre。体温や熱さの意味の「熱」は calore。,,体調と病院
L2-0717,2,la tosse,咳,noun,f,tossi,体・健康,Ho la tosse da due giorni.,2日前から咳が出ています。,「咳が出る」は avere la tosse。複数形は le tossi だが、ふつうは単数で使う。,,体調と病院
L2-0458,2,il mal di testa,頭痛,noun,m,i mal di testa,体・健康,Ho un forte mal di testa.,ひどい頭痛がします。,「頭が痛い」は avere mal di testa。複数形は冠詞だけが変わる形が一般的。mal di pancia（腹痛）なども同型。,,体調と病院
L2-0255,2,il mal di pancia,腹痛|おなかの痛み,noun,m,mal di pancia（不変）,体・健康,Ho mal di pancia da ieri sera.,昨日の夜からおなかが痛いです。,avere mal di pancia で「腹痛がある」。冠詞なしで使うことが多い。同様に mal di testa（頭痛）、mal di gola（喉の痛み）。,il mal di stomaco,体調と病院
L2-0540,2,il dolore,痛み|苦痛,noun,m,dolori,体・健康,Ho un dolore alla schiena.,背中が痛いです。,体の部位の痛みは avere un dolore a＋部位（例: un dolore alla schiena）、または avere mal di＋部位（例: Ho mal di schiena.）。心の苦しみ（悲しみ）の意味でも使う。,,体調と病院
L2-0661,2,la malattia,病気,noun,f,malattie,体・健康,Mio padre ha una malattia del cuore.,父は心臓の病気を患っています。,一般的な「病気」。軽い体調不良は sono malato/a や ho il raffreddore のように言うことが多い。,,体調と病院
L2-0583,2,la medicina,薬|医学,noun,f,複数形: le medicine,体・健康,Devo prendere questa medicina due volte al giorno.,この薬を1日2回飲まなければなりません。,「薬」の意味では farmaco も使う。「医学」は学問分野を指す。,il farmaco,体調と病院
L2-0691,2,l'esame,検査|試験,noun,m,esami,体・健康,Domani devo fare un esame del sangue.,明日は血液検査を受けなければなりません。,医療の「検査」と学校の「試験」の両方に使う。「検査を受ける」は fare un esame、試験を受けるのも fare un esame。,,体調と病院
L2-0568,2,dov'è il pronto soccorso,救急外来はどこですか？|救急救命室はどこですか？,phrase,,,体・健康,"Scusi, dov'è il pronto soccorso?",すみません、救急外来はどこですか？,pronto soccorso は病院の救急外来。救急車を呼ぶ番号は118。,dove è il pronto soccorso,体調と病院
