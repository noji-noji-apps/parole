L5-0261,5,umile,謙虚な|控えめな|質素な,adj,,umili（男女複数）,感情・性格,Mio nonno è una persona umile e gentile con tutti.,私の祖父は謙虚で、誰にでも親切な人です。,-e 形容詞で男女同形。人の性格（謙虚）のほか、umili origini（庶民の出自）のように身分の低さも表す。最上級は umilissimo。,,誇りと美徳
L5-0246,5,la sensibilità,感受性|繊細さ|感度,noun,f,sensibilità（不変）,感情・性格,Ha una grande sensibilità verso i problemi degli altri.,彼女は他人の問題に対してとても感受性が強い。,-à で終わる名詞は複数形も同形（le sensibilità）。形容詞は sensibile。「敏感さ」の意味でも使う。,,誇りと美徳
L5-0385,5,la coscienza,良心|意識,noun,f,coscienze,感情・性格,Ho la coscienza pulita e dormo tranquillo.,私は良心にやましいところがなく、安心して眠れます。,「意識」は perdere coscienza（意識を失う）、「良心」は avere la coscienza pulita（やましくない）。英語の conscience と consciousness の両方を表す。,,誇りと美徳
L5-0418,5,la consapevolezza,自覚|認識|意識,noun,f,consapevolezze,感情・性格,Bisogna aumentare la consapevolezza dei rischi per l'ambiente.,環境へのリスクについての認識を高める必要があります。,「〜への自覚」は consapevolezza di ...。形容詞 consapevole（自覚している）は essere consapevole di と使う。,,誇りと美徳
L5-0302,5,l'ospitalità,もてなし|歓待|ホスピタリティ,noun,f,ospitalità（不変）,感情・性格,Ringraziamo tutti per la calorosa ospitalità che ci avete offerto.,私たちにしてくださった温かいおもてなしに、皆さんに感謝します。,-à で終わる名詞は複数形も同形。ospite（客にも主人にもなる）と関連。settore dell'ospitalità はホテル・飲食業界を指す。,,誇りと美徳
L5-0082,5,la responsabilità,責任,noun,f,responsabilità（不変）,感情・性格,Il direttore si prende la responsabilità di questa decisione.,部長はこの決定の責任を負います。,-à で終わる名詞は複数形も同形。prendersi la responsabilità di ～で「～の責任を負う」。,,誇りと美徳
L5-0238,5,la reputazione,評判|名声,noun,f,reputazioni,感情・性格,Questo ristorante ha una reputazione molto buona in città.,このレストランは街でとても評判がいい。,良い評判にも悪い評判にも使える中立的な語。avere una buona/cattiva reputazione の形で頻出。,la fama,誇りと美徳
L5-0061,5,comprensivo,理解のある|思いやりのある,adj,,"comprensiva, comprensivi, comprensive",感情・性格,Il mio capo è molto comprensivo con tutti i dipendenti.,私の上司は従業員みんなにとても理解があります。,人の性格に使う。「〜に対して理解がある」は comprensivo con / verso。「包括的な」の意味でも使う（prezzo comprensivo di IVA）。,,人柄と欠点
L5-0031,5,spiritoso,機知に富んだ|面白い|ユーモアのある,adj,,"spiritosa, spiritosi, spiritose",感情・性格,Il nostro cameriere è molto spiritoso e simpatico.,私たちのウェイターはとても機知に富んでいて感じがいい。,人の話し方や冗談が気が利いて面白いこと。buffo や divertente は「笑える、楽しい」で、少しニュアンスが違う。,,人柄と欠点

L5-0408,5,estroverso,外向的な|社交的な,adj,,"estroversa, estroversi, estroverse",感情・性格,Mia sorella è molto estroversa e ha tanti amici.,私の姉はとても外向的で、友達がたくさんいます。,反対語は introverso。人の性格を表し、essere estroverso の形でよく使う。,,人柄と欠点
L5-0382,5,altruista,利他的な|思いやりのある,adj,,"altruisti, altruiste",感情・性格,Mia sorella è una persona molto altruista e generosa.,私の姉はとても利他的で寛大な人です。,-ista 形容詞は男女同形（単数 altruista）。複数は男性 altruisti、女性 altruiste。反意語は egoista。,,人柄と欠点
L5-0219,5,ingenuo,純真な|お人好しの|うぶな,adj,,"ingenua, ingenui, ingenue",感情・性格,Sei troppo ingenuo: non tutti dicono la verità.,君はお人好しすぎる。みんなが本当のことを言うわけじゃないよ。,「世間知らずで騙されやすい」という否定的なニュアンスで使われることが多い。名詞としても使う（un ingenuo）。,,人柄と欠点
L5-0220,5,insicuro,自信のない|不安な|安全でない,adj,,"insicura, insicuri, insicure",感情・性格,Mi sento insicuro quando parlo davanti a molte persone.,大勢の前で話すとき、私は自信が持てなくなります。,人にも物・場所にも使う。人なら「自信がない」、道や場所なら「安全でない」の意味。反対語は sicuro。,,人柄と欠点
L5-0160,5,pessimista,悲観的な|悲観主義の,adj,,"pessimisti, pessimiste",感情・性格,Perché sei sempre così pessimista? Andrà tutto bene.,どうしてそんなにいつも悲観的なの？きっとうまくいくよ。,-ista 形容詞は単数が男女同形。複数は男性 pessimisti、女性 pessimiste。反対は ottimista。名詞としても使う。,,人柄と欠点
L5-0263,5,vigliacco,臆病な|卑怯な,adj,,"vigliacca, vigliacchi, vigliacche",感情・性格,"Non essere vigliacco, di' la verità a tuo padre.",臆病になるな、お父さんに本当のことを言いなさい。,名詞としても使う（un vigliacco＝臆病者、卑怯者）。かなり強い侮辱の言葉なので使う相手に注意。,codardo,人柄と欠点
L5-0097,5,disonesto,不誠実な|不正直な,adj,,"disonesta, disonesti, disoneste",感情・性格,Non mi fido di lui perché è un uomo disonesto.,彼は不誠実な男だから、私は信用していません。,反意語は onesto。名詞としても使え、un disonesto は「不誠実な人」。,,人柄と欠点
L5-0017,5,obbedire,従う|服従する,verb,,"obbedisco, obbedisci, obbedisce, obbediamo, obbedite, obbediscono",感情・性格,I bambini devono obbedire ai genitori.,子供たちは両親に従わなければなりません。,-isc- 型の動詞。「〜に従う」は前置詞 a を使う（obbedire a qualcuno）。助動詞は avere。,ubbidire,人柄と欠点
L5-0279,5,la cattiveria,意地悪さ|悪意|意地悪な行為,noun,f,cattiverie,感情・性格,Non capisco tutta questa cattiveria verso di lui.,彼に対するこの意地悪さがまったく理解できません。,性質を指す抽象名詞だが、複数形 cattiverie は「意地悪な言動」の意味で使う。形容詞は cattivo。,la malvagità,人柄と欠点
L5-0294,5,la furbizia,抜け目なさ|ずる賢さ|悪知恵,noun,f,furbizie,感情・性格,"Con un po' di furbizia, puoi trovare un buon prezzo anche in centro.",少し抜け目なくやれば、中心街でもいい値段で買えますよ。,furbo（ずる賢い、抜け目のない）の名詞形。文脈により褒め言葉にも悪口にもなる。複数形 furbizie は「小ずるい手口」の意味でも使う。,l'astuzia,人柄と欠点
L5-0161,5,la pigrizia,怠惰|無精,noun,f,pigrizie,感情・性格,"Non vado in palestra per pigrizia, non per mancanza di tempo.",ジムに行かないのは時間がないからではなく、怠けているからです。,per pigrizia「面倒くさくて」の形でよく使う。形容詞は pigro、人を指す「怠け者」は pigro/a。,l'accidia,人柄と欠点
L5-0380,5,la vanità,虚栄心|うぬぼれ|むなしさ,noun,f,vanità（不変）,感情・性格,La sua vanità è un problema per tutti i colleghi.,彼の虚栄心は同僚みんなにとって問題です。,-à で終わる名詞なので複数形も同形。形容詞は vanitoso（うぬぼれの強い）。「むなしさ」の意味は文語的。,,人柄と欠点
L5-0386,5,l'egoismo,利己主義|エゴイズム|わがまま,noun,m,egoismi,感情・性格,Il suo egoismo ha rovinato la nostra amicizia.,彼の利己主義が私たちの友情を壊した。,形容詞・名詞は egoista（男女同形）。母音で始まるので単数は l'egoismo と省略する。,,人柄と欠点
L5-0272,5,l'ambizione,野心|向上心|大志,noun,f,ambizioni,感情・性格,Ha molta ambizione e vuole diventare direttore.,彼は野心が強く、部長になりたがっています。,肯定的な「向上心」にも否定的な「野心」にも使える。形容詞は ambizioso（野心的な）。,,人柄と欠点

L5-0153,5,la motivazione,動機|やる気|理由,noun,f,motivazioni,感情・性格,Non ho la motivazione per studiare stasera.,今夜は勉強するやる気がありません。,「やる気」は mancanza di motivazione（やる気の欠如）などとも言う。-zione で終わる名詞は基本的に女性。,,人柄と欠点

L5-0118,5,la conseguenza,結果|影響|帰結,noun,f,conseguenze,抽象・社会,Questa decisione avrà conseguenze molto gravi per tutti noi.,この決定は私たち全員に非常に深刻な影響をもたらすでしょう。,多くは悪い結果を指す。di conseguenza は「その結果、したがって」、in conseguenza di は「〜の結果として」。risultato は成果。,,成り行きと評価
L5-0048,5,l'ostacolo,障害物|障害|妨げ,noun,m,ostacoli,抽象・社会,Il traffico è un grosso ostacolo per arrivare in tempo all'aeroporto.,交通渋滞は、空港に時間どおり着くうえで大きな障害です。,物理的な障害物にも、比喩的な障害にも使う。母音で始まるので冠詞は l'。,l'impedimento,成り行きと評価
L5-0320,5,lo svantaggio,不利|デメリット|欠点,noun,m,svantaggi,抽象・社会,"Il vantaggio di questa casa è il prezzo, lo svantaggio è la distanza dal centro.",この家の利点は値段で、欠点は中心部から遠いことです。,反対語は il vantaggio（利点）。s＋子音で始まるので冠詞は lo、複数は gli svantaggi。,,成り行きと評価

L5-0063,5,la crescita,成長|増加,noun,f,crescite,抽象・社会,La crescita economica del paese è stata molto lenta quest'anno.,今年、その国の経済成長はとても緩やかでした。,経済・人・植物など幅広く使う。複数形はあまり使われない。動詞は crescere（過去分詞 cresciuto）。,,成り行きと評価
L5-0033,5,sviluppare,発展させる|開発する|現像する,verb,,"sviluppo, sviluppi, sviluppa, sviluppiamo, sviluppate, sviluppano",抽象・社会,La nostra azienda vuole sviluppare nuovi prodotti per i giovani.,私たちの会社は若者向けの新製品を開発したいと考えています。,再帰形 svilupparsi は「発展する、成長する」。写真の現像にも使う。名詞は sviluppo。,,成り行きと評価

L5-0295,5,l'identità,アイデンティティ|身元|同一性,noun,f,identità（不変）,抽象・社会,Alla frontiera devi mostrare un documento che prova la tua identità.,国境では身元を証明する書類を見せなければなりません。,-à で終わる名詞は複数形も同形。carta d'identità は「身分証明書」。,,成り行きと評価

/* 日付（午前4時で1日が切り替わる） */
const DAY = 864e5, CUT = 4 * 3600e3;
function dayOf(ts){ const d = new Date(ts - CUT); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / DAY); }
function today(){ return dayOf(Date.now()); }
function dayLabel(n){
  const td = today();
  if(n <= td) return n === td ? '今日' : n === td - 1 ? '昨日' : md(n);
  return n === td + 1 ? '明日' : md(n);
}
function md(n){ const d = new Date(n * DAY); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate(); }

/* ------------------------------------------------------------------ */
/* CSV                                                                 */
/* ------------------------------------------------------------------ */
function parseRows(text){
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = (first.includes('\t') && !first.includes(',')) ? '\t' : ',';
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    }else{
      if(c === '"' && f === '') q = true;
      else if(c === delim){ row.push(f); f = ''; }
      else if(c === '\n' || c === '\r'){
        if(c === '\r' && text[i+1] === '\n') i++;
        row.push(f); rows.push(row); row = []; f = '';
      }else f += c;
    }
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function splitMulti(s){ return (s || '').split('|').map(x => x.trim()).filter(Boolean); }
function parseCSV(text){
  const rows = parseRows(text); const errors = []; const out = [];
  if(!rows.length) return {words:[], errors:['空のデータです']};
  const head = rows[0].map(h => h.trim().toLowerCase());
  const col = n => head.indexOf(n);
  if(col('italian') < 0 || col('japanese') < 0){
    return {words:[], errors:['1行目に italian と japanese の列名が必要です（見つかった列: ' + head.join(', ') + '）']};
  }
  const g = (r, n) => { const i = col(n); return i < 0 ? '' : (r[i] || '').trim(); };
  for(let k = 1; k < rows.length; k++){
    const r = rows[k];
    const it = g(r,'italian'), ja = g(r,'japanese');
    if(!it || !ja){ errors.push((k+1) + '行目: italian または japanese が空です'); continue; }
    let lv = parseInt(g(r,'level'), 10); if(!(lv >= 1 && lv <= 5)) lv = 1;
    out.push({
      id: g(r,'id') || ('auto-' + lv + '-' + baseNorm(it)),
      level: lv, it, ja: splitMulti(ja),
      pos: g(r,'pos').toLowerCase(), gender: g(r,'gender').toLowerCase(),
      forms: g(r,'forms'), cat: g(r,'category'),
      exIt: g(r,'example_it'), exJa: g(r,'example_ja'),
      note: g(r,'note'), alt: splitMulti(g(r,'alt_answers')),
      unit: g(r,'unit'), ord: k
    });
  }
  return {words: out, errors};
}

/* ------------------------------------------------------------------ */
/* 文字列の正規化                                                      */
/* ------------------------------------------------------------------ */
function clean(s, keepAccents){
  let t = (s || '').normalize(keepAccents ? 'NFC' : 'NFD');
  if(!keepAccents) t = t.replace(/[\u0300-\u036f]/g, '');
  return t.toLowerCase().replace(/[’‘`´]/g, "'").replace(/\([^)]*\)/g, ' ')
          .replace(/[.!?¡¿,;:"“”«»]/g, ' ').replace(/\s+/g, ' ').replace(/'\s+/g, "'").trim();
}
function baseNorm(s){ return clean(s, false); }
const ART_TOKEN = /^(il|lo|la|i|gli|le|un|uno|una)(\/(il|lo|la|i|gli|le|un|uno|una))*$/;
/* 冠詞と本体に分ける（冠詞は文中のものも対象） */
function splitArt(t){
  const arts = [], body = [];
  for(const tok of t.split(' ').filter(Boolean)){
    if(ART_TOKEN.test(tok)){ arts.push(tok); continue; }
    const m = tok.match(/^(l|un)'(.+)$/);
    if(m){ arts.push(m[1] + "'"); body.push(m[2].replace(/(.)'$/, '$1')); continue; }
    body.push(tok.replace(/(.)'$/, '$1'));
  }
  if(!body.length) return {arts:[], body:t};
  return {arts, body: body.join(' ')};
}
function artOk(a, b){
  if(a.length !== b.length) return false;
  return a.every((x, i) => x === b[i] || b[i].split('/').includes(x));
}
/* ヒント用：先頭の冠詞だけ取り出す */
function leadArticle(t){
  const tok = t.split(' ');
  if(tok.length > 1 && ART_TOKEN.test(tok[0])) return {art: tok[0], core: tok.slice(1).join(' ')};
  const m = t.match(/^(l'|un')(.+)$/);
  return m ? {art: m[1], core: m[2]} : {art:'', core:t};
}
function normMeaning(m){ return (m || '').replace(/（[^）]*）|\([^)]*\)|[〜～~…\s]/g, ''); }
function lev(a, b){
  const d = Array.from({length:a.length+1}, (_, i) => [i]);
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}

/* 単語データ（内蔵は固定、自分で追加した語は別に保存）                */

const BUILTIN = parseCSV(SAMPLE_CSV).words;
const BUILTIN_IDS = new Set(BUILTIN.map(w => w.id));
let userWords = LS.get('itv:userWords', null);
if(!Array.isArray(userWords)){
  /* 旧版の保存形式から、自分で追加した語だけを引き継ぐ */
  const old = LS.get('itv:words', null);
  userWords = Array.isArray(old)
    ? old.filter(w => w && w.id && w.it && Array.isArray(w.ja) && !BUILTIN_IDS.has(w.id) && !MERGED[w.id])
    : [];
  LS.set('itv:userWords', userWords);
}
LS.del('itv:words'); LS.del('itv:dataver');

let words = [], byId = new Map(), synCache = new Map();
function prep(w){
  w.alt = w.alt || []; w.ja = w.ja || [];
  /* 訳語の中の改行は、大きな見出しの改行位置の指定。ほかの表示では詰める */
  if(!w.jaLines) w.jaLines = w.ja.slice();
  w.ja = w.jaLines.map(m => m.replace(/\s*\n\s*/g, ''));
  w.jn = new Set(w.ja.map(normMeaning).filter(Boolean));
  w.body = splitArt(baseNorm(w.it)).body;
  w.search = baseNorm(w.it) + ' ' + w.alt.map(baseNorm).join(' ') + ' ' + w.ja.join(' ').toLowerCase();
}
/* ユニット：同じレベル・同じユニット名の語を収録順にまとめる */
let UNITS = [], unitByKey = new Map();
function rebuild(){
  const map = new Map(BUILTIN.map(w => [w.id, w]));
  userWords.forEach((w, i) => {
    const b = map.get(w.id);
    w.ord = b ? b.ord : 1e6 + i;
    if(b && !w.unit && w.level === b.level) w.unit = b.unit;
    map.set(w.id, w);
  });
  const sorted = [...map.values()].sort((a, b) => a.level - b.level || a.ord - b.ord);
  const m = new Map(); UNITS = [];
  for(const w of sorted){
    prep(w);
    const name = w.unit || w.cat || 'その他';
    const key = w.level + ':' + name;
    let u = m.get(key);
    if(!u){ u = {key, lv:w.level, name, words:[]}; m.set(key, u); UNITS.push(u); }
    u.words.push(w); w.ukey = key;
  }
  const cnt = {};
  UNITS.forEach(u => { u.idx = (cnt[u.lv] = (cnt[u.lv] || 0) + 1); });
  unitByKey = m;
  words = UNITS.flatMap(u => u.words);
  words.forEach((w, i) => { w.seq = i; });
  byId = new Map(words.map(w => [w.id, w]));
  synCache = new Map();
}
function bySeq(list){ return list.slice().sort((a, b) => a.seq - b.seq); }
function saveUserWords(){
  return LS.set('itv:userWords', userWords.map(({jn, body, search, ord, ukey, seq, jaLines, ...r}) => r));
}
rebuild();

let settings = Object.assign({levels:[1], cats:[], units:[], count:20, order:'book', dir:'it2ja', artMode:false, autoSpeak:true, voiceNoteHidden:false}, LS.get('itv:settings', {}));
function saveSettings(){ LS.set('itv:settings', settings); }

/* ------------------------------------------------------------------ */
/* 学習記録                                                            */
/*  s: 復習の段階 0–7 / due: 次に復習する日 / h: 一問一答の直近5回      */
/*  wt: 最後に間違えた時刻 / ot: 最後に4択・一問一答で正解した時刻      */
/* ------------------------------------------------------------------ */
let prog = LS.get('itv:prog', {});
let logd = LS.get('itv:log', {});
function saveProg(){ LS.set('itv:prog', prog); }
function saveLog(){ LS.set('itv:log', logd); }
(function migrate(){
  let changed = false; const td = today();
  for(const id in prog){
    const r = prog[id];
    if(r && r.b !== undefined && r.s === undefined){
      r.s = [0,1,2,2,3,4][Math.min(5, r.b | 0)]; r.due = td;
      r.h = r.b >= 5 ? [1,1,1,1] : r.b >= 4 ? [1,1,1] : [];
      delete r.b; changed = true;
    }
  }
  for(const [from, to] of Object.entries(MERGED)){
    const a = prog[from]; if(!a) continue;
    const b = prog[to];
    prog[to] = !b ? a : {
      c:(a.c||0)+(b.c||0), w:(a.w||0)+(b.w||0), t:Math.max(a.t||0, b.t||0),
      s:Math.max(a.s||0, b.s||0), due:Math.min(a.due ?? td, b.due ?? td),
      h:[...(a.h||[]), ...(b.h||[])].slice(-5), wt:Math.max(a.wt||0, b.wt||0), ot:Math.max(a.ot||0, b.ot||0)
    };
    delete prog[from]; changed = true;
  }
  const old = td - 400;
  for(const k in logd) if(Number(k) < old){ delete logd[k]; changed = true; }
  if(changed){ saveProg(); saveLog(); }
})();

function rec(id){ return prog[id] || (prog[id] = {c:0, w:0, t:0, s:0, due:null, h:[]}); }
function grade(id, kind, ok, opt){
  const r = rec(id); const now = Date.now(); const td = today();
  const isDue = r.due == null || r.due <= td;
  r.t = now; if(ok) r.c++; else r.w++;
  if(kind === 'type') r.h = [...(r.h || []), ok ? 1 : 0].slice(-5);
  const s = r.s || 0;
  if(ok){
    if(kind !== 'flash') r.ot = now;
    if(isDue){
      const cap = kind === 'type' ? 7 : kind === 'choice' ? 3 : 2;
      r.s = s < cap ? s + 1 : s;
      r.due = td + INTERVALS[r.s];
    }
  }else{
    r.wt = now;
    r.s = kind === 'flash' ? Math.max(0, s - 1) : Math.floor(s / 2);
    r.due = td + 1;
  }
  saveProg();
  if(!(opt && opt.nolog)){
    const e = logd[td] || (logd[td] = {n:0, ok:0}); e.n++; if(ok) e.ok++; saveLog();
  }
}
/* 定着：テストの直近4回のうち3回以上正解（正答率75%以上） */
function mastered(r){ return !!(r && r.h && r.h.slice(-4).reduce((a, b) => a + b, 0) >= 3); }
function status(id){ const r = prog[id]; if(!r) return 'u'; return mastered(r) ? 'm' : 'l'; }
function wrongToday(r){ return !!(r && r.wt && dayOf(r.wt) === today() && !(r.ot > r.wt)); }
function isDue(r){ return !!(r && r.due != null && r.due <= today()); }
function dueWords(){
  return words.filter(w => isDue(prog[w.id]))
    .sort((a, b) => (prog[a.id].due - prog[b.id].due) || ((prog[a.id].s||0) - (prog[b.id].s||0)));
}
function wrongWords(){ return words.filter(w => wrongToday(prog[w.id])); }
function streak(){
  let d = today(); if(!(logd[d] && logd[d].n)) d--;
  let n = 0; while(logd[d] && logd[d].n){ n++; d--; }
  return n;
}

/* ------------------------------------------------------------------ */
/* 判定                                                                */
/* ------------------------------------------------------------------ */
const POSG = p => (p === 'phrase' || p === 'interj') ? 'expr' : p;
/* 類義語：品詞が同じで、互いの第一義を含む語（または意味を2つ以上共有する語） */
function synonyms(w){
  if(synCache.has(w.id)) return synCache.get(w.id);
  if(['prep','pron','art','num'].includes(w.pos)){ synCache.set(w.id, []); return []; }
  const f = normMeaning(w.ja[0]);
  const shared = x => { let n = 0; for(const m of x.jn) if(w.jn.has(m)) n++; return n; };
  const out = words.filter(x => x.id !== w.id && x.body !== w.body && POSG(x.pos) === POSG(w.pos) && x.ja.length &&
    ((f && x.jn.has(f) && w.jn.has(normMeaning(x.ja[0]))) || shared(x) >= 2));
  synCache.set(w.id, out); return out;
}
function judge(input, w){
  const inN = baseNorm(input); if(!inN) return {result:'empty'};
  const I = splitArt(inN), IA = splitArt(clean(input, true));
  const strict = settings.artMode;
  let artMiss = null;
  for(const c of [w.it, ...w.alt]){
    const C = splitArt(baseNorm(c));
    if(I.body !== C.body) continue;
    const same = artOk(I.arts, C.arts);
    if(strict && !same){ artMiss = artMiss || c; continue; }
    const parts = [];
    if(IA.body !== splitArt(clean(c, true)).body) parts.push('アクセント記号');
    if(!same) parts.push('冠詞');
    return {result:'ok', notes: parts.length ? [parts.join('と') + 'まで書くと ' + c] : [], matched:c};
  }
  if(artMiss) return {result:'art', correct:artMiss};
  for(const x of synonyms(w)){
    for(const c of [x.it, ...x.alt]){
      const C = splitArt(baseNorm(c));
      if(I.body === C.body && (!strict || artOk(I.arts, C.arts))) return {result:'syn', other:x};
    }
  }
  let best = 99;
  for(const c of [w.it, ...w.alt]) best = Math.min(best, lev(I.body, splitArt(baseNorm(c)).body));
  const len = w.body.length;
  if((best === 1 && len >= 4) || (best === 2 && len >= 8)) return {result:'close'};
  return {result:'ng'};
}

/* 音声                                                                */
/* ------------------------------------------------------------------ */
let itVoice = null, voicesReady = false, itVoices = [];
/* 声の品質：Apple は voiceURI や名前に premium / enhanced が入る */
function voiceQuality(v){
  const s = (v.voiceURI + ' ' + v.name).toLowerCase();
  if(/premium|プレミアム/.test(s)) return 3;
  if(/enhanced|拡張|natural|neural|online/.test(s)) return 2;
  return 1;
}
const QLABEL = {3:'プレミアム', 2:'拡張', 1:'標準'};
/* 声の名前から括弧書き（「（イタリア語（イタリア））」「(Enhanced)」など、入れ子も含む）を取り除く */
function voiceName(v){
  let n = v.name, prev;
  do{ prev = n; n = n.replace(/\s*[（(][^（）()]*[）)]/g, ''); }while(n !== prev);
  return n.trim() || v.name;
}
function loadVoices(){
  try{
    const vs = speechSynthesis.getVoices(); if(vs.length) voicesReady = true;
    const seen = new Set();
    itVoices = vs.filter(v => /^it/i.test(v.lang) && !seen.has(v.voiceURI) && seen.add(v.voiceURI))
      .sort((a, b) => voiceQuality(b) - voiceQuality(a) || a.name.localeCompare(b.name));
    /* 選んだ声がなければ、いちばん高音質な声を自動で使う */
    itVoice = (settings.voiceURI && itVoices.find(v => v.voiceURI === settings.voiceURI)) || itVoices[0] || null;
  }catch(e){}
  updateVoiceNotes();
}
/* iPhone の Safari は voiceschanged が来ないことがあるので、少し待って読み直す */
if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; setTimeout(loadVoices, 600); setTimeout(() => { voicesReady = true; loadVoices(); }, 2500); }
function voiceState(){ if(!('speechSynthesis' in window)) return 'none'; if(itVoice) return 'ok'; return voicesReady ? 'noit' : 'wait'; }
const VOICE_HELP = '端末の設定（読み上げ・音声の項目）でイタリア語の音声を追加すると、自然な発音になります。';
function voiceNoteHtml(where){
  const st = voiceState();
  if(where === 'home'){
    if(settings.voiceNoteHidden || (st !== 'noit' && st !== 'none')) return '';
    return `<div class="notice row" style="flex-wrap:nowrap;align-items:flex-start"><span style="flex:1">${st === 'none'
      ? 'このブラウザは読み上げに対応していないため、発音は再生されません。'
      : 'この端末にはイタリア語の読み上げ音声がありません。別の言語の音声で読むため、発音が不自然になります。' + VOICE_HELP}</span>
      <button class="btn ghost small" data-hide-voice>閉じる</button></div>`;
  }
  if(st === 'ok') return `<p class="small">イタリア語の音声（${esc(voiceName(itVoice))}）で読み上げます。</p>`;
  if(st === 'wait') return `<p class="small muted">音声を確認しています…</p>`;
  if(st === 'none') return `<div class="notice">このブラウザは読み上げに対応していないため、発音は再生されません。</div>`;
  return `<div class="notice">この端末にはイタリア語の読み上げ音声がありません。別の言語の音声で読むため、発音が不自然になります。${VOICE_HELP}</div>`;
}
function voicePickHtml(){
  if(!itVoices.length) return '';
  const cur = settings.voiceURI && itVoices.some(v => v.voiceURI === settings.voiceURI) ? settings.voiceURI : '';
  const row = (val, name, q) => `<label class="vopt"><input type="radio" name="voicePick" value="${esc(val)}" ${val === cur ? 'checked' : ''}><span class="vname" lang="it">${name}</span>${q ? `<span class="badge">${q}</span>` : ''}</label>`;
  return `<div class="vlist">
    ${row('', `自動 <span class="muted small">（いちばん高音質な声：${esc(voiceName(itVoices[0]))}）</span>`, '')}
    ${itVoices.map(v => row(v.voiceURI, esc(voiceName(v)), QLABEL[voiceQuality(v)])).join('')}
  </div>`;
}
function updateVoiceNotes(){
  document.querySelectorAll('[data-voice-note]').forEach(el => {
    if(el.dataset.voiceNote === 'pick'){
      el.innerHTML = voicePickHtml();
      el.querySelectorAll('input[name=voicePick]').forEach(r => r.onchange = () => {
        settings.voiceURI = r.value; saveSettings();
        itVoice = (r.value && itVoices.find(v => v.voiceURI === r.value)) || itVoices[0] || null;
        speak('Buongiorno, un caffè per favore.');
        const note = document.querySelector('[data-voice-note="settings"]'); if(note) note.innerHTML = voiceNoteHtml('settings');
      });
      return;
    }
    el.innerHTML = voiceNoteHtml(el.dataset.voiceNote);
    const b = el.querySelector('[data-hide-voice]');
    if(b) b.onclick = () => { settings.voiceNoteHidden = true; saveSettings(); el.innerHTML = ''; };
  });
}
function speak(t){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/\([^)]*\)/g, ''));
    u.lang = 'it-IT'; if(itVoice) u.voice = itVoice; u.rate = .9;
    speechSynthesis.speak(u);
  }catch(e){}
}
function autoSpeak(t){ if(settings.autoSpeak) speak(t); }
const SPK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
function spkBtn(text){ return `<button class="speak" data-say="${esc(text)}" aria-label="発音を聞く">${SPK}</button>`; }

/* ------------------------------------------------------------------ */
/* 小物                                                                */
/* ------------------------------------------------------------------ */
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function jaText(w, n){ return w.ja.slice(0, n || w.ja.length).join('、'); }
const PAREN_RE = /（[^）]*）|\([^)]*\)/g;
/* 日本語訳の大きな表示。訳語ごとに改行しないかたまりにして、括弧書きは小さく下の行に置く */
function jaBig(w){
  const n = w.jaLines.length;
  return `<div class="ja-big jfit">${w.jaLines.map((m, k) => {
    const t = m.trim();
    const pars = t.match(PAREN_RE) || [];
    let main = t.replace(PAREN_RE, '').trim();
    let note = pars.join('');
    if(!main){ main = note; note = ''; }
    const sep = k < n - 1 ? '、' : '';
    const noteHtml = note ? `<span class="jn">${esc(note)}</span>` : '';
    const lines = main.split(/\s*\n\s*/).filter(Boolean);
    return `<span class="jc">${lines.map((l, i) => `<span class="jm">${esc(l)}${i === lines.length - 1 ? sep : ''}</span>`).join('')}${noteHtml}</span>`;
  }).join('')}</div>`;
}
/* はみ出す訳語だけ、その訳語の文字を縮めて1行に収める */
function fitJa(root){
  (root || document).querySelectorAll('.jfit').forEach(box => {
    const cw = box.clientWidth; if(!cw) return;
    box.querySelectorAll('.jc').forEach(c => {
      c.style.fontSize = '';
      const w = c.scrollWidth;
      if(w > cw) c.style.fontSize = Math.floor(cw / w * 1000) / 10 + '%';
    });
  });
}
window.addEventListener('resize', () => fitJa(main));
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitJa(main));
function fmt(n){ return Number(n).toLocaleString('ja-JP'); }
function badges(w){
  const b = [];
  if(w.pos) b.push(`<span class="badge">${esc(POS[w.pos] || w.pos)}</span>`);
  if(w.gender) b.push(`<span class="badge ${w.gender === 'm' ? 'm' : w.gender === 'f' ? 'f' : ''}">${esc(GENDER[w.gender] || w.gender)}</span>`);
  return `<div class="badges">${b.join('')}</div>`;
}
function details(w){
  const rows = [];
  if(w.forms) rows.push(['変化', esc(w.forms)]);
  if(w.exIt) rows.push(['例文', `<div class="row" style="gap:10px;flex-wrap:nowrap;align-items:flex-start"><div><div class="ex-it" lang="it">${esc(w.exIt)}</div><div class="muted small">${esc(w.exJa)}</div></div>${spkBtn(w.exIt)}</div>`]);
  if(w.note) rows.push(['ニュアンス', esc(w.note)]);
  if(w.alt.length) rows.push(['別解', esc(w.alt.join(' / '))]);
  const u = unitByKey.get(w.ukey);
  rows.push(['分類', `Lv.${w.level}${u ? '　' + String(u.idx).padStart(2, '0') + ' ' + esc(u.name) : ''}${w.cat ? '　<span class="muted">' + esc(w.cat) + '</span>' : ''}`]);
  return rows.map(([k, v]) => `<dl class="field"><dt>${k}</dt><dd>${v}</dd></dl>`).join('');
}
function recLine(w){
  const r = prog[w.id];
  if(!r) return '<span class="muted">まだ学習していません</span>';
  const h = (r.h || []);
  const dots = h.length ? `<span class="hist" aria-label="テストの直近${h.length}回">${h.map(x => `<i class="${x ? 'o' : 'x'}"></i>`).join('')}</span>` : '<span class="muted">テストはまだ</span>';
  const next = r.due != null ? `次の復習 ${dayLabel(Math.max(r.due, today()))}` : '';
  return `正解 ${r.c}・誤答 ${r.w}　${dots}　<span class="muted">${next}</span>`;
}

function pool(){
  return words.filter(w => settings.levels.includes(w.level) && (!settings.cats.length || settings.cats.includes(w.cat))
    && (!settings.units.length || settings.units.includes(w.ukey)));
}
function limit(arr){ const n = settings.count === 'all' ? arr.length : Number(settings.count); return arr.slice(0, n); }
function pick(list){
  if(settings.order === 'book'){
    /* 収録順：まだ学習していない語から順に。全部学習済みなら定着していない語、それもなければ全体 */
    const ordered = bySeq(list);
    const fresh = ordered.filter(w => !prog[w.id]);
    const notM = ordered.filter(w => status(w.id) !== 'm');
    return limit(fresh.length ? fresh : notM.length ? notM : ordered);
  }
  let arr = shuffle(list);
  if(settings.order === 'weak'){
    const score = w => { const r = prog[w.id]; if(!r) return 1.5; return (r.s || 0) + (mastered(r) ? 3 : 0) - (r.w > r.c ? 1 : 0); };
    arr.sort((a, b) => (score(a) - score(b)) || ((prog[a.id]?.t || 0) - (prog[b.id]?.t || 0)));
  }else if(settings.order === 'new'){
    arr.sort((a, b) => (prog[a.id] ? 1 : 0) - (prog[b.id] ? 1 : 0));
  }
  return shuffle(limit(arr));
}

let S = null; // 現在のセッション
const openLv = new Set(); // ホームで開いているユニットの段

function unitProgress(u){
  let m = 0, l = 0;
  for(const w of u.words){ const s = status(w.id); if(s === 'm') m++; else if(s === 'l') l++; }
  return {m, l, t: u.words.length};
}
function unitDone(u){ const p = unitProgress(u); return p.m === p.t; }
function pad2(n){ return String(n).padStart(2, '0'); }
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function goBack(from){
  window.scrollTo(0, 0);
  if(from === 'random') return renderRandom();
  if(from === 'level') return renderLevel(curLevel);
  return renderHome();
}
/* ユニットの1行。タップで学習方法を選ぶシートが下から出る */
function unitRow(u, scope){
  const p = unitProgress(u);
  return `<div class="urow">
    <button class="uline" data-unit="${esc(u.key)}" aria-haspopup="dialog">
      <span class="un">${pad2(u.idx)}</span>
      <span class="uname">${esc(u.name)}</span>
      <span class="ucount">${p.m === p.t ? '<span class="udone">完了</span>' : `${p.m}/${p.t}`}</span>
      <span class="meter"><i class="m" style="width:${p.m/p.t*100}%"></i><i class="l" style="width:${p.l/p.t*100}%"></i></span>
    </button>
  </div>`;
}
function bindUnitRows(){
  main.querySelectorAll('[data-unit]').forEach(b => b.onclick = () => { const u = unitByKey.get(b.dataset.unit); if(u) openUnitSheet(u, b); });
}
let sheetReturn = null;
/* 画面中央に出すダイアログ（ユニットの学習方法・確認） */
function closeUnitSheet(){
  const bd = document.getElementById('ubackdrop'); if(!bd) return;
  bd.classList.remove('show');
  document.removeEventListener('keydown', sheetKey, true);
  setTimeout(() => bd.remove(), 200);
  if(sheetReturn && document.body.contains(sheetReturn)) sheetReturn.focus();
  sheetReturn = null;
}
function sheetKey(e){ if(e.key === 'Escape'){ e.stopPropagation(); closeUnitSheet(); } }
function openDialog(html, from, role){
  closeUnitSheet();
  const bd = document.createElement('div');
  bd.id = 'ubackdrop'; bd.className = 'ubackdrop';
  bd.innerHTML = `<div class="usheet" role="${role || 'dialog'}" aria-modal="true" aria-labelledby="usheetTitle">${html}</div>`;
  document.body.appendChild(bd);
  sheetReturn = from || null;
  bd.onclick = e => { if(e.target === bd) closeUnitSheet(); };
  bd.querySelectorAll('[data-sheet-close]').forEach(x => x.onclick = closeUnitSheet);
  document.addEventListener('keydown', sheetKey, true);
  requestAnimationFrame(() => bd.classList.add('show'));
  return bd;
}
function openUnitSheet(u, from){
  const p = unitProgress(u);
  const bd = openDialog(`
    <div class="usheet-head">
      <span class="un">${pad2(u.idx)}</span>
      <b id="usheetTitle">${esc(u.name)}</b>
      <button class="btn ghost small" data-sheet-close>閉じる</button>
    </div>
    <div class="usheet-prog"><span class="muted small">Lv.${u.lv}　${p.m} / ${p.t}語が定着</span>
      <span class="meter"><i class="m" style="width:${p.m/p.t*100}%"></i><i class="l" style="width:${p.l/p.t*100}%"></i></span></div>
    <div class="ustart">
      <button class="btn" data-ustart="flash">フラッシュ<wbr>カード</button>
      <button class="btn" data-ustart="choice">4択</button>
      <button class="btn ink" data-ustart="type">テスト</button>
    </div>`, from);
  bd.querySelectorAll('[data-ustart]').forEach(b => b.onclick = () => { const m = b.dataset.ustart; sheetReturn = null; closeUnitSheet(); startUnit(m, u); });
  requestAnimationFrame(() => bd.querySelector('[data-ustart="flash"]').focus({preventScroll:true}));
}
/* テストで空欄のまま答えたとき */
function confirmGiveUp(){
  const inp = document.getElementById('ans');
  const bd = openDialog(`
    <b id="usheetTitle" class="dlg-title">答えを表示しますか？</b>
    <p class="muted small" style="margin:0">何も入力されていません。答えを見ると、この問題は不正解として記録されます。</p>
    <div class="dlg-actions">
      <button class="btn" data-sheet-close>入力に戻る</button>

    </div>`, inp, 'alertdialog');
  bd.querySelector('[data-giveup]').onclick = () => { sheetReturn = null; closeUnitSheet(); if(S && S.mode === 'type' && !S.answered) submitType(true); };
  requestAnimationFrame(() => bd.querySelector('[data-giveup]').focus({preventScroll:true}));
}
function startUnit(mode, u){ start(mode, settings.unitShuffle ? shuffle(u.words) : u.words.slice(), {unit: u.key}); }
function nextUnit(u){
  return UNITS.filter(x => x.lv === u.lv && x.idx > u.idx).find(x => !(settings.skipDone && unitDone(x))) || null;
}

function renderHome(){
  S = null; view = 'home'; setNav('home');
  const td = today();
  const due = dueWords(), wrong = wrongWords();
  const tl = logd[td] || {n:0, ok:0};
  const mCount = words.filter(w => status(w.id) === 'm').length;
  let nextDue = null;
  if(!due.length){ for(const w of words){ const r = prog[w.id]; if(r && r.due != null && r.due > td && (nextDue === null || r.due < nextDue)) nextDue = r.due; } }
  const nextCount = nextDue !== null ? words.filter(w => prog[w.id]?.due === nextDue).length : 0;

  /* レベルの進捗はユニット数：全語定着＝完了、1語でも学習済み＝学習中 */
  const lvHtml = LEVELS.map(L => {
    const us = UNITS.filter(u => u.lv === L.n);
    let m = 0, l = 0;
    for(const u of us){ const p = unitProgress(u); if(p.m === p.t) m++; else if(p.m || p.l) l++; }
    const tot = us.length || 1;
    return `<button class="lv" data-lv="${L.n}">
      <span class="num">${L.n}</span>
      <span class="name">${L.name}<span class="tag">${L.tag}</span></span>
      <span class="count">${m} / ${us.length}ユニット</span>
      <span class="desc">${L.desc}</span>
      <span class="meter"><i class="m" style="width:${m/tot*100}%"></i><i class="l" style="width:${l/tot*100}%"></i></span>
    </button>`;
  }).join('');

  main.innerHTML = `
    ${!storageOK ? `<div class="notice">このブラウザでは学習記録を保存できません。ページを閉じると記録が消えます。</div>` : ''}
    <div data-voice-note="home"></div>
    <div class="stats">
      <div class="stat"><b>${tl.n}</b><span>今日解いた数</span></div>
      <div class="stat"><b>${streak()}</b><span>連続日数</span></div>
      <div class="stat"><b>${fmt(mCount)}</b><span>定着した語</span></div>
    </div>

    <h2>今日の復習</h2>
    <div class="review">
      <div class="rv">
        <div class="rv-head"><b>${due.length}</b><span>${due.length ? '語が復習の時期です' : nextDue !== null ? `次の復習は${dayLabel(nextDue)}（${nextCount}語）` : '学習した語が、間隔をあけてここに出てきます'}</span></div>
        ${due.length ? `<div class="row">
          <button class="btn ink" data-review="type">テストで復習</button>
          <button class="btn" data-review="choice">4択で復習</button>
        </div>` : ''}
      </div>
      ${wrong.length ? `<div class="rv">
        <div class="rv-head"><b class="red">${wrong.length}</b><span>語を今日まちがえました</span></div>
        <div class="row">
          <button class="btn" data-wrong="flash">カードで見直す</button>
          <button class="btn" data-wrong="type">テストでやり直す</button>
        </div>
      </div>` : ''}
    </div>

    <h2>レベル</h2>
    <div class="levels">${lvHtml}</div>
    <div class="legend"><span>完了</span><span class="l">学習中</span><span class="u">未学習</span></div>
    <p class="muted small" style="margin-top:6px">すべての語が定着したユニットを「完了」と数えます。定着は、テストの直近4回のうち3回以上正解した語です。</p>

    <h2>ランダム出題</h2>
    <button class="mode" id="goRandom" style="width:100%"><b>ユニットを選んでランダムに出題</b><span>レベルをまたいで、選んだユニットの語をまぜて出題します</span></button>
  `;
  updateVoiceNotes();
  main.querySelectorAll('[data-lv]').forEach(b => b.onclick = () => { openUnit = null; window.scrollTo(0, 0); renderLevel(Number(b.dataset.lv)); });
  document.getElementById('goRandom').onclick = () => { window.scrollTo(0, 0); renderRandom(); };
  main.querySelectorAll('[data-review]').forEach(b => b.onclick = () => start(b.dataset.review, bySeq(limit(dueWords()))));
  main.querySelectorAll('[data-wrong]').forEach(b => b.onclick = () => start(b.dataset.wrong, bySeq(wrongWords())));
}

function renderLevel(n){
  S = null; view = 'level'; curLevel = n; setNav('home');
  if(settings.levels[0] !== n){ settings.levels = [n]; saveSettings(); }
  const L = LEVELS.find(x => x.n === n);
  const us = UNITS.filter(u => u.lv === n);
  const ws = words.filter(w => w.level === n);
  let m = 0, l = 0;
  for(const u of us){ const p = unitProgress(u); if(p.m === p.t) m++; else if(p.m || p.l) l++; }
  const tot = us.length || 1;
  const rec = us.filter(u => !unitDone(u)).slice(0, 3);
  const testN = settings.count === 'all' ? ws.length : Math.min(Number(settings.count), ws.length);
  main.innerHTML = `
    <button class="btn ghost small" id="backLevels">レベル選択に戻る</button>
    <div class="lvhead">
      <span class="num">${n}</span>
      <div class="lvinfo"><b>${L.name}</b><span class="tag">${L.tag}</span>
        <div class="muted small">${m} / ${us.length}ユニット完了　${fmt(ws.length)}語</div>
        <span class="meter"><i class="m" style="width:${m/tot*100}%"></i><i class="l" style="width:${l/tot*100}%"></i></span>
      </div>
    </div>
    <button class="mode primary" id="lvTest" style="width:100%" ${ws.length ? '' : 'disabled'}><b>レベル全体からランダムにテスト</b><span>このレベルの語から${testN}語を出題</span></button>

    <h2>おすすめ</h2>
    ${rec.length ? `<div class="ulines">${rec.map(u => unitRow(u, 'rec')).join('')}</div>` : '<p class="muted">このレベルのユニットは、すべて完了しています。</p>'}

    <h2>ユニット一覧 <span class="muted small" style="font-weight:400">${us.length}ユニット</span></h2>
    <div class="ulines">${us.map(u => unitRow(u, 'all')).join('')}</div>
  `;
  document.getElementById('backLevels').onclick = () => { window.scrollTo(0, 0); renderHome(); };
  document.getElementById('lvTest').onclick = () => start('type', limit(shuffle(ws)));
  bindUnitRows();
}

function renderRandom(){
  S = null; view = 'random'; setNav('home');
  if(!settings.rDefault2){ settings.rUnits = []; settings.rLevels = []; settings.rDefault2 = true; saveSettings(); }
  if(!Array.isArray(settings.rUnits)) settings.rUnits = [];
  if(!Array.isArray(settings.rLevels)) settings.rLevels = [];
  settings.rUnits = settings.rUnits.filter(k => unitByKey.has(k));
  const sel = new Set(settings.rUnits);
  /* レベルを外しても、そのレベルのユニット選択は覚えておく（出題対象は表示中のレベルだけ） */
  const target = words.filter(w => sel.has(w.ukey) && settings.rLevels.includes(w.level));
  if(!rOpen.size && settings.rLevels.length === 1) rOpen.add(settings.rLevels[0]);
  const lvChips = LEVELS.map(L => `<button class="chip" data-rlv="${L.n}" aria-pressed="${settings.rLevels.includes(L.n)}">Lv.${L.n} ${L.name}</button>`).join('');
  const groups = LEVELS.filter(L => settings.rLevels.includes(L.n)).map(L => {
    const us = UNITS.filter(u => u.lv === L.n);
    if(!us.length) return '';
    const k = us.filter(u => sel.has(u.key)).length;
    return `<details class="ugroup" data-ulv="${L.n}" ${rOpen.has(L.n) ? 'open' : ''}>
      <summary>Lv.${L.n} ${L.name}<span class="muted small" style="font-weight:400">${k} / ${us.length}ユニット</span></summary>
      <div class="row" style="gap:6px;margin:2px 0 8px">
        <button class="btn small" data-lvall="${L.n}">すべて選ぶ</button>
        <button class="btn ghost small" data-lvnone="${L.n}">すべて外す</button>
      </div>
      <div class="ulines">${us.map(u => {
        const p = unitProgress(u);
        return `<label class="uline ucheck">
          <input type="checkbox" data-ru="${esc(u.key)}" ${sel.has(u.key) ? 'checked' : ''}>
          <span class="un">${String(u.idx).padStart(2, '0')}</span>
          <span class="uname">${esc(u.name)}</span>
          <span class="ucount">${p.m}/${p.t}</span>
          <span class="meter"><i class="m" style="width:${p.m/p.t*100}%"></i><i class="l" style="width:${p.l/p.t*100}%"></i></span>
        </label>`;
      }).join('')}</div>
    </details>`;
  }).join('');
  main.innerHTML = `
    <button class="btn ghost small" id="backHome">学習へ戻る</button>
    <h2>ランダム出題</h2>
    <p class="muted small">レベルは複数選べます。</p>
    <div class="chips" style="margin-bottom:14px">${lvChips}</div>
    <div class="opts">
      <label>1回の語数
        <select id="optCount">${[10,20,30,50,'all'].map(n => `<option value="${n}" ${String(settings.count) === String(n) ? 'selected' : ''}>${n === 'all' ? 'すべて' : n + '語'}</option>`).join('')}</select>
      </label>
      <label>カードと4択の向き
        <select id="optDir">
          <option value="it2ja" ${settings.dir === 'it2ja' ? 'selected' : ''}>イタリア語 → 日本語</option>
          <option value="ja2it" ${settings.dir === 'ja2it' ? 'selected' : ''}>日本語 → イタリア語</option>
        </select>
      </label>
    </div>
    <h2>ユニットを選択する</h2>
    ${groups || '<p class="muted">上でレベルを選ぶと、そのレベルのユニットが表示されます。</p>'}
    <div class="startbar">
      <span class="small">対象 <b>${fmt(target.length)}</b>語</span>
      <div class="row" style="gap:6px">
        <button class="btn ink" data-rstart="flash" ${target.length ? '' : 'disabled'}>カード</button>
        <button class="btn" data-rstart="choice" ${target.length ? '' : 'disabled'}>4択</button>
        <button class="btn" data-rstart="type" ${target.length ? '' : 'disabled'}>テスト</button>
      </div>
    </div>
  `;
  const setUnits = keys => { settings.rUnits = keys; saveSettings(); keepScroll(renderRandom); };
  document.getElementById('backHome').onclick = () => { window.scrollTo(0, 0); renderHome(); };
  document.getElementById('optCount').onchange = e => { settings.count = e.target.value === 'all' ? 'all' : Number(e.target.value); saveSettings(); };
  document.getElementById('optDir').onchange = e => { settings.dir = e.target.value; saveSettings(); };
  main.querySelectorAll('.ugroup').forEach(d => d.ontoggle = () => { const n = Number(d.dataset.ulv); if(d.open) rOpen.add(n); else rOpen.delete(n); });
  main.querySelectorAll('[data-ru]').forEach(c => c.onchange = () => {
    const k = c.dataset.ru;
    setUnits(c.checked ? [...settings.rUnits.filter(x => x !== k), k] : settings.rUnits.filter(x => x !== k));
  });
  main.querySelectorAll('[data-rlv]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.rlv);
    if(settings.rLevels.includes(n)){ settings.rLevels = settings.rLevels.filter(x => x !== n); rOpen.delete(n); }
    else{ settings.rLevels = [...settings.rLevels, n].sort(); rOpen.add(n); }
    saveSettings(); keepScroll(renderRandom);
  });
  main.querySelectorAll('[data-lvall]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.lvall);
    setUnits([...new Set([...settings.rUnits, ...UNITS.filter(u => u.lv === n).map(u => u.key)])]);
  });
  main.querySelectorAll('[data-lvnone]').forEach(b => b.onclick = () => {
    const n = Number(b.dataset.lvnone);
    setUnits(settings.rUnits.filter(k => unitByKey.get(k)?.lv !== n));
  });
  main.querySelectorAll('[data-rstart]').forEach(b => b.onclick = () => start(b.dataset.rstart, limit(shuffle(target))));
}

function start(mode, list, extra){
  if(!list.length) return;
  S = {mode, list, i:0, results:[], answered:false, flipped:false,
       from: ['random', 'level'].includes(view) ? view : 'home', unit: extra && extra.unit};
  view = 'session';
  window.scrollTo(0, 0);
  renderSession();
}
function sessHead(){
  const n = S.list.length;
  return `<div class="sesshead">
    <button class="btn ghost" id="quit">終了</button>
    <div class="progress"><i style="width:${S.i / n * 100}%"></i></div>
    <span class="counter">${Math.min(S.i + 1, n)} / ${n}</span>
  </div>`;
}
function bindQuit(){ const q = document.getElementById('quit'); if(q) q.onclick = () => renderResult(true); }
function renderSession(){
  setNav('');
  if(S.i >= S.list.length) return renderResult();
  if(S.mode === 'flash') renderFlash();
  if(S.mode === 'choice') renderChoice();
  if(S.mode === 'type') renderType();
  bindQuit();
}
function next(){
  S.i++; S.answered = false; S.flipped = false;
  S.hint = ''; S.usedHint = false; S.retry = false; S.snap = undefined; S.opts = null;
  renderSession();
}

/* フラッシュカード */

function flip(){ if(S.flipped) return; S.flipped = true; renderFlash(); bindQuit(); }
function flashJudge(ok){ const w = S.list[S.i]; grade(w.id, 'flash', ok); S.results.push({w, ok}); next(); }

/* 4択 */
function overlap(a, b){ for(const m of a.jn) if(b.jn.has(m)) return true; return false; }
function distractors(w, field){
  const key = x => field === 'ja' ? jaText(x, 2) : baseNorm(x.it);
  const mine = key(w);
  const others = words.filter(x => x.id !== w.id && x.body !== w.body && key(x) !== mine && !overlap(w, x));
  const near = x => Math.abs(x.level - w.level) <= 1;
  const tiers = [
    others.filter(x => x.ukey === w.ukey && x.pos === w.pos),
    others.filter(x => x.ukey === w.ukey),
    others.filter(x => x.level === w.level && x.pos === w.pos),
    others.filter(x => x.level === w.level),
    others.filter(x => near(x) && x.pos === w.pos),
    others.filter(near),
    others,
  ];
  const out = []; const seen = new Set([mine]);
  for(const t of tiers){
    for(const x of shuffle(t)){
      const k = key(x); if(seen.has(k)) continue;
      seen.add(k); out.push(x); if(out.length === 3) return out;
    }
  }
  return out;
}
function renderChoice(){
  const w = S.list[S.i]; const it2ja = settings.dir === 'it2ja';
  if(!S.opts) S.opts = shuffle([w, ...distractors(w, it2ja ? 'ja' : 'it')]);
  const q = it2ja
    ? `<div class="row" style="justify-content:center;gap:10px"><div class="it" lang="it">${esc(w.it)}</div>${spkBtn(w.it)}</div>${badges(w)}`
    : `${jaBig(w)}${badges(w)}`;
  main.innerHTML = sessHead() + `
    <div class="sheet"><div class="question">${q}</div></div>
    <div class="choices">${S.opts.map((o, k) => {
      let cls = 'choice' + (it2ja ? '' : ' it-opt');
      if(S.answered){ if(o.id === w.id) cls += ' ok'; else if(o.id === S.chosen) cls += ' ng'; }
      return `<button class="${cls}" data-k="${k}" ${S.answered ? 'disabled' : ''} ${it2ja ? '' : 'lang="it"'}><span class="k">${k + 1}</span><span>${esc(it2ja ? jaText(o, 2) : o.it)}</span></button>`;
    }).join('')}</div>
    ${S.answered ? `<div class="sheet feedback" style="margin-top:14px">
      <div class="correct-it"><span class="it" lang="it">${esc(w.it)}</span>${spkBtn(w.it)}<span class="meaning">${esc(jaText(w))}</span></div>
      ${details(w)}
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ink" id="nextQ">次へ<kbd style="color:inherit;border-color:currentColor">Enter</kbd></button></div>` : ''}
  `;
  main.querySelectorAll('[data-k]').forEach(b => b.onclick = () => choose(Number(b.dataset.k)));
  if(S.answered) document.getElementById('nextQ').onclick = next;
  fitJa(main);
}
function choose(k){
  if(S.answered) return;
  const w = S.list[S.i]; const o = S.opts[k]; if(!o) return;
  const ok = o.id === w.id;
  S.answered = true; S.chosen = o.id;
  grade(w.id, 'choice', ok); S.results.push({w, ok});
  renderChoice(); bindQuit();
  autoSpeak(w.it);
}

/* 一問一答 */
const ACCENTS = ['à','è','é','ì','ò','ù',"'"];
function renderType(){
  const w = S.list[S.i];
  main.innerHTML = sessHead() + `
    <div class="sheet">
      <div class="question">${jaBig(w)}${badges(w)}
        <div class="hint" id="hintTxt" lang="it">${S.hint ? esc(S.hint) : ''}</div>
      </div>
      <div class="answer-box">
        <input type="text" id="ans" lang="it" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="イタリア語で入力" aria-label="答え">
        <button class="btn ink" id="check">答える</button>
      </div>
      <div class="accents" id="accents">${ACCENTS.map(a => `<button type="button" data-acc="${esc(a)}" aria-label="${a === "'" ? 'アポストロフィ' : a} を入力">${a === "'" ? '’' : a}</button>`).join('')}<button type="button" class="hintbtn" id="hintBtn">ヒント</button></div>
      <div id="fb"></div>
    </div>
  `;
  const inp = document.getElementById('ans');
  inp.focus();
  inp.onkeydown = e => { if(e.key === 'Enter' && !e.isComposing){ e.preventDefault(); e.stopPropagation(); if(S.answered) next(); else submitType(); } };
  document.getElementById('check').onclick = () => S.answered ? next() : submitType();
  document.getElementById('hintBtn').onclick = () => {
    if(S.answered) return;
    const {art, core} = leadArticle(clean(w.it, true));
    S.hint = (art ? art + (art.endsWith("'") ? '' : ' ') : '') + core[0] + core.slice(1).replace(/[^\s']/g, '＿');
    S.usedHint = true;
    document.getElementById('hintTxt').textContent = S.hint;
    inp.focus();
  };
  document.querySelectorAll('[data-acc]').forEach(b => {
    b.onpointerdown = e => e.preventDefault();
    b.onclick = () => {
      if(inp.readOnly) return;
      /* カーソル位置に入れる（扱えない環境では末尾に足す） */
      try{
        const s = inp.selectionStart, en = inp.selectionEnd;
        if(s == null) throw 0;
        inp.setRangeText(b.dataset.acc, s, en, 'end');
      }catch(e){ inp.value += b.dataset.acc; }
      inp.focus();
    };
  });
  fitJa(main);
}
function submitType(giveup){
  const w = S.list[S.i];
  const inp = document.getElementById('ans');
  const fb = document.getElementById('fb');
  const res = giveup ? {result:'ng'} : judge(inp.value, w);
  if(res.result === 'empty'){ confirmGiveUp(); return; }
  if(res.result === 'close' && !S.retry){
    S.retry = true;
    inp.classList.add('close');
    fb.innerHTML = `<div class="feedback"><div class="verdict close">惜しい。つづりが少し違います。もう一度書いてみてください</div></div>`;
    inp.focus(); inp.select();
    return;
  }
  const ok = res.result === 'ok' || res.result === 'syn';
  S.answered = true;
  S.snap = prog[w.id] ? JSON.parse(JSON.stringify(prog[w.id])) : null;
  grade(w.id, 'type', ok);
  S.results.push({w, ok});
  inp.readOnly = true; inp.classList.remove('close'); inp.classList.add(ok ? 'ok' : 'ng');
  document.getElementById('accents').classList.add('hidden');
  document.getElementById('check').innerHTML = '次へ';
  inp.focus();
  let verdict;
  if(res.result === 'ok') verdict = `<div class="verdict ok">正解${res.notes.length ? `<span class="muted small" style="font-weight:400;margin-left:8px">${esc(res.notes.join('　'))}</span>` : ''}</div>`;
  else if(res.result === 'syn') verdict = `<div class="verdict ok">正解（類義語）<span class="muted small" style="font-weight:400;margin-left:8px" lang="it">${esc(res.other.it)}（${esc(jaText(res.other, 2))}）も合っています。ここで想定していたのは下の語です</span></div>`;
  else if(res.result === 'art') verdict = `<div class="verdict ng">冠詞が違います</div>`;
  else if(res.result === 'close') verdict = `<div class="verdict ng">つづりが違います</div>`;
  else verdict = `<div class="verdict ng">${giveup ? '答え' : '不正解'}</div>`;
  fb.innerHTML = `<div class="feedback">
    ${verdict}
    <div class="correct-it"><span class="it" lang="it">${esc(w.it)}</span>${spkBtn(w.it)}</div>
    ${details(w)}
    ${!ok && !giveup ? `<div><button class="btn small" id="override">正解として扱う</button></div>` : ''}
  </div>`;
  const ov = document.getElementById('override');
  if(ov) ov.onclick = () => {
    if(S.snap) prog[w.id] = S.snap; else delete prog[w.id];
    grade(w.id, 'type', true, {nolog:true});
    const e = logd[today()]; if(e){ e.ok++; saveLog(); }
    S.results[S.results.length - 1].ok = true; next();
  };
  autoSpeak(w.it);
}

/* 結果 */
function renderResult(quit){
  if(!S) return renderHome();
  const done = S.results; const ok = done.filter(r => r.ok).length;
  const miss = done.filter(r => !r.ok).map(r => r.w);
  const all = S.list;
  const label = {flash:'覚えた', choice:'正解', type:'正解'}[S.mode];
  const mode = S.mode, from = S.from;
  const unit = S.unit ? unitByKey.get(S.unit) : null;
  const nxt = unit ? nextUnit(unit) : null;
  if(!done.length){ return goBack(from); }
  setNav('');
  main.innerHTML = `
    <div class="sheet">
      <div class="row" style="align-items:baseline;gap:14px">
        <span class="result-num">${ok}<span style="font-size:1.6rem"> / ${done.length}</span></span>
        <span class="muted">${label}${quit && done.length < S.list.length ? '（途中で終了）' : ''}</span>
      </div>
      ${miss.length ? `<h2 style="margin-top:18px">${S.mode === 'flash' ? 'まだの語' : '間違えた語'}</h2>
      <ul class="misslist">${miss.map(w => `<li><span class="w" lang="it">${esc(w.it)}</span><span class="muted">${esc(jaText(w, 2))}</span></li>`).join('')}</ul>` : ''}
    </div>
    ${unit ? `<div class="row" style="margin-top:14px">
      ${nxt ? `<button class="btn ink" data-again="next">次のユニットへ<span class="small" style="opacity:.8;margin-left:8px">${pad2(nxt.idx)} ${esc(nxt.name)}</span></button>` : ''}
      <button class="btn${nxt ? '' : ' ink'}" data-again="home">ホームに戻る</button>
    </div>` : `<div class="row" style="margin-top:14px">
      ${miss.length ? `<button class="btn ink" data-again="flash-miss">${S.mode === 'flash' ? 'まだの語をもう一度' : '間違えた語をカードで復習'}</button>` : ''}
      ${S.mode !== 'type' ? `<button class="btn ${miss.length ? '' : 'ink'}" data-again="type-all">同じ語でテスト</button>` : `<button class="btn" data-again="type-all">もう一度</button>`}
      ${S.mode === 'flash' ? `<button class="btn" data-again="choice-all">4択で確認</button>` : ''}
      <button class="btn ghost" data-again="back">${from === 'random' ? 'ランダム出題へ' : from === 'level' ? 'レベルのページへ' : 'ホームへ'}</button>
    </div>`}
  `;
  main.querySelectorAll('[data-again]').forEach(b => b.onclick = () => {
    const a = b.dataset.again;
    if(a === 'home'){ window.scrollTo(0, 0); return renderHome(); }
    if(a === 'back') return goBack(from);
    if(a === 'next') return startUnit(mode, nxt);
    if(a === 'flash-miss') return start('flash', shuffle(miss));
    if(a === 'type-all') return start('type', shuffle(all));
    if(a === 'choice-all') return start('choice', shuffle(all));
  });
  S.mode = 'result';
}

const LST = {q:'', lv:'', st:'', cat:'', unit:'', limit:100};
const ST_LABEL = {m:'定着', l:'学習中', u:'未学習'};
function listFiltered(){
  const q = baseNorm(LST.q);
  return words.filter(w => {
    if(LST.lv && w.level !== Number(LST.lv)) return false;
    if(LST.cat && w.cat !== LST.cat) return false;
    if(LST.unit && w.ukey !== LST.unit) return false;
    if(LST.st){
      const r = prog[w.id];
      if(LST.st === 'wrong'){ if(!wrongToday(r)) return false; }
      else if(LST.st === 'due'){ if(!isDue(r)) return false; }
      else if(status(w.id) !== LST.st) return false;
    }
    return !q || w.search.includes(q);
  });
}
function renderList(){

  let total = 0, totalOk = 0; for(const k in logd){ total += logd[k].n; totalOk += logd[k].ok; }
  const days = []; for(let d = td - 13; d <= td; d++) days.push({d, n: logd[d]?.n || 0, ok: logd[d]?.ok || 0});
  const maxN = Math.max(10, ...days.map(x => x.n));
  const ahead = []; for(let d = td; d <= td + 6; d++) ahead.push({d, n:0});
  for(const w of words){ const r = prog[w.id]; if(!r || r.due == null) continue; const d = Math.max(r.due, td); if(d <= td + 6) ahead[d - td].n++; }
  const maxA = Math.max(10, ...ahead.map(x => x.n));
  const lvRows = LEVELS.map(L => {

    <div class="legend"><span>正解</span><span class="l">不正解</span></div>

  `;
}

  ['level','必須','1〜5','3'],
  ['italian','必須','見出し語。名詞は定冠詞つき','il binario'],

  ['gender','名詞','m / f / mf','m'],

      </select></label></div>
    <h2>ユニット学習</h2>

    <label class="toggle"><input type="checkbox" id="unitShuffle" ${settings.unitShuffle ? 'checked' : ''}>

    <h2>音声</h2>
    <label class="toggle"><input type="checkbox" id="autoSpeak" ${settings.autoSpeak ? 'checked' : ''}>
      <span><b>自動で読み上げる</b><span class="muted small">カードの表示時と、解答後に発音を再生します。オフでも発音ボタンで聞けます。</span></span></label>
    <div data-voice-note="settings" style="margin-top:10px"></div>
    <div data-voice-note="pick"></div>
    <p class="muted small">iPhone では「設定 → アクセシビリティ → 読み上げコンテンツ → 声 → イタリア語」から、拡張・プレミアムの声を無料でダウンロードできます。追加したら、このページを開き直すと一覧に出ます。</p>
    <div class="row"><button class="btn small" id="voiceTest">試しに聞く</button>${settings.voiceNoteHidden ? '<button class="btn ghost small" id="voiceNoteShow">ホームの案内を再表示</button>' : ''}</div>

    <h2>単語データ</h2>
    <p>内蔵 ${fmt(BUILTIN.length)}語（固定）＋ 自分で追加 ${fmt(userWords.length)}語${overB ? `（うち内蔵語の上書き ${overB}語）` : ''}<br>
    <span class="muted small">${LEVELS.map(L => `Lv.${L.n}: ${words.filter(w => w.level === L.n).length}`).join('　')}</span></p>
    <p class="muted small">内蔵データは消えません。CSVで読み込んだ語は内蔵データに追加され、同じ id の語は読み込んだ内容で上書きされます。</p>

      <label>読み込み方
        <select id="mode">
          <option value="merge">追加する（同じidは上書き）</option>

    <div class="row">
      <label class="btn ink" style="cursor:pointer">ファイルを選ぶ

    <textarea id="paste" rows="6" placeholder="id,level,italian,japanese,..."></textarea>
    <div class="row" style="margin-top:8px"><button class="btn" id="loadPaste">貼り付けた内容を読み込む</button></div>

    <div class="tablewrap"><table>
      <thead><tr><th>列名</th><th></th><th>内容</th><th>例</th></tr></thead>

    <h2>リセット</h2>
    <div class="row">
      <button class="btn danger" id="resetProg">学習記録を消す</button>

  updateVoiceNotes();

  /* 公開ページでは confirm() が使えないため、ページ内で確認する */
  const askReset = (text, label, run) => {

    document.getElementById('resetYes').onclick = () => { run(); window.scrollTo(0, 0); };
    box.scrollIntoView({block:'nearest'});
  };
  document.getElementById('resetProg').onclick = () => askReset(
    'すべての学習記録（定着・復習の予定・解答数の記録）を消します。元に戻せません。',
    '学習記録を消す',
    () => { prog = {}; logd = {}; saveProg(); saveLog(); renderSettings('<div class="notice">学習記録を消しました。</div>'); });
  document.getElementById('resetData').onclick = () => askReset(
    '自分で追加した語をすべて消します。内蔵データと学習記録は残ります。',
    '追加した語を消す',
    () => { userWords = []; saveUserWords(); rebuild(); renderSettings('<div class="notice">自分で追加した語を消しました。</div>'); });
}
function importTexts(texts, mode, names){
  let added = []; const errs = [];
  texts.forEach((t, i) => {
    const r = parseCSV(t);
    added = added.concat(r.words);
    r.errors.slice(0, 20).forEach(e => errs.push(names[i] + ': ' + e));
  });
  const skipped = added.filter(w => MERGED[w.id]).length;
  added = added.filter(w => !MERGED[w.id]);
  if(!added.length){ renderSettings(`<div class="notice">読み込める行がありませんでした。<ul class="errors">${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>`); return; }
  const map = new Map(mode === 'replace' ? [] : userWords.map(w => [w.id, w]));
  let upd = 0, overB = 0;
  added.forEach(w => { if(map.has(w.id)) upd++; else if(BUILTIN_IDS.has(w.id)) overB++; map.set(w.id, w); });
  userWords = [...map.values()];
  const saved = saveUserWords();
  rebuild();
  renderSettings(`<div class="notice">${added.length}行を読み込みました${upd ? `（うち${upd}語は追加済みの語を上書き）` : ''}${overB ? `。${overB}語は内蔵語を上書きしています` : ''}${skipped ? `。統合済みの重複語 ${skipped}行は読み飛ばしました` : ''}。合計${fmt(words.length)}語。
    ${saved ? '' : '<br>ブラウザに保存できなかったため、ページを閉じると消えます。'}
    ${errs.length ? `<ul class="errors">${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul>` : ''}</div>`);
}

document.addEventListener('keydown', e => {
  if(!S || e.isComposing) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(S.mode === 'flash'){
    if(e.key === ' ' || e.key === 'Enter'){ if(tag === 'button' && S.flipped) return; e.preventDefault(); if(!S.flipped) flip(); }
    else if(S.flipped && e.key === 'ArrowLeft') flashJudge(false);
    else if(S.flipped && e.key === 'ArrowRight') flashJudge(true);
  }else if(S.mode === 'choice'){
    if(!S.answered && /^[1-4]$/.test(e.key)) choose(Number(e.key) - 1);
    else if(S.answered && e.key === 'Enter'){ e.preventDefault(); next(); }
  }
});

/* 起動画面：旗をポールから吹かれているように波打たせ、タップで上へ流す */
(function(){
  const sp = document.getElementById('splash'); if(!sp) return;
  const cv = sp.querySelector('.flagcv'), ctx = cv.getContext('2d');
  const COLORS = [[0,146,70],[255,255,255],[206,43,55]];
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, dpr = 1, raf = 0, goAt = 0, phase = 0, last = 0;
  const t0 = performance.now();
  function size(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.round(cv.clientWidth * dpr); H = Math.round(cv.clientHeight * dpr);
    cv.width = W; cv.height = H;
  }
  const ease = x => x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2) / 2;
  function draw(now){
    const dt = last ? Math.min(.05, (now - last) / 1000) : 0; last = now;
    let p = 0;
    if(goAt){ p = Math.min(1, (now - goAt) / 1700); }
    const e = ease(p);
    const base = 9 * dpr, amp = base + e * 30 * dpr;          /* 波の大きさ。飛ぶときは大きくはためく */
    const speed = 2.2 + e * 1.6;                               /* 波の速さ（飛ぶときも少しだけ速く） */
    phase += dt * speed;                                       /* 速さが変わっても波が飛ばないように积み上げる */
    const pad = 46 * dpr;                                      /* 上下の余白（静止時は端が見えない） */
    const lift = e * (H + pad * 3);                            /* 上へ流れる量 */
    ctx.clearRect(0, 0, W, H);
    const step = Math.max(1, Math.round(dpr));
    for(let x = 0; x < W; x += step){
      const u = x / W;
      const grow = .35 + .65 * u;                              /* 左（ポール側）は揺れが小さい */
      const ph = u * Math.PI * 2 * 1.35 - phase;
      const ph2 = u * Math.PI * 2 * 2.7 - phase * 1.7;
      const dy = (Math.sin(ph) + .28 * Math.sin(ph2)) * amp * grow;
      const shade = (Math.cos(ph) + .28 * Math.cos(ph2)) * grow;    /* 波の傾きで明暗をつける */
      const c = COLORS[Math.min(2, Math.floor(u * 3))];
      let r, g, b;
      if(shade > 0){ const k = .10 * shade; r = c[0] + (255 - c[0]) * k; g = c[1] + (255 - c[1]) * k; b = c[2] + (255 - c[2]) * k; }
      else{ const k = 1 + .16 * shade; r = c[0] * k; g = c[1] * k; b = c[2] * k; }
      ctx.fillStyle = `rgb(${r|0},${g|0},${b|0})`;
      ctx.fillRect(x, dy - pad - lift, step + 1, H + pad * 2);
      if(lift > 0){                                              /* 下端の影（白い帯も背景と見分けられるように） */
        const yb = dy - pad - lift + H + pad * 2;
        ctx.fillStyle = 'rgba(0,0,0,.10)'; ctx.fillRect(x, yb, step + 1, 5 * dpr);
        ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.fillRect(x, yb + 5 * dpr, step + 1, 6 * dpr);
      }
    }
    if(p < 1) raf = requestAnimationFrame(draw);
    else finish();
  }
  function finish(){ cancelAnimationFrame(raf); sp.remove(); document.documentElement.style.overflow = ''; window.removeEventListener('resize', size); }
  size(); window.addEventListener('resize', size);
  document.documentElement.style.overflow = 'hidden';
  if(reduce){ draw(t0); cancelAnimationFrame(raf); }
  else raf = requestAnimationFrame(draw);
  let gone = false;
  const enter = () => {
    if(gone) return; gone = true;
    sp.classList.add('go');
    if(reduce){ sp.style.transition = 'opacity .3s'; sp.style.opacity = '0'; setTimeout(finish, 320); }
    else goAt = performance.now();
  };
  sp.onclick = enter;
  sp.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); enter(); } };
  sp.focus();
})();

renderHome();
</script>
