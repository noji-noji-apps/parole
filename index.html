L5-0233,5,ossia,すなわち|つまり,conj,,,副詞・接続詞・前置詞,"Arriviamo alle otto, ossia tra un'ora.",8時に着きます、つまり1時間後です。,前の語句を言い換えたり補足したりするときに使う。やや書き言葉的。ovvero もほぼ同義。,ovvero|cioè,書きことばのつなぎ
L5-0245,5,sennò,さもないと|そうでなければ,conj,,,副詞・接続詞・前置詞,"Sbrigati, sennò perdiamo il treno.",急いで、さもないと電車に乗り遅れるよ。,se no を一語にした口語的な形。se no とも書く。直前にコンマを置くことが多い。,se no|altrimenti,書きことばのつなぎ
L5-0184,5,tramite,〜を介して|〜経由で|〜を通じて,prep,,,副詞・接続詞・前置詞,Ho prenotato la camera tramite un sito internet.,ウェブサイトを通じて部屋を予約しました。,手段・仲介を表す前置詞で、直後に名詞を置く。tramite は名詞（仲介、橋渡し）としても使う。,attraverso|per mezzo di,書きことばのつなぎ
L5-0372,5,mediante,〜によって|〜を用いて|〜を通じて,prep,,,副詞・接続詞・前置詞,Si può prenotare mediante il sito internet dell'hotel.,ホテルのウェブサイトから予約できます。,改まった書き言葉的な前置詞。日常会話では con や tramite を使うことが多い。,tramite,書きことばのつなぎ
L5-0170,5,salvo,〜を除いて|〜は別として,prep,,,副詞・接続詞・前置詞,"Il museo è aperto tutti i giorni, salvo il lunedì.",美術館は月曜日を除いて毎日開いています。,salvo che＋接続法で「〜でない限り」。形容詞の salvo（無事な）は別用法で、前置詞では変化しない。,tranne|eccetto,書きことばのつなぎ
L5-0265,5,addirittura,なんと|〜さえ|それどころか,adv,,,副詞・接続詞・前置詞,"Ha camminato per tre ore, addirittura sotto la pioggia.",彼は3時間歩いた、しかも雨の中でさえ。,予想以上の程度を強調する。「それどころか」と前の内容を強めて言い換える使い方もある。,,書きことばのつなぎ
L5-0124,5,effettivamente,実際に|確かに|実のところ,adv,,,副詞・接続詞・前置詞,"Effettivamente, hai ragione tu, il treno era in ritardo.",確かにあなたの言う通り、列車は遅れていた。,相手の意見や事実を認める時に使う。realmente や davvero より、確認・同意の意味合いが強い。,,書きことばのつなぎ
L5-0406,5,egli,彼は|彼が,pron,,,疑問詞・代名詞,Egli sostiene che il progetto sia già concluso.,彼はそのプロジェクトはすでに終わったと主張している。,主語専用の文語的な代名詞。現代の会話では lui や省略が普通。女性は ella、複数は essi。,,書きことばの代名詞と場所
L5-0407,5,ella,彼女は|彼女が,pron,,,疑問詞・代名詞,Ella è la nuova direttrice dell'azienda.,彼女は会社の新しい女性部長です。,文語的・古風な主語代名詞で、日常会話では lei や省略が普通。目的語や前置詞のあとには使えない。,,書きことばの代名詞と場所
L5-0289,5,esso,それ（男性名詞を指す）|それは（主語）,pron,,"essa, essi, esse",疑問詞・代名詞,Ho comprato un libro ed esso è molto interessante.,私は本を買ったが、それはとても面白い。,主に書き言葉。イタリア語では主語代名詞は普通省略され、物を指す場合も esso はあまり使われない。人には lui/lei/loro を使い、esso/essa は物・動物を指す。,,書きことばの代名詞と場所
L5-0330,5,sé,自分自身|自分,pron,,,疑問詞・代名詞,Ognuno pensa solo a sé.,誰もが自分のことしか考えていない。,"3人称の再帰強勢形で、前置詞の後に使う（a sé, di sé, con sé など）。単数・複数同形。強調形は sé stesso/a（se stesso とも書く）。con sé は「自分と一緒に・身につけて」の意で、文語・古語では seco ともいう。",,書きことばの代名詞と場所
L5-0381,5,alcuno,いくつか|誰も（否定文で）|少しも（否定文で）,pron,,"alcuna, alcuni, alcune",疑問詞・代名詞,Alcuni di noi non hanno ancora mangiato.,私たちのうち何人かはまだ食べていません。,代名詞は複数 alcuni/alcune「何人か」が普通。単数の否定 non… alcuno は主に形容詞用法（non ho alcun dubbio）。,,書きことばの代名詞と場所
L5-0108,5,altrove,別の場所に|よそに,adv,,,疑問詞・代名詞,"Se non c'è posto qui, cerchiamo altrove.",ここに席がなければ、よそを探しましょう。,「別の場所で・へ」の両方に使える。やや書き言葉的で、会話では in un altro posto もよく使う。,da un'altra parte,書きことばの代名詞と場所
L5-0122,5,dovunque,どこでも|どこへ行っても,adv,,,疑問詞・代名詞,"Dovunque vada, porto sempre con me il mio libro.",どこへ行っても、私はいつも本を持ち歩いています。,「どこで〜しても」の意味で接続法を伴うことが多い。ovunque も同義で、こちらのほうがやや一般的。,ovunque,書きことばの代名詞と場所
L5-0012,5,lassù,あの上に|上の方に,adv,,,疑問詞・代名詞,Lassù c'è un piccolo ristorante con una bella vista.,あの上に、眺めのいい小さなレストランがあります。,遠くの高い場所を指す。話し手に近い上方は quassù。反対の「あの下に」は laggiù。,là sopra,書きことばの代名詞と場所
L5-0049,5,pari,偶数の|等しい|同点の,adj,,pari（不変）,数・時間・曜日,Il due è un numero pari.,2は偶数です。,男女・単複とも不変の形容詞。「偶数の」の反対は dispari（奇数の）。スポーツでは「引き分け」の意味でも使い、finire pari は「引き分けに終わる」。,,数と期間
L5-0369,5,dispari,奇数の,adj,,dispari（不変）,数・時間・曜日,Il sette è un numero dispari.,7は奇数です。,男女同形で複数形も変わらない。反対語は pari（偶数の）。numeri dispari（奇数）の形でよく使う。,,数と期間
L5-0104,5,il triplo,3倍|3倍の量,noun,m,（通常は単数形で使う）,数・時間・曜日,Questo biglietto costa il triplo rispetto a quello di ieri.,この切符は昨日のものの3倍の値段です。,il triplo di A は「Aの3倍」。「2倍」は il doppio。形容詞としても使う（una dose tripla「3倍量」）。,la triplice quantità,数と期間
L5-0119,5,la decina,約十|十個ほど|10のまとまり,noun,f,decine,数・時間・曜日,Ci sono una decina di persone in fila davanti al museo.,美術館の前に10人ほどが列を作っています。,una decina di + 名詞で「約10の〜」。同様に dozzina（12）、ventina（約20）、trentina などがある。,,数と期間
L5-0115,5,il centinaio,約百|百ほど,noun,m,le centinaia（不規則な女性複数）,数・時間・曜日,Alla festa c'erano un centinaio di persone.,パーティーには百人ほどの人がいました。,un centinaio di + 名詞で「約百の〜」。複数形は女性名詞扱いの le centinaia（例: centinaia di persone「何百人もの人」）。cento は正確な100。,,数と期間
L5-0225,5,il migliaio,約千|千ほど|何千も（複数形で）,noun,m,le migliaia（女性複数・不規則）,数・時間・曜日,C'erano migliaia di persone in piazza.,広場には何千人もの人がいました。,単数 il migliaio は「約1000（のまとまり）」。複数形は女性形 le migliaia（不規則）で、migliaia di + 名詞で「何千もの〜」。un migliaio di + 名詞は「約千の〜」。,,数と期間
L5-0151,5,moltiplicare,掛ける|増やす|掛け算をする,verb,,"moltiplico, moltiplichi, moltiplica, moltiplichiamo, moltiplicate, moltiplicano",数・時間・曜日,"Se moltiplichi quattro per tre, ottieni dodici.",4に3を掛けると12になります。,"「AにBを掛ける」は moltiplicare A per B。tu と noi の活用では h が入る（moltiplichi, moltiplichiamo）。",,数と期間
L5-0419,5,il bimestre,2か月間|2か月の期間,noun,m,bimestri,数・時間・曜日,Pago la bolletta del gas ogni bimestre.,ガス料金は2か月ごとに支払っています。,bi-（2）＋mese から。公共料金の請求など事務的な文脈で使う。形容詞 bimestrale は「2か月ごとの」。,,数と期間
L5-0360,5,il trimestre,四半期|3か月|学期（3学期制の）,noun,m,trimestri,数・時間・曜日,Nel primo trimestre dell'anno ho viaggiato molto per lavoro.,今年の第1四半期は仕事でたくさん出張しました。,学校の3学期制の「学期」の意味でも使う。「4か月・2学期制」は quadrimestre、semestre（半年）と区別する。,,数と期間
L5-0042,5,il decennio,十年間|10年,noun,m,decenni,数・時間・曜日,Questa città è cambiata molto nell'ultimo decennio.,この街はこの10年でとても変わりました。,-io で終わる名詞で、複数形は decenni（i が1つ）。「10年代」の意味でも使う。,,数と期間
L5-0420,5,il quinquennio,5年間|5年期,noun,m,quinquenni,数・時間・曜日,Nell'ultimo quinquennio la città è cambiata molto.,この5年間で、街はとても変わりました。,「5年間」を一つの期間として指す語。数年単位では biennio（2年間）、triennio（3年間）、decennio（10年間）もある。,il lustro,数と期間
L5-0227,5,il millennio,千年間|千年紀,noun,m,millenni,数・時間・曜日,Questa città esiste da quasi un millennio.,この都市は千年近く前から存在しています。,複数形は millenni で、-nn- の綴りに注意（millennio は mille＋anno が語源）。「第三千年紀」は il terzo millennio。,,数と期間
L5-0015,5,mensile,月1回の|月々の|毎月の,adj,,mensili,数・時間・曜日,Pago un abbonamento mensile per l'autobus.,私はバスの月間定期券の代金を払っています。,-e 形容詞で男女同形。名詞 il mensile は「月刊誌」、副詞的には ogni mese も使う。,,数と期間
L5-0043,5,la durata,継続時間|期間,noun,f,durate,数・時間・曜日,Qual è la durata del viaggio in treno?,電車での移動時間はどのくらいですか？,所要時間や有効期間を尋ねるときに使う。動詞は durare（続く、かかる）。,,数と期間
L5-0028,5,la scadenza,期限|締め切り|有効期限,noun,f,scadenze,数・時間・曜日,La scadenza per presentare la domanda è il trenta giugno.,申請の期限は6月30日です。,食品の賞味期限は data di scadenza。契約や書類の満期・有効期限にも使う。動詞は scadere（期限が切れる）。,,数と期間
L5-0156,5,la nottata,一晩|夜通し|夜の間,noun,f,nottate,数・時間・曜日,Ho passato la nottata a studiare per l'esame.,試験のために一晩中勉強して過ごした。,notte が時間帯としての「夜」なのに対し、nottata は夜の間の経過や出来事を強調する。passare la nottata（夜を過ごす）、nottata in bianco（徹夜）などで使う。,,数と期間
L5-0195,5,la vigilia,前日|前夜|イブ,noun,f,vigilie,数・時間・曜日,La vigilia di Natale mangiamo sempre il pesce con la famiglia.,クリスマスイブには、いつも家族と魚料理を食べます。,la vigilia di Natale はクリスマスイブ。Capodanno の前夜（大晦日）は la vigilia di Capodanno、または San Silvestro と言う。単に「その前の日」と言うときは il giorno prima を使う。,,数と期間
L5-0062,5,contemporaneo,同時の|同時代の|現代の,adj,,"contemporanea, contemporanei, contemporanee",数・時間・曜日,Questo museo ospita opere di arte contemporanea.,この美術館には現代美術の作品が展示されています。,arte contemporanea は「現代美術」。名詞では「同時代の人」の意味にもなる。,,数と期間
L5-0066,5,eterno,永遠の|果てしない,adj,,"eterna, eterni, eterne",数・時間・曜日,Roma è chiamata la Città Eterna.,ローマは永遠の都と呼ばれています。,「永遠の都」la Città Eterna はローマの異名。比喩的に「終わりのない」の意味でも使う。,,数と期間
L5-0056,5,anticipare,早める|前倒しする|前もって行う|先に知らせる,verb,,"anticipo, anticipi, anticipa, anticipiamo, anticipate, anticipano",数・時間・曜日,Possiamo anticipare la partenza di un'ora?,出発を1時間早めることはできますか？,anticipo は「前払い、手付金」の名詞にもなる（pagare in anticipo＝前払いする）。近過去は avere を助動詞にとる。,,数と期間
L5-0326,5,l'anticipo,前払い|手付金|早めること,noun,m,anticipi,数・時間・曜日,"Se paghi in anticipo, hai uno sconto sul prezzo della camera.",前払いなら、部屋代が割引になります。,in anticipo は「前もって、早めに」。arrivare in anticipo（早く着く）の反対は in ritardo。,,数と期間
L5-0096,5,il bisnonno,曾祖父|ひいおじいさん,noun,m,bisnonni,家族・人,Mio bisnonno è nato in un piccolo paese vicino a Napoli.,私の曾祖父はナポリ近郊の小さな村で生まれました。,女性形は la bisnonna。複数 i bisnonni は「曾祖父母」の意味にもなる。さらに上は trisnonno。,,親族と結婚
L5-0375,5,il/la pronipote,ひ孫|甥や姪の子,noun,mf,"i pronipoti, le pronipoti",家族・人,Mia nonna ha già tre pronipoti.,祖母にはすでにひ孫が3人います。,男女同形で、複数は i/le pronipoti。「ひ孫」のほか「甥・姪の子」の意味もあるので文脈で判断する。,,親族と結婚
L5-0186,5,il cognato,義兄|義弟|義理の兄弟,noun,m,cognati,家族・人,Mio cognato lavora in banca a Milano.,義兄は(義弟は)ミラノの銀行で働いています。,配偶者の兄弟、または姉妹の夫を指す。女性形は la cognata（義姉・義妹）。年上か年下かは区別しない。,,親族と結婚
L5-0228,5,la nuora,息子の妻|嫁|義理の娘,noun,f,nuore,家族・人,Mia nuora lavora in un ospedale a Milano.,息子の妻はミラノの病院で働いています。,息子の妻を指す。娘の夫は genero。配偶者の母は suocera（姑）、父は suocero（舅）。,,親族と結婚
L5-0414,5,il suocero,義父|しゅうと,noun,m,suoceri,家族・人,"Domenica pranziamo a casa di mio suocero, che cucina molto bene.",日曜日は義父の家で昼食をとります。義父は料理がとても上手です。,配偶者の父を指す。複数形 suoceri は義父母（夫婦）の意味でも使う。義母は la suocera。,,親族と結婚
L5-0305,5,il patrigno,継父|義父（母の再婚相手）,noun,m,patrigni,家族・人,Il mio patrigno lavora in banca e cucina molto bene.,私の継父は銀行で働いていて、料理がとても上手です。,配偶者の父は suocero。patrigno は親の再婚相手。対は la matrigna（継母）。複数形は patrigni。,,親族と結婚
L5-0355,5,il padrino,代父|名付け親|ゴッドファーザー,noun,m,padrini,家族・人,Il padrino del bambino porta un regalo per il battesimo.,その子の代父が洗礼のお祝いにプレゼントを持ってくる。,洗礼・堅信の立会人の男性。女性は la madrina。複数形 i padrini は代父母（男女）を指すこともある。,,親族と結婚
L5-0349,5,la madrina,代母|名付け親（女性）,noun,f,madrine,家族・人,La mia madrina mi ha regalato un bellissimo libro per il compleanno.,代母は誕生日にとても素敵な本をプレゼントしてくれました。,男性は il padrino。洗礼や堅信の立会人。padrino は複数形 padrini で「代父母」の意味にもなる。,,親族と結婚
L5-0340,5,il/la coniuge,配偶者,noun,mf,"i coniugi, le coniugi",家族・人,Anche il coniuge deve firmare il documento.,配偶者も書類に署名しなければなりません。,男女同形。複数 coniugi は「夫婦」の意味でも使う。公的書類や手続きで頻出する改まった語。,,親族と結婚
L5-0178,5,sposare,結婚する（〜と）|（司祭などが）結婚させる|（娘を）嫁がせる,verb,,"sposo, sposi, sposa, sposiamo, sposate, sposano",家族・人,Marco sposa Giulia a giugno.,マルコは6月にジュリアと結婚します。,他動詞で「〜と結婚する」。前置詞は不要（sposare Giulia）。再帰形 sposarsi は「結婚する」、sposarsi con は「〜と結婚する」。,,親族と結婚
L5-0416,5,il celibe,独身男性|未婚の男性,noun,m,celibi,家族・人,Nel modulo c'è una casella per il celibe e una per la nubile.,書類には、独身男性用の欄と独身女性用の欄があります。,本来は形容詞（男性の「未婚の」）で、女性は nubile。名詞としては書類などやや硬い文脈で使い、日常会話では lo scapolo（独身男性）がよく使われる。書類の婚姻状況欄では celibe/nubile と書く。,lo scapolo,親族と結婚
L5-0351,5,la nubile,未婚の女性|独身女性,adj,f,"nubile（女性単数）, nubili（女性複数）；男性は celibe（単数）, celibi（複数）",家族・人,Nel modulo devo scrivere se sono nubile o sposata.,書類に、未婚か既婚かを書かなければなりません。,女性に対して使う「未婚の」。男性には celibe を使う。書類や正式な場面でよく見られる。,,親族と結婚
L5-0415,5,il vedovo,男やもめ|妻に先立たれた男性,noun,m,vedovi,家族・人,Mio zio è vedovo da cinque anni.,叔父は5年前に妻を亡くしています。,女性は la vedova（複数 vedove）。essere vedovo di ... で「〜に先立たれた」。形容詞としても使う。,,親族と結婚
L5-0417,5,il tutore,後見人|保護者,noun,m,"i tutori（女性形: la tutrice, le tutrici）",家族・人,Il tutore del bambino è suo zio.,その子の後見人は叔父さんです。,法律上の後見人を指すことが多い。女性形は tutrice。tutore dell'ordine は「警察官」を指す表現。,,親族と結婚
L5-0125,5,il/la erede,相続人|後継者,noun,mf,"gli eredi, le eredi",家族・人,Lei è l'unica erede della casa di famiglia.,彼女は実家の唯一の相続人です。,語尾は -e で男女同形。単数は男女とも l'erede で、性は形容詞（l'unico / l'unica erede）や不定冠詞（un / un'erede）で区別する。複数は男性 gli eredi、女性 le eredi。,,親族と結婚
L5-0099,5,la gravidanza,妊娠|妊娠期間,noun,f,gravidanze,家族・人,Sono al quinto mese di gravidanza e mi sento bene.,妊娠5か月ですが、体調は良いです。,「妊娠している」は essere incinta とも言う。incinta は形容詞で、男性には使わない。,,人生の段階
L5-0304,5,il parto,出産|分娩,noun,m,parti,家族・人,Il parto è previsto per la fine di maggio.,出産は5月末の予定です。,「産む・出産する」は partorire、または dare alla luce と言う。parto naturale（自然分娩）、parto cesareo（帝王切開）のような形でよく使う。複数形 parti は parte（部分）の複数形と同形なので注意。,,人生の段階
L5-0155,5,il neonato,新生児|赤ちゃん,noun,m,neonati,家族・人,Il neonato dorme tranquillo accanto alla mamma.,新生児はお母さんの隣で静かに眠っています。,女児は la neonata（複数 le neonate）。生後間もない赤ちゃんを指す。やや広く「赤ちゃん」は il bebè や il bambino piccolo も使う。,,人生の段階
L5-0010,5,l'infanzia,幼少期|子供時代,noun,f,infanzie,家族・人,Ho passato l'infanzia in una piccola città vicino al mare.,私は海に近い小さな町で子供時代を過ごしました。,複数形 infanzie はまれで、通常は単数で使う。類義語の fanciullezza はやや文語的。,la fanciullezza,人生の段階
L5-0127,5,la fanciulla,少女|乙女,noun,f,fanciulle,家族・人,Una fanciulla ci ha indicato la strada per la stazione.,一人の少女が駅への道を教えてくれた。,文語的・詩的な語で、日常会話では ragazza や bambina を使う。男性形は fanciullo。,,人生の段階
L5-0282,5,il coetaneo,同年代の人|同い年の人,noun,m,複数形: i coetanei / 女性形: la coetanea（複数 le coetanee）,家族・人,Mi piace passare il tempo con i miei coetanei.,私は同年代の人たちと過ごすのが好きです。,女性は la coetanea。形容詞としても「同年齢の・同時代の」の意味で使える。,,人生の段階
L5-0092,5,la vecchiaia,老年|老い,noun,f,（複数形 vecchiaie はほとんど使われない）,家族・人,"Mio nonno vuole passare la vecchiaia in campagna, vicino alla famiglia.",祖父は家族の近くの田舎で老後を過ごしたがっています。,人生の段階としての老年期。ほぼ単数で使う。「老人」は il vecchio / l'anziano（anziano のほうが丁寧）。,la terza età,人生の段階
L5-0291,5,l'estraneo,他人|よそ者|見知らぬ人,noun,m,gli estranei,家族・人,Non parlo mai con gli estranei.,私は知らない人とは決して話しません。,形容詞 estraneo（無関係な）の名詞用法。女性形は l'estranea（複数 le estranee）。家族・集団の外にいる人を指し、sconosciuto は「面識のない人」を指す。,lo sconosciuto,人生の段階
L5-0014,5,il membro,一員|会員|メンバー,noun,m,i membri,家族・人,Sono membro di questa associazione da due anni.,私は2年前からこの協会の会員です。,男性名詞で、女性の会員を指すときも通常 il membro を使う。人を指す複数形は i membri。体の部位（手足）の意味では女性複数 le membra で別扱い。身分を言うときは冠詞なしで essere membro di ～。,,人生の段階
L5-0144,5,il legame,絆|結びつき|つながり,noun,m,legami,家族・人,C'è un legame molto forte tra madre e figlio.,母と子の間にはとても強い絆があります。,人間関係だけでなく、物事の関連性（legame tra A e B）にも使う。動詞 legare（結ぶ）から派生。,,人生の段階
L5-0271,5,stabilirsi,定住する|居を構える,verb,,"mi stabilisco, ti stabilisci, si stabilisce, ci stabiliamo, vi stabilite, si stabiliscono",家族・人,"Dopo gli studi, mi sono stabilito a Torino con la mia famiglia.",学業を終えたあと、私は家族とトリノに定住しました。,再帰動詞で -isc- 型。近過去は essere を使う（mi sono stabilito/a）。場所は a や in で示す。,,人生の段階
L5-0210,5,il falegname,大工|木工職人,noun,m,falegnami,仕事・学校,Mio nonno faceva il falegname e costruiva mobili bellissimi.,祖父は大工をしていて、とても美しい家具を作っていました。,家具や木製品を作る職人を指す。家の建築現場の大工は carpentiere が近い。,,職人と専門家
L5-0154,5,il muratore,レンガ職人|石工|建設作業員,noun,m,muratori,仕事・学校,Mio zio fa il muratore e lavora in cantiere ogni giorno.,叔父はレンガ職人をしていて、毎日現場で働いています。,レンガやブロックを積む職人を指す。女性形は muratrice だがあまり使われない。fare il muratore で「レンガ職人として働く」。,,職人と専門家
L5-0214,5,il giardiniere,庭師|園丁,noun,m,giardinieri,仕事・学校,Il giardiniere viene a tagliare l'erba ogni settimana.,庭師は毎週、芝を刈りに来ます。,女性形は la giardiniera。-iere 終わりの男性名詞は複数形が -ieri になる。,,職人と専門家
L5-0312,5,il salumiere,ハム・サラミ店の店主|食肉加工品店の店主,noun,m,i salumieri,仕事・学校,Dal salumiere ho comprato del prosciutto e un po' di salame.,ハム・サラミ屋で生ハムとサラミを少し買いました。,店は la salumeria。ハム、サラミ、チーズなどを量り売りで買う店の人。女性形は la salumiera。,,職人と専門家
L5-0257,5,il/la titolare,店主|経営者|（権利・口座などの）名義人,noun,mf,"i titolari, le titolari",仕事・学校,"Vorrei parlare con il titolare del ristorante, per favore.",レストランの経営者とお話ししたいのですが。,語尾は -e だが男女同形で、性は冠詞で区別する。複数は男女とも titolari。契約や口座の名義人の意味でも使う。,il proprietario,職人と専門家
L5-0147,5,il/la macchinista,機関士|運転士,noun,mf,"i macchinisti, le macchiniste",仕事・学校,Il macchinista ha annunciato un ritardo di venti minuti.,運転士は20分の遅れをアナウンスした。,単数は男女同形（il/la macchinista）だが、複数は男性 -i、女性 -e と分かれる。列車の運転士を指すほか、舞台の裏方（機械担当）の意味もある。,,職人と専門家
L5-0328,5,il marinaio,船員|水夫|船乗り,noun,m,marinai,仕事・学校,Mio nonno era marinaio e viaggiava in tutto il mondo.,祖父は船乗りで、世界中を旅していました。,職業を言うとき、essere の後は冠詞を省くのが普通（è marinaio）。複数形は -i で marinai。,,職人と専門家
L5-0268,5,il bibliotecario,司書|図書館員,noun,m,i bibliotecari,仕事・学校,Ho chiesto un libro al bibliotecario della scuola.,私は学校の司書に本を（貸してほしいと）頼みました。,女性は la bibliotecaria（複数 le bibliotecarie）。図書館は la biblioteca、書店 la libreria と混同しないこと。,,職人と専門家
L5-0129,5,il filosofo,哲学者,noun,m,filosofi,仕事・学校,Socrate è uno dei filosofi più famosi della storia.,ソクラテスは歴史上最も有名な哲学者の一人です。,女性の哲学者は la filosofa（複数 filosofe）。語源は filosofia（哲学）と同じで、アクセントは filòsofo。,,職人と専門家
L5-0174,5,lo scultore,彫刻家,noun,m,scultori,仕事・学校,Michelangelo è stato uno scultore e pittore molto famoso.,ミケランジェロはとても有名な彫刻家であり画家でした。,女性形は scultrice（複数 scultrici）。s＋子音で始まるので冠詞は lo、複数は gli scultori。,,職人と専門家
L5-0400,5,l'archeologo,考古学者,noun,m,"gli archeologi, le archeologhe",仕事・学校,L'archeologo ha trovato antiche monete romane vicino al foro.,考古学者はフォロ近くで古代ローマの硬貨を見つけた。,男性複数は -gi（archeologi）で、女性形は archeologa、複数は archeologhe。語頭が母音なので冠詞は l' を使う。,,職人と専門家
L5-0162,5,il/la professionista,専門職の人|プロ|専門家,noun,mf,"i professionisti, le professioniste",仕事・学校,Per questo lavoro serve un professionista con molti anni di esperienza.,この仕事には、長年の経験を持つプロが必要です。,語尾は -a だが男女同形。複数は男性 professionisti、女性 professioniste。医師・弁護士など専門職にも、プロ選手にも使う。,,職人と専門家
L5-0207,5,il/la dirigente,管理職|幹部|責任者,noun,mf,"i dirigenti, le dirigenti",仕事・学校,La dirigente ha convocato una riunione con tutti i dipendenti.,その女性管理職は全従業員との会議を招集しました。,"語尾は -e で男女同形。性は冠詞で区別する（il dirigente, la dirigente）。会社だけでなく官庁の幹部にも使う。",il/la manager,職人と専門家
L5-0166,5,il/la responsabile,責任者|担当者,noun,mf,"i responsabili, le responsabili",仕事・学校,"Vorrei parlare con il responsabile dell'albergo, per favore.",ホテルの責任者とお話ししたいのですが。,語尾は -e で男女同形。複数は男女とも responsabili で、冠詞（i / le）で区別する。形容詞「責任がある」としても使う。,,職人と専門家
L5-0343,5,il datore di lavoro,雇用主|雇い主,noun,m,i datori di lavoro,仕事・学校,Il mio datore di lavoro mi ha dato due giorni di ferie.,雇用主は私に2日間の休暇をくれました。,複数形は datore の方が変化する。女性の雇用主は datrice di lavoro。,il padrone,職人と専門家
L5-0217,5,l'impiego,職|雇用|使用,noun,m,impieghi,仕事・学校,Mia sorella cerca un impiego in una banca da due mesi.,姉は2か月前から銀行での仕事を探しています。,lavoro より改まった語で、求人や公的な文脈で多い。「使用」の意味もあり、impiego del tempo は時間の使い方。,,雇用と学び
L5-0371,5,la mansione,職務|任務,noun,f,mansioni,仕事・学校,Quali sono le mie mansioni in questa azienda?,この会社での私の職務は何ですか？,職場での担当業務を指す。複数形 mansioni でよく使う。svolgere una mansione（職務を遂行する）。,,雇用と学び
L5-0323,5,il tirocinio,実習|インターンシップ|研修,noun,m,tirocini,仕事・学校,Quest'estate faccio un tirocinio in un'azienda di Milano.,今年の夏、私はミラノの会社でインターンをします。,学生や新卒が職場で経験を積む期間。fare un tirocinio で「実習をする」。stage もよく使われる。,lo stage,雇用と学び
L5-0244,5,il seminario,セミナー|ゼミ|神学校,noun,m,seminari,仕事・学校,Domani partecipo a un seminario sul turismo sostenibile all'università.,明日、大学で持続可能な観光に関するセミナーに参加します。,大学の演習・研修会を指す。「神学校」の意味もあるが、日常では前者が普通。,,雇用と学び
L5-0322,5,la tesi,卒業論文|学位論文|主張,noun,f,tesi（不変）,仕事・学校,Sto scrivendo la tesi di laurea e sono molto stanca.,卒業論文を書いている最中で、とても疲れています。,-i で終わる女性名詞で複数形も同形。tesi di laurea で「卒業論文」。「主張・説」の意味でも使う。,la tesi di laurea,雇用と学び
L5-0337,5,bocciare,落第させる|不合格にする|否決する,verb,,"boccio, bocci, boccia, bocciamo, bocciate, bocciano",仕事・学校,Il professore ha bocciato tre studenti all'esame di matematica.,先生は数学の試験で3人の学生を不合格にした。,試験に落ちる側は essere bocciato。提案・法案を否決する意味でも使う。,,雇用と学び
L5-0163,5,promuovere,昇進させる|進級させる|促進する,verb,,"promuovo, promuovi, promuove, promuoviamo, promuovete, promuovono（過去分詞 promosso）",仕事・学校,L'azienda ha promosso Marco a direttore delle vendite.,会社はマルコを営業部長に昇進させました。,過去分詞が不規則。学校では「進級させる、合格させる」、反対は bocciare。「販売促進する」の意味でも使う。,,雇用と学び
L5-0064,5,dimettersi,辞職する|辞任する,verb,,"mi dimetto, ti dimetti, si dimette, ci dimettiamo, vi dimettete, si dimettono（過去分詞 dimesso）",仕事・学校,Il direttore si è dimesso ieri per motivi personali.,部長は昨日、個人的な理由で辞職しました。,再帰動詞で、近過去は essere を使う（mi sono dimesso/a）。過去分詞が不規則。「〜を辞める」は dimettersi da を使う。,,雇用と学び
L5-0401,5,assentarsi,席を外す|欠席する|留守にする,verb,,"mi assento, ti assenti, si assenta, ci assentiamo, vi assentate, si assentano",仕事・学校,"Mi assento un momento, torno subito.",ちょっと席を外します、すぐ戻ります。,再帰動詞。近過去は essere を使う（mi sono assentato/a）。やや改まった語で、日常では andare via なども使う。,,雇用と学び
L5-0121,5,disoccupato,失業中の|無職の,adj,,"disoccupata, disoccupati, disoccupate",仕事・学校,"Mio fratello è disoccupato da sei mesi, ma cerca lavoro.",兄は半年前から失業中ですが、仕事を探しています。,名詞としても使う（un disoccupato＝失業者）。「失業」は la disoccupazione。,,雇用と学び
L5-0288,5,la disoccupazione,失業|失業率,noun,f,（通常単数のみ）,仕事・学校,La disoccupazione giovanile è un problema serio in molte regioni del Sud.,若者の失業は南部の多くの地域で深刻な問題です。,ほぼ不可算で、複数形はまず使わない。「失業者」は disoccupato/a。「失業率」は tasso di disoccupazione。,,雇用と学び
L5-0192,5,il sindacato,労働組合|組合,noun,m,sindacati,仕事・学校,Il sindacato ha convocato uno sciopero per venerdì prossimo.,労働組合は来週の金曜日にストライキを呼びかけました。,sindacato は労働組合。「組合員」は iscritto al sindacato。複数形は -i。,,雇用と学び
L5-0270,5,il salario,賃金|給与,noun,m,salari,抽象・社会,Molti lavoratori chiedono un salario più alto e orari di lavoro migliori.,多くの労働者がより高い賃金とより良い勤務時間を求めています。,salario は主に労働者（特に肉体労働者）の賃金。事務職などの月給は stipendio が一般的。,,お金と商い
L5-0338,5,la busta paga,給与明細|給料袋,noun,f,buste paga（後ろの paga は単数のまま）,抽象・社会,Alla fine del mese ricevo la busta paga per email.,月末に給与明細がメールで届きます。,複合名詞で、複数形は buste paga と前半だけ変わる。同義で il cedolino もよく使う。,il cedolino,お金と商い
L5-0384,5,il compenso,報酬|謝礼,noun,m,compensi,抽象・社会,"Il compenso per questo lavoro è giusto, ma vorrei un contratto scritto.",この仕事の報酬は適正ですが、書面の契約書がほしいです。,仕事やサービスへの対価。stipendio は給料、onorario は専門職への報酬。,,お金と商い
L5-0398,5,il reddito,所得|収入,noun,m,redditi,抽象・社会,Il reddito delle famiglie è diminuito negli ultimi anni.,家計の所得はここ数年で減少しました。,個人や家庭の所得全般を指す。dichiarazione dei redditi は「所得申告」。stipendio は給料。,,お金と商い
L5-0373,5,il mutuo,住宅ローン|ローン,noun,m,mutui,抽象・社会,Abbiamo chiesto un mutuo alla banca per comprare la casa.,私たちは家を買うために銀行に住宅ローンを申し込みました。,通常は住宅ローンを指す。「ローン」一般は prestito。mutuo は fare / chiedere / pagare un mutuo の形でよく使う。,,お金と商い
L5-0327,5,la caparra,手付金|保証金,noun,f,caparre,抽象・社会,Per prenotare la camera devo versare una caparra del venti per cento.,部屋を予約するには、2割の手付金を払わなければなりません。,予約時に前払いする手付金。宿泊では、キャンセル時に返金されないことが多い。,,お金と商い
L5-0139,5,l'impresa,企業|事業|偉業,noun,f,imprese,抽象・社会,Mio padre lavora in una piccola impresa di costruzioni a Torino.,父はトリノの小さな建設会社で働いています。,「偉業・大仕事」の意味もあり、一般に azienda より事業体の色が強い。piccole e medie imprese は中小企業。,,お金と商い
L5-0006,5,gestire,管理する|運営する|対処する,verb,,"gestisco, gestisci, gestisce, gestiamo, gestite, gestiscono",抽象・社会,Mia sorella gestisce un piccolo albergo vicino al mare.,姉は海の近くで小さなホテルを経営しています。,-isco型の動詞。仕事・店・時間・問題など幅広い目的語をとる。過去分詞は規則形（gestito）。,,お金と商い
L5-0001,5,il commercio,商業|貿易|取引,noun,m,commerci,抽象・社会,Il commercio con l'estero è importante per l'economia del paese.,外国との貿易はその国の経済にとって重要です。,複数形 commerci はあまり使わない。「店・商店」は negozio。in commercio は「市販されている」の意。,,お金と商い
L5-0041,5,il consumo,消費|消費量,noun,m,consumi,抽象・社会,Il consumo di energia è aumentato molto negli ultimi anni.,エネルギーの消費量はここ数年で大きく増えた。,consumo di ... で「〜の消費（量）」。ラベルの「消費期限」は da consumarsi entro。,,お金と商い
L5-0206,5,il consumatore,消費者,noun,m,"consumatori, consumatrici",抽象・社会,I consumatori chiedono prezzi più bassi e prodotti di qualità migliore.,消費者はより低い価格とより良い品質の商品を求めている。,女性形は la consumatrice。複数形は男性 consumatori、女性 consumatrici。動詞 consumare（消費する）から派生。,,お金と商い
L5-0002,5,condire,味付けする|和える|ドレッシングをかける,verb,,"condisco, condisci, condisce, condiamo, condite, condiscono（過去分詞 condito）",食事・飲み物,"Condisco sempre l'insalata con olio, sale e un po' di aceto.",私はいつもサラダを油と塩と少しの酢で味付けします。,-isco 型の活用。condire A con B で「AをBで味付けする」。パスタをソースで和える意味でも使う。,,調理の動詞
L5-0197,5,affettare,薄切りにする|スライスする,verb,,"affetto, affetti, affetta, affettiamo, affettate, affettano",食事・飲み物,Puoi affettare il pane per la colazione?,朝食用にパンを薄切りにしてくれる？,パンやハム、野菜などを薄く切るときに使う。名詞は affettato（薄切りのハム・サラミ類）。,,調理の動詞
L5-0260,5,tritare,みじん切りにする|細かく刻む,verb,,"trito, tritti, trita, tritiamo, tritate, tritano",食事・飲み物,Tritate la cipolla finemente e poi fatela soffriggere nell'olio.,玉ねぎをみじん切りにして、油で炒めてください。,料理でよく使う。tritare la carne は「肉を挽く」。tagliare は単に「切る」。,,調理の動詞
L5-0296,5,impanare,パン粉をまぶす|衣をつける,verb,,"impano, impani, impana, impaniamo, impanate, impanano",食事・飲み物,"Prima di friggere, impano la carne con il pangrattato.",揚げる前に、肉にパン粉をまぶします。,過去分詞 impanato は形容詞的にも使う（cotoletta impanata＝パン粉をつけたカツレツ）。パン粉は pangrattato。,panare,調理の動詞
L5-0297,5,impastare,こねる|練る,verb,,"impasto, impasti, impasta, impastiamo, impastate, impastano",食事・飲み物,"Per fare il pane, bisogna impastare la farina con l'acqua e il lievito.",パンを作るには、小麦粉を水とイーストでこねなければなりません。,パンやパスタの生地をこねるときに使う。名詞 impasto は「生地、こねたもの」。規則動詞で過去分詞は impastato。,,調理の動詞
L5-0140,5,infornare,オーブンに入れる|オーブンで焼く,verb,,"inforno, inforni, inforna, inforniamo, infornate, infornano",食事・飲み物,Infornate la torta a centottanta gradi per quaranta minuti.,ケーキを180度のオーブンで40分焼いてください。,-are 規則動詞。レシピの命令形 inforna / infornate で頻出。「焼く」は cuocere al forno とも言う。,,調理の動詞
L5-0131,5,frullare,ミキサーにかける|撹拌する|泡立てる,verb,,"frullo, frulli, frulla, frulliamo, frullate, frullano",食事・飲み物,Frullo la frutta con il latte per fare un frullato.,スムージーを作るために、果物を牛乳と一緒にミキサーにかけます。,規則動詞（-are）。名詞 frullato（スムージー）、frullatore（ミキサー）と関連。卵を溶くときは sbattere、卵白や生クリームを角が立つまで泡立てるときは montare も使う。,,調理の動詞
L5-0313,5,scolare,水を切る|湯切りする,verb,,"scolo, scoli, scola, scoliamo, scolate, scolano",食事・飲み物,Scola la pasta quando è al dente e aggiungi il sugo.,パスタはアルデンテになったら湯を切って、ソースを加えてください。,パスタの湯切りは scolare la pasta。水切り用の道具は lo scolapasta（ざる）。,,調理の動詞
L5-0333,5,affumicare,燻製にする|燻す,verb,,"affumico, affumichi, affumica, affumichiamo, affumicate, affumicano",食事・飲み物,Mio nonno affumica il pesce con il legno di faggio.,祖父はブナの木で魚を燻製にします。,"-care 動詞なので、tu と noi では h が入る（affumichi, affumichiamo）。過去分詞の形 affumicato は「燻製の」という形容詞としても頻出。",,調理の動詞
L5-0254,5,stappare,栓を抜く|（瓶を）開ける,verb,,"stappo, stappi, stappa, stappiamo, stappate, stappano",食事・飲み物,Stappiamo una bottiglia di vino per festeggiare!,お祝いにワインを1本開けましょう！,ワインやシャンパンの栓を抜くときの定番動詞。反対は tappare（栓をする）。規則動詞で近過去は avere を使う。,,調理の動詞
L5-0088,5,sparecchiare,食卓を片付ける|食器を下げる,verb,,"sparecchio, sparecchi, sparecchia, sparecchiamo, sparecchiate, sparecchiano",食事・飲み物,Dopo cena aiuto sempre mia madre a sparecchiare la tavola.,夕食のあと、私はいつも母が食卓を片付けるのを手伝います。,反対語は apparecchiare（食卓を整える）。sparecchiare la tavola の形で使う。-chiare 動詞なので tu sparecchi の i は一つだけ。,,調理の動詞
L5-0173,5,lo scolapasta,水切りザル|パスタ用の水切り,noun,m,scolapasta（不変）,食事・飲み物,"Metti la pasta nello scolapasta, per favore.",パスタを水切りザルに入れてください。,scolare（水を切る）＋ pasta の複合語で、複数形も同形。s＋子音で始まるので冠詞は lo。colapasta とも言う。,il colapasta,台所の道具
L5-0148,5,il mestolo,お玉|玉じゃくし,noun,m,mestoli,食事・飲み物,"Per favore, passami il mestolo per servire la zuppa.",スープをよそうので、お玉を取ってください。,スープやソースをすくう調理器具。穴あきの網じゃくしは schiumarola。,,台所の道具
L5-0138,5,la grattugia,おろし器|チーズおろし器,noun,f,grattugie,食事・飲み物,Mi passi la grattugia? Vorrei aggiungere un po' di parmigiano sulla pasta.,おろし器を取ってくれますか？パスタにパルミジャーノを少しかけたいのです。,動詞 grattugiare（おろす）から派生。チーズやレモンの皮をおろす道具で、イタリアの台所の必需品。,,台所の道具
L5-0379,5,la teglia,天板|オーブン皿,noun,f,teglie,食事・飲み物,Metti la teglia nel forno a duecento gradi per venti minuti.,天板をオーブンに入れて、200度で20分焼いてください。,オーブン用の浅い金属製の型や皿。ピザや焼き菓子、ラザニアなどに使う。複数形は -gl- の音を保つ。,,台所の道具
L5-0201,5,il cavatappi,コルク抜き|栓抜き（ワインの）,noun,m,cavatappi（不変）,食事・飲み物,"Mi scusi, ha un cavatappi per aprire questa bottiglia di vino?",すみません、このワインのボトルを開けるコルク抜きはありますか？,単数も複数も cavatappi で同形（不変）。cava（抜く）と tappi（栓）の複合語。冠詞で数を区別する。,il levatappi,台所の道具
L5-0267,5,l'apriscatole,缶切り,noun,m,apriscatole（不変）,食事・飲み物,"Non trovo l'apriscatole, puoi aiutarmi a cercarlo?",缶切りが見つからないんだ、探すのを手伝ってくれる？,"複合名詞で単複同形。冠詞で数を区別する（l'apriscatole, gli apriscatole）。",,台所の道具
L5-0397,5,il canovaccio,ふきん|布巾,noun,m,canovacci,食事・飲み物,Puoi asciugare i piatti con il canovaccio pulito?,きれいなふきんでお皿を拭いてくれる？,食器や台所用の布。似た意味で strofinaccio も使う。比喩的に劇の「筋書き」の意味もある。,lo strofinaccio,台所の道具
L5-0011,5,integrale,全粒の|完全な,adj,,integrali,食事・飲み物,Per colazione mangio sempre il pane integrale con la marmellata.,朝食にはいつも全粒粉のパンにジャムをつけて食べます。,-e 形容詞なので男女同形。pasta integrale、riso integrale など食品に頻出。,,穀物・豆・肉・魚
L5-0211,5,il farro,ファッロ|エンマー小麦|スペルト小麦,noun,m,farri,食事・飲み物,"Per primo prendo la zuppa di farro, grazie.",プリモにはファッロのスープをいただきます。,イタリアではスープやサラダによく使われる古代穀物。主にエンマー小麦（farro dicocco）を指すが、スペルト小麦なども farro と呼ぶ。複数形 farri は種類を言うときなどに稀に使う。,,穀物・豆・肉・魚
L5-0232,5,l'orzo,大麦|オルツォ（麦のコーヒー）,noun,m,（通常は単数形のみ）まれに複数形 orzi,食事・飲み物,"Al bar prendo un caffè d'orzo, grazie.",バールで大麦コーヒーをいただきます。,caffè d'orzo または単に orzo で、焙煎した大麦の飲み物（カフェインを含まない）を指す。バールで「un orzo」と注文できる。精白した大麦は orzo perlato。米粒形の小さなパスタも orzo と呼ぶが、イタリアでは risoni とも言う。,,穀物・豆・肉・魚
L5-0076,5,la lenticchia,レンズ豆,noun,f,lenticchie,食事・飲み物,A Capodanno mangiamo le lenticchie per portare fortuna.,元日には幸運を願ってレンズ豆を食べます。,イタリアでは新年にレンズ豆を食べると金運に恵まれるとされる。複数形で使うことが多い。,,穀物・豆・肉・魚
L5-0366,5,il chicco,粒|（コーヒー豆などの）一粒,noun,m,chicchi,食事・飲み物,Preferisco macinare i chicchi di caffè al momento.,コーヒー豆はその都度挽くほうが好きです。,複数形は chicchi（hを入れて硬いk音を保つ）。chicco di caffè（コーヒー豆）、chicco d'uva（ぶどうの粒）、chicco di riso（米粒）のように使う。,,穀物・豆・肉・魚
L5-0083,5,il seme,種|種子,noun,m,semi,食事・飲み物,Ho piantato dei semi di pomodoro in giardino.,庭にトマトの種をまきました。,植物の種。桃やサクランボなどの硬い核は nocciolo。トランプなどカードの「スート」にも seme を使う。,,穀物・豆・肉・魚
L5-0389,5,il porro,ポロネギ|リーキ,noun,m,porri,食事・飲み物,"Per la zuppa uso patate, carote e un porro.",スープにはジャガイモとニンジンとポロネギを1本使います。,porro には「いぼ」の意味もあるが、料理の文脈では野菜を指す。複数形は porri。,,穀物・豆・肉・魚
L5-0231,5,l'ortaggio,野菜,noun,m,ortaggi,食事・飲み物,Al mercato compro frutta e ortaggi freschi ogni settimana.,私は毎週、市場で新鮮な果物と野菜を買います。,ortaggio は畑で採れる食用野菜の総称で、やや改まった語。verdura は特に葉物野菜を指すことが多く、日常ではこちらのほうがよく使う。,la verdura,穀物・豆・肉・魚
L5-0235,5,il pollame,家禽（類）|鳥肉類,noun,m,pollami,食事・飲み物,Il pollame di questa fattoria è allevato all'aperto e molto saporito.,この農場の家禽は放し飼いで育てられていて、とても味がよい。,鶏・七面鳥・アヒルなど家禽類の総称で、生きた鳥にも食肉にも使う。鶏肉だけなら pollo。複数形 pollami は稀で、通常は単数で使う。,,穀物・豆・肉・魚
L5-0040,5,il coniglio,ウサギ|ウサギ肉,noun,m,conigli,食事・飲み物,"Stasera ordiniamo il coniglio alla cacciatora, che è una specialità della casa.",今夜は、この店の名物であるウサギのカチャトーラ風を注文しましょう。,動物も料理名も同じ語。イタリアでは肉料理として一般的で、alla cacciatora（猟師風の煮込み）などが定番。,,穀物・豆・肉・魚
L5-0250,5,la sogliola,舌平目|ソール,noun,f,sogliole,食事・飲み物,"Per secondo vorrei la sogliola alla griglia, per favore.",メインには舌平目のグリルをお願いします。,魚料理の定番。alla griglia（グリル）、al burro（バター焼き）、alla mugnaia（ムニエル）などの調理法とともにメニューに出る。,,穀物・豆・肉・魚
L5-0112,5,il baccalà,塩鱈|塩漬けの鱈,noun,m,baccalà（不変）,食事・飲み物,"Per secondo vorrei il baccalà con le patate, per favore.",メインは、じゃがいも添えの塩鱈をお願いします。,-à で終わるので複数形も同形。塩漬けの鱈のこと。塩を使わず干した鱈は stoccafisso で、混同されやすい。,,穀物・豆・肉・魚
L5-0075,5,il lardo,豚の背脂|ラード,noun,m,lardi,食事・飲み物,Ho assaggiato il lardo di Colonnata su pane caldo.,温かいパンにのせたコロンナータのラルドを味見しました。,塩漬けにして薄切りで食べる豚の背脂（ラルド）を指すことが多い。精製した調理用の脂は strutto。,,穀物・豆・肉・魚
L5-0094,5,lo zafferano,サフラン,noun,m,zafferani,食事・飲み物,Il risotto alla milanese si fa con lo zafferano.,ミラノ風リゾットはサフランで作ります。,z で始まるので冠詞は lo。複数形はほとんど使わず、料理では不可算的に使う。,,穀物・豆・肉・魚
L5-0035,5,il timo,タイム|タイム（ハーブ）,noun,m,timi,食事・飲み物,Aggiungo un po' di timo alla salsa di pomodoro.,トマトソースに少しタイムを加えます。,香草のタイム。肉料理やトマトソースによく使う。複数形はあまり使わず、普通は単数で用いる。,,穀物・豆・肉・魚
L5-0374,5,il pangrattato,パン粉,noun,m,（通常は複数形なし）,食事・飲み物,"Per la cotoletta serve uovo, farina e pangrattato.",カツレツには卵と小麦粉とパン粉が必要です。,pane grattato（すりおろしたパン）が語源。ふつう単数形のみで、不可算的に使う。,il pan grattato,穀物・豆・肉・魚
L5-0318,5,il sottaceto,ピクルス|酢漬け野菜,noun,m,sottaceti,食事・飲み物,"Come contorno prendo i sottaceti, per favore.",付け合わせにピクルスをお願いします。,普通は複数形 i sottaceti で使う。giardiniera は酢漬け野菜の盛り合わせ。,,穀物・豆・肉・魚
L5-0039,5,l'aperitivo,食前酒|アペリティーヴォ,noun,m,aperitivi,食事・飲み物,Dopo il lavoro andiamo a bere un aperitivo in centro.,仕事のあとで、中心街にアペリティーヴォを飲みに行きます。,夕方に軽食つきで楽しむ習慣も指す。bere un aperitivo や fare l'aperitivo と言う。,,食卓と味わい
L5-0256,5,la tartina,カナッペ|小さなオープンサンド,noun,f,tartine,食事・飲み物,Per l'aperitivo ordiniamo qualche tartina con il salmone.,食前酒のお供に、サーモンのカナッペをいくつか注文しましょう。,小さく切ったパンに具をのせた軽食。aperitivo や パーティーの前菜で出る。tramezzino は三角形のサンドイッチ。,il canapè,食卓と味わい
L5-0021,5,la portata,料理（コースの一品）|一皿,noun,f,portate,食事・飲み物,Come prima portata prendo la zuppa di verdure.,最初の一品は野菜スープをいただきます。,"コースの各皿を指す。primo, secondo などの順に出る。「持ち運ぶ」の portare 由来で、portata には「射程」「流量」の意味もある。",,食卓と味わい
L5-0335,5,il banchetto,宴会|饗宴|屋台,noun,m,banchetti,食事・飲み物,Dopo la cerimonia c'è stato un grande banchetto con tutti i parenti.,式のあと、親戚みんなで盛大な宴会がありました。,盛大な祝宴を指す改まった語。banco の指小形として「小さな露店、出店」の意味もある。,,食卓と味わい
L5-0275,5,il boccone,一口|一口分（の食べ物）,noun,m,bocconi,食事・飲み物,"Vorrei assaggiare un boccone del tuo dolce, se non ti dispiace.",よければ、あなたのデザートを一口味見したいな。,mangiare un boccone は「軽く食べる」の定番表現。boccone は口に入れる一口分で、morso は「かみつくこと、一かじり」。,,食卓と味わい
L5-0086,5,il sorso,一口（飲み物の）|ひと飲み,noun,m,sorsi,食事・飲み物,Posso assaggiare un sorso del tuo vino prima di ordinare?,注文する前に、あなたのワインを一口味見してもいい？,飲み物の一口。食べ物の一口は boccone や morso。un sorso d'acqua（水を一口）のように使う。,,食卓と味わい
L5-0177,5,sorseggiare,ちびちび飲む|少しずつ味わって飲む,verb,,"sorseggio, sorseggi, sorseggia, sorseggiamo, sorseggiate, sorseggiano",食事・飲み物,Mi piace sorseggiare un caffè sulla terrazza.,私はテラスでコーヒーをゆっくり味わって飲むのが好きです。,他動詞。sorso（一口、ひと飲み）から派生した語。ゆっくり味わう飲み方を表す。,,食卓と味わい
L5-0027,5,il sapore,味|風味,noun,m,sapori,食事・飲み物,Questo gelato ha un sapore davvero delizioso.,このジェラートは本当においしい味がします。,味覚・風味そのものを指す。味見は assaggio、味付けや好みの意味の「味」は gusto も使う。,,食卓と味わい
L5-0190,5,saporito,味が濃い|風味豊かな|おいしい,adj,,"saporita, saporiti, saporite",食事・飲み物,"Questa pasta è molto saporita, mi piace.",このパスタはとても味が濃くて、気に入りました。,sapore（味）から派生。「塩気が強い」の意味でも使う。味が薄いは insipido、塩気が足りないは sciapo。,gustoso,食卓と味わい
L5-0193,5,speziato,スパイスの効いた|香辛料の効いた,adj,,"speziata, speziati, speziate",食事・飲み物,"Questo piatto è troppo speziato per me, preferisco qualcosa di più delicato.",この料理は私には香辛料が効きすぎです。もっとあっさりしたものがいいです。,辛さ（唐辛子）は piccante、speziato は香辛料の香りが強いこと。両者は混同しやすい。,,食卓と味わい
L5-0182,5,tiepido,生ぬるい|ぬるい,adj,,"tiepida, tiepidi, tiepide",食事・飲み物,"Il caffè è tiepido, posso averne un altro più caldo?",コーヒーがぬるいので、もっと熱いのをもらえますか？,飲み物や水などに使う。比喩的に「熱意のない」の意味もある（un'accoglienza tiepida）。,,食卓と味わい
L5-0030,5,soffice,ふわふわした|柔らかい,adj,,soffici,食事・飲み物,Questo cuscino è molto soffice e comodo.,このクッションはとてもふわふわで快適です。,-e 形容詞なので男女同形、複数は soffici。パンやケーキ、枕など触感の柔らかさに使う。,,食卓と味わい
L5-0085,5,la soffitta,屋根裏部屋,noun,f,soffitte,住まい・日用品,Abbiamo trovato vecchi libri nella soffitta della nonna.,私たちは祖母の屋根裏部屋で古い本を見つけました。,物置として使う屋根裏。mansarda は居住可能な屋根裏部屋を指すことが多い。,,家の中と色あい
L5-0240,5,il ripostiglio,物置|納戸,noun,m,ripostigli,住まい・日用品,Metto le scope e l'aspirapolvere nel ripostiglio vicino alla cucina.,ほうきと掃除機は台所の近くの物置にしまいます。,家の中の小さな収納スペースを指す。ガレージや庭の物置は別の語を使うことが多い。,lo sgabuzzino,家の中と色あい
L5-0388,5,il pianerottolo,踊り場|（アパートの）階段の踊り場,noun,m,pianerottoli,住まい・日用品,"Ho lasciato la bicicletta sul pianerottolo, davanti alla porta dei vicini.",自転車を踊り場の、隣の家のドアの前に置いておきました。,階段の途中だけでなく、各階の玄関前のスペースも指す。sul pianerottolo「踊り場で」の形で頻出。,,家の中と色あい
L5-0362,5,la veranda,ベランダ|サンルーム,noun,f,verande,住まい・日用品,Nella nostra casa al mare facciamo colazione in veranda quando il tempo è bello.,海辺の家では、天気がよいとベランダで朝食をとります。,ガラス張りで囲まれた部分を指すことが多い。屋外の手すり付きバルコニーは balcone、テラスは terrazza。,,家の中と色あい
L5-0234,5,la persiana,よろい戸|雨戸,noun,f,persiane,住まい・日用品,"Per favore, chiudi la persiana, c'è troppa luce.",お願い、よろい戸を閉めて。光が強すぎるわ。,窓の外側につく、よろい板付きの開き戸。ふつう左右2枚一組なので、複数形 persiane で使うことが多い。巻き上げ式のシャッターは tapparella と言う。,,家の中と色あい
L5-0101,5,la piastrella,タイル,noun,f,piastrelle,住まい・日用品,"Vorremmo cambiare le piastrelle del bagno, perché sono molto vecchie.",浴室のタイルを替えたいのです。とても古いので。,床や壁に貼るタイル全般を指す。床用なら piastrelle per pavimenti、壁用なら piastrelle da rivestimento などと言う。,la mattonella,家の中と色あい
L5-0222,5,il lampadario,シャンデリア|天井照明,noun,m,lampadari,住まい・日用品,Nel salone dell'albergo c'è un grande lampadario di cristallo.,ホテルの広間には大きなクリスタルのシャンデリアがあります。,豪華なものに限らず、天井から吊るす照明全般を指す。卓上ランプは la lampada。,,家の中と色あい
L5-0278,5,la cassettiera,整理だんす|チェスト,noun,f,cassettiere,住まい・日用品,Ho comprato una cassettiera nuova per la camera da letto.,寝室用に新しいチェストを買いました。,cassetto（引き出し）に -iera が付いた語。寝室の衣類収納によく使う。comò もほぼ同義。,il comò,家の中と色あい
L5-0053,5,lo sgabello,スツール|腰掛け,noun,m,sgabelli,住まい・日用品,"Siediti su questo sgabello, qui c'è più spazio.",このスツールに座って、ここのほうが広いから。,背もたれのない椅子。s＋子音で始まるので冠詞は lo、複数は gli sgabelli。バーのカウンター席にもよく使う。,,家の中と色あい
L5-0342,5,la cornice,額縁|枠,noun,f,cornici,住まい・日用品,Vorrei comprare una cornice per questa foto.,この写真用の額縁を買いたいのですが。,単数 cornice は -e で終わる女性名詞。複数は cornici（-ce → -ci）。比喩的に「背景・枠組み」の意味でも使う。,,家の中と色あい
L5-0113,5,la biancheria,リネン類|下着|洗濯物,noun,f,（通常は単数のみ）,住まい・日用品,"Potrebbe cambiare la biancheria del letto, per favore?",ベッドのリネンを交換していただけますか？,不可算的に使う。「下着」は biancheria intima、「寝具・ベッドリネン」は biancheria da letto。,,家の中と色あい
L5-0093,5,il velluto,ベルベット|ビロード,noun,m,velluti,住まい・日用品,"Cerco una giacca di velluto nera, di taglia media.",黒いベルベットのジャケットを探しています、Mサイズです。,素材は di velluto で表す。「コーデュロイ」は velluto a coste とも言う。,,家の中と色あい
L5-0018,5,la pantofola,スリッパ,noun,f,pantofole,住まい・日用品,Ho comprato un paio di pantofole morbide per l'inverno.,冬用に柔らかいスリッパを1足買いました。,通常は複数形で使い、1足は un paio di pantofole。ciabatta も室内履きの意味で使われる。,,家の中と色あい
L5-0111,5,l'asciugatrice,衣類乾燥機|乾燥機,noun,f,asciugatrici,住まい・日用品,Nell'appartamento c'è anche una lavatrice con asciugatrice.,そのアパートには乾燥機付きの洗濯機もあります。,l' は母音の前の省略形。洗濯機は la lavatrice。ヘアドライヤーは il fon（または asciugacapelli）。,,家の中と色あい
L5-0095,5,avorio,アイボリー色の|象牙色の,adj,,avorio（不変）,住まい・日用品,"Vorrei una camicia color avorio, per favore.",アイボリー色のシャツをお願いします。,"色を表す avorio は不変で、性数で変化しない。名詞では「象牙」の意味（l'avorio, 男性）。",,家の中と色あい
L5-0109,5,argentato,銀色の|銀メッキの,adj,,"argentata, argentati, argentate",住まい・日用品,Ho comprato una borsa argentata per la festa di sabato.,土曜のパーティー用に銀色のバッグを買いました。,色名としては argento（不変：una borsa argento）も使う。d'argento は主に「銀製の」の意味。argentato は銀色の光沢や銀メッキを表す。,argenteo,家の中と色あい
L5-0145,5,lilla,ライラック色の|薄紫の,adj,,lilla（不変）,住まい・日用品,Ho comprato una camicia lilla per la festa.,パーティー用にライラック色のシャツを買いました。,色の形容詞で性数不変。lilla の複数形も lilla。名詞としては「ライラック色」（il lilla）。,,家の中と色あい
L5-0029,5,la scopa,ほうき,noun,f,scope,住まい・日用品,Prendo la scopa e pulisco il pavimento della cucina.,ほうきを取って、台所の床を掃除します。,イタリア式トランプの定番ゲーム名 scopa でもある。ちりとりは paletta。,,道具と手入れ
L5-0255,5,lo straccio,雑巾|ぼろ布,noun,m,stracci,住まい・日用品,"Prendi uno straccio e pulisci il tavolo, per favore.",雑巾を持ってきて、テーブルを拭いてください。,s＋子音で始まるので冠詞は lo。複数は gli stracci。「ぼろぼろの服」の意味でも使う。,,道具と手入れ
L5-0013,5,il martello,金づち|ハンマー,noun,m,martelli,住まい・日用品,Mi serve un martello per appendere il quadro al muro.,壁に絵を掛けるのに金づちが必要です。,複数形は martelli。木槌は mazzuolo、大型のハンマーは mazza。,,道具と手入れ
L5-0325,5,il trapano,電動ドリル|ドリル,noun,m,trapani,住まい・日用品,Mi presti il trapano per montare lo scaffale?,棚を組み立てるのに、ドリルを貸してくれる？,歯科の「ドリル」も trapano。電動のものは trapano elettrico、充電式は trapano a batteria とも言う。,il trapano elettrico,道具と手入れ
L5-0050,5,il pennello,刷毛|絵筆|筆,noun,m,pennelli,住まい・日用品,Mi serve un pennello per dipingere la parete della camera.,寝室の壁を塗るのに刷毛が必要です。,壁塗り用の刷毛も絵筆も pennello。ひげそり用ブラシは pennello da barba と言う。,,道具と手入れ
L5-0105,5,la vernice,ペンキ|塗料|ニス,noun,f,vernici,住まい・日用品,Dobbiamo comprare la vernice bianca per pitturare le pareti della camera.,寝室の壁を塗るために、白いペンキを買わなければなりません。,vernice は透明な仕上げ塗料やニスも指す。壁用の塗料は pittura がより一般的。,,道具と手入れ
L5-0146,5,il lucchetto,南京錠,noun,m,lucchetti,住まい・日用品,Ho comprato un lucchetto per la valigia.,スーツケース用に南京錠を買いました。,旅行では荷物やロッカー用の鍵として使う。「鍵」一般は la chiave、ドアの錠は la serratura。,,道具と手入れ
L5-0069,5,il fiammifero,マッチ,noun,m,fiammiferi,住まい・日用品,Hai un fiammifero? Devo accendere la candela.,マッチある？ろうそくに火をつけたいんだ。,「マッチ箱」は la scatola di fiammiferi。火をつけるのは accendere。ライターは l'accendino。,,道具と手入れ
L5-0290,5,l'estintore,消火器,noun,m,estintori,住まい・日用品,Dov'è l'estintore più vicino? C'è un piccolo incendio in cucina.,一番近い消火器はどこですか？台所で小さな火事が起きています。,語頭が母音なので冠詞は l'。ホテルや建物の廊下などに設置されている。,,道具と手入れ
L5-0090,5,strappare,引きちぎる|破る|引き裂く,verb,,"strappo, strappi, strappa, strappiamo, strappate, strappano",住まい・日用品,Ho strappato la pagina per sbaglio.,うっかりそのページを破ってしまった。,紙や布を破るときに使う。strappare un muscolo は「筋を傷める」。規則動詞で近過去は avere を使う。,,道具と手入れ
L5-0019,5,il pedale,ペダル,noun,m,pedali,交通・移動,Devo cambiare il pedale della mia bicicletta perché è rotto.,自転車のペダルが壊れているので、交換しなければなりません。,自転車や車、ピアノなどのペダル全般に使う。pedalare は「ペダルをこぐ」。,,運転席から
L5-0130,5,la frizione,クラッチ|摩擦,noun,f,frizioni,交通・移動,"Per partire, premi la frizione e inserisci la prima marcia.",発進するには、クラッチを踏んでローギアに入れてください。,車のクラッチは frizione。「摩擦」の意味もある。マニュアル車は auto con il cambio manuale。,,運転席から
L5-0179,5,lo sterzo,ハンドル|ステアリング,noun,m,sterzi,交通・移動,Lo sterzo di questa macchina è molto duro.,この車のステアリングはとても重いです。,sterzo は操舵機構全般、運転者が握る円形の部分は volante。s＋子音で始まるので冠詞は lo。,il volante,運転席から
L5-0167,5,la retromarcia,バック（車の）|後退ギア,noun,f,retromarce,交通・移動,Metti la retromarcia ed esci piano dal parcheggio.,バックギアに入れて、ゆっくり駐車場から出て。,車のバックギアのこと。fare retromarcia は「バックする」、転じて「方針を撤回する」の意味にもなる。,,運転席から
L5-0158,5,il parabrezza,フロントガラス,noun,m,parabrezza（不変）,交通・移動,Il parabrezza della macchina è rotto.,車のフロントガラスが割れています。,"複合名詞で単複同形。冠詞で数を示す（il parabrezza, i parabrezza）。語尾は -a だが男性名詞。",,運転席から
L5-0399,5,lo specchietto,バックミラー|サイドミラー,noun,m,specchietti,交通・移動,"Prima di partire, regola lo specchietto retrovisore.",出発する前に、バックミラーを調整してください。,正式には specchietto retrovisore。車の外側のミラーは specchietto laterale。小さい鏡の意味もある。s＋子音なので冠詞は lo。,,運転席から
L5-0084,5,il serbatoio,燃料タンク|タンク,noun,m,serbatoi,交通・移動,"Il serbatoio è quasi vuoto, dobbiamo fare benzina.",燃料タンクがほぼ空なので、ガソリンを入れなければなりません。,車の燃料タンクは serbatoio (della benzina)。fare il pieno は「満タンにする」。,,運転席から
L5-0321,5,il tachimetro,速度計|スピードメーター,noun,m,tachimetri,交通・移動,"Il tachimetro della macchina non funziona più, dobbiamo portarla dal meccanico.",車の速度計がもう動かないので、修理工場に持っていかなければなりません。,車やバイクの計器。velocità は「速度」そのもの、tachimetro はそれを示す計器。,,運転席から
L5-0024,5,la precedenza,優先通行権|優先|先行,noun,f,precedenze,交通・移動,"In questo incrocio hai la precedenza, puoi passare.",この交差点ではあなたが優先です、進んでいいですよ。,dare la precedenza（道を譲る）や avere la precedenza（優先権がある）の形で頻出。「優先道路」は strada con diritto di precedenza。,,運転席から
L5-0283,5,la collisione,衝突|衝突事故,noun,f,collisioni,交通・移動,C'è stata una collisione tra due auto sulla strada statale.,国道で2台の車の衝突事故がありました。,事故の「衝突」を指す語。日常会話では incidente（事故）がよく使われる。scontro もほぼ同義。,lo scontro,運転席から
L5-0181,5,la tangenziale,環状道路|バイパス,noun,f,tangenziali,交通・移動,Prendiamo la tangenziale per evitare il traffico del centro.,市街地の渋滞を避けるために環状道路を使いましょう。,都市の中心部を迂回する幹線道路。通行は無料のことが多いが、料金所のある場合もある。,,道と旅路
L5-0365,5,il cavalcavia,陸橋|高架橋,noun,m,i cavalcavia（不変）,交通・移動,"Dopo il cavalcavia, gira a destra e vai dritto fino al semaforo.",陸橋を過ぎたら右に曲がって、信号までまっすぐ行ってください。,複合語で複数形は不変（i cavalcavia）。道路や線路をまたぐ橋を指す。男性名詞。,il sovrappasso,道と旅路
L5-0411,5,la pensilina,（バス停などの）屋根付き待合所|（ホームの）上屋,noun,f,pensiline,交通・移動,Aspettiamo l'autobus sotto la pensilina perché piove.,雨が降っているので、屋根の下でバスを待ちましょう。,バス停の屋根や待合スペース、駅ホームの屋根を指す。バス停そのものは fermata dell'autobus。,,道と旅路
L5-0103,5,la tratta,区間|路線,noun,f,tratte,交通・移動,Questa tratta è chiusa per lavori fino a domani sera.,この区間は明日の夜まで工事のため運休です。,鉄道・バスなどの一区間や路線の一部を指す。別の意味で「人身売買」(tratta di esseri umani)もある。,,道と旅路
L5-0264,5,la vignetta,高速道路の通行許可ステッカー|風刺漫画|一コマ漫画,noun,f,vignette,交通・移動,Per guidare in Svizzera serve la vignetta autostradale.,スイスで運転するには高速道路用のステッカーが必要です。,スイスやオーストリアなどで高速利用のため車に貼る。日常では「風刺漫画、一コマ漫画」の意味のほうが一般的。,,道と旅路
L5-0356,5,percorrere,（道を）進む|踏破する|たどる,verb,,"percorro, percorri, percorre, percorriamo, percorrete, percorrono（過去分詞 percorso）",交通・移動,Per arrivare al castello bisogna percorrere un sentiero nel bosco.,城に着くには、森の小道を歩いて行かなければなりません。,他動詞で直接目的語をとる（percorrere una strada）。過去分詞は不規則で percorso。近過去は avere を使う。,,道と旅路
L5-0218,5,incamminarsi,歩き出す|出発する|向かう,verb,,"mi incammino, ti incammini, si incammina, ci incamminiamo, vi incamminate, si incamminano",交通・移動,Ci incamminiamo verso il centro prima che faccia buio.,暗くなる前に、中心街へ向かって歩き出しましょう。,再帰動詞で、近過去は essere を使う（mi sono incamminato/a）。徒歩で出発する場面で使い、方向は verso や per で示す。,,道と旅路
L5-0221,5,invertire,逆にする|入れ替える|方向転換する,verb,,"invertisco, invertisci, invertisce, invertiamo, invertite, invertiscono",交通・移動,Alla rotonda dobbiamo invertire la marcia e tornare indietro.,ロータリーでUターンして引き返さなければなりません。,-isco型の動詞。「Uターンする」は invertire la marcia または fare inversione。invertire は本来「逆にする」の意味。,,道と旅路
L5-0259,5,la traversata,横断|渡航（海の）|船旅,noun,f,traversate,交通・移動,La traversata dello stretto dura circa venti minuti in traghetto.,フェリーで海峡を渡るのに約20分かかります。,海・山・砂漠・道路などを渡る行為に使う。船で渡る場合は traversata in traghetto / in nave などと言う。動詞は traversare。,,道と旅路
L5-0310,5,la rotta,航路|進路|針路,noun,f,rotte,交通・移動,La nave ha cambiato rotta per il maltempo.,船は悪天候のため進路を変えました。,船や飛行機のコースを指す。cambiare rotta は「進路を変える」で比喩的にも使う。,,道と旅路
L5-0169,5,il salvagente,浮き輪|救命浮き輪|救命具,noun,m,salvagente / salvagenti,交通・移動,Il bambino ha messo il salvagente prima di entrare in acqua.,その子は水に入る前に浮き輪を着けました。,複数形は不変の salvagente と salvagenti の両方が使われる。ライフジャケットも指すことがあるが、救命胴衣は giubbotto di salvataggio とも言う。,,道と旅路
L5-0008,5,inciampare,つまずく|けつまずく,verb,,"inciampo, inciampi, inciampa, inciampiamo, inciampate, inciampano",交通・移動,Sono inciampato su un gradino e sono caduto.,段差につまずいて転びました。,つまずく対象は前置詞 in か su で表す（inciampare in un sasso）。近過去の助動詞は essere も avere も使われるが essere が一般的。,,道と旅路
L5-0191,5,sbattere,ぶつける|打ちつける|泡立てる,verb,,"sbatto, sbatti, sbatte, sbattiamo, sbattete, sbattono",交通・移動,Ho sbattuto la testa contro la porta.,ドアに頭をぶつけてしまった。,sbattere la porta は「ドアをバタンと閉める」。卵を泡立てる意味もある。自動詞で「ぶつかる」は sbattere contro。,,道と旅路
L5-0038,5,l'affresco,フレスコ画,noun,m,affreschi,観光・文化,Gli affreschi di questa chiesa sono del Quattrocento.,この教会のフレスコ画は15世紀のものです。,複数形は affreschi。壁や天井に直接描く技法の絵。動詞は affrescare（フレスコ画を描く）。,,遺跡と信仰
L5-0152,5,il mosaico,モザイク,noun,m,mosaici,観光・文化,A Ravenna abbiamo visto bellissimi mosaici bizantini nelle chiese antiche.,ラヴェンナでは、古い教会で美しいビザンチン様式のモザイクを見ました。,複数形は -ci（mosaici）で、c の発音は「チ」。ラヴェンナやローマの教会のモザイク画が有名。,,遺跡と信仰
L5-0110,5,l'artigianato,工芸|手工業,noun,m,artigianati,観光・文化,Nella nostra regione l'artigianato è molto importante e i prodotti sono famosi.,私たちの地方では手工業がとても重要で、その製品は有名です。,集合的に「職人による手仕事・その製品」を指す。複数形はまれ。「職人」は artigiano。,,遺跡と信仰
L5-0239,5,restaurare,修復する|復元する,verb,,"restauro, restauri, restaura, restauriamo, restaurate, restaurano",観光・文化,Stanno restaurando la facciata della chiesa da due anni.,教会のファサードは2年前から修復中です。,建物・美術品の修復に使う。名詞は il restauro（修復）。規則動詞で、アクセントは restàuro の位置。,ripristinare,遺跡と信仰
L5-0391,5,il reperto,出土品|遺物|展示品（博物館の）,noun,m,reperti,観光・文化,Nel museo ci sono molti reperti romani trovati vicino alla città.,博物館には、街の近くで見つかったローマ時代の出土品がたくさんあります。,考古学的な出土品や、鑑定・捜査で見つかった証拠物件にも使う。博物館では reperti archeologici の表示をよく見る。,,遺跡と信仰
L5-0249,5,il sito,遺跡|場所|サイト,noun,m,siti,観光・文化,Questo sito archeologico è patrimonio dell'UNESCO e si visita in due ore.,この遺跡はユネスコの世界遺産で、2時間ほどで見学できます。,sito archeologico は「遺跡」。il sito web は「ウェブサイト」の意味でも頻出。,,遺跡と信仰
L5-0309,5,la reggia,宮殿|王宮,noun,f,regge,観光・文化,Domenica visitiamo la reggia di Caserta con la nostra guida.,日曜日はガイドと一緒にカゼルタの王宮を見学します。,複数形は regge。王が住んだ壮大な宮殿を指す。一般的な「邸宅・宮殿」は palazzo。,il palazzo reale,遺跡と信仰
L5-0280,5,il cavaliere,騎士|ナイト,noun,m,cavalieri,観光・文化,Nel museo c'è l'armatura di un cavaliere medievale.,博物館に中世の騎士の鎧があります。,馬に乗る人も指す。イタリアでは功労者に贈る勲位の称号（Cavaliere）としても使う。,,遺跡と信仰
L5-0241,5,il santuario,聖域|聖堂|巡礼地,noun,m,santuari,観光・文化,Il santuario si trova in cima alla collina e molti pellegrini lo visitano ogni anno.,その聖堂は丘の上にあり、毎年多くの巡礼者が訪れます。,巡礼や信仰の対象となる場所。普通の教会は chiesa、大聖堂は duomo。複数形は -i で、アクセントは変わらない。,,遺跡と信仰
L5-0077,5,il monastero,修道院,noun,m,monasteri,観光・文化,Domenica visitiamo un monastero medievale sulle colline vicino a Siena.,日曜日はシエナ近郊の丘にある中世の修道院を訪れます。,convento（托鉢修道会などの修道院）とも近い。monastero は主に観想修道会の修道院を指す。,,遺跡と信仰
L5-0281,5,il chiostro,回廊|修道院の中庭,noun,m,chiostri,観光・文化,Il chiostro dell'abbazia è silenzioso e molto bello da visitare.,修道院の回廊は静かで、とても見応えがあります。,教会や修道院の中庭を囲む柱廊。観光名所の案内でよく出てくる。複数形は -i で、語尾の発音は変わらない。,,遺跡と信仰
L5-0016,5,il monaco,修道士|僧侶,noun,m,monaci,観光・文化,Il monaco vive in un convento sulla montagna.,その修道士は山の修道院で暮らしています。,複数形は monaci（-co → -ci）。女性は la monaca（複数 le monache）。仏教の僧にも使える。,,遺跡と信仰
L5-0293,5,il frate,修道士|托鉢修道士,noun,m,frati,観光・文化,Il frate vive in un convento sulla collina vicino al paese.,その修道士は村の近くの丘の上の修道院で暮らしています。,肩書きとして名前の前に付くときは fra / fra' と短くなる（例: Fra Angelico）。女性に当たる語は suora（修道女）で、複数形は suore。,,遺跡と信仰
L5-0102,5,la tomba,墓|墓所,noun,f,tombe,観光・文化,Dentro la chiesa c'è la tomba di un famoso pittore.,教会の中に有名な画家の墓があります。,個人の墓は tomba、墓地全体は cimitero。古代の墳墓や石棺にも使う。,,遺跡と信仰
L5-0025,5,la preghiera,祈り|祈禱|お願い,noun,f,preghiere,観光・文化,Molte persone entrano in chiesa per una preghiera silenziosa.,多くの人が静かに祈るために教会に入る。,pregare（祈る、頼む）の名詞。宗教的な祈りのほか、丁寧な「お願い」の意味でも使う。,l'orazione,遺跡と信仰
L5-0005,5,la fede,信仰|信頼|結婚指輪,noun,f,fedi,観光・文化,Ho molta fede nei miei amici e nella mia famiglia.,私は友人と家族をとても信頼しています。,「結婚指輪」の意味もあり、単数 la fede で普通に使う（複数 fedi は二人分の指輪など）。fede in で「〜への信頼・信仰」。buona fede は「善意」。,,遺跡と信仰
L5-0060,5,celebre,有名な|名高い,adj,,celebri,観光・文化,Firenze è celebre per i suoi musei e le sue chiese.,フィレンツェは美術館や教会で有名です。,-e 形容詞で男女同形。「〜で有名な」は celebre per。famoso よりやや格調高い。,famoso,遺跡と信仰
L5-0336,5,il bello,美男子|美しいもの,noun,m,i belli,観光・文化,Il bello di questa città è che si può girare a piedi.,この街のいいところは、歩いて回れることだ。,il bello は「美、美しいもの」の意味が基本（il bello della vita）。il bello è che ... は「おもしろい（いい）のは〜だ」の意味。「美男子」の意味は口語的で、普通は un bel ragazzo / un bell'uomo を使う。,,遺跡と信仰
L5-0100,5,la penisola,半島,noun,f,penisole,天気・自然,L'Italia è una penisola circondata dal mare su tre lati.,イタリアは三方を海に囲まれた半島です。,la Penisola と大文字にすると通常イタリア半島（イタリア本土）を指す。,,水辺と大地
L5-0172,5,la scogliera,断崖|崖|岩礁,noun,f,scogliere,天気・自然,Dalla scogliera si vede il mare azzurro e tutta la costa.,断崖からは青い海と海岸線全体が見えます。,海に面した崖や岩場を指す。scoglio は「岩礁、海辺の岩」。切り立った崖は falesia ともいう。,,水辺と大地
L5-0051,5,la riva,岸|川岸,noun,f,rive,天気・自然,Ci siamo seduti sulla riva del fiume a guardare il tramonto.,私たちは川岸に座って夕日を眺めました。,川・湖・海の岸を指す。海岸は costa や spiaggia、岸辺は sponda も使う。,la sponda,水辺と大地
L5-0168,5,il ruscello,小川|せせらぎ,noun,m,ruscelli,天気・自然,Vicino alla casa c'è un piccolo ruscello con l'acqua molto fresca.,家の近くに、とても冷たい水の小さな小川があります。,fiume より小さい流れ。s＋子音ではないので冠詞は il、複数は i ruscelli。,,水辺と大地
L5-0258,5,il torrente,渓流|急流|谷川,noun,m,torrenti,天気・自然,Dopo la pioggia il torrente è diventato molto pericoloso.,雨のあと、その渓流はとても危険になった。,山間を流れる川で、雨や雪解けで急に増水する。大きな川は fiume、小川は ruscello。,,水辺と大地
L5-0252,5,la sorgente,泉|水源|源流,noun,f,sorgenti,天気・自然,Il fiume nasce da una piccola sorgente in montagna.,その川は山の小さな泉から始まっています。,acqua di sorgente は「湧き水」。温泉は terme、源泉は sorgente termale。「情報源」は通常 fonte を使う。光源は sorgente di luce。,la fonte,水辺と大地
L5-0303,5,la palude,沼地|湿地,noun,f,paludi,天気・自然,Vicino al lago c'è una grande palude con molti uccelli.,湖の近くに、鳥がたくさんいる大きな湿地があります。,-e で終わる女性名詞で、複数形は paludi。小さめの沼や池は stagno、沼沢地全般は palude。,la zona umida,水辺と大地
L5-0007,5,il ghiacciaio,氷河,noun,m,ghiacciai,天気・自然,Domani saliamo in funivia per vedere il ghiacciaio.,明日はロープウェイで上って氷河を見ます。,複数形は ghiacciai（-io の i が1つ）。ghiaccio は「氷」。発音は「ギャッチャイオ」。,,水辺と大地
L5-0347,5,la lava,溶岩,noun,f,lave,天気・自然,La lava scende lentamente dal vulcano e arriva vicino al paese.,溶岩は火山からゆっくり流れ下り、村の近くまで達します。,火山の溶岩は lava。lavare（洗う）の活用形 lava（彼が洗う）と同形なので文脈で区別する。,,水辺と大地
L5-0345,5,la giungla,ジャングル|密林,noun,f,giungle,天気・自然,Abbiamo fatto un viaggio nella giungla del Borneo.,私たちはボルネオのジャングルを旅しました。,giu- の発音は「ジュ」（i は読まない）。比喩で「弱肉強食の世界」「混沌」の意味にもなる（la giungla urbana）。,,水辺と大地
L5-0306,5,il pendio,斜面|坂,noun,m,pendii,天気・自然,Il sentiero sale lungo un pendio molto ripido.,その小道はとても急な斜面に沿って登っていきます。,il pendio は山や丘の自然の傾斜。町の坂道は salita や discesa を使うことが多い。複数形は -ii。,il declivio,水辺と大地
L5-0107,5,l'altitudine,標高|高度,noun,f,altitudini,天気・自然,Il rifugio si trova a duemila metri di altitudine.,山小屋は標高2000メートルのところにあります。,山や土地の標高は altitudine。建物などの高さは altezza。「高地では」は in altitudine。,,水辺と大地
L5-0188,5,l'orizzonte,地平線|水平線,noun,m,orizzonti,天気・自然,Dalla terrazza si vede il sole che tramonta all'orizzonte.,テラスから、太陽が地平線に沈むのが見えます。,陸でも海でも使う。比喩で「視野」の意味にもなる（ampliare i propri orizzonti）。,,水辺と大地
L5-0180,5,il suolo,土壌|地面|土地,noun,m,suoli,天気・自然,Il suolo di questa regione è molto fertile e adatto alla coltivazione dell'uva.,この地域の土壌はとても肥沃で、ぶどうの栽培に向いています。,terra より硬い語で、地質・農業・環境の文脈で使う。日常の「地面」は terra が普通で、建物の「床」は pavimento。,,水辺と大地
L5-0067,5,il fango,泥|ぬかるみ,noun,m,fanghi,天気・自然,Dopo la pioggia le strade sono piene di fango.,雨のあと、道は泥だらけです。,複数形 fanghi は主に温泉の泥療法（fanghi termali）の意味で使う。fangoso は「ぬかるんだ」。,,水辺と大地
L5-0202,5,il cespuglio,茂み|低木,noun,m,cespugli,天気・自然,Il gatto si nasconde dietro il cespuglio in giardino.,猫は庭の茂みの後ろに隠れています。,単数は -io で終わり、複数は cespugli（i が1つ）。庭や野原にある低い木。arbusto はやや専門的な「低木」。,l'arbusto,水辺と大地
L5-0359,5,la siepe,生け垣|垣根,noun,f,siepi,天気・自然,Il giardino è circondato da una siepe molto alta.,庭はとても高い生け垣に囲まれています。,植物で作った垣根を指す。柵や塀（金属・木・石）は recinzione や muro など別の語を使う。,,水辺と大地
L5-0307,5,il pino,松,noun,m,pini,天気・自然,Ci sono molti pini lungo la strada che porta al mare.,海へ続く道沿いにはたくさんの松があります。,地中海沿岸の風景を象徴する木。松ぼっくりは la pigna、松の実は i pinoli。,,水辺と大地
L5-0204,5,coltivare,栽培する|耕す|育てる,verb,,"coltivo, coltivi, coltiva, coltiviamo, coltivate, coltivano",天気・自然,Mio nonno coltiva pomodori e zucchine nel suo piccolo orto.,祖父は小さな畑でトマトとズッキーニを育てています。,規則動詞（-are）。比喩的に、趣味や友情などを「大切に育む」の意味でも使う（coltivare un'amicizia）。,,水辺と大地
L5-0032,5,splendere,輝く|(太陽が)照る,verb,,"splendo, splendi, splende, splendiamo, splendete, splendono（過去分詞 splenduto）",天気・自然,Oggi il sole splende e il mare è bellissimo.,今日は太陽が輝いていて、海がとても美しい。,天気では splende il sole（太陽が照る）が定番。過去分詞 splenduto はほとんど使われず、複合時制は避けられがち。,,空と気候
L5-0185,5,tramontare,沈む（日が）|日が沈む,verb,,"tramonto, tramonti, tramonta, tramontiamo, tramontate, tramontano",天気・自然,In estate il sole tramonta dopo le nove.,夏は日が9時過ぎに沈みます。,助動詞は essere（il sole è tramontato）。名詞 il tramonto は「日没、夕焼け」。反対は sorgere。,,空と気候
L5-0058,5,la brezza,そよ風|微風,noun,f,brezze,天気・自然,La sera c'è sempre una brezza fresca dal mare.,夕方はいつも海から涼しいそよ風が吹きます。,海辺では brezza marina（海風）という言い方もよく使う。vento より穏やかな風を指す。,,空と気候
L5-0150,5,mite,温暖な|穏やかな,adj,,miti,天気・自然,In Sicilia l'inverno è molto mite.,シチリアの冬はとても温暖です。,-e 形容詞なので男女同形、複数は miti。気候・冬・気温に使う。人の性格にも使えるが「穏やかな」の意味になる。,,空と気候
L5-0071,5,gelido,凍るように冷たい|氷のような,adj,,"gelida, gelidi, gelide",天気・自然,"Il vento di stamattina è gelido, mettiti la sciarpa.",今朝の風は凍るように冷たいから、マフラーをしなさい。,風・水・手などに使う。比喩的に「冷淡な」の意味もあり、sguardo gelido は冷ややかな視線。,,空と気候
L5-0133,5,il gelo,厳しい寒さ|凍てつく寒気|氷点下の寒さ|凍結,noun,m,geli,天気・自然,Quest'inverno il gelo ha rovinato tutti i fiori del giardino.,今年の冬は厳しい寒さで庭の花がすべて駄目になった。,「霜」は普通 la brina（霜）や la gelata（凍結、霜害）を使う。複数形 geli はまれで、ふつうは単数で使う。,,空と気候
L5-0135,5,ghiacciato,凍った|氷に覆われた|キンキンに冷えた,adj,,"ghiacciata, ghiacciati, ghiacciate",天気・自然,"Il lago è ghiacciato, quindi non possiamo fare il bagno.",湖が凍っているので、泳げません。,飲み物が「氷のように冷たい」意味でも使う（una birra ghiacciata）。動詞 ghiacciare の過去分詞でもある。,gelato,空と気候
L5-0276,5,la brina,霜,noun,f,brine,天気・自然,Stamattina c'era la brina sui campi e sulle auto.,今朝は畑や車に霜が降りていました。,主に単数で使う。「霜が降りる」は c'è la brina、si forma la brina、cade la brina などと言う。,,空と気候
L5-0357,5,la rugiada,露,noun,f,rugiade,天気・自然,Al mattino l'erba è coperta di rugiada.,朝には草が露に覆われています。,複数形 rugiade はあまり使わず、ふつうは単数で用いる。詩的な文脈でもよく出てくる。,,空と気候
L5-0189,5,piovoso,雨の多い|雨降りの,adj,,"piovosa, piovosi, piovose",天気・自然,"Il mese scorso è stato molto piovoso, quindi siamo rimasti spesso in albergo.",先月はとても雨が多かったので、私たちはよくホテルにいました。,天気や季節、月を形容する語。「（今）雨が降っている」は piove や sta piovendo と動詞で言い、piovoso は使わない。,,空と気候
L5-0390,5,la pozzanghera,水たまり,noun,f,pozzanghere,天気・自然,"Attenzione, c'è una grande pozzanghera davanti al portone dopo la pioggia.",気をつけて、雨のあとで入口の前に大きな水たまりがあるよ。,複数形は -h- が入る（pozzanghere）。発音は「ポッツァンゲーラ」で g は硬い音。,,空と気候
L5-0137,5,la grandine,雹|あられ,noun,f,grandini,天気・自然,Ieri sera è caduta la grandine e ha rovinato le macchine.,昨夜雹が降って、車が傷ついた。,ふつう単数で使う。「雹が降る」は grandinare（非人称動詞）でも言え、Grandina. は「雹が降っている」。,,空と気候
L5-0136,5,grandinare,雹が降る|あられが降る,verb,,grandina（三人称単数のみ）／過去分詞 grandinato,天気・自然,Ieri sera ha grandinato per dieci minuti.,昨夜、10分間雹が降りました。,天候を表す非人称動詞で、基本は三人称単数のみ。名詞は la grandine（雹）。,,空と気候
L5-0346,5,lampeggiare,稲妻が光る|点滅する|パッシングする,verb,,"lampeggio, lampeggi, lampeggia, lampeggiamo, lampeggiate, lampeggiano",天気・自然,"Sta lampeggiando, forse tra poco arriva un temporale.",稲光がしている、もうすぐ雷雨が来るかもしれない。,天候の非人称では lampeggia（稲妻が光る）と3人称単数で使う。助動詞は essere も avere も可。,,空と気候
L5-0358,5,schiarirsi,晴れる|明るくなる,verb,,"mi schiarisco, ti schiarisci, si schiarisce, ci schiariamo, vi schiarite, si schiariscono",天気・自然,Il cielo si schiarisce e domani dovrebbe uscire il sole.,空が明るくなってきて、明日は晴れるはずです。,-isc- 型の再帰動詞。非再帰の schiarire は「明るくする」。天気では tempo/cielo が主語。近過去は essere を使う。,,空と気候
L5-0262,5,l'uragano,ハリケーン|大暴風,noun,m,uragani,天気・自然,Un uragano ha colpito la costa durante la notte.,夜の間にハリケーンが海岸を襲いました。,母音で始まるので l' と省略する。台風は tifone、竜巻は tornado と言い分ける。,,災害と環境
L5-0106,5,l'alluvione,洪水|大水害,noun,f,alluvioni,天気・自然,"Dopo l'alluvione, molte strade sono rimaste chiuse per giorni.",洪水の後、多くの道路が何日も通行止めのままでした。,川の氾濫による災害を指す。inondazione は水があふれること全般で、ほぼ同義。母音始まりなので l' を使う。,l'inondazione,災害と環境
L5-0212,5,la frana,地すべり|土砂崩れ,noun,f,frane,天気・自然,"A causa della frana, la strada per il paese è chiusa.",土砂崩れのため、村へ続く道は閉鎖されています。,大雨の後などに道路や鉄道が止まる原因としてニュースでよく使う。「崖崩れ」にも使える。,,災害と環境
L5-0314,5,la siccità,干ばつ|日照り,noun,f,siccità（不変）,天気・自然,Quest'estate la siccità ha danneggiato molti campi in tutta la regione.,今年の夏は干ばつで、地域全体の多くの畑が被害を受けました。,-à で終わる名詞は複数形も同形。ニュースで頻出し、grave siccità（深刻な干ばつ）などと使う。,,災害と環境
L5-0230,5,l'ondata,波|急増|（熱波・寒波などの）波,noun,f,ondate,天気・自然,Questa settimana arriva un'ondata di caldo su tutta l'Italia.,今週はイタリア全土に熱波が押し寄せます。,un'ondata di caldo（熱波）、di freddo（寒波）のように〈di＋名詞〉で使う。波一般は onda、ondata は押し寄せる波や現象の高まり。,,災害と環境
L5-0344,5,evacuare,避難させる|退去させる|空にする,verb,,"evacuo, evacui, evacua, evacuiamo, evacuate, evacuano",天気・自然,La polizia ha evacuato tutto l'edificio dopo l'allarme.,警報の後、警察は建物全体から人々を避難させました。,規則動詞（他動詞）。建物や地域を目的語にして「そこから人を避難させる」。避難させられる人が主語なら受け身で essere evacuato / venire evacuato を使う。,,災害と環境
L5-0074,5,l'inquinamento,汚染|公害,noun,m,inquinamenti,天気・自然,L'inquinamento dell'aria è un grosso problema nelle grandi città.,大気汚染は大都市の大きな問題です。,inquinamento atmosferico（大気汚染）、inquinamento acustico（騒音公害）のように形容詞と組み合わせる。複数形は稀。,,災害と環境
L5-0141,5,inquinare,汚染する|汚す,verb,,"inquino, inquini, inquina, inquiniamo, inquinate, inquinano",天気・自然,Le fabbriche inquinano l'aria e i fiumi della nostra città.,工場は私たちの街の空気と川を汚染しています。,規則動詞（-are）。名詞は inquinamento（汚染）。他動詞として「空気・水を汚染する」、目的語なしでも使える。,,災害と環境
L5-0123,5,l'ecologia,生態学|エコロジー|環境保護,noun,f,ecologie,天気・自然,Mia sorella studia ecologia all'università di Bologna.,姉はボローニャ大学で生態学を勉強しています。,学問としての「生態学」と、環境を守る考え方の両方に使う。形容詞は ecologico（環境にやさしい）。,,災害と環境
L5-0331,5,il sopracciglio,眉毛|眉,noun,m,"sopracciglia（女性複数）, sopraccigli",体・健康,Ha le sopracciglia molto folte.,彼女はとても眉毛が濃いです。,複数形が不規則で、le sopracciglia（両眉・眉毛全体）が一般的。男性複数の i sopraccigli も正しい形で使われるが、頻度はやや低い。,,体の部位（くわしく）
L5-0300,5,la mascella,あご（顎）|顎骨,noun,f,mascelle,体・健康,Il dentista mi ha controllato la mascella dopo la caduta.,転んだあと、歯医者さんが私のあごの骨を診てくれた。,日常ではあご全体を指すが、解剖学では上顎骨を指す。下あごの骨は mandibola、顔の「あご（先端）」は mento。,,体の部位（くわしく）
L5-0352,5,la nuca,うなじ|首の後ろ,noun,f,nuche,体・健康,Ho un forte dolore alla nuca da stamattina.,今朝から首の後ろがひどく痛みます。,首の後ろ側の部分。首全体は il collo、のどは la gola。,,体の部位（くわしく）
L5-0403,5,la clavicola,鎖骨,noun,f,clavicole,体・健康,Mi sono rotto la clavicola cadendo dalla bicicletta.,自転車から落ちて鎖骨を折りました。,体の部位には所有形容詞でなく再帰代名詞と定冠詞を使う（mi sono rotto la clavicola）。発音は clavìcola で、アクセントは -vi- に置く。,,体の部位（くわしく）
L5-0324,5,il torace,胸部|胸郭,noun,m,toraci,体・健康,Ho un forte dolore al torace da ieri sera.,昨夜から胸にひどい痛みがあります。,医学的・解剖学的な語。日常会話では il petto（胸）もよく使う。複数形は toraci。,,体の部位（くわしく）
L5-0070,5,il fianco,脇腹|腰（側面）|側面,noun,m,fianchi,体・健康,Ho un dolore al fianco destro da stamattina.,今朝から右の脇腹が痛いです。,胴体の横の部分（脇腹）や、物の側面を指す。複数形 i fianchi は「腰回り」の意味でも使う。a fianco di は「〜の隣に」という前置詞句。,,体の部位（くわしく）
L5-0078,5,l'ombelico,へそ,noun,m,ombelichi,体・健康,Il bambino ha un piccolo dolore vicino all'ombelico.,その子はおへその近くが少し痛いです。,複数形は ombelichi（-co → -chi で綴りに h が入る）。母音で始まるので冠詞は l'。,,体の部位（くわしく）
L5-0057,5,il bacino,骨盤|腰まわり,noun,m,bacini,体・健康,"Dopo la caduta, ho un forte dolore al bacino.",転んでから、骨盤にひどい痛みがあります。,bacino は「盆地、港のドック、流域」の意味もあり、文脈で判断する。「キス」は bacio で別語。,,体の部位（くわしく）
L5-0266,5,l'anca,股関節|腰（骨盤の横あたり）,noun,f,anche,体・健康,Mi fa male l'anca destra quando cammino.,歩くと右の腰（股関節）が痛みます。,複数形は anche で、副詞の anche（〜も）と同形。腰痛の「腰」（背中の下部）は la schiena や la zona lombare、体の脇腹は il fianco と言い分ける。,,体の部位（くわしく）
L5-0157,5,il palmo,手のひら,noun,m,palmi,体・健康,Ho una piccola ferita sul palmo della mano.,手のひらに小さな傷があります。,palmo della mano の形でよく使う。palma は「ヤシ」または手のひらの意味でも使われる。,,体の部位（くわしく）
L5-0020,5,il polpaccio,ふくらはぎ,noun,m,polpacci,体・健康,Dopo la lunga camminata mi fanno male i polpacci.,長く歩いたので、ふくらはぎが痛いです。,すねは lo stinco、足首は la caviglia。両脚のことを言うときは複数形 i polpacci。,,体の部位（くわしく）
L5-0237,5,il rene,腎臓,noun,m,reni,体・健康,Ho un forte dolore al rene destro da ieri.,昨日から右の腎臓に強い痛みがあります。,複数形は i reni。女性複数形の le reni は「腰（腰部）」の意味で、mal di reni（腰痛）のように使う。,,体の部位（くわしく）
L5-0363,5,la vescica,膀胱|水ぶくれ,noun,f,vesciche,体・健康,Ho un'infezione alla vescica e devo vedere un medico.,膀胱炎になったので、医者に診てもらわなければなりません。,「水ぶくれ」の意味もあり、靴ずれの水ぶくれにも使う。「胆嚢」は cistifellea で別語。,,体の部位（くわしく）
L5-0387,5,l'ormone,ホルモン,noun,m,ormoni,体・健康,Il medico controlla gli ormoni della tiroide.,医師は甲状腺のホルモンを検査します。,-one で終わるが男性名詞。母音で始まるので単数は l'ormone、複数は gli ormoni。,,体の部位（くわしく）
L5-0311,5,la saliva,唾液,noun,f,salive,体・健康,Il dentista ha detto che la saliva protegge i denti dalle carie.,歯医者は、唾液が虫歯から歯を守ると言いました。,複数形 salive はまれで、通常は単数で使う。「唾」は sputo、「唾を吐く」は sputare。,,体の部位（くわしく）
L5-0194,5,l'udito,聴力|聴覚,noun,m,udito（通常は単数形で用いる）,体・健康,Mio nonno ha problemi di udito e non sente bene al telefono.,祖父は聴力に問題があり、電話がよく聞こえません。,五感の一つ「聴覚」も指す。複数形はほぼ使わない。l'orecchio は「耳」、l'udito は「聞く能力」。,l'ascolto,体の部位（くわしく）
L5-0354,5,l'olfatto,嗅覚,noun,m,olfatti,体・健康,Dopo il raffreddore ho perso l'olfatto per alcuni giorni.,風邪のあと、数日間嗅覚を失いました。,"五感の一つ。他は la vista, l'udito, il gusto, il tatto。母音で始まるので冠詞は l'。複数形はほとんど使わない。",,体の部位（くわしく）
L5-0022,5,la postura,姿勢,noun,f,posture,体・健康,"Dopo ore al computer, la mia postura è sempre peggiore.",何時間もパソコンに向かっていると、私の姿勢はますます悪くなる。,体の姿勢を指す。「態度・立場」の意味でも使うが、日常では体の姿勢が中心。assumere una postura で「姿勢をとる」。,,体の部位（くわしく）
L5-0045,5,la frattura,骨折|亀裂,noun,f,fratture,体・健康,Il dottore dice che è una frattura al braccio e serve il gesso.,医者は腕の骨折で、ギプスが必要だと言っています。,医療では frattura が正式な語。「骨を折る」は rompersi。「腕を折った」は mi sono rotto il braccio がよく使われる。,,けがと検査
L5-0055,5,l'ustione,やけど|火傷,noun,f,ustioni,体・健康,Mi sono fatto un'ustione alla mano con l'acqua bollente.,熱湯で手にやけどをしました。,ustione は l' の形で、複数形は le ustioni。「やけどする」は farsi un'ustione や ustionarsi。日焼けは scottatura solare。,la scottatura,けがと検査
L5-0117,5,la cicatrice,傷跡|傷痕,noun,f,cicatrici,体・健康,Ho una cicatrice sul braccio dopo l'operazione.,手術のあと、腕に傷跡が残っています。,複数形は -ce → -ci。ferita は「傷（負傷）」、cicatrice は治ったあとに残る跡。,,けがと検査
L5-0073,5,l'infarto,心臓発作|心筋梗塞,noun,m,infarti,体・健康,Mio padre ha avuto un infarto l'anno scorso.,父は去年心臓発作を起こしました。,正式には infarto del miocardio（心筋梗塞）。avere un infarto で「発作を起こす」。救急は 118 に電話。,l'infarto cardiaco,けがと検査
L5-0395,5,lo svenimento,失神|気絶,noun,m,svenimenti,体・健康,"Dopo lo svenimento, il ragazzo è stato portato subito in ospedale.",失神したあと、少年はすぐに病院へ運ばれました。,動詞は svenire（essere 助動詞）。「気を失う」は svenire、「失神しそうだ」は sto per svenire。s＋子音なので冠詞は lo。,,けがと検査
L5-0176,5,soffocare,窒息する|息が詰まる|窒息させる,verb,,"soffoco, soffochi, soffoca, soffochiamo, soffocate, soffocano",体・健康,"Aiuto, mio figlio sta soffocando, chiamate un'ambulanza!",助けて、息子が窒息しています、救急車を呼んでください！,"自動詞（窒息する）にも他動詞（窒息させる）にも使う。近過去の助動詞は、自動詞では主に essere、他動詞では avere。-chi, -chiamo のように h が入る。",,けがと検査
L5-0200,5,il batterio,細菌|バクテリア,noun,m,batteri,体・健康,Questo antibiotico combatte i batteri che causano l'infezione.,この抗生物質は感染症の原因となる細菌と闘います。,複数形は batteri。ウイルスは il virus（複数形も virus で不変）で、細菌とは別物。,,けがと検査
L5-0164,5,la radiografia,レントゲン写真|X線検査,noun,f,radiografie,体・健康,Il medico mi ha prescritto una radiografia al torace.,医者は私に胸部のレントゲンを指示しました。,口語では短縮形の la radio も使うが、「ラジオ」と同形なので文脈に注意。fare una radiografia で「レントゲンを撮る」。,la lastra,けがと検査
L5-0377,5,il referto,検査結果|所見書|報告書（医療の）,noun,m,referti,体・健康,Quando posso ritirare il referto delle analisi del sangue?,血液検査の結果はいつ受け取れますか？,医師や検査機関が出す所見・結果の書類。診断書そのものは certificato medico と言う。,,けがと検査
L5-0175,5,la siringa,注射器|シリンジ,noun,f,siringhe,体・健康,Il medico usa una siringa nuova per fare l'iniezione.,医師は注射をするのに新しい注射器を使います。,複数形は siringhe（g の後ろに h が入り、硬い g の音を保つ）。注射そのものは l'iniezione、la puntura は刺すことや虫刺されも指す。,,けがと検査
L5-0253,5,la stampella,松葉づえ|ハンガー,noun,f,stampelle,体・健康,Dopo l'incidente ho dovuto usare le stampelle per due settimane.,事故のあと、2週間松葉づえを使わなければなりませんでした。,松葉づえは普通複数形 le stampelle で使う。地域によっては服のハンガーの意味でも使われる。,la gruccia,けがと検査
L5-0301,5,medicare,手当てする|治療する,verb,,"medico, medichi, medica, medichiamo, medicate, medicano",体・健康,Il dottore medica la ferita con attenzione.,医者は傷を丁寧に手当てします。,"-care 動詞なので medichi, medichiamo のように h が入る。傷など軽い手当てに使い、病気の治療は curare が一般的。",,けがと検査
L5-0215,5,la guarigione,回復|治癒,noun,f,guarigioni,体・健康,Auguro una pronta guarigione a tutta la tua famiglia.,あなたのご家族みんなが早く回復しますように。,病気やけがからの回復。「早く良くなってね」は Buona guarigione! や Auguri di pronta guarigione! と言う。,,けがと検査
L5-0393,5,la sanità,保健医療|医療制度,noun,f,sanità（不変）,体・健康,In Italia la sanità pubblica è gratuita per molti servizi.,イタリアでは公的医療の多くのサービスが無料です。,-à で終わる名詞は不変。「健全さ」の意味もあるが、日常では医療制度の意味でよく使う。,il sistema sanitario,けがと検査
L5-0229,5,la nutrizione,栄養|栄養摂取,noun,f,nutrizioni,体・健康,Una buona nutrizione è importante per la salute di tutta la famiglia.,良い栄養は家族みんなの健康にとって大切です。,nutrimento は「栄養物」、alimentazione は「食生活」。nutrizione は栄養摂取や栄養学の文脈で使う。,,食べる・眠る
L5-0353,5,nutrirsi,栄養を取る|（〜を）常食とする,verb,,"mi nutro, ti nutri, si nutre, ci nutriamo, vi nutrite, si nutrono",体・健康,"Mi nutro soprattutto di frutta e verdura, perché è più leggera.",私は主に果物と野菜を食べています。そのほうが軽いからです。,再帰動詞。「〜を常食とする」は nutrirsi di ...。他動詞 nutrire は「養う、栄養を与える」。やや改まった語で、日常では mangiare が普通。,,食べる・眠る
L5-0287,5,digerire,消化する|（嫌なことを）我慢する|受け入れる,verb,,"digerisco, digerisci, digerisce, digeriamo, digerite, digeriscono",体・健康,Dopo cena faccio una passeggiata per digerire meglio.,夕食後は消化を助けるために散歩をします。,-isco 型の動詞。比喩的な「（嫌なことを）受け入れる」の意味では、否定形 non digerisco で「我慢できない」の意味でよく使う。,,食べる・眠る
L5-0368,5,deglutire,飲み込む|嚥下する,verb,,"deglutisco, deglutisci, deglutisce, deglutiamo, deglutite, deglutiscono",体・健康,Ho mal di gola e faccio fatica a deglutire.,喉が痛くて、飲み込むのがつらいです。,-isco 型の動詞。やや医学的・改まった語で、日常会話では inghiottire がよく使われる。,inghiottire,食べる・眠る
L5-0370,5,ingoiare,飲み込む|丸呑みする|(嫌なことを)我慢する,verb,,"ingoio, ingoi, ingoia, ingoiamo, ingoiate, ingoiano",体・健康,Il bambino ha ingoiato una moneta per sbaglio.,その子は誤って硬貨を飲み込んでしまった。,inghiottire もほぼ同義。比喩的に「(屈辱などを)耐え忍ぶ」の意味でも使う。近過去の助動詞は avere。,inghiottire,食べる・眠る
L5-0404,5,digiunare,断食する|絶食する,verb,,"digiuno, digiuni, digiuna, digiuniamo, digiunate, digiunano",体・健康,Prima delle analisi del sangue bisogna digiunare per dodici ore.,血液検査の前は12時間絶食しなければなりません。,助動詞は avere（ho digiunato）。宗教的な断食にも健康上の絶食にも使う。名詞は il digiuno。essere a digiuno は「空腹で」。,,食べる・眠る
L5-0046,5,ingrassare,太る|肥える,verb,,"ingrasso, ingrassi, ingrassa, ingrassiamo, ingrassate, ingrassano",体・健康,"Da quando non faccio sport, sono ingrassato di cinque chili.",運動をしなくなってから、5キロ太りました。,自動詞では近過去に essere をとる（sono ingrassato/a）。他動詞「太らせる」では avere。「痩せる」は dimagrire。,,食べる・眠る
L5-0315,5,snello,ほっそりした|すらりとした,adj,,"snella, snelli, snelle",体・健康,"Mia sorella è alta e snella, come mia madre.",姉は母と同じように、背が高くてほっそりしています。,体型を褒めるときに使う。magro は「痩せた」で否定的な響きになることもある。,,食べる・眠る
L5-0079,5,pallido,青白い|顔色が悪い|淡い,adj,,"pallida, pallidi, pallide",体・健康,Sei molto pallido oggi. Ti senti bene?,今日はとても顔色が悪いね。気分は大丈夫?,人の顔色だけでなく、色が淡いことにも使う(un rosa pallido)。性数一致する。,,食べる・眠る
L5-0187,5,l'insonnia,不眠症|不眠,noun,f,insonnie,体・健康,Soffro di insonnia da una settimana e sono sempre stanco.,1週間前から眠れなくて、いつも疲れています。,「不眠に苦しむ」は soffrire di insonnia。症状としては複数形はあまり使わない。,,食べる・眠る
L5-0242,5,sbadigliare,あくびをする,verb,,"sbadiglio, sbadigli, sbadiglia, sbadigliamo, sbadigliate, sbadigliano",体・健康,"Dopo il viaggio lungo, tutti sbadigliavano sul treno.",長い旅のあと、列車の中でみんながあくびをしていた。,-gliare 動詞なので tu の活用は sbadigli（i は1つだけ）。近過去は avere を使う（ho sbadigliato）。,,食べる・眠る
L5-0329,5,il risveglio,目覚め|起床,noun,m,risvegli,体・健康,Il risveglio è stato difficile dopo il lungo viaggio in treno.,長い列車の旅のあとで、目覚めはつらかった。,risvegliare / risvegliarsi（目覚める）の名詞形。「春の目覚め」など比喩的にも使う。モーニングコールは sveglia。,,食べる・眠る
L5-0171,5,lo scippo,ひったくり,noun,m,scippi,トラブル・緊急,Ho subito uno scippo vicino alla stazione e ho chiamato la polizia.,駅の近くでひったくりに遭い、警察を呼びました。,バイクなどで通りすがりに鞄を奪う行為。人は lo scippatore。スリは il borseggio、強盗は la rapina。,,事件と救助
L5-0243,5,lo scippatore,ひったくり犯|ひったくり,noun,m,scippatori,トラブル・緊急,Uno scippatore mi ha rubato la borsa mentre camminavo.,歩いているときにひったくりにバッグを盗まれました。,女性形は la scippatrice。スリは borseggiatore、強盗は rapinatore で区別する。動詞は scippare。,,事件と救助
L5-0236,5,il reato,犯罪行為|罪,noun,m,reati,トラブル・緊急,Rubare è un reato punito dalla legge.,盗みは法律で罰せられる犯罪です。,法律上の犯罪・違反行為を指す。crimine はより重大な犯罪や道義的な悪事に使うことが多い。,,事件と救助
L5-0132,5,la fuga,逃亡|逃走|（ガス・水の）漏れ,noun,f,fughe,トラブル・緊急,"C'è una fuga di gas in cucina, chiamate subito qualcuno!",台所でガス漏れです、すぐに誰かを呼んでください！,fuga di gas はガス漏れ、fuga d'acqua は水漏れ。in fuga は「逃走中の」。,,事件と救助
L5-0054,5,smarrire,なくす|紛失する|見失う,verb,,"smarrisco, smarrisci, smarrisce, smarriamo, smarrite, smarriscono",トラブル・緊急,Ho smarrito il passaporto e devo andare alla polizia.,パスポートをなくしたので、警察に行かなければなりません。,-isco 型の動詞。やや改まった語で、日常では perdere も多い。再帰形 smarrirsi は「道に迷う」。,,事件と救助
L5-0087,5,il sospetto,疑い|疑惑,noun,m,sospetti,トラブル・緊急,Ho il sospetto che lui non dica la verità.,彼は本当のことを言っていないのではと疑っている。,avere il sospetto che＋接続法で「〜ではないかと疑う」。形容詞 sospetto は「怪しい」、名詞では容疑者も指す。,,事件と救助
L5-0332,5,il/la testimone,証人|目撃者,noun,mf,"i testimoni, le testimoni",トラブル・緊急,Il testimone ha visto tutto e ha chiamato la polizia.,目撃者はすべてを見て、警察に電話しました。,語尾は -e で男女同形。複数は testimoni で、冠詞 i / le で性を区別する。結婚式の「立会人」も testimone。,,事件と救助
L5-0316,5,soccorrere,救助する|助ける,verb,,"soccorro, soccorri, soccorre, soccorriamo, soccorrete, soccorrono（過去分詞 soccorso）",トラブル・緊急,Un passante ha soccorso il ragazzo caduto dalla bicicletta.,通行人が自転車から落ちた少年を助けました。,過去分詞が不規則（soccorso）。助動詞は avere。名詞は soccorso（救助）で、pronto soccorso は救急外来。,aiutare,事件と救助
L5-0378,5,il soccorritore,救助者|救急隊員,noun,m,"i soccorritori, le soccorritrici",トラブル・緊急,I soccorritori sono arrivati sul posto in pochi minuti.,救助隊員は数分で現場に到着しました。,女性形は la soccorritrice。-tore で終わる名詞の多くは女性形が -trice になる（attore と attrice など）。ただし dottore と dottoressa のような例外もある。,,事件と救助
L5-0274,5,l'autorità,当局|権威|権限,noun,f,autorità（不変）,トラブル・緊急,Dobbiamo chiedere il permesso alle autorità locali.,私たちは地元当局に許可を求めなければなりません。,-à で終わる名詞は複数形も同形。「当局」の意味では複数 le autorità で使うことが多い。,,事件と救助
L5-0004,5,il diritto,権利|法律|法学,noun,m,diritti,抽象・社会,Tutti hanno il diritto di essere trattati con rispetto.,誰もが敬意をもって扱われる権利を持っています。,「権利」は diritto di + 不定詞。「法律（学）」の意味もある。形容詞 diritto は「まっすぐな」、andare diritto は「直進する」。,,権利と社会問題
L5-0072,5,la giustizia,正義|司法,noun,f,giustizie,抽象・社会,Tutti hanno diritto a una giustizia equa e rapida.,誰もが公正で迅速な司法を受ける権利がある。,「正義」と「司法制度」の両方を表す。複数形は主に制度や種類を指すときに使う。,,権利と社会問題
L5-0203,5,la cittadinanza,市民権|国籍,noun,f,cittadinanze,抽象・社会,Ha chiesto la cittadinanza italiana dopo dieci anni di residenza.,彼は10年の居住の後、イタリア国籍を申請しました。,法的な国籍・市民権を指す。「国籍」は nazionalità とも言うが、cittadinanza は法的な資格を強調する。,,権利と社会問題
L5-0159,5,il partito,政党|党,noun,m,partiti,抽象・社会,Quale partito hai votato alle ultime elezioni?,前回の選挙ではどの政党に投票しましたか？,un buon partito は「結婚相手として条件のよい人」の意味にもなる。partita（試合）と混同しないこと。,,権利と社会問題
L5-0286,5,il conflitto,対立|紛争|衝突,noun,m,conflitti,抽象・社会,Il conflitto tra i due paesi dura da molti anni.,両国の紛争は何年も続いている。,国家間の「紛争」から個人間の「対立」まで広く使う。conflitto di interessi は「利益相反」。,,権利と社会問題
L5-0308,5,il razzismo,人種差別|人種主義,noun,m,razzismi,抽象・社会,Il razzismo è un problema serio in molti paesi.,人種差別は多くの国で深刻な問題です。,形容詞・名詞は razzista（男女同形）。「人種差別をする人」は un razzista。複数形はほとんど使われない。,,権利と社会問題
L5-0405,5,la discriminazione,差別|区別,noun,f,discriminazioni,抽象・社会,La discriminazione razziale è vietata dalla legge in Italia.,人種差別はイタリアでは法律で禁止されています。,-zione で終わる名詞は女性。discriminazione razziale（人種差別）、di genere（性差別）などと続けて使う。,,権利と社会問題
L5-0361,5,l'uguaglianza,平等|同等,noun,f,uguaglianze,抽象・社会,Tutti lottano per l'uguaglianza dei diritti tra uomini e donne.,皆が男女の権利の平等のために闘っている。,parità も近い意味。uguaglianza は法的・社会的な平等という理念に使う。「平等な」は uguale。,la parità,権利と社会問題
L5-0394,5,la solidarietà,連帯|団結|思いやり,noun,f,solidarietà（不変）,抽象・社会,"Dopo il terremoto, molte persone hanno mostrato grande solidarietà verso le famiglie colpite.",地震の後、多くの人が被災した家族に大きな連帯の気持ちを示した。,-à で終わる名詞は複数形も同形。mostrare solidarietà（連帯を示す）や per solidarietà（連帯のために）の形で頻出。,,権利と社会問題
L5-0023,5,la povertà,貧困|貧しさ,noun,f,povertà（不変）,抽象・社会,La povertà è un problema serio in molti paesi del mondo.,貧困は世界の多くの国で深刻な問題です。,-à で終わる名詞は複数形も同形。通常は単数で使う抽象名詞。,,権利と社会問題
L5-0026,5,la ricchezza,富|豊かさ,noun,f,ricchezze,抽象・社会,"La vera ricchezza non è solo il denaro, ma anche la salute e il tempo libero.",本当の豊かさはお金だけでなく、健康や自由な時間でもあります。,複数形 ricchezze は「財産・資源」の意味でも使う。形容詞は ricco。反意語は povertà。,,権利と社会問題
L5-0034,5,il territorio,領土|地域|領域,noun,m,territori,抽象・社会,Questo prodotto tipico viene dal territorio intorno a Parma.,この特産品はパルマ周辺の地域のものです。,国の領土にも、ワインや食材の産地という意味の「土地」にも使う。territorio nazionale は「国土」。,,権利と社会問題
L5-0052,5,il sentimento,感情|気持ち,noun,m,sentimenti,感情・性格,Non riesco a nascondere i miei sentimenti per lui.,彼への気持ちを隠すことができません。,愛情・思いなど心の動きを指す。emozione は一時的で強い「感動・情動」、sentimento はより持続的な感情。,,しみじみした気持ち
L5-0098,5,emozionarsi,感動する|どきどきする|緊張する,verb,,"mi emoziono, ti emozioni, si emoziona, ci emozioniamo, vi emozionate, si emozionano",感情・性格,Mi emoziono sempre quando sento questa canzone.,この歌を聞くといつも感動します。,再帰動詞。近過去は essere を使う（mi sono emozionato/a）。「〜に感動する」は emozionarsi per 〜、「〜して感動する」は a + 不定詞（mi emoziono a sentirlo）。,,しみじみした気持ち
L5-0205,5,commuoversi,感動する|心を打たれる,verb,,"mi commuovo, ti commuovi, si commuove, ci commuoviamo, vi commuovete, si commuovono（過去分詞 commosso）",感情・性格,Mi commuovo sempre quando vedo questo film.,この映画を見ると、私はいつも感動します。,再帰動詞で、過去分詞が不規則。近過去は essere を使う（mi sono commosso/a）。他動詞 commuovere は「感動させる」。,,しみじみした気持ち
L5-0284,5,commovente,感動的な|心を打つ,adj,,commoventi,感情・性格,Il film era così commovente che tutti piangevano in sala.,その映画はとても感動的で、会場のみんなが泣いていた。,男女同形の -e 形容詞。「感動した」と言う人は commosso、感動させるものは commovente。,toccante,しみじみした気持ち
L5-0165,5,rallegrarsi,喜ぶ|嬉しく思う,verb,,"mi rallegro, ti rallegri, si rallegra, ci rallegriamo, vi rallegrate, si rallegrano",感情・性格,Mi rallegro di sapere che stai meglio.,あなたが元気になったと知って嬉しいです。,再帰動詞。「〜を喜ぶ」は rallegrarsi di。「祝う」は rallegrarsi con qualcuno per ... の形で、congratularsi の方が一般的。,,しみじみした気持ち
L5-0251,5,il sollievo,安堵|ほっとすること|軽減,noun,m,sollievi,感情・性格,Che sollievo! Il treno è ancora qui e possiamo partire.,ほっとした！電車がまだここにあるから出発できる。,Che sollievo! で「ああ、ほっとした」。「痛みの緩和」にも使う。sentire sollievo は「楽になる」。,,しみじみした気持ち
L5-0247,5,la serenità,平穏|穏やかさ|落ち着き,noun,f,serenità（不変）,感情・性格,Dopo le vacanze ho ritrovato la serenità e la voglia di lavorare.,休暇のあと、私は心の平穏と働く意欲を取り戻した。,-à で終わる名詞は複数形も同形。形容詞は sereno（穏やかな、晴れた空）。,la tranquillità,しみじみした気持ち
L5-0319,5,lo stupore,驚き|驚嘆,noun,m,stupori,感情・性格,Ho guardato il panorama con stupore.,私は驚きの気持ちで景色を眺めました。,複数形は稀。con stupore（驚いて）の形で頻出。sorpresa より強く、感嘆の響きがある。,,しみじみした気持ち
L5-0299,5,la malinconia,物悲しさ|憂鬱|哀愁,noun,f,malinconie,感情・性格,"Quando piove, mi viene un po' di malinconia.",雨が降ると、少し物悲しい気分になります。,depressione のような病的な「うつ」ではなく、静かで物思いにふける悲しみ。形容詞は malinconico。,,しみじみした気持ち
L5-0224,5,malinconico,憂鬱な|物悲しい|哀愁のある,adj,,"malinconica, malinconici, malinconiche",感情・性格,"Oggi mi sento un po' malinconico, ho nostalgia di casa.",今日は少し憂鬱な気分で、家が恋しいです。,名詞は la malinconia（憂鬱、哀愁）。人にも音楽や景色などにも使える。,,しみじみした気持ち
L5-0081,5,il pianto,泣くこと|泣き声|涙,noun,m,pianti,感情・性格,Il pianto del bambino ha svegliato tutti i vicini di casa.,赤ちゃんの泣き声で近所の人たちが皆目を覚ました。,動詞 piangere の名詞形で、泣く行為や泣き声を指す。涙の一粒一粒は lacrima、複数 lacrime。,,しみじみした気持ち
L5-0080,5,la pena,悲しみ|哀れみ|刑罰,noun,f,pene,感情・性格,Mi fa pena vedere quel cane abbandonato.,あの捨てられた犬を見ると哀れに思う。,fare pena a qualcuno は「〜を哀れに思わせる」。valere la pena は「〜する価値がある」。,,しみじみした気持ち
L5-0208,5,il dispiacere,悲しみ|残念な気持ち|心痛,noun,m,dispiaceri,感情・性格,Ho saputo con dispiacere della sua malattia.,彼の病気のことを知って、残念に思いました。,con dispiacere で「残念ながら、悲しい思いで」。動詞 dispiacere（mi dispiace）の名詞形で、お悔やみや謝罪の気持ちを表せる。,,しみじみした気持ち
L5-0065,5,dispiacersi,残念に思う|気の毒に思う|申し訳なく思う,verb,,"mi dispiaccio, ti dispiaci, si dispiace, ci dispiacciamo, vi dispiacete, si dispiacciono（過去分詞 dispiaciuto）",感情・性格,Si dispiace molto per quello che è successo.,彼は起きたことをとても残念に思っている。,日常では非人称の dispiacere（Mi dispiace di non poter venire.）を使うのが普通。再帰形 dispiacersi は文語的でまれ。複合時制は essere を使う。,,しみじみした気持ち
L5-0341,5,consolare,慰める|元気づける,verb,,"consolo, consoli, consola, consoliamo, consolate, consolano",感情・性格,Ho cercato di consolare il mio amico dopo la brutta notizia.,悪い知らせのあと、私は友人を慰めようとした。,規則動詞（-are）。再帰形 consolarsi は「気を取り直す、立ち直る」。同形の形容詞 consolare は「領事の」で別語。,,しみじみした気持ち
L5-0339,5,la compassione,同情|哀れみ|思いやり,noun,f,compassioni,感情・性格,Ho provato molta compassione per lui quando ho saputo la notizia.,その知らせを聞いたとき、私は彼にとても同情しました。,provare compassione per ... で「〜に同情する」。-sione・-zione で終わる名詞は女性名詞。,,しみじみした気持ち
L5-0392,5,il rimpianto,後悔|未練,noun,m,rimpianti,感情・性格,Non voglio avere rimpianti quando sarò anziano.,年をとったときに後悔したくありません。,過去の出来事を惜しむ気持ち。avere dei rimpianti「後悔がある」。行為への悔いは pentimento、遺憾は rammarico。,,後悔・不安・怒り
L5-0413,5,il rimorso,後悔|良心の呵責,noun,m,rimorsi,感情・性格,Ho il rimorso di non averti chiamato prima.,もっと早く君に電話しなかったことを後悔している。,罪悪感を伴う深い後悔。失ったものや逃した機会を惜しむ気持ち（未練）は rimpianto、「悔い改め」は pentimento。avere rimorsi の形も多い。,,後悔・不安・怒り
L5-0334,5,l'angoscia,不安|苦悩|強い恐怖,noun,f,angosce,感情・性格,Aspettare i risultati degli esami mi riempie di angoscia.,試験の結果を待っていると、不安で胸が締めつけられます。,ansia より重く、胸が締めつけられるような強い不安や苦悩を表す。形容詞は angosciato（不安に苛まれた）。,,後悔・不安・怒り
L5-0183,5,il timore,恐れ|不安|懸念,noun,m,timori,感情・性格,Ho il timore di non arrivare in tempo alla stazione.,駅に時間通りに着けないのではと不安です。,avere timore di + 不定詞 / che + 接続法 の形で使う。paura より改まった響きで、漠然とした不安を表す。,,後悔・不安・怒り
L5-0091,5,l'umore,気分|機嫌,noun,m,umori,感情・性格,Oggi sono di buon umore perché domani parto per le vacanze.,明日から休暇に出かけるので、今日は機嫌がいい。,essere di buon umore（上機嫌）、di cattivo umore（不機嫌）の形でよく使う。humor（ユーモア）は umorismo。,,後悔・不安・怒り
L5-0350,5,il malumore,不機嫌|機嫌の悪さ,noun,m,malumori,感情・性格,Da stamattina è di malumore e non parla con nessuno.,今朝から彼は不機嫌で、誰とも話しません。,essere di malumore「機嫌が悪い」の形でよく使う。反対は buonumore（上機嫌）。複数形はまれ。,,後悔・不安・怒り
L5-0410,5,l'ira,激怒|怒り,noun,f,ire,感情・性格,Ha urlato per l'ira e poi è uscito dalla stanza.,彼は怒りのあまり叫び、そして部屋を出て行った。,文語的で強い怒り。日常会話では rabbia が一般的。複数形 ire はまれ。,,後悔・不安・怒り
L5-0216,5,l'imbarazzo,当惑|気まずさ|戸惑い,noun,m,imbarazzi,感情・性格,Ho sentito un grande imbarazzo quando mi hanno fatto quella domanda.,あの質問をされたとき、とても気まずく感じました。,mettere in imbarazzo で「困らせる」、essere in imbarazzo で「困っている」。形容詞は imbarazzante（気まずい）、imbarazzato（戸惑った）。,,後悔・不安・怒り
L5-0036,5,la vergogna,恥|恥ずかしさ,noun,f,vergogne,感情・性格,Che vergogna! Ho dimenticato il suo nome davanti a tutti.,恥ずかしい！みんなの前で彼の名前を忘れてしまった。,avere vergogna（恥ずかしい）、vergognarsi（恥じる）、Che vergogna!（恥ずかしい、みっともない）が頻出。,,後悔・不安・怒り
L5-0134,5,la gelosia,嫉妬|やきもち,noun,f,gelosie,感情・性格,"Non sopporto la gelosia di Marco, è davvero eccessiva.",マルコの嫉妬には耐えられない、本当に度が過ぎている。,主に恋愛などで相手を取られたくない気持ち。他人をうらやむ「羨望」は invidia。形容詞は geloso（嫉妬深い）。essere geloso di で「〜に嫉妬している」。,,後悔・不安・怒り
L5-0143,5,l'invidia,ねたみ|嫉妬|羨望,noun,f,invidie,感情・性格,Provo un po' di invidia per la tua vacanza al mare.,君の海での休暇が少しうらやましい。,他人の持つものへのねたみ。恋愛の嫉妬は gelosia。avere invidia di は「〜をうらやむ」。,,後悔・不安・怒り
L5-0298,5,invidiare,うらやむ|妬む,verb,,"invidio, invidi, invidia, invidiamo, invidiate, invidiano",感情・性格,Ti invidio: domani puoi partire per le vacanze.,君がうらやましいよ。明日から休暇に出かけられるなんて。,人を直接目的語にとる（Ti invidio）。うらやむ内容は per で示すか（Ti invidio per la tua calma）、物事を直接目的語にして人を a で示す（Invidio a te la tua calma）。,,後悔・不安・怒り
L5-0199,5,l'antipatia,反感|嫌悪感|虫が好かないこと,noun,f,antipatie,感情・性格,Non nascondo la mia antipatia per quel tipo di persone.,ああいうタイプの人たちへの反感は隠しません。,形容詞は antipatico（感じが悪い）。反対語は simpatia。provare antipatia per qlcn で「〜に反感を抱く、〜が苦手だ」。,,後悔・不安・怒り
L5-0120,5,deludere,失望させる|がっかりさせる|裏切る（期待を）,verb,,"deludo, deludi, delude, deludiamo, deludete, deludono（過去分詞 deluso）",感情・性格,"Mi dispiace, non volevo deluderti.",ごめんね、君をがっかりさせるつもりはなかったんだ。,他動詞で、過去分詞 deluso は「がっかりした」の形容詞としても頻出。過去分詞・遠過去が不規則（delusi）。,,後悔・不安・怒り
L5-0317,5,la sofferenza,苦しみ|苦痛,noun,f,sofferenze,感情・性格,Il film racconta la sofferenza di una famiglia durante la guerra.,その映画は戦時中のある家族の苦しみを描いている。,精神的にも肉体的にも使える。soffrire（苦しむ）の名詞形。dolore は痛みそのものを指すことが多い。,,後悔・不安・怒り
L5-0089,5,spiacevole,不愉快な|いやな|残念な,adj,,spiacevoli,感情・性格,È stata una sorpresa molto spiacevole per tutti noi.,それは私たち全員にとってとても不愉快な驚きでした。,男女同形の -e 形容詞。反対語は piacevole（心地よい）。出来事や状況に使うことが多い。,sgradevole,後悔・不安・怒り
L5-0128,5,fiero,誇らしい|誇り高い,adj,,"fiera, fieri, fiere",感情・性格,"Sono fiero di mio figlio, ha studiato molto.",私は息子を誇りに思っています。彼はとても勉強しました。,fiero di ～で「～を誇りに思う」。orgoglioso もほぼ同義。「獰猛な」の意味もある。,orgoglioso,誇りと美徳
L5-0409,5,la fierezza,誇り|気高さ,noun,f,fierezze,感情・性格,Parla del suo lavoro con grande fierezza.,彼は自分の仕事について大きな誇りをもって話す。,良い意味の誇り。orgoglio も近いが、fierezza は気高さや毅然とした態度のニュアンスが強い。,,誇りと美徳
L5-0269,5,l'orgoglio,誇り|プライド|自尊心,noun,m,,感情・性格,Mio padre è pieno di orgoglio per i suoi figli.,父は子どもたちを誇りに思っています。,良い意味の「誇り」にも、悪い意味の「うぬぼれ・思い上がり」にも使う。形容詞 orgoglioso（誇りに思う／高慢な）と合わせて覚えるとよい。通常は単数形で使う。,,誇りと美徳
L5-0047,5,l'onestà,正直さ|誠実さ,noun,f,onestà（不変）,感情・性格,Apprezzo molto l'onestà in una persona.,私は人の正直さをとても高く評価します。,-à で終わる名詞は複数形も同形。形容詞は onesto。,,誇りと美徳
L5-0248,5,la sincerità,誠実さ|率直さ,noun,f,sincerità（不変）,感情・性格,Apprezzo molto la sincerità delle persone che dicono sempre la verità.,私は、いつも本当のことを言う人の誠実さをとても評価しています。,-à で終わる名詞なので複数形も同形。in tutta sincerità は「正直に言って」。形容詞は sincero。,l'onestà,誇りと美徳
L5-0348,5,la lealtà,誠実さ|忠誠,noun,f,lealtà（不変）,感情・性格,Apprezzo molto la lealtà dei miei amici.,私は友人たちの誠実さをとても高く評価しています。,-à で終わる名詞は複数形も同形。形容詞は leale（誠実な）。「忠誠」は fedeltà とも近いが、lealtà は正直さや公正さに重点がある。,,誇りと美徳
L5-0223,5,leale,誠実な|忠実な|公正な,adj,,leali,感情・性格,Marco è un amico leale e non mi tradirebbe mai.,マルコは誠実な友人で、決して私を裏切らないだろう。,-e 形容詞で男女同形。複数は leali。人柄や行動の誠実さ・忠誠を表し、スポーツの「フェアな」にも使う。,,誇りと美徳
L5-0114,5,la bontà,善良さ|親切|おいしさ,noun,f,bontà（不変）,感情・性格,Mi ha colpito la bontà di quella persona.,その人の優しさに心を打たれました。,-à で終わる名詞は複数形も同形。食べ物の「おいしさ」にも使う。Che bontà! は「なんておいしい！」。,la gentilezza,誇りと美徳
L5-0213,5,la generosità,寛大さ|気前のよさ,noun,f,generosità（不変）,感情・性格,Ringrazio tutti per la generosità che hanno dimostrato con noi.,私たちに示してくださった寛大さに、皆さんに感謝します。,-à で終わる名詞なので複数形も同形。形容詞は generoso。,,誇りと美徳
